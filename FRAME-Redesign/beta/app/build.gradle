plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ilia.frame.redesignbeta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ilia.frame.redesignbeta'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-beta2'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
