plugins {
    id 'com.android.application'
}

def betaKeystoreB64 = rootProject.file('signing/shishalove-beta-keystore.b64')
def betaKeystore = rootProject.file('signing/shishalove-beta.keystore')
if (!betaKeystore.exists()) {
    if (!betaKeystoreB64.exists()) throw new GradleException('Missing stable ShishaLove beta signing identity')
    betaKeystore.parentFile.mkdirs()
    betaKeystore.bytes = java.util.Base64.decoder.decode(betaKeystoreB64.getText('UTF-8').trim())
}

android {
    namespace 'eu.shishalove.merchant'
    compileSdk 35

    signingConfigs {
        beta {
            storeFile betaKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'eu.shishalove.merchant'
        minSdk 24
        targetSdk 35
        versionCode 125
        versionName '1.1.23'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            signingConfig signingConfigs.beta
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.beta
        }
    }
}

// PERMANENT OWNER LOCK — Merchant launcher only.
// Keep the exact approved 512x512 ShishaLove Merchant source artwork, but generate:
// 1) a transparent, safely inset adaptive foreground for modern Android launchers, and
// 2) a rounded transparent legacy icon so no launcher can show a sharp black square.
def materializeMerchantLauncherIcon = tasks.register('materializeMerchantLauncherIcon') {
    doLast {
        def brandingDir = rootProject.file('../shishalove-branding')
        def expectedNames = (0..<4).collect { String.format('merchant-icon.b64.part%02d', it) }
        def discoveredNames = fileTree(brandingDir) {
            include 'merchant-icon.b64.part*'
        }.files.collect { it.name }.sort()
        if (discoveredNames != expectedNames) {
            throw new GradleException("Merchant launcher lock violated. Expected ${expectedNames}, found ${discoveredNames}")
        }
        def parts = expectedNames.collect { new File(brandingDir, it) }
        if (parts.any { !it.exists() }) throw new GradleException('Missing permanent red-band ShishaLove Merchant launcher artwork')
        def encoded = parts.collect { it.getText('UTF-8').trim() }.join('')
        byte[] raw = java.util.Base64.decoder.decode(encoded)

        byte[] pngSig = [(byte)0x89,(byte)0x50,(byte)0x4e,(byte)0x47,(byte)0x0d,(byte)0x0a,(byte)0x1a,(byte)0x0a] as byte[]
        if (raw.length < 24 || !(0..<8).every { raw[it] == pngSig[it] }) {
            throw new GradleException('Permanent Merchant launcher source is not a valid PNG')
        }
        int width = ((raw[16] & 0xff) << 24) | ((raw[17] & 0xff) << 16) | ((raw[18] & 0xff) << 8) | (raw[19] & 0xff)
        int height = ((raw[20] & 0xff) << 24) | ((raw[21] & 0xff) << 16) | ((raw[22] & 0xff) << 8) | (raw[23] & 0xff)
        if (width != 512 || height != 512) {
            throw new GradleException("Permanent Merchant launcher source must stay 512x512, got ${width}x${height}")
        }

        def sourceImage = javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(raw))
        if (sourceImage == null || sourceImage.width != 512 || sourceImage.height != 512) {
            throw new GradleException('Unable to decode permanent Merchant launcher source')
        }

        def outputDir = file('src/main/res/drawable-nodpi')
        outputDir.mkdirs()

        // Keep an exact decoded copy for audit/verification only.
        def sourceOutput = new File(outputDir, 'ic_shishalove_merchant.png')
        sourceOutput.bytes = raw

        // Adaptive foreground: remove the black canvas from the exact artwork and
        // scale the visible logo into Android's safe region. The adaptive icon background
        // stays black in mipmap-anydpi-v26, so Samsung/Pixel/etc. can apply their own mask.
        def extracted = new java.awt.image.BufferedImage(512, 512, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        int visiblePixels = 0
        for (int y = 0; y < 512; y++) {
            for (int x = 0; x < 512; x++) {
                int argb = sourceImage.getRGB(x, y)
                int a = (argb >>> 24) & 0xff
                int r = (argb >>> 16) & 0xff
                int g = (argb >>> 8) & 0xff
                int b = argb & 0xff
                if (a == 0 || (r < 20 && g < 20 && b < 20)) {
                    extracted.setRGB(x, y, 0x00000000)
                } else {
                    extracted.setRGB(x, y, argb)
                    visiblePixels++
                }
            }
        }
        if (visiblePixels < 1000) throw new GradleException('Merchant adaptive foreground extraction failed')

        def adaptive = new java.awt.image.BufferedImage(512, 512, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def ag = adaptive.createGraphics()
        ag.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        ag.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        ag.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        int adaptiveSize = 384
        int adaptiveOffset = (512 - adaptiveSize) / 2
        ag.drawImage(extracted, adaptiveOffset, adaptiveOffset, adaptiveSize, adaptiveSize, null)
        ag.dispose()
        def adaptiveOutput = new File(outputDir, 'ic_shishalove_merchant_art.png')
        javax.imageio.ImageIO.write(adaptive, 'png', adaptiveOutput)

        // Legacy/fallback icon: exact artwork on black, clipped to a real rounded-square
        // with transparent corners. This permanently prevents the sharp-square fallback
        // seen on the Samsung launcher while preserving the exact logo.
        def legacy = new java.awt.image.BufferedImage(512, 512, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def lg = legacy.createGraphics()
        lg.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        lg.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        lg.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        def rounded = new java.awt.geom.RoundRectangle2D.Float(0f, 0f, 512f, 512f, 224f, 224f)
        lg.setClip(rounded)
        lg.setColor(java.awt.Color.BLACK)
        lg.fillRect(0, 0, 512, 512)
        int legacySize = 448
        int legacyOffset = (512 - legacySize) / 2
        lg.drawImage(sourceImage, legacyOffset, legacyOffset, legacySize, legacySize, null)
        lg.dispose()
        if (((legacy.getRGB(0, 0) >>> 24) & 0xff) != 0) {
            throw new GradleException('Merchant legacy icon corner must stay transparent')
        }
        if (((legacy.getRGB(256, 256) >>> 24) & 0xff) == 0) {
            throw new GradleException('Merchant legacy icon center unexpectedly transparent')
        }
        def legacyOutput = new File(outputDir, 'ic_shishalove_merchant_legacy.png')
        javax.imageio.ImageIO.write(legacy, 'png', legacyOutput)
    }
}

def lockMerchantRuntimeVersion = tasks.register('lockMerchantRuntimeVersion') {
    doLast {
        def activity = file('src/main/java/eu/shishalove/merchant/MainActivity.java')
        def source = activity.getText('UTF-8')
        ['build=116','build=118','build=119','build=120','build=129'].each { oldValue -> source = source.replace(oldValue, 'build=129') }
        ['ShishaLoveMerchant/1.1.6','ShishaLoveMerchant/1.1.8','ShishaLoveMerchant/1.1.9','ShishaLoveMerchant/1.1.10','ShishaLoveMerchant/1.1.11','ShishaLoveMerchant/1.1.19','ShishaLoveMerchant/1.1.20','ShishaLoveMerchant/1.1.21'].each { oldValue -> source = source.replace(oldValue, 'ShishaLoveMerchant/1.1.22') }
        activity.setText(source, 'UTF-8')

        def permanentActivity = file('src/main/java/eu/shishalove/merchant/MerchantActivityV121.java')
        def permanentSource = permanentActivity.getText('UTF-8')
        if (!permanentSource.contains('v.setPadding(bars.left, bars.top, bars.right, 0)')) {
            throw new GradleException('Permanent Merchant top-only native inset fix missing')
        }
        if (!permanentSource.contains("nav.style.setProperty('bottom','0','important')")) {
            throw new GradleException('Permanent Merchant bottom navigation edge lock missing')
        }
        if (!permanentSource.contains("nav.style.setProperty('padding-bottom',inset,'important')")) {
            throw new GradleException('Permanent Merchant navigation safe-area padding missing')
        }
        if (!permanentSource.contains("overflow-y','auto','important")) {
            throw new GradleException('Permanent Merchant scrolling fix missing')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn materializeMerchantLauncherIcon
    dependsOn lockMerchantRuntimeVersion
}
