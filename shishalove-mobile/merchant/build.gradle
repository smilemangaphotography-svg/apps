plugins {
    id 'com.android.application'
}

android {
    namespace 'eu.shishalove.merchant'
    compileSdk 35

    defaultConfig {
        applicationId 'eu.shishalove.merchant'
        minSdk 24
        targetSdk 35
        versionCode 110
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
        release {
            minifyEnabled false
        }
    }
}