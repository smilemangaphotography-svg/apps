plugins {
    id 'com.android.application'
}

def betaKeystoreB64 = rootProject.file('signing/shishalove-beta-keystore.b64')
def betaKeystore = rootProject.file('signing/shishalove-beta.keystore')
if (!betaKeystore.exists()) {
    if (!betaKeystoreB64.exists()) throw new GradleException('Missing stable ShishaLove beta signing identity')
    betaKeystore.parentFile.mkdirs()
    betaKeystore.bytes = java.util.Base64.decoder.decode(betaKeystoreB64.getText('UTF-8').trim())
}

android {
    namespace 'eu.shishalove.merchant'
    compileSdk 35

    signingConfigs {
        beta {
            storeFile betaKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'eu.shishalove.merchant'
        minSdk 24
        targetSdk 35
        versionCode 126
        versionName '1.1.24'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            signingConfig signingConfigs.beta
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.beta
        }
    }
}

// Merchant launcher only: Android owns the final launcher mask/shape.
// No rounded square, white frame or corner treatment is baked into the icon.
def materializeMerchantLauncherIcon = tasks.register('materializeMerchantLauncherIcon') {
    doLast {
        def brandingDir = rootProject.file('../shishalove-branding')
        def expectedNames = (0..<4).collect { String.format('merchant-icon.b64.part%02d', it) }
        def discoveredNames = fileTree(brandingDir) { include 'merchant-icon.b64.part*' }.files.collect { it.name }.sort()
        if (discoveredNames != expectedNames) throw new GradleException('Merchant launcher source set changed')
        def encoded = expectedNames.collect { new File(brandingDir, it).getText('UTF-8').trim() }.join('')
        byte[] raw = java.util.Base64.decoder.decode(encoded)
        def sourceImage = javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(raw))
        if (sourceImage == null || sourceImage.width != 512 || sourceImage.height != 512) throw new GradleException('Merchant launcher source must be 512x512 PNG')

        def outputDir = file('src/main/res/drawable-nodpi')
        outputDir.mkdirs()
        new File(outputDir, 'ic_shishalove_merchant.png').bytes = raw

        int w = 512, h = 512
        boolean[] outside = new boolean[w * h]
        def queue = new java.util.ArrayDeque<Integer>()
        def isOuterBackground = { int argb ->
            int a = (argb >>> 24) & 0xff
            int r = (argb >>> 16) & 0xff
            int g = (argb >>> 8) & 0xff
            int b = argb & 0xff
            int max = Math.max(r, Math.max(g, b))
            int min = Math.min(r, Math.min(g, b))
            a == 0 || (min > 150 && (max - min) < 50)
        }
        def enqueue = { int x, int y ->
            int idx = y * w + x
            if (!outside[idx] && isOuterBackground(sourceImage.getRGB(x, y))) {
                outside[idx] = true
                queue.add(idx)
            }
        }
        for (int x = 0; x < w; x++) { enqueue(x, 0); enqueue(x, h - 1) }
        for (int y = 0; y < h; y++) { enqueue(0, y); enqueue(w - 1, y) }
        int[] dx = [1, -1, 0, 0]
        int[] dy = [0, 0, 1, -1]
        while (!queue.isEmpty()) {
            int idx = queue.removeFirst()
            int x = idx % w
            int y = (int)(idx / w)
            for (int k = 0; k < 4; k++) {
                int nx = x + dx[k], ny = y + dy[k]
                if (nx >= 0 && nx < w && ny >= 0 && ny < h) enqueue(nx, ny)
            }
        }

        def art = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        int visiblePixels = 0
        for (int y = 0; y < h; y++) {
            for (int x = 0; x < w; x++) {
                int idx = y * w + x
                int argb = sourceImage.getRGB(x, y)
                int a = (argb >>> 24) & 0xff
                int r = (argb >>> 16) & 0xff
                int g = (argb >>> 8) & 0xff
                int b = argb & 0xff
                if (outside[idx] || a == 0 || (r < 28 && g < 28 && b < 28)) {
                    art.setRGB(x, y, 0x00000000)
                } else {
                    art.setRGB(x, y, argb)
                    visiblePixels++
                }
            }
        }
        if (visiblePixels < 1000) throw new GradleException('Merchant launcher foreground extraction failed')
        [[0,0],[511,0],[0,511],[511,511]].each { p ->
            if (((art.getRGB(p[0], p[1]) >>> 24) & 0xff) != 0) throw new GradleException('Merchant launcher corners must be transparent')
        }
        javax.imageio.ImageIO.write(art, 'png', new File(outputDir, 'ic_shishalove_merchant_art.png'))
        def obsolete = new File(outputDir, 'ic_shishalove_merchant_legacy.png')
        if (obsolete.exists()) obsolete.delete()
    }
}

def lockMerchantRuntimeVersion = tasks.register('lockMerchantRuntimeVersion') {
    doLast {
        def activity = file('src/main/java/eu/shishalove/merchant/MainActivity.java')
        def source = activity.getText('UTF-8')
        ['build=116','build=118','build=119','build=120','build=129'].each { oldValue -> source = source.replace(oldValue, 'build=129') }
        ['ShishaLoveMerchant/1.1.6','ShishaLoveMerchant/1.1.8','ShishaLoveMerchant/1.1.9','ShishaLoveMerchant/1.1.10','ShishaLoveMerchant/1.1.11','ShishaLoveMerchant/1.1.19','ShishaLoveMerchant/1.1.20','ShishaLoveMerchant/1.1.21'].each { oldValue -> source = source.replace(oldValue, 'ShishaLoveMerchant/1.1.22') }
        activity.setText(source, 'UTF-8')

        def permanentActivity = file('src/main/java/eu/shishalove/merchant/MerchantActivityV121.java')
        def permanentSource = permanentActivity.getText('UTF-8')
        if (!permanentSource.contains('v.setPadding(bars.left, bars.top, bars.right, 0)')) throw new GradleException('Permanent Merchant inset fix missing')
        if (!permanentSource.contains("nav.style.setProperty('bottom','0','important')")) throw new GradleException('Permanent Merchant bottom navigation lock missing')
        if (!permanentSource.contains("nav.style.setProperty('padding-bottom',inset,'important')")) throw new GradleException('Permanent Merchant navigation safe-area padding missing')
        if (!permanentSource.contains("overflow-y','auto','important")) throw new GradleException('Permanent Merchant scrolling fix missing')
    }
}

tasks.named('preBuild').configure {
    dependsOn materializeMerchantLauncherIcon
    dependsOn lockMerchantRuntimeVersion
}
