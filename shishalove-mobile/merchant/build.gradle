plugins {
    id 'com.android.application'
}

def betaKeystoreB64 = rootProject.file('signing/shishalove-beta-keystore.b64')
def betaKeystore = rootProject.file('signing/shishalove-beta.keystore')
if (!betaKeystore.exists()) {
    if (!betaKeystoreB64.exists()) throw new GradleException('Missing stable ShishaLove beta signing identity')
    betaKeystore.parentFile.mkdirs()
    betaKeystore.bytes = java.util.Base64.decoder.decode(betaKeystoreB64.getText('UTF-8').trim())
}

android {
    namespace 'eu.shishalove.merchant'
    compileSdk 35

    signingConfigs {
        beta {
            storeFile betaKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'eu.shishalove.merchant'
        minSdk 24
        targetSdk 35
        versionCode 119
        versionName '1.1.9'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            signingConfig signingConfigs.beta
        }
        release {
            minifyEnabled false
            // Canonical Merchant installer. Keep the exact production package name
            // and one stable signing identity so future APKs update in place.
            signingConfig signingConfigs.beta
        }
    }
}

// Exact owner-approved Merchant icon: black icon, white ShishaLove mark,
// red heart and red MERCHANT band. Customer launcher artwork is untouched.
def materializeMerchantLauncherIcon = tasks.register('materializeMerchantLauncherIcon') {
    doLast {
        def approved = file('src/main/assets/merchant_launcher_approved.b64')
        if (!approved.exists()) throw new GradleException('Missing approved red-band Merchant launcher artwork')
        def output = file('src/main/res/drawable-nodpi/ic_shishalove_merchant.png')
        output.parentFile.mkdirs()
        output.bytes = java.util.Base64.decoder.decode(approved.getText('UTF-8').trim())
    }
}

// Keep wrapper metadata in sync with the canonical installable build.
def lockMerchantRuntimeVersion = tasks.register('lockMerchantRuntimeVersion') {
    doLast {
        def activity = file('src/main/java/eu/shishalove/merchant/MainActivity.java')
        def source = activity.getText('UTF-8')
        source = source.replace('build=116', 'build=119')
        source = source.replace('build=118', 'build=119')
        source = source.replace('ShishaLoveMerchant/1.1.6', 'ShishaLoveMerchant/1.1.9')
        source = source.replace('ShishaLoveMerchant/1.1.8', 'ShishaLoveMerchant/1.1.9')
        activity.setText(source, 'UTF-8')
    }
}

tasks.named('preBuild').configure {
    dependsOn materializeMerchantLauncherIcon
    dependsOn lockMerchantRuntimeVersion
}
