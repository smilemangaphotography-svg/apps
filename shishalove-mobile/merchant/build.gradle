plugins {
    id 'com.android.application'
}

def betaKeystoreB64 = rootProject.file('signing/shishalove-beta-keystore.b64')
def betaKeystore = rootProject.file('signing/shishalove-beta.keystore')
if (!betaKeystore.exists()) {
    if (!betaKeystoreB64.exists()) throw new GradleException('Missing stable ShishaLove beta signing identity')
    betaKeystore.parentFile.mkdirs()
    betaKeystore.bytes = java.util.Base64.decoder.decode(betaKeystoreB64.getText('UTF-8').trim())
}

android {
    namespace 'eu.shishalove.merchant'
    compileSdk 35

    signingConfigs {
        beta {
            storeFile betaKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'eu.shishalove.merchant'
        minSdk 24
        targetSdk 35
        versionCode 173
        versionName '1.1.73'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            signingConfig signingConfigs.beta
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.beta
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}

// PERMANENT MERCHANT LAUNCHER LOCK
// Android/Samsung owns the final mask. The exact Merchant artwork is extracted from
// the locked 512x512 branding source, cropped to its visible pixels, then fitted
// inside the adaptive safe area so the red MERCHANT band can never be clipped.
def materializeMerchantLauncherIcon = tasks.register('materializeMerchantLauncherIcon') {
    doLast {
        def brandingDir = rootProject.file('../shishalove-branding')
        def expectedNames = (0..<4).collect { String.format('merchant-icon.b64.part%02d', it) }
        def discoveredNames = fileTree(brandingDir) { include 'merchant-icon.b64.part*' }.files.collect { it.name }.sort()
        if (discoveredNames != expectedNames) throw new GradleException('Merchant launcher source set changed')
        def encoded = expectedNames.collect { new File(brandingDir, it).getText('UTF-8').trim() }.join('')
        byte[] raw = java.util.Base64.decoder.decode(encoded)
        def sourceImage = javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(raw))
        if (sourceImage == null || sourceImage.width != 512 || sourceImage.height != 512) {
            throw new GradleException('Merchant launcher source must be 512x512 PNG')
        }

        def outputDir = file('src/main/res/drawable-nodpi')
        outputDir.mkdirs()
        new File(outputDir, 'ic_shishalove_merchant.png').bytes = raw

        int w = 512, h = 512
        def extracted = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        int minX = w, minY = h, maxX = -1, maxY = -1
        int visiblePixels = 0
        int redPixels = 0

        for (int y = 0; y < h; y++) {
            for (int x = 0; x < w; x++) {
                int argb = sourceImage.getRGB(x, y)
                int a = (argb >>> 24) & 0xff
                int r = (argb >>> 16) & 0xff
                int g = (argb >>> 8) & 0xff
                int b = argb & 0xff
                boolean blackBackground = a == 0 || (r < 28 && g < 28 && b < 28)
                if (blackBackground) {
                    extracted.setRGB(x, y, 0x00000000)
                } else {
                    extracted.setRGB(x, y, argb)
                    visiblePixels++
                    minX = Math.min(minX, x)
                    minY = Math.min(minY, y)
                    maxX = Math.max(maxX, x)
                    maxY = Math.max(maxY, y)
                    if (r > 120 && r > g * 1.35 && r > b * 1.35) redPixels++
                }
            }
        }

        if (visiblePixels < 1000 || redPixels < 500 || maxX <= minX || maxY <= minY) {
            throw new GradleException('Merchant launcher artwork extraction failed or red MERCHANT band is missing')
        }

        int sourceW = maxX - minX + 1
        int sourceH = maxY - minY + 1

        // 408px on a 512px adaptive canvas = ~80% visual width.
        // This is deliberately smaller than the full foreground layer: Android launchers
        // apply additional masking/zoom, and previous 96/112dp wrapper scaling clipped
        // the MERCHANT band. The complete logo now stays inside the adaptive safe area.
        int targetW = 408
        int targetH = Math.round(targetW * (sourceH / (float) sourceW))
        int maxTargetH = 350
        if (targetH > maxTargetH) {
            targetH = maxTargetH
            targetW = Math.round(targetH * (sourceW / (float) sourceH))
        }
        int offsetX = (w - targetW) / 2
        int offsetY = (h - targetH) / 2

        def safeArt = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g2 = safeArt.createGraphics()
        g2.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        g2.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        g2.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        g2.drawImage(extracted,
            offsetX, offsetY, offsetX + targetW, offsetY + targetH,
            minX, minY, maxX + 1, maxY + 1,
            null)
        g2.dispose()

        // Permanent geometry guard: visible artwork must retain at least 48px of left/right
        // canvas space and 64px of top/bottom space before Android applies its own mask.
        if (offsetX < 48 || offsetY < 64 || (w - (offsetX + targetW)) < 48 || (h - (offsetY + targetH)) < 64) {
            throw new GradleException('Merchant launcher safe-area geometry violated')
        }

        javax.imageio.ImageIO.write(safeArt, 'png', new File(outputDir, 'ic_shishalove_merchant_art.png'))
        def obsolete = new File(outputDir, 'ic_shishalove_merchant_legacy.png')
        if (obsolete.exists()) obsolete.delete()
    }
}

def lockMerchantRuntimeVersion = tasks.register('lockMerchantRuntimeVersion') {
    doLast {
        def activity = file('src/main/java/eu/shishalove/merchant/MainActivity.java')
        def source = activity.getText('UTF-8')
        if (!source.contains('build=173')) throw new GradleException('Merchant build marker must be 173')
        if (!source.contains('ShishaLoveMerchant/1.1.73')) throw new GradleException('Merchant user agent must be 1.1.73')
        if (!source.contains('WindowCompat.setDecorFitsSystemWindows(window, false)')) throw new GradleException('Native edge-to-edge ownership missing')
        if (!source.contains('WindowInsetsCompat.Type.systemBars()')) throw new GradleException('systemBars inset source missing')
        if (!source.contains('root.setVisibility(View.INVISIBLE)')) throw new GradleException('First-frame inset gate missing')
        if (!source.contains('ViewCompat.requestApplyInsets(root)')) throw new GradleException('Initial inset request missing')
        if (!source.contains('processStartupGateShown')) throw new GradleException('Merchant cold-start gate lock missing')
        if (!source.contains('R.drawable.ic_shishalove_merchant')) throw new GradleException('Merchant startup must use the real locked logo asset')
        if (!source.contains('enter.setText("ENTER")')) throw new GradleException('Merchant ENTER gate missing')

        def permanentActivity = file('src/main/java/eu/shishalove/merchant/MerchantActivityV121.java')
        def permanentSource = permanentActivity.getText('UTF-8')
        if (permanentSource.contains('postDelayed(this::applyWebFix')) throw new GradleException('Delayed bottom-nav correction must not return')
        if (permanentSource.contains('scheduleWebFixes()')) throw new GradleException('Late safe-area scheduler must not return')
        if (permanentSource.contains('evaluateJavascript(js')) throw new GradleException('Native shell must not rewrite nav geometry with JS')
        if (permanentSource.contains('--safe-bottom')) throw new GradleException('Native shell must not own CSS safe-area variables')
    }
}

tasks.named('preBuild').configure {
    dependsOn materializeMerchantLauncherIcon
    dependsOn lockMerchantRuntimeVersion
}
