plugins {
    id 'com.android.application'
}

android {
    namespace 'eu.shishalove.customer'
    compileSdk 35

    defaultConfig {
        applicationId 'eu.shishalove.customer'
        minSdk 24
        targetSdk 35
        versionCode 101
        versionName '1.0.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
        release {
            minifyEnabled false
        }
    }
}
