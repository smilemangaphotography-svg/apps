plugins {
    id 'com.android.application'
}

def betaKeystoreB64 = rootProject.file('signing/shishalove-beta-keystore.b64')
def betaKeystore = rootProject.file('signing/shishalove-beta.keystore')
if (!betaKeystore.exists()) {
    if (!betaKeystoreB64.exists()) throw new GradleException('Missing stable ShishaLove beta signing identity')
    betaKeystore.parentFile.mkdirs()
    betaKeystore.bytes = java.util.Base64.decoder.decode(betaKeystoreB64.getText('UTF-8').trim())
}

android {
    namespace 'eu.shishalove.customer'
    compileSdk 35

    signingConfigs {
        beta {
            storeFile betaKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'eu.shishalove.customer'
        minSdk 24
        targetSdk 35
        versionCode 124
        versionName '1.1.22'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            signingConfig signingConfigs.beta
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.beta
        }
    }
}

// PERMANENT CUSTOMER LAUNCHER LOCK
// Android/Samsung owns the final launcher mask. The exact user-approved Customer
// artwork is reconstructed from four locked source parts, its dark canvas/outline
// is removed, and only the white ShishaLove + red heart artwork is fitted into a
// protected adaptive safe area so no part of the logo touches the launcher frame.
def materializeCustomerLauncherIcon = tasks.register('materializeCustomerLauncherIcon') {
    doLast {
        def iconParts = (0..3).collect { idx ->
            rootProject.file(String.format('../shishalove-branding/customer-icon.b64.part%02d', idx))
        }
        iconParts.each { part ->
            if (!part.exists()) throw new GradleException("Missing locked ShishaLove customer icon source: ${part.name}")
        }
        def encoded = iconParts.collect { it.getText('UTF-8').replaceAll('\\s', '') }.join('')
        byte[] raw = java.util.Base64.decoder.decode(encoded)
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(raw).encodeHex().toString()
        if (digest != '74d5803c3da43f55fb5c3947b37d15b868eee2c5f6a014a83d5a7b774f780f50') {
            throw new GradleException('Customer launcher source changed')
        }

        def sourceImage = javax.imageio.ImageIO.read(new java.io.ByteArrayInputStream(raw))
        if (sourceImage == null || sourceImage.width != 512 || sourceImage.height != 512) {
            throw new GradleException('Customer launcher source must be 512x512 PNG')
        }

        def outputDir = file('src/main/res/drawable-nodpi')
        outputDir.mkdirs()
        new File(outputDir, 'ic_shishalove_customer.png').bytes = raw

        int w = 512, h = 512
        def extracted = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        int minX = w, minY = h, maxX = -1, maxY = -1
        int visiblePixels = 0
        int redPixels = 0

        for (int y = 0; y < h; y++) {
            for (int x = 0; x < w; x++) {
                int argb = sourceImage.getRGB(x, y)
                int a = (argb >>> 24) & 0xff
                int r = (argb >>> 16) & 0xff
                int g = (argb >>> 8) & 0xff
                int b = argb & 0xff
                // Remove the black canvas and faint baked rounded-square outline.
                boolean darkBackground = a == 0 || (r < 70 && g < 70 && b < 70)
                if (darkBackground) {
                    extracted.setRGB(x, y, 0x00000000)
                } else {
                    extracted.setRGB(x, y, argb)
                    visiblePixels++
                    minX = Math.min(minX, x)
                    minY = Math.min(minY, y)
                    maxX = Math.max(maxX, x)
                    maxY = Math.max(maxY, y)
                    if (r > 120 && r > g * 1.35 && r > b * 1.35) redPixels++
                }
            }
        }

        if (visiblePixels < 1000 || redPixels < 500 || maxX <= minX || maxY <= minY) {
            throw new GradleException('Customer launcher artwork extraction failed or red heart is missing')
        }

        int sourceW = maxX - minX + 1
        int sourceH = maxY - minY + 1
        // Final Samsung-safe fit: 368px visible width leaves 72px horizontal
        // breathing room on the 512px adaptive canvas before Android applies its mask.
        int targetW = 368
        int targetH = Math.round(targetW * (sourceH / (float) sourceW))
        int maxTargetH = 320
        if (targetH > maxTargetH) {
            targetH = maxTargetH
            targetW = Math.round(targetH * (sourceW / (float) sourceH))
        }
        int offsetX = (w - targetW) / 2
        int offsetY = (h - targetH) / 2

        def safeArt = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g2 = safeArt.createGraphics()
        g2.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
        g2.setRenderingHint(java.awt.RenderingHints.KEY_RENDERING, java.awt.RenderingHints.VALUE_RENDER_QUALITY)
        g2.setRenderingHint(java.awt.RenderingHints.KEY_ANTIALIASING, java.awt.RenderingHints.VALUE_ANTIALIAS_ON)
        g2.drawImage(extracted,
            offsetX, offsetY, offsetX + targetW, offsetY + targetH,
            minX, minY, maxX + 1, maxY + 1,
            null)
        g2.dispose()

        if (offsetX < 64 || offsetY < 80 || (w - (offsetX + targetW)) < 64 || (h - (offsetY + targetH)) < 80) {
            throw new GradleException('Customer launcher safe-area geometry violated')
        }

        javax.imageio.ImageIO.write(safeArt, 'png', new File(outputDir, 'ic_shishalove_customer_art.png'))
        def obsolete = new File(outputDir, 'ic_shishalove_customer_legacy.png')
        if (obsolete.exists()) obsolete.delete()
    }
}

def lockCanonicalCustomerRuntime = tasks.register('lockCanonicalCustomerRuntime') {
    doLast {
        def guard = "if(window.SHISHALOVE_BRIDGE&&location.pathname.toLowerCase().indexOf('/shishalove-app')===0){return;}"
        ['customer_phone_polish.js', 'customer_phone_fix_115.js'].each { name ->
            def asset = file("src/main/assets/${name}")
            if (!asset.exists()) throw new GradleException("Missing ${name}")
            def text = asset.getText('UTF-8')
            if (!text.contains(guard)) {
                def anchor = "'use strict';"
                if (!text.contains(anchor)) throw new GradleException("Cannot lock ${name}")
                text = text.replace(anchor, anchor + "\n" + guard)
                asset.setText(text, 'UTF-8')
            }
        }

        def activity = file('src/main/java/eu/shishalove/customer/MainActivity.java')
        def source = activity.getText('UTF-8')
        ['build=115','build=118','build=119','build=120','build=129'].each { oldValue -> source = source.replace(oldValue, 'build=129') }
        ['ShishaLoveCustomer/1.1.5','ShishaLoveCustomer/1.1.8','ShishaLoveCustomer/1.1.9','ShishaLoveCustomer/1.1.10','ShishaLoveCustomer/1.1.11','ShishaLoveCustomer/1.1.19'].each { oldValue -> source = source.replace(oldValue, 'ShishaLoveCustomer/1.1.20') }
        source = source.replace(
                'v.setPadding(bars.left, bars.top, bars.right, bars.bottom);',
                'v.setPadding(bars.left, bars.top + dp(6), bars.right, Math.max(dp(10), bars.bottom - dp(28)));'
        )
        // Splash must use the processed transparent adaptive artwork, never the raw
        // 512x512 source that contains the faint baked rounded-square border.
        source = source.replace(
                'logo.setImageResource(eu.shishalove.customer.R.drawable.ic_shishalove_customer);',
                'logo.setImageResource(eu.shishalove.customer.R.drawable.ic_shishalove_customer_art);'
        )
        activity.setText(source, 'UTF-8')
    }
}

tasks.named('preBuild').configure {
    dependsOn materializeCustomerLauncherIcon
    dependsOn lockCanonicalCustomerRuntime
}
