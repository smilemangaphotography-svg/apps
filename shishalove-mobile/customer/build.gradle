plugins {
    id 'com.android.application'
}

def betaKeystoreB64 = rootProject.file('signing/shishalove-beta-keystore.b64')
def betaKeystore = rootProject.file('signing/shishalove-beta.keystore')
if (!betaKeystore.exists()) {
    if (!betaKeystoreB64.exists()) throw new GradleException('Missing stable ShishaLove beta signing identity')
    betaKeystore.parentFile.mkdirs()
    betaKeystore.bytes = java.util.Base64.decoder.decode(betaKeystoreB64.getText('UTF-8').trim())
}

android {
    namespace 'eu.shishalove.customer'
    compileSdk 35

    signingConfigs {
        beta {
            storeFile betaKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'eu.shishalove.customer'
        minSdk 24
        targetSdk 35
        versionCode 119
        versionName '1.1.9'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            signingConfig signingConfigs.beta
        }
        release {
            minifyEnabled false
            // Canonical install/update identity. Release must never fall back to an
            // unsigned APK or an ephemeral debug key.
            signingConfig signingConfigs.beta
        }
    }
}

def materializeCustomerLauncherIcon = tasks.register('materializeCustomerLauncherIcon') {
    doLast {
        def brandingDir = rootProject.file('../shishalove-branding')
        def parts = fileTree(brandingDir) {
            include 'customer-icon.b64.part*'
        }.files.sort { a, b -> a.name <=> b.name }
        if (parts.isEmpty()) {
            throw new GradleException('Missing locked ShishaLove customer launcher artwork')
        }
        def encoded = parts.collect { it.getText('UTF-8').trim() }.join('')
        def output = file('src/main/res/drawable-nodpi/ic_shishalove_customer.png')
        output.parentFile.mkdirs()
        output.bytes = java.util.Base64.decoder.decode(encoded)
    }
}

// Canonical bridge runtime lock.
// Legacy phone-polish scripts are allowed only on legacy website pages. They must
// never execute on /shishalove-app/: otherwise they can create a second age gate,
// replace bridge navigation, attach whole-document MutationObservers and break
// scrolling/performance. Keep this build-time guard as a second line of defence;
// MainActivity also blocks legacy injection on the canonical bridge route.
def lockCanonicalCustomerRuntime = tasks.register('lockCanonicalCustomerRuntime') {
    doLast {
        def guard = "if(window.SHISHALOVE_BRIDGE&&location.pathname.toLowerCase().indexOf('/shishalove-app')===0){return;}"
        ['customer_phone_polish.js', 'customer_phone_fix_115.js'].each { name ->
            def asset = file("src/main/assets/${name}")
            if (!asset.exists()) throw new GradleException("Missing ${name}")
            def text = asset.getText('UTF-8')
            if (!text.contains(guard)) {
                def anchor = "'use strict';"
                if (!text.contains(anchor)) throw new GradleException("Cannot lock ${name}")
                text = text.replace(anchor, anchor + "\n" + guard)
                asset.setText(text, 'UTF-8')
            }
        }

        def activity = file('src/main/java/eu/shishalove/customer/MainActivity.java')
        def source = activity.getText('UTF-8')
        source = source.replace('build=115', 'build=119')
        source = source.replace('build=118', 'build=119')
        source = source.replace('ShishaLoveCustomer/1.1.5', 'ShishaLoveCustomer/1.1.9')
        source = source.replace('ShishaLoveCustomer/1.1.8', 'ShishaLoveCustomer/1.1.9')
        activity.setText(source, 'UTF-8')
    }
}

tasks.named('preBuild').configure {
    dependsOn materializeCustomerLauncherIcon
    dependsOn lockCanonicalCustomerRuntime
}
