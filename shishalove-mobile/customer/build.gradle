plugins {
    id 'com.android.application'
}

android {
    namespace 'eu.shishalove.customer'
    compileSdk 35

    defaultConfig {
        applicationId 'eu.shishalove.customer.beta'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0-beta'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
