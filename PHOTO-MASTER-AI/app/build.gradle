plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ilia.photomasterai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ilia.photomasterai'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.10.0-beta'

        def endpoint = project.findProperty('PHOTO_MASTER_AI_ENDPOINT') ?: ''
        buildConfigField 'String', 'AI_ENDPOINT', '"' + endpoint.toString().replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
