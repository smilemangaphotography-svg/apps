name: ShishaLove Runtime 1.1.35 Final Corrections

on:
  push:
    branches: [shishalove-main]
    paths:
      - '.github/workflows/shishalove-runtime-1.1.35.yml'
      - 'shishalove-wordpress-bridge/tools/patch-shishalove-1.1.35.py'
      - 'shishalove-mobile/tools/patch-runtime-1.1.35.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Build Bridge 1.1.35 and Android runtime
        run: |
          set -euo pipefail
          rm -rf package dist
          mkdir -p package dist
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge package/shishalove-app-bridge
          python3 shishalove-wordpress-bridge/tools/patch-shishalove-1.1.35.py package/shishalove-app-bridge
          python3 shishalove-mobile/tools/patch-runtime-1.1.35.py

          CUSTOMER='package/shishalove-app-bridge/assets/customer.js'
          MERCHANT='package/shishalove-app-bridge/assets/merchant.js'
          MAIN='package/shishalove-app-bridge/shishalove-app-bridge.php'
          CSS='package/shishalove-app-bridge/assets/bridge.css'
          sed -i 's/Version: 1.1.6-rc.2/Version: 1.1.35/' "$MAIN"
          sed -i "s/define('SLB_VERSION', '1.1.6-rc.2');/define('SLB_VERSION', '1.1.35');/" "$MAIN"

          node --check "$CUSTOMER"
          node --check "$MERCHANT"
          php -l "$MAIN"

          grep -Fq "var BUILD='1.1.35'" "$CUSTOMER"
          grep -Fq "CFG.version='1.1.35'" "$CUSTOMER"
          grep -Fq "CFG.version='1.1.35'" "$MERCHANT"
          grep -Fq 'Bridge 1.1.35' "$MERCHANT"
          grep -Fq 'window.slbRepairProductImage' "$CUSTOMER"
          grep -Fq 'grid-template-columns:minmax(0,1fr) 176px' "$CSS"
          grep -Fq 'padding-bottom:calc(112px + var(--safe-bottom))' "$CSS"
          grep -Fq 'html:not(.slb-android-app) body.slb-merchant .slm-bottom' "$CSS"
          grep -Fq 'bottom:0!important' "$CSS"

          # Runtime root fixes from 1.1.34 must remain.
          test -f shishalove-mobile/customer/src/main/java/eu/shishalove/customer/CustomerActivityV134.java
          grep -Fq 'v.setPadding(bars.left, bars.top, bars.right, 0);' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/CustomerActivityV134.java
          grep -Fq 'versionCode 135' shishalove-mobile/customer/build.gradle
          grep -Fq "versionName '1.1.35'" shishalove-mobile/customer/build.gradle
          grep -Fq 'build=135' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -Fq 'versionCode 135' shishalove-mobile/merchant/build.gradle
          grep -Fq "versionName '1.1.35'" shishalove-mobile/merchant/build.gradle
          grep -Fq 'build=135' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          ! grep -Fq '__slmPermanentScrollGuard' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MerchantActivityV121.java

          # Approved functional regression locks.
          grep -Fq 'TRASH PRODUCT' "$MERCHANT"
          grep -Fq 'slm-manage-stock' "$MERCHANT"
          grep -Fq 'pagerMarkup(data)' "$MERCHANT"
          grep -Fq 'watermark_failed' "$MAIN"
          grep -Fq 'slb-heart' "$CSS"

          cat > package/shishalove-app-bridge/INSTALL-1.1.35.txt <<'TXT'
          ShishaLove Runtime 1.1.35 — FINAL CORRECTIVE RELEASE

          Fixes only:
          - Customer Recommended-order selector shows the complete text.
          - Customer last product row can scroll fully above the fixed bottom navigation.
          - Customer broken/stale product image URLs retry live WooCommerce image variants.
          - Merchant browser/iPhone/Android-browser bottom navigation is pinned to the real viewport bottom with correct content clearance.
          - Android wrappers use build=135 to bypass stale page caches while preserving the 1.1.34 safe-area/reload root fixes.

          Locked and unchanged:
          - Customer hearts, black bottom labels, product card design, sorting and recommendations.
          - Merchant logo/header, products, orders, stock, editor, media library, watermark and launcher artwork.
          TXT

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build canonical and legacy-beta APKs
        working-directory: shishalove-mobile
        run: gradle :customer:assembleRelease :customer:assembleDebug :merchant:assembleRelease :merchant:assembleDebug --stacktrace

      - name: Verify package identities and signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          CR='shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk'
          CD='shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk'
          MR='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          MD='shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk'

          "$AAPT" dump badging "$CR" | grep -q "package: name='eu.shishalove.customer' versionCode='135' versionName='1.1.35'"
          "$AAPT" dump badging "$CD" | grep -q "package: name='eu.shishalove.customer.dev' versionCode='135' versionName='1.1.35-dev'"
          "$AAPT" dump badging "$MR" | grep -q "package: name='eu.shishalove.merchant' versionCode='135' versionName='1.1.35'"
          "$AAPT" dump badging "$MD" | grep -q "package: name='eu.shishalove.merchant.dev' versionCode='135' versionName='1.1.35-dev'"

          mkdir -p dist/previous
          gh release download shishalove-runtime-1.1.34 --pattern 'ShishaLove-Customer-Android-1.1.34.apk' --dir dist/previous
          gh release download shishalove-runtime-1.1.34 --pattern 'ShishaLove-Customer-Android-1.1.34-LEGACY-BETA.apk' --dir dist/previous
          gh release download shishalove-runtime-1.1.34 --pattern 'ShishaLove-Merchant-Android-1.1.34.apk' --dir dist/previous
          gh release download shishalove-runtime-1.1.34 --pattern 'ShishaLove-Merchant-Android-1.1.34-LEGACY-BETA.apk' --dir dist/previous

          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/previous/ShishaLove-Customer-Android-1.1.34.apk)" = "$(digest "$CR")"
          test "$(digest dist/previous/ShishaLove-Customer-Android-1.1.34-LEGACY-BETA.apk)" = "$(digest "$CD")"
          test "$(digest dist/previous/ShishaLove-Merchant-Android-1.1.34.apk)" = "$(digest "$MR")"
          test "$(digest dist/previous/ShishaLove-Merchant-Android-1.1.34-LEGACY-BETA.apk)" = "$(digest "$MD")"

      - name: Package release
        run: |
          set -euo pipefail
          (cd package && zip -qr ../dist/shishalove-app-bridge-1.1.35.zip shishalove-app-bridge)
          cp shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk dist/ShishaLove-Customer-Android-1.1.35.apk
          cp shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk dist/ShishaLove-Customer-Android-1.1.35-LEGACY-BETA.apk
          cp shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk dist/ShishaLove-Merchant-Android-1.1.35.apk
          cp shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk dist/ShishaLove-Merchant-Android-1.1.35-LEGACY-BETA.apk
          cat > dist/WHICH-APK.txt <<'TXT'
          Android update identity:
          - Canonical Customer: eu.shishalove.customer
          - Legacy Customer: eu.shishalove.customer.dev
          - Canonical Merchant: eu.shishalove.merchant
          - Legacy Merchant: eu.shishalove.merchant.dev

          If Android offers INSTALL instead of UPDATE for one line, cancel it and use the other matching package line. Never uninstall an existing app merely to change package identity.
          TXT
          sha256sum dist/shishalove-app-bridge-1.1.35.zip dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: shishalove-runtime-1.1.35
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-runtime-1.1.35'
          NOTES='Final corrective release: Customer selector/bottom clearance/image recovery, Merchant browser bottom-nav anchoring, Android build cache bust. Approved business/UI behavior remains locked.'
          ASSETS=(dist/shishalove-app-bridge-1.1.35.zip dist/ShishaLove-Customer-Android-1.1.35.apk dist/ShishaLove-Customer-Android-1.1.35-LEGACY-BETA.apk dist/ShishaLove-Merchant-Android-1.1.35.apk dist/ShishaLove-Merchant-Android-1.1.35-LEGACY-BETA.apk dist/WHICH-APK.txt dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Runtime 1.1.35 — Final Corrections' --notes "$NOTES" --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Runtime 1.1.35 — Final Corrections' --notes "$NOTES" --target shishalove-main
          fi
