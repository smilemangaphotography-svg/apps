name: ShishaLove Merchant 1.1.54 Category Quick Edit Device Test

on:
  push:
    branches: [merchant-post-update-master-fix-1.1.53]
    paths:
      - '.github/workflows/shishalove-merchant-1.1.54-category-quick-edit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact approved frontend implementation
        uses: actions/checkout@v4
        with:
          ref: be43f1cad34cb33f359a41d862bf2dad499acbbc
          fetch-depth: 0

      - name: Verify exact source and frontend-only scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "be43f1cad34cb33f359a41d862bf2dad499acbbc"
          BASE='0c66a9bd8073c70039da2dcbc2de908825a84b9f'
          test "$(git diff --name-only "$BASE" HEAD)" = "shishalove-mobile/merchant/src/main/assets/merchant_phone_polish.js"
          P='shishalove-mobile/merchant/src/main/assets/merchant_phone_polish.js'
          grep -Fq '__SLM3_FILTER_UI_INSTALLED' "$P"
          grep -Fq 'Category / Brand' "$P"
          grep -Fq 'slmq-panel' "$P"
          grep -Fq "merchant/product/" "$P"
          grep -Fq 'No changes to update.' "$P"
          grep -Fq 'Could not load current WooCommerce values' "$P"
          ! grep -Fq '8 matching products' "$P"
          ! grep -Fq 'Quasar' "$P"
          git diff --quiet
          git diff --cached --quiet

      - name: Prepare read-only Android patch input
        run: |
          set -euo pipefail
          rm -rf /tmp/slm-bridge-input
          mkdir -p /tmp/slm-bridge-input/assets
          cp shishalove-wordpress-bridge/runtime/merchant-approved-beta-1.1.50.js /tmp/slm-bridge-input/assets/merchant.js
          grep -Fq "var MERCHANT_WORDMARK='data:image/png;base64," /tmp/slm-bridge-input/assets/merchant.js

      - name: Apply existing Android release chain through 1.1.52
        run: |
          set -euo pipefail
          python3 shishalove-mobile/tools/patch-merchant-final-1.1.52.py /tmp/slm-bridge-input

      - name: Set device-test version 1.1.54
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('shishalove-mobile/merchant/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          if g.count('versionCode 152') != 1:
              raise SystemExit('versionCode 152 anchor missing/ambiguous')
          if g.count("versionName '1.1.52'") != 1:
              raise SystemExit('versionName 1.1.52 anchor missing/ambiguous')
          g = g.replace('versionCode 152', 'versionCode 154', 1)
          g = g.replace("versionName '1.1.52'", "versionName '1.1.54'", 1)
          g = g.replace('ShishaLoveMerchant/1.1.52', 'ShishaLoveMerchant/1.1.54')
          gradle.write_text(g, encoding='utf-8')

          main = Path('shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java')
          t = main.read_text(encoding='utf-8')
          if 'build=152' not in t:
              raise SystemExit('build=152 anchor missing')
          t = t.replace('build=152', 'build=154')
          t = t.replace('ShishaLoveMerchant/1.1.52', 'ShishaLoveMerchant/1.1.54')
          main.write_text(t, encoding='utf-8')
          PY

          G='shishalove-mobile/merchant/build.gradle'
          M='shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java'
          P='shishalove-mobile/merchant/src/main/assets/merchant_phone_polish.js'

          grep -Fq 'versionCode 154' "$G"
          grep -Fq "versionName '1.1.54'" "$G"
          grep -Fq "applicationId 'eu.shishalove.merchant'" "$G"
          grep -Fq 'build=154' "$M"
          grep -Fq 'ShishaLoveMerchant/1.1.54' "$M"
          grep -Fq '__SLM_FILTER_CLOSE_OPEN' "$M"
          grep -Fq '__SLM3_FILTER_UI_INSTALLED' "$P"
          grep -Fq 'slmq-panel' "$P"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: shishalove-mobile
        run: gradle :merchant:assembleRelease --stacktrace

      - name: Verify package and signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          test -f "$APK"
          "$AAPT" dump badging "$APK" | grep -q "package: name='eu.shishalove.merchant' versionCode='154' versionName='1.1.54'"

          mkdir -p dist/previous
          gh release download shishalove-merchant-1.1.51 \
            --pattern 'ShishaLove-Merchant-1.1.51-CURRENT-PHONE-UPDATE.apk' \
            --dir dist/previous

          digest() {
            "$APKSIGNER" verify --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
              head -n1
          }
          PREV="$(digest dist/previous/ShishaLove-Merchant-1.1.51-CURRENT-PHONE-UPDATE.apk)"
          NEXT="$(digest "$APK")"
          test -n "$PREV"
          test "$PREV" = "$NEXT"

          mkdir -p dist
          cp "$APK" dist/ShishaLove-Merchant-1.1.54-CATEGORY-QUICK-EDIT-DEVICE-TEST.apk
          cat > dist/BUILD-INFO.txt <<EOF
          SHISHALOVE MERCHANT 1.1.54 — CATEGORY + QUICK EDIT DEVICE TEST
          Source branch: merchant-post-update-master-fix-1.1.53
          Source implementation commit: be43f1cad34cb33f359a41d862bf2dad499acbbc
          Package: eu.shishalove.merchant
          versionCode: 154
          versionName: 1.1.54
          Signing continuity: PASS
          WordPress modified: NO
          Bridge/backend modified: NO
          Customer modified: NO
          Real WooCommerce data path preserved: YES
          Device validation required for live taxonomy/price/stock tests.
          EOF
          sha256sum dist/ShishaLove-Merchant-1.1.54-CATEGORY-QUICK-EDIT-DEVICE-TEST.apk > dist/SHA256SUMS.txt

      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-merchant-1.1.54-category-quick-edit-device-test
          path: |
            dist/ShishaLove-Merchant-1.1.54-CATEGORY-QUICK-EDIT-DEVICE-TEST.apk
            dist/BUILD-INFO.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
