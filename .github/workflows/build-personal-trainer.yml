name: Build Personal Trainer Android Beta

on:
  workflow_dispatch:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - 'personal-trainer/android-beta/**'
      - '.github/workflows/build-personal-trainer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: personal-trainer-main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and video tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Bundle Style 2.4 continuous anatomy motion
        shell: bash
        run: |
          set -euo pipefail
          D=personal-trainer/android-beta/app/src/main/assets/media
          mkdir -p "$D" /tmp/pt-motion

          make_loop() {
            local name="$1"
            local url="$2"
            local out="$D/motion-${name}-loop.mp4"
            local raw="/tmp/pt-motion/${name}-raw.mp4"
            if [ -s "$out" ]; then
              echo "motion $name already bundled"
              return
            fi
            curl -L --fail --retry 4 --retry-delay 2 -o "$raw" "$url"
            ffmpeg -hide_banner -loglevel error -y -i "$raw" \
              -filter_complex "[0:v]split=2[f][r];[r]reverse[rr];[f][rr]concat=n=2:v=1:a=0,setpts=0.5*PTS,fps=24,format=yuv420p[v]" \
              -map "[v]" -an -c:v libx264 -preset veryfast -crf 25 -movflags +faststart -t 6 "$out"
            test -s "$out"
          }

          make_loop pushup 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_132737_13137d5c-976c-42c0-9e52-9f8a820b97a9.mp4'
          make_loop incline 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_132737_99f43071-5bf9-47c4-9a3d-8bdf1255163e.mp4'
          make_loop lat 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_132737_4f874c60-8de7-42f3-bbcb-0be4d12fd8c0.mp4'
          make_loop rdl 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_133012_ef4a9654-bd11-4880-8301-f92100f640b4.mp4'
          make_loop row 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_132737_0cf603da-5f6f-4952-8e5c-6dbe51e7de41.mp4'
          make_loop goblet 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_132736_a59a2421-84d4-4275-a3dd-7438ebb0f505.mp4'
          make_loop legpress 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_132813_a9a1b348-fe1d-40c0-9bcf-6c9ae2fc761e.mp4'
          make_loop calf 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_132813_e3a36ccc-4d92-43dc-879a-1b324dcc1e77.mp4'
          make_loop split 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_132812_deca169a-0967-418f-b742-5121f7063806.mp4'
          make_loop hamcurl 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_133013_1b964b32-7e3a-4d32-a213-bbd9afe4eaac.mp4'

      - name: Persist motion pack in canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "personal-trainer-build"
          git config user.email "actions@users.noreply.github.com"
          git add personal-trainer/android-beta/app/src/main/assets/media/motion-*-loop.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Bundle Style 2.4 continuous anatomy motion pack"
            git push origin HEAD:personal-trainer-main
          fi

      - name: Validate Style 2 Beta 2.4 runtime
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          test -s "$A/index2.html"
          test -s "$A/app-v2.css"
          test -s "$A/app-v2.js"
          test -s "$A/visual-v21.css"
          test -s "$A/visual-v21.js"
          test -s "$A/style2-v22.css"
          test -s "$A/style2-v22.js"
          test -s "$A/style2-v23.css"
          test -s "$A/style2-v23.js"
          test -s "$A/style2-v23-patch.js"
          test -s "$A/style2-v24.css"
          test -s "$A/style2-v24.js"
          node --check "$A/app-v2.js"
          node --check "$A/visual-v21.js"
          node --check "$A/style2-v22.js"
          node --check "$A/style2-v23.js"
          node --check "$A/style2-v23-patch.js"
          node --check "$A/style2-v24.js"
          grep -q 'style2-v24.css' "$A/index2.html"
          grep -q 'style2-v24.js' "$A/index2.html"
          grep -q "__PT_STYLE24__='real-motion-integrations-2.4'" "$A/style2-v24.js"
          grep -q 'CONNECT SPOTIFY' "$A/style2-v24.js"
          grep -q 'CONNECT GARMIN' "$A/style2-v24.js"
          grep -q 'builderBack' "$A/style2-v24.js"
          grep -q '__PT_STYLE24__' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q "versionName '2.4-beta'" personal-trainer/android-beta/app/build.gradle

          for f in pushup incline lat rdl row goblet legpress calf split hamcurl; do
            test -s "$A/media/motion-$f-loop.mp4"
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$A/media/motion-$f-loop.mp4")
            awk -v d="$dur" 'BEGIN{exit !(d>=5.7 && d<=6.3)}'
          done

      - name: Build Personal Trainer APK
        run: gradle --no-daemon -p personal-trainer/android-beta :app:assembleDebug

      - name: Package APK
        shell: bash
        run: |
          mkdir -p release
          cp personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk release/Personal-Trainer-Style2-Beta-2.4.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PERSONAL-TRAINER-STYLE2-BETA-2.4
          path: release/*
          if-no-files-found: error
          retention-days: 30
