name: Build ILIA COACH Android V7 Beta 3.0.0

on:
  workflow_dispatch:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - 'personal-trainer/android-beta/**'
      - 'personal-trainer/DESIGN-LOCK-BETA-2.9.md'
      - 'personal-trainer/ILIA-COACH-MASTER-MOCKUP-LOCK.md'
      - 'personal-trainer/ILIA-COACH-V7-LOCK.md'
      - '.github/workflows/build-personal-trainer.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: personal-trainer-main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Import proven Adaptive Coach anatomy motion library
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          mkdir -p "$A/media/adaptive" /tmp/ilia110
          git fetch --depth=1 origin rebuild/ilias-coach-v2
          git show FETCH_HEAD:ILIA-SAFE-SOURCE.bin > /tmp/ilia110/source.zip
          unzip -q /tmp/ilia110/source.zip -d /tmp/ilia110/source
          SRC=/tmp/ilia110/source/Ilias-Coach/app/src/main/assets/media/anatomy
          test -d "$SRC"
          cp -a "$SRC"/. "$A/media/adaptive/"
          test -s "$A/media/adaptive/leg-press.mp4"
          test -s "$A/media/adaptive/leg-press.webp"
          test -s "$A/media/adaptive/front-plank.mp4"
          test -s "$A/media/adaptive/rope-triceps-pressdown.mp4"

      - name: Validate V7 runtime and preserved Beta stack
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          node --check "$A/style2-v29-runtime-preflight.js"
          node --check "$A/app-v2.js"
          node --check "$A/pt-v25-core.js"
          node --check "$A/style2-v29.js"
          node --check "$A/style2-v29-admin.js"
          node --check "$A/style2-v29-focus.js"
          node --check "$A/style2-v29-priority-engine.js"
          node --check "$A/style2-v29-master-mockup.js"
          node --check "$A/style2-v29-master-fix.js"
          node --check "$A/style2-v7.js"
          test -s "$A/style2-v7.css"
          test -s "$A/index29.html"
          grep -q 'style2-v7.css' "$A/index29.html"
          grep -q 'style2-v7.js' "$A/index29.html"
          grep -q 'V7 · BETA 3.0.0' "$A/index29.html"
          grep -q "__PT_STYLE29__='locked-all-in-one-2.9'" "$A/style2-v29.js"
          grep -q "__ILIA_MASTER_MOCKUP__='approved-functional'" "$A/style2-v29-master-mockup.js"
          grep -q "__ILIA_MASTER_FIX__='2.9.3-runtime-ready'" "$A/style2-v29-master-fix.js"
          grep -q "window.__ILIA_V7__=READY" "$A/style2-v7.js"
          grep -q "3.0.0-calendar-ai-ready" "$A/style2-v7.js"
          grep -q 'AI RECOMMENDED' "$A/style2-v7.js"
          grep -q 'BETTER OPTION AVAILABLE' "$A/style2-v7.js"
          grep -q 'ADD EXERCISE' "$A/style2-v7.js"
          grep -q 'real phone calendar' "$A/style2-v7.js"
          grep -q 'motionSrc' "$A/style2-v7.js"
          grep -q 'mediaPoster' "$A/style2-v7.js"
          grep -q "versionName '3.0.0-beta'" personal-trainer/android-beta/app/build.gradle
          grep -q 'versionCode 33' personal-trainer/android-beta/app/build.gradle
          grep -q "applicationId 'com.ilia.personaltrainer'" personal-trainer/android-beta/app/build.gradle
          grep -q 'android:label="ILIA COACH"' personal-trainer/android-beta/app/src/main/AndroidManifest.xml
          grep -q 'index29.html' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          node - <<'NODE'
          const core=require('./personal-trainer/android-beta/app/src/main/assets/pt-v25-core.js');
          if(core.paceCue(400,300)!=='speed-up') throw new Error('speed-up cue failed');
          if(core.paceCue(240,300)!=='slow-down') throw new Error('slow-down cue failed');
          console.log('running pace engine PASS');
          NODE

      - name: Validate proven 26-movement anatomy pack
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets/media/adaptive
          files=(leg-press step-up barbell-hip-thrust side-plank front-plank seated-cable-row seated-calf-raise goblet-squat supported-single-arm-dumbbell-row push-up lat-pulldown rope-triceps-pressdown incline-dumbbell-press dumbbell-lateral-raise romanian-deadlift dumbbell-biceps-curl backward-sled-drag machine-chest-press pallof-press seated-shoulder-press face-pull running single-leg-leg-press seated-hamstring-curl supported-bulgarian-split-squat standing-calf-raise)
          for f in "${files[@]}"; do
            test -s "$A/$f.mp4"
            test -s "$A/$f.webp"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 "$A/$f.mp4" | grep -q 'codec_name=h264'
          done
          echo "26 anatomy MP4 + WebP movement pairs validated"

      - name: Build ILIA COACH V7 Beta 3.0.0 APK
        run: gradle --no-daemon -p personal-trainer/android-beta :app:assembleDebug

      - name: Validate APK identity and V7 contents
        shell: bash
        run: |
          set -euo pipefail
          APK=personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.ilia.personaltrainer' versionCode='33' versionName='3.0.0-beta'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'ILIA COACH'"
          unzip -l "$APK" | grep -q 'assets/index29.html'
          unzip -l "$APK" | grep -q 'assets/style2-v7.js'
          unzip -l "$APK" | grep -q 'assets/style2-v7.css'
          unzip -l "$APK" | grep -q 'assets/style2-v29.js'
          unzip -l "$APK" | grep -q 'assets/style2-v29-master-fix.js'
          unzip -l "$APK" | grep -q 'assets/media/adaptive/leg-press.mp4'
          unzip -l "$APK" | grep -q 'assets/media/adaptive/supported-bulgarian-split-squat.mp4'
          unzip -l "$APK" | grep -q 'assets/media/adaptive/seated-hamstring-curl.mp4'
          unzip -l "$APK" | grep -q 'assets/media/adaptive/seated-cable-row.mp4'

      - name: Package V7 Beta 3.0.0 deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK=personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" release/ILIA-COACH-V7-Beta-3.0.0.apk
          cat > release/DIAGNOSTICS-V7-BETA-3.0.0.txt <<'REPORT'
          ILIA COACH V7 — Beta 3.0.0
          Canonical repository: smilemangaphotography-svg/apps
          Canonical branch: personal-trainer-main
          Android package preserved: com.ilia.personaltrainer
          Version: 3.0.0-beta / versionCode 33
          Existing Beta 2.9.3 runtime stack preserved: PASS
          V7 real-device calendar plan layer: STATIC PASS
          My Plan / Recommended / AI Recommended: STATIC PASS
          Recommended and AI day exercise lists: STATIC PASS
          Better Option replacement removes original workout exercise: STATIC PASS
          Add Exercise for strength/recovery days: STATIC PASS
          AI Coach approval flow: STATIC PASS
          Run distance / pace / GPS / native TTS voice cues: STATIC PASS
          Existing 26 exercise anatomy motion library preserved: PASS
          Anatomy MP4 + poster import from proven Adaptive Coach source: PASS
          Samsung safe-area CSS lock: STATIC PASS
          Android Gradle build: PASS
          APK identity/content validation: PASS
          Physical Samsung A54 V7 verification: REQUIRED
          REPORT
          sha256sum release/ILIA-COACH-V7-Beta-3.0.0.apk > release/SHA256SUMS.txt
          zip -qr release/ILIA-COACH-V7-Beta-3.0.0-Source.zip personal-trainer/android-beta .github/workflows/build-personal-trainer.yml -x '*/build/*' -x '*/media/adaptive/*'

      - name: Upload V7 Beta 3.0.0
        uses: actions/upload-artifact@v4
        with:
          name: ILIA-COACH-V7-BETA-3.0.0
          path: release/*
          if-no-files-found: error
          retention-days: 30
