name: Build ILIA COACH Android Beta

on:
  workflow_dispatch:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - 'personal-trainer/android-beta/**'
      - 'personal-trainer/ILIA-COACH-2.7-DESIGN-LOCK.md'
      - '.github/workflows/build-personal-trainer.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: personal-trainer-main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Import proven Adaptive Coach 1.1 anatomy pack
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          mkdir -p "$A/media/anatomy" "$A/media/custom" /tmp/ilia110
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/smilemangaphotography-svg/apps/rebuild/ilias-coach-v2/ILIA-SAFE-SOURCE.bin' \
            -o /tmp/ilia110/source.zip
          unzip -q /tmp/ilia110/source.zip -d /tmp/ilia110/source
          SRC=/tmp/ilia110/source/Ilias-Coach/app/src/main/assets/media/anatomy
          test -d "$SRC"
          cp -a "$SRC"/. "$A/media/anatomy/"
          test -s "$A/media/anatomy/leg-press.mp4"
          test -s "$A/media/anatomy/leg-press.webp"
          test -s "$A/media/anatomy/front-plank.mp4"
          test -s "$A/media/anatomy/rope-triceps-pressdown.mp4"

      - name: Import five Personal Trainer extension motions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          mkdir -p /tmp/b26 "$A/media/custom"
          curl -L --fail --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'https://api.github.com/repos/smilemangaphotography-svg/apps/actions/artifacts/10123086475/zip' \
            -o /tmp/b26/artifact.zip
          unzip -q /tmp/b26/artifact.zip -d /tmp/b26/artifact
          unzip -q /tmp/b26/artifact/Personal-Trainer-Style2-Beta-2.6.apk -d /tmp/b26/apk
          for pair in chestrow:chestrow legext:legext revlunge:revlunge spanish:spanish deadbug:deadbug; do
            name=${pair%%:*}
            src=${pair##*:}
            cp "/tmp/b26/apk/assets/media/motion-${src}-loop.mp4" "$A/media/custom/${name}.mp4"
            cp "/tmp/b26/apk/assets/media/motion-${src}-poster.jpg" "$A/media/custom/${name}.jpg"
            test -s "$A/media/custom/${name}.mp4"
            test -s "$A/media/custom/${name}.jpg"
          done

      - name: Validate ILIA COACH 2.7 source
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          node --check "$A/ilia27.js"
          test -s "$A/ilia27.css"
          test -s "$A/index27.html"
          grep -q 'ilia27.css' "$A/index27.html"
          grep -q 'ilia27.js' "$A/index27.html"
          grep -q "__ILIA_COACH_27__='all-in-one-locked-2.7'" "$A/ilia27.js"
          grep -q 'requestAnimationFrame' "$A/ilia27.js"
          grep -q 'preload="auto"' "$A/ilia27.js"
          grep -q 'EXERCISE SELECTION' "$A/ilia27.js"
          grep -q 'TRAINING TYPE' "$A/ilia27.js"
          grep -q 'RUNNING TYPE' "$A/ilia27.js"
          grep -q "versionName '2.7-beta'" personal-trainer/android-beta/app/build.gradle
          grep -q "applicationId 'com.ilia.personaltrainer'" personal-trainer/android-beta/app/build.gradle
          grep -q 'android:label="ILIA COACH"' personal-trainer/android-beta/app/src/main/AndroidManifest.xml
          grep -q 'index27.html' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q 'window.PT27' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          test "$(grep -o "id:'" "$A/ilia27.js" | wc -l)" -ge 31

      - name: Validate bundled anatomy motion media
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          old=(leg-press machine-chest-press supported-bulgarian-split-squat seated-hamstring-curl standing-calf-raise running lat-pulldown seated-shoulder-press backward-sled-drag pallof-press romanian-deadlift barbell-hip-thrust step-up incline-dumbbell-press seated-calf-raise single-leg-leg-press supported-single-arm-dumbbell-row side-plank push-up seated-cable-row dumbbell-biceps-curl rope-triceps-pressdown dumbbell-lateral-raise face-pull goblet-squat front-plank)
          for f in "${old[@]}"; do
            test -s "$A/media/anatomy/$f.mp4"
            test -s "$A/media/anatomy/$f.webp"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 "$A/media/anatomy/$f.mp4" | grep -q 'codec_name=h264'
          done
          custom=(chestrow legext revlunge spanish deadbug)
          for f in "${custom[@]}"; do
            test -s "$A/media/custom/$f.mp4"
            test -s "$A/media/custom/$f.jpg"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1 "$A/media/custom/$f.mp4" | grep -q 'codec_name=h264'
          done
          echo "31 exercise motion sources validated"

      - name: Build ILIA COACH Beta 2.7 APK
        run: gradle --no-daemon -p personal-trainer/android-beta :app:assembleDebug

      - name: Validate APK identity and contents
        shell: bash
        run: |
          set -euo pipefail
          APK=personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.ilia.personaltrainer' versionCode='27' versionName='2.7-beta'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'ILIA COACH'"
          unzip -l "$APK" | grep -q 'assets/index27.html'
          unzip -l "$APK" | grep -q 'assets/ilia27.js'
          unzip -l "$APK" | grep -q 'assets/ilia27.css'
          unzip -l "$APK" | grep -q 'assets/media/anatomy/leg-press.mp4'
          unzip -l "$APK" | grep -q 'assets/media/anatomy/front-plank.mp4'
          unzip -l "$APK" | grep -q 'assets/media/custom/legext.mp4'
          unzip -l "$APK" | grep -q 'assets/media/custom/deadbug.mp4'

      - name: Package Beta 2.7 deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK=personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" release/ILIA-COACH-All-In-One-Beta-2.7.apk
          cat > release/DIAGNOSTICS-BETA-2.7.txt <<'REPORT'
          ILIA COACH All-In-One — Beta 2.7 CI Diagnostics
          Canonical repository: smilemangaphotography-svg/apps
          Canonical branch: personal-trainer-main
          Existing Android package preserved: PASS — com.ilia.personaltrainer
          Display label: PASS — ILIA COACH
          Version: PASS — 2.7-beta / versionCode 27
          Locked design document: PASS
          Single consolidated frontend runtime: PASS — index27.html + ilia27.js + ilia27.css
          Legacy Personal Trainer localStorage migration: STATIC PASS
          Multi-goal selection: STATIC PASS
          Training-type selection: STATIC PASS
          Running-type selection: STATIC PASS
          Schedule builder: STATIC PASS
          Today/current workout full exercise list: STATIC PASS
          Weekly + Monthly + 2-week plan views: STATIC PASS
          Exercise select/unselect + automatic rebuild: STATIC PASS
          Exercise library: PASS — 31 strength/rehab/conditioning movements
          Adaptive Coach 1.1 proven anatomy pack imported: PASS — 26 MP4 + WebP pairs
          Personal Trainer extension motions imported: PASS — 5 MP4 + JPG pairs
          Motion architecture: PASS — one player, requestAnimationFrame attach, autoplay/muted/loop/playsinline/preload auto, poster fallback
          Active workout flow: STATIC PASS
          Rest timer: STATIC PASS
          Native GPS bridge compile: PASS
          Native TTS voice coach bridge compile: PASS
          Recover page: STATIC PASS
          Fuel/meal tracking: STATIC PASS
          Local music picker: STATIC PASS
          YouTube/YouTube Music: external official app/browser launch; no broken WebView embed
          Progress dashboard: STATIC PASS
          Spotify: EXCLUDED BY REQUEST
          Garmin: EXCLUDED BY REQUEST
          Strava: EXCLUDED BY REQUEST
          Android Gradle build: PASS
          APK identity/content validation: PASS
          Safe-area implementation: STATIC PASS; Samsung physical verification required
          GPS accuracy, TTS audibility and continuous video smoothness: PHYSICAL DEVICE VERIFICATION REQUIRED
          REPORT
          sha256sum release/ILIA-COACH-All-In-One-Beta-2.7.apk > release/SHA256SUMS.txt
          zip -qr release/ILIA-COACH-All-In-One-Beta-2.7-Source.zip personal-trainer/android-beta personal-trainer/ILIA-COACH-2.7-DESIGN-LOCK.md .github/workflows/build-personal-trainer.yml -x '*/build/*'

      - name: Upload Beta 2.7
        uses: actions/upload-artifact@v4
        with:
          name: ILIA-COACH-ALL-IN-ONE-BETA-2.7
          path: release/*
          if-no-files-found: error
          retention-days: 30
