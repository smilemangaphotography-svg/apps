name: Build Personal Trainer Android Beta

on:
  workflow_dispatch:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - 'personal-trainer/android-beta/**'
      - '.github/workflows/build-personal-trainer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate and reconstruct bundled UI
        shell: bash
        run: |
          node --check personal-trainer/android-beta/app/src/main/assets/fallback.js
          test -s personal-trainer/android-beta/app/src/main/assets/fallback.js
          grep -q "safe-fallback" personal-trainer/android-beta/app/src/main/assets/fallback.js
          grep -q "fallback.js" personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          cat personal-trainer/android-beta/app/src/main/assets/index.part* \
              > personal-trainer/android-beta/app/src/main/assets/index.html
          test -s personal-trainer/android-beta/app/src/main/assets/index.html
          grep -q "<!doctype html>" personal-trainer/android-beta/app/src/main/assets/index.html
          grep -q "</html>" personal-trainer/android-beta/app/src/main/assets/index.html
          test -s personal-trainer/android-beta/app/src/main/assets/media/goblet.webp
          test -s personal-trainer/android-beta/app/src/main/assets/media/legpress.webp
          ! grep -q "cdn.jsdelivr.net/npm/@bryllim" personal-trainer/android-beta/app/src/main/assets/index.html
          ! grep -q "Choose file" personal-trainer/android-beta/app/src/main/assets/index.html
      - name: Build Personal Trainer APK
        run: gradle --no-daemon -p personal-trainer/android-beta :app:assembleDebug
      - name: Package APK
        shell: bash
        run: |
          mkdir -p release
          cp personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk release/Personal-Trainer-Beta-1.4.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PERSONAL-TRAINER-BETA-1.4
          path: release/*
          if-no-files-found: error
          retention-days: 30
