          fetch_if_missing "$D/motion-pushup-alt.png" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/f36b41a6-20a1-4284-8435-788c4346fa8c/0a18aff9-609f-48e5-b0bf-5063139d06d5/_exercise_same_anatomical_fitness_illustration__same_male_su.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDJkZWI2ZDUzNzJhZDliZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTA3Mjg1M30.HUlz1H98i8VrjPqNBOAWZd2HUhRRq_Uv_LsGvW9iLoY'
