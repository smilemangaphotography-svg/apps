name: Build Personal Trainer Android Beta

on:
  workflow_dispatch:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - 'personal-trainer/android-beta/**'
      - '.github/workflows/build-personal-trainer.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: personal-trainer-main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Prepare Beta 2.5 motion pack
        shell: bash
        run: |
          set -euo pipefail
          D=personal-trainer/android-beta/app/src/main/assets/media
          mkdir -p "$D" /tmp/pt25-motion
          make_new() {
            local name="$1"
            local url="$2"
            local raw="/tmp/pt25-motion/${name}-raw.mp4"
            local out="$D/motion-${name}-loop.mp4"
            curl -L --fail --retry 4 --retry-delay 2 -o "$raw" "$url"
            ffmpeg -hide_banner -loglevel error -y -i "$raw" -filter_complex "[0:v]scale=640:640:force_original_aspect_ratio=decrease,pad=640:640:(ow-iw)/2:(oh-ih)/2:color=#efe9dc,split=2[f][r];[r]reverse[rr];[f][rr]concat=n=2:v=1:a=0,setpts=0.5*PTS,fps=24,format=yuv420p[v]" -map "[v]" -an -c:v libx264 -preset veryfast -crf 27 -movflags +faststart -t 6 "$out"
          }
          make_new machinepress 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_141535_c402adad-283c-406b-b332-fc7ff01662aa.mp4'
          make_new chestrow 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_141535_8a436c63-b0d4-40a8-8ceb-3cce80740a07.mp4'
          make_new shoulderpress 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_141535_80934c59-1f70-43b1-9f3e-38d0bf5d2d2a.mp4'
          make_new legext 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_141535_ce3882ac-ec2b-4195-9932-57b50f09ef14.mp4'
          make_new hipthrust 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_141535_0a002e34-d476-4476-8b80-65d7b3e0ce3b.mp4'
          make_new revlunge 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_141535_b161488f-5606-45b3-a673-8eae54e49ae0.mp4'
          make_new spanish 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_141556_31b809d5-4328-44e1-90a1-c0779b5db2fb.mp4'
          make_new seatedcalf 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_141556_3b89aef7-4171-4642-ac20-aa70899f217a.mp4'
          make_new deadbug 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_141556_b44ee7ca-a7d8-4b5f-ade2-8a3143ec4ae3.mp4'
          make_new pallof 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_141557_4f0fc56f-5f9e-4283-8eef-c96e9def7ae7.mp4'
          for f in pushup incline lat rdl row goblet legpress calf split hamcurl; do
            src="$D/motion-$f-loop.mp4"; test -s "$src"; tmp="/tmp/pt25-motion/${f}-optimized.mp4"
            ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "scale=640:640:force_original_aspect_ratio=decrease,pad=640:640:(ow-iw)/2:(oh-ih)/2:color=#efe9dc,fps=24,format=yuv420p" -an -c:v libx264 -preset veryfast -crf 27 -movflags +faststart -t 6 "$tmp"
            mv "$tmp" "$src"
          done

      - name: Validate Beta 2.5 source and plan engine
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          node --check "$A/app-v2.js"
          node --check "$A/pt-v25-core.js"
          node --check "$A/style2-v25.js"
          test -s "$A/style2-v25.css"
          grep -q 'pt-v25-core.js' "$A/index2.html"
          grep -q 'style2-v25.js' "$A/index2.html"
          ! grep -q 'style2-v24.js' "$A/index2.html"
          grep -q "versionName '2.5-beta'" personal-trainer/android-beta/app/build.gradle
          grep -q "applicationId 'com.ilia.personaltrainer'" personal-trainer/android-beta/app/build.gradle
          grep -q 'ACCESS_FINE_LOCATION' personal-trainer/android-beta/app/src/main/AndroidManifest.xml
          grep -q 'JavascriptInterface' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          node - <<'NODE'
          const c=require('./personal-trainer/android-beta/app/src/main/assets/pt-v25-core.js');
          const tests=[
            {days:5,goals:['5K','Get Stronger','Injury Recovery / Rehab'],injuries:['Knee']},
            {days:4,goals:['10K','Get Stronger'],injuries:[]},
            {days:4,goals:['Marathon','Build Muscle'],injuries:[]},
            {days:3,goals:['Injury Recovery / Rehab'],injuries:['Knee']},
            {days:4,goals:['Get Stronger'],injuries:[]}
          ];
          for(const t of tests){const p=c.createPlanBlueprint(t);if(p.length!==t.days)throw new Error('plan length failed');}
          const pace=c.paceTargets('5K','22:00');if(!pace||Math.round(pace.race)!==264)throw new Error('pace calculation failed');
          if(c.paceCue(290,264)!=='speed-up'||c.paceCue(240,264)!=='slow-down')throw new Error('voice cue logic failed');
          console.log('Beta 2.5 plan engine PASS');
          NODE
          files=(pushup incline lat rdl row goblet legpress calf split hamcurl machinepress chestrow shoulderpress legext hipthrust revlunge spanish seatedcalf deadbug pallof)
          for f in "${files[@]}"; do
            test -s "$A/media/motion-$f-loop.mp4"
            dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$A/media/motion-$f-loop.mp4")
            awk -v d="$dur" 'BEGIN{exit !(d>=5.7 && d<=6.3)}'
          done

      - name: Build Personal Trainer Beta 2.5 APK
        run: gradle --no-daemon -p personal-trainer/android-beta :app:assembleDebug

      - name: Validate APK identity and contents
        shell: bash
        run: |
          set -euo pipefail
          APK=personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.ilia.personaltrainer' versionCode='25' versionName='2.5-beta'"
          unzip -l "$APK" | grep -q 'assets/style2-v25.js'
          unzip -l "$APK" | grep -q 'assets/pt-v25-core.js'
          unzip -l "$APK" | grep -q 'assets/media/motion-machinepress-loop.mp4'
          unzip -l "$APK" | grep -q 'assets/media/motion-pallof-loop.mp4'

      - name: Package Beta 2.5 deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK=personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" release/Personal-Trainer-Style2-Beta-2.5.apk
          cat > release/DIAGNOSTICS-BETA-2.5.txt <<'REPORT'
          Personal Trainer Style 02 — Beta 2.5 CI Diagnostics
          Package identity: PASS — com.ilia.personaltrainer
          Version: PASS — 2.5-beta / versionCode 25
          JavaScript syntax: PASS
          Multi-goal plan engine: PASS
          5K + Injury Recovery + Strength plan: PASS
          10K + Strength plan: PASS
          Marathon + Strength plan: PASS
          Injury Recovery only plan: PASS
          Strength only plan: PASS
          Target pace calculation: PASS
          Voice pace cue logic: PASS
          GPS/TTS native bridge compile: PASS
          Exercise library target: PASS — 20 strength/rehab + 8 running session types
          Motion assets: PASS — 20 x ~6-second H.264 loops validated
          Spotify: EXCLUDED BY REQUEST
          Garmin: EXCLUDED BY REQUEST
          Strava: EXCLUDED BY REQUEST
          YouTube/YouTube Music embedded DRIVE code: PASS; physical-device playback verification required
          Android Gradle build: PASS
          APK identity/content validation: PASS
          Safe-area implementation: STATIC PASS; physical Samsung verification required
          Live GPS accuracy/voice audibility: PHYSICAL DEVICE VERIFICATION REQUIRED
          REPORT
          sha256sum release/Personal-Trainer-Style2-Beta-2.5.apk > release/SHA256SUMS.txt
          zip -qr release/Personal-Trainer-Style2-Beta-2.5-Source.zip personal-trainer/android-beta .github/workflows/build-personal-trainer.yml -x '*/build/*'

      - name: Upload Beta 2.5
        uses: actions/upload-artifact@v4
        with:
          name: PERSONAL-TRAINER-STYLE2-BETA-2.5
          path: release/*
          if-no-files-found: error
          retention-days: 30
