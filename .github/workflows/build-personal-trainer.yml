          fetch_if_missing "$D/motion-lat-alt.jpg" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/b1f261bb-f3d3-42a5-80f6-77dbe4b37a59/99fdf6a7-0175-4196-ac6e-7c5495ad3b42/_exercise_preserve_the_same_anatomical_illustration_style__s.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNDViODQ2ODE0MDdhNmQxMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTEwNjE3N30.LLDgzEjO9nkPmsUC5QmU7e7pseVTdt61ll4lO2QVhSo'
