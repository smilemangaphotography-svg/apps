name: Build Personal Trainer Android Beta

on:
  workflow_dispatch:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - 'personal-trainer/android-beta/**'
      - '.github/workflows/build-personal-trainer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: personal-trainer-main
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle local anatomy and Style 2 artwork
        shell: bash
        run: |
          set -euo pipefail
          D=personal-trainer/android-beta/app/src/main/assets/media
          mkdir -p "$D"
          fetch_if_missing() { local out="$1"; local url="$2"; if [ ! -s "$out" ]; then curl -L --fail --retry 3 --retry-delay 2 -o "$out" "$url"; fi; }
          fetch_if_missing "$D/v21-pushup.webp" 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_011423_4deb921c-44dc-4fa9-8814-b063f9e26e58_min.webp'
          fetch_if_missing "$D/v21-incline.webp" 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_011612_193aae58-1b4c-4f79-bba2-1b7753a91884_min.webp'
          fetch_if_missing "$D/v21-lat.webp" 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_011423_7cdaaeb6-2c71-4f4f-96a6-c712a4464756_min.webp'
          fetch_if_missing "$D/v21-rdl.webp" 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_011423_52beceb0-0575-4124-820d-a5e950cf4194_min.webp'
          fetch_if_missing "$D/v21-row.webp" 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_011423_bc8f007b-ad22-405c-b9d8-f032cf94463a_min.webp'
          fetch_if_missing "$D/v21-goblet.webp" 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_011423_765c595a-03f1-4b6f-927f-08172f931e92_min.webp'
          fetch_if_missing "$D/v21-legpress.webp" 'https://d8j0ntlcm91z4.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/hf_20260909_011612_eed7ef0a-22f9-4d70-be93-5e64fe6ae883_min.webp'
