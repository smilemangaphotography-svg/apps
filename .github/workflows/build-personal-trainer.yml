          fetch_if_missing "$D/motion-goblet-alt.jpg" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/cd79045f-8525-4c69-b5da-a23066c72ce8/bcde16a3-96bf-47f1-9677-3b0e1357b329/_exercise_preserve_the_same_anatomical_illustration_style__s.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTJmYmY0MDM3YWUwNjk4ZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTEyNzkzOX0.iNOYfOPVGHaqeHtCgK2fjXmIo-VLCe3REMYPP9Fr2Ag'
          fetch_if_missing "$D/motion-legpress-alt.jpg" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/2a0e95d6-ebf4-4266-a543-8f666c32ce4e/4536a73c-5adf-40f5-b169-3862ea2d1677/_exercise_preserve_the_same_hand_drawn_anatomical_male__crea.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNzEzYjAyZjkxZGNjZTYyYSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTEwMDc5M30.aJSLippKBUSeJqocloyDX8X0FJODwhn22wF0PMAh-64'
          fetch_if_missing "$D/motion-calf-alt.jpg" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/3ce541c0-9c57-4161-91b3-0dce3515c96c/781228fe-f1f8-4095-ab51-45450d5d9523/_exercise_preserve_the_same_anatomical_illustration_style__s.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzAzZGFhMGIxOTQ5MWEyMCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTEyMzU5NX0.SfvQbpDeKaEIoHlf7RX3BPURlAOplzXoyfbDaOEDjG0'
          fetch_if_missing "$D/motion-split-alt.jpg" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/97364d26-9577-4808-99a0-d3c895351bee/b5441827-072c-47be-9b5f-73305c937608/_exercise_preserve_the_same_anatomical_illustration_style__s.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2FjZGIzYWYwY2YzN2FiYiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTA5MTYzMX0.jmOcYE9D9XPuEGYduETQtK5g7iA6Y3t02Ad_xccpjpE'
          fetch_if_missing "$D/motion-hamcurl-alt.jpg" 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/51e84b1b-cbb6-432b-abf2-c29cedb5989f/80be4826-bdc0-4406-8947-33cdbb1c36ab/Single_standalone_anatomical_exercise_illustration_on_a_warm.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOTUyMzQ1YTVkNThlMDc1YSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTA1NzU3M30.TWLg3E1uwrb72U9EfPtbqic9o_ELVtM2dBep_-w5OGM'
      - name: Persist local media in canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "personal-trainer-build"
          git config user.email "actions@users.noreply.github.com"
          git add personal-trainer/android-beta/app/src/main/assets/media
          if ! git diff --cached --quiet; then
            git commit -m "Bundle Personal Trainer anatomy motion assets"
            git push origin HEAD:personal-trainer-main
          fi
      - name: Validate Style 2 Beta 2.3 runtime
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          test -s "$A/index2.html"
          test -s "$A/app-v2.css"
          test -s "$A/app-v2.js"
          test -s "$A/visual-v21.css"
          test -s "$A/visual-v21.js"
          test -s "$A/style2-v22.css"
          test -s "$A/style2-v22.js"
          test -s "$A/style2-v23.css"
          test -s "$A/style2-v23.js"
          test -s "$A/media/style2-cover.jpg"
          node --check "$A/app-v2.js"
          node --check "$A/visual-v21.js"
          node --check "$A/style2-v22.js"
          node --check "$A/style2-v23.js"
          grep -q "style2-v23.css" "$A/index2.html"
          grep -q "style2-v23.js" "$A/index2.html"
          grep -q "__PT_BETA2__='ready'" "$A/app-v2.js"
          grep -q "__PT_V21__='anatomy-ui-v21'" "$A/visual-v21.js"
          grep -q "__PT_STYLE2__='minimal-pro-2.2'" "$A/style2-v22.js"
          grep -q "__PT_STYLE23__='motion-ui-2.3'" "$A/style2-v23.js"
          grep -q "START ↔ END" "$A/style2-v23.js"
          grep -q "2-WEEK BLOCKS" "$A/style2-v23.js"
          grep -q "__PT_STYLE23__" personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q "versionName '2.3-beta'" personal-trainer/android-beta/app/build.gradle
          for f in pushup incline lat rdl row goblet legpress calf split hamcurl; do test -s "$A/media/v21-$f.webp"; done
          test -s "$A/media/motion-pushup-alt.png"
          for f in incline lat rdl row goblet legpress calf split hamcurl; do test -s "$A/media/motion-$f-alt.jpg"; done
      - name: Build Personal Trainer APK
        run: gradle --no-daemon -p personal-trainer/android-beta :app:assembleDebug
      - name: Package APK
        shell: bash
        run: |
          mkdir -p release
          cp personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk release/Personal-Trainer-Style2-Beta-2.3.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PERSONAL-TRAINER-STYLE2-BETA-2.3
          path: release/*
          if-no-files-found: error
          retention-days: 30
