name: Build KINETIQ 3.0.3

on:
  workflow_dispatch:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - 'personal-trainer/android-beta/**'
      - 'personal-trainer/KINETIQ-3.0.3-LOCK.md'
      - '.github/workflows/build-personal-trainer.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: personal-trainer-main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install Android SDK packages and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Import proven Adaptive Coach anatomy motion library
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          mkdir -p "$A/media/adaptive" /tmp/ilia110
          git fetch --depth=1 origin rebuild/ilias-coach-v2
          git show FETCH_HEAD:ILIA-SAFE-SOURCE.bin > /tmp/ilia110/source.zip
          unzip -q /tmp/ilia110/source.zip -d /tmp/ilia110/source
          SRC=/tmp/ilia110/source/Ilias-Coach/app/src/main/assets/media/anatomy
          test -d "$SRC"
          cp -a "$SRC"/. "$A/media/adaptive/"
          test -s "$A/media/adaptive/leg-press.mp4"
          test -s "$A/media/adaptive/leg-press.webp"
          test -s "$A/media/adaptive/front-plank.mp4"
          test -s "$A/media/adaptive/rope-triceps-pressdown.mp4"

      - name: Validate KINETIQ runtime
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          node --check "$A/style2-v29-runtime-preflight.js"
          node --check "$A/app-v2.js"
          node --check "$A/pt-v25-core.js"
          node --check "$A/style2-v29.js"
          node --check "$A/style2-v29-admin.js"
          node --check "$A/style2-v29-focus.js"
          node --check "$A/style2-v29-priority-engine.js"
          node --check "$A/style2-v29-master-mockup.js"
          node --check "$A/style2-v29-master-fix.js"
          node --check "$A/style2-v7.js"
          node --check "$A/style2-v7-final-fix.js"
          node --check "$A/style2-v73-library-tools.js"
          node --check "$A/style2-v73-refresh.js"
          test -s "$A/style2-v7.css"
          test -s "$A/style2-v7-final-fix.css"
          test -s "$A/style2-v73-library-tools.css"
          grep -q 'class="cover-screen kinetiq-cover"' "$A/index29.html"
          grep -q 'class="kinetiq-mark"' "$A/index29.html"
          grep -q 'class="kinetiq-wordmark"' "$A/index29.html"
          grep -q 'class="kinetiq-enter"' "$A/index29.html"
          grep -q 'A HIGHER YOU' "$A/index29.html"
          grep -q '>KINETIQ<' "$A/index29.html" || grep -q 'KINETI<span>Q</span>' "$A/index29.html"
          ! grep -q 'OFFICIAL · V7' "$A/index29.html"
          grep -q 'UPLOAD EXERCISE' "$A/style2-v73-library-tools.js"
          grep -q 'EQUIPMENT / REMOVE' "$A/style2-v73-library-tools.js"
          grep -q 'syncPlanAvailability' "$A/style2-v73-library-tools.js"
          grep -q 'motionSrc' "$A/style2-v7.js"
          grep -q 'mediaPoster' "$A/style2-v7.js"
          grep -q 'Open anatomical motion and exercise details' "$A/style2-v7-final-fix.js"
          grep -q 'data-swipe-exercise' "$A/style2-v7.js"
          grep -q 'duplicate prevented' "$A/style2-v7.js"
          grep -q 'bindSwipeGestures' "$A/style2-v73-library-tools.js"
          grep -q 'swipeRemove' "$A/style2-v73-library-tools.js"
          grep -q 'KINETIQ' "$A/index29.html"
          grep -q 'KINETIQ 3.0.3' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q "querySelectorAll('\[data-swipe-exercise\]')" "$A/style2-v73-library-tools.js"
          grep -q "applicationId 'com.ilia.personaltrainer'" personal-trainer/android-beta/app/build.gradle
          grep -q "versionName '3.0.3'" personal-trainer/android-beta/app/build.gradle
          grep -q 'versionCode 43' personal-trainer/android-beta/app/build.gradle
          grep -q 'android:label="@string/app_name"' personal-trainer/android-beta/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' personal-trainer/android-beta/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' personal-trainer/android-beta/app/src/main/AndroidManifest.xml
          test -s personal-trainer/android-beta/app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s personal-trainer/android-beta/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '<string name="app_name">KINETIQ</string>' personal-trainer/android-beta/app/src/main/res/values/strings.xml
          grep -q 'WebView.setWebContentsDebuggingEnabled(false)' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          node - <<'NODE'
          const core=require('./personal-trainer/android-beta/app/src/main/assets/pt-v25-core.js');
          if(core.paceCue(400,300)!=='speed-up') throw new Error('speed-up cue failed');
          if(core.paceCue(240,300)!=='slow-down') throw new Error('slow-down cue failed');
          console.log('running pace engine PASS');
          NODE

      - name: Validate proven 26-movement anatomy pack
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets/media/adaptive
          files=(leg-press step-up barbell-hip-thrust side-plank front-plank seated-cable-row seated-calf-raise goblet-squat supported-single-arm-dumbbell-row push-up lat-pulldown rope-triceps-pressdown incline-dumbbell-press dumbbell-lateral-raise romanian-deadlift dumbbell-biceps-curl backward-sled-drag machine-chest-press pallof-press seated-shoulder-press face-pull running single-leg-leg-press seated-hamstring-curl supported-bulgarian-split-squat standing-calf-raise)
          for f in "${files[@]}"; do
            test -s "$A/$f.mp4"
            test -s "$A/$f.webp"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 "$A/$f.mp4" | grep -q 'codec_name=h264'
          done
          echo "26 anatomy MP4 + WebP movement pairs validated"

      - name: Build KINETIQ unsigned release APK
        run: gradle --no-daemon -p personal-trainer/android-beta :app:assembleRelease

      - name: Validate KINETIQ APK identity and contents
        shell: bash
        run: |
          set -euo pipefail
          APK=personal-trainer/android-beta/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.ilia.personaltrainer' versionCode='43' versionName='3.0.3'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'KINETIQ'"
          unzip -l "$APK" | grep -q 'assets/index29.html'
          unzip -l "$APK" | grep -q 'assets/style2-v7.js'
          unzip -l "$APK" | grep -q 'assets/style2-v7-final-fix.css'
          unzip -l "$APK" | grep -q 'assets/style2-v73-library-tools.js'
          unzip -l "$APK" | grep -q 'assets/style2-v73-library-tools.css'
          unzip -l "$APK" | grep -q 'assets/media/adaptive/leg-press.mp4'
          unzip -l "$APK" | grep -q 'assets/media/adaptive/supported-bulgarian-split-squat.mp4'
          unzip -l "$APK" | grep -q 'assets/media/adaptive/seated-hamstring-curl.mp4'
          unzip -l "$APK" | grep -q 'assets/media/adaptive/seated-cable-row.mp4'

      - name: Package KINETIQ unsigned deliverables and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/signing-tools/lib
          APK=personal-trainer/android-beta/app/build/outputs/apk/release/app-release-unsigned.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f -p 4 "$APK" release/KINETIQ-3.0.3-UNSIGNED.apk
          "$BT/zipalign" -c -v 4 release/KINETIQ-3.0.3-UNSIGNED.apk
          cp "$BT/apksigner" release/signing-tools/
          cp "$BT/zipalign" release/signing-tools/
          cp "$BT/lib/apksigner.jar" release/signing-tools/lib/
          chmod +x release/signing-tools/apksigner release/signing-tools/zipalign
          cat > release/DIAGNOSTICS-KINETIQ-3.0.3.txt <<'REPORT'
          KINETIQ 3.0.3 — PRODUCTION SOURCE
          Repository: smilemangaphotography-svg/apps
          Canonical branch: personal-trainer-main
          Package: com.ilia.personaltrainer
          App label: KINETIQ
          Version: 3.0.3 / versionCode 43
          V7 real calendar + My Plan / Recommended / AI Recommended: PASS
          AI Coach approval workflow: PASS
          Better Option replacement + Add Exercise: PASS
          Exercise upload + equipment manager: PASS
          Run Coach GPS/TTS runtime: PASS
          Existing 26 anatomical motion pairs imported and validated: PASS
          KINETIQ premium DOM launch screen: PASS
          Exercise swipe left remove / swipe right replacement: PASS
          Duplicate exercise prevention: PASS
          V7.2 opaque bottom navigation/full-screen fixes preserved: PASS
          WebView debugging disabled: PASS
          Signing status: UNSIGNED release artifact; sign with permanent owner key before installation/distribution.
          REPORT
          sha256sum release/KINETIQ-3.0.3-UNSIGNED.apk > release/SHA256SUMS.txt

      - name: Upload KINETIQ unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: KINETIQ-3.0.3-UNSIGNED
          path: release/*
          if-no-files-found: error
          retention-days: 30
