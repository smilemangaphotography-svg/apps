name: Build KINETIQ 3.0.10 In-Place Update

on:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - '.github/workflows/build-kinetiq-update-signed.yml'
      - 'personal-trainer/android-beta/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: personal-trainer-main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install Android SDK packages and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Prepare approved KINETIQ cover and adaptive launcher
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          R=personal-trainer/android-beta/app/src/main/res
          COVER_URL='https://d2ol7oe51mr4n9.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/d5bda7fd-ec4a-4e2a-8ee3-d967c49c4159.png'
          SYMBOL_URL='https://d2ol7oe51mr4n9.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/5bffb31b-1258-4bbd-af9f-2ec79043f1dc.png'
          curl -fL "$COVER_URL" -o /tmp/kinetiq-approved-cover.png
          curl -fL "$SYMBOL_URL" -o /tmp/kinetiq-symbol.png
          echo '861115ad7c8f0bc6a26f087bc69fbbbb42e7941d6661582b65bc535790a0e087  /tmp/kinetiq-approved-cover.png' | sha256sum -c -
          echo '50a157cd3fead14297f6239034cdd9f36df1379124deb144d88e8212073b6bc5  /tmp/kinetiq-symbol.png' | sha256sum -c -
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          assets=Path('personal-trainer/android-beta/app/src/main/assets')
          res=Path('personal-trainer/android-beta/app/src/main/res')
          (res/'drawable-nodpi').mkdir(parents=True,exist_ok=True)
          (res/'mipmap-xxxhdpi').mkdir(parents=True,exist_ok=True)

          # Canonical approved mountain cover, lossless WebP, full source resolution.
          cover=Image.open('/tmp/kinetiq-approved-cover.png').convert('RGB')
          assert cover.size == (941,1672), cover.size
          cover.save(assets/'kinetiq-cover-locked.webp','WEBP',lossless=True,method=6)

          # Canonical metallic athlete/ribbon symbol with transparent surroundings.
          sym=Image.open('/tmp/kinetiq-symbol.png').convert('RGBA')
          alpha=sym.getchannel('A')
          bbox=alpha.getbbox()
          assert bbox is not None
          sym=sym.crop(bbox)

          # Adaptive foreground: safe-zone scale, no text, no poster/background.
          fw=fh=432
          max_dim=292
          scale=min(max_dim/sym.width,max_dim/sym.height)
          sized=sym.resize((round(sym.width*scale),round(sym.height*scale)),Image.Resampling.LANCZOS)
          fg=Image.new('RGBA',(fw,fh),(0,0,0,0))
          fg.alpha_composite(sized,((fw-sized.width)//2,(fh-sized.height)//2))
          fg.save(res/'drawable-nodpi/kinetiq_launcher_foreground_final.webp','WEBP',lossless=True,method=6)

          # Fallback mipmap for launchers that request a raster variant.
          canvas=Image.new('RGB',(512,512),(3,11,8))
          max_dim=330
          scale=min(max_dim/sym.width,max_dim/sym.height)
          sized=sym.resize((round(sym.width*scale),round(sym.height*scale)),Image.Resampling.LANCZOS)
          layer=Image.new('RGBA',(512,512),(0,0,0,0))
          layer.alpha_composite(sized,((512-sized.width)//2,(512-sized.height)//2))
          canvas.paste(layer,(0,0),layer)
          canvas.save(res/'mipmap-xxxhdpi/kinetiq_launcher_final.webp','WEBP',quality=92,method=6)

          # Hard verification of output geometry and transparency.
          assert Image.open(assets/'kinetiq-cover-locked.webp').size == (941,1672)
          fg2=Image.open(res/'drawable-nodpi/kinetiq_launcher_foreground_final.webp').convert('RGBA')
          assert fg2.size == (432,432)
          assert fg2.getchannel('A').getextrema()[0] == 0
          assert Image.open(res/'mipmap-xxxhdpi/kinetiq_launcher_final.webp').size == (512,512)
          PY

      - name: Import proven anatomy motion library
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          mkdir -p "$A/media/adaptive" /tmp/ilia110
          git fetch --depth=1 origin rebuild/ilias-coach-v2
          git show FETCH_HEAD:ILIA-SAFE-SOURCE.bin > /tmp/ilia110/source.zip
          unzip -q /tmp/ilia110/source.zip -d /tmp/ilia110/source
          SRC=/tmp/ilia110/source/Ilias-Coach/app/src/main/assets/media/anatomy
          test -d "$SRC"
          cp -a "$SRC"/. "$A/media/adaptive/"
          test -s "$A/media/adaptive/leg-press.mp4"
          test -s "$A/media/adaptive/supported-bulgarian-split-squat.mp4"

      - name: Install approved KINETIQ visual assets
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          R=personal-trainer/android-beta/app/src/main/res/drawable-nodpi
          mkdir -p "$A" "$R"
          curl -fL 'https://d2ol7oe51mr4n9.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/a8a7750e-58e2-4dc8-9267-18f2e5bf7c8b.png' -o "$A/kinetiq-cover-approved-v307.png"
          echo '861115ad7c8f0bc6a26f087bc69fbbbb42e7941d6661582b65bc535790a0e087  '"$A"'/kinetiq-cover-approved-v307.png' | sha256sum -c -
          curl -fL 'https://d2ol7oe51mr4n9.cloudfront.net/user_35vkPzhsm2L0FO5iYEXz13FP2Gn/9d5261e2-b84f-43a2-8ac8-c5888efdd969.png' -o "$R/kinetiq_launcher_foreground_v307.png"
          echo 'f6dba6ccdcfb362cdb5eea835bf0cf8b067faeec1c0a14f30bd59e18a6a82cd2  '"$R"'/kinetiq_launcher_foreground_v307.png' | sha256sum -c -
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          r=Path('personal-trainer/android-beta/app/src/main/res/drawable-nodpi')
          src=Image.open(r/'kinetiq_launcher_foreground_v307.png').convert('RGBA')
          bbox=src.getchannel('A').getbbox()
          assert bbox is not None
          glyph=src.crop(bbox)
          scale=0.76
          size=(max(1,round(glyph.width*scale)),max(1,round(glyph.height*scale)))
          glyph=glyph.resize(size,Image.Resampling.LANCZOS)
          out=Image.new('RGBA',src.size,(0,0,0,0))
          out.alpha_composite(glyph,((src.width-glyph.width)//2,(src.height-glyph.height)//2))
          out.save(r/'kinetiq_launcher_foreground_v308.png','PNG',optimize=True)
          b=out.getchannel('A').getbbox()
          assert b is not None
          assert (b[2]-b[0]) <= src.width*0.80
          assert (b[3]-b[1]) <= src.height*0.80
          PY

      - name: Validate KINETIQ update source
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          node --check "$A/app-v2.js"
          node --check "$A/style2-v29.js"
          node --check "$A/style2-v7.js"
          node --check "$A/style2-v7-final-fix.js"
          node --check "$A/style2-v73-library-tools.js"
          node --check "$A/style2-v305-master-fix.js"
          node --check "$A/kinetiq-v308-hotfix.js"
          grep -q "applicationId 'com.ilia.personaltrainer'" personal-trainer/android-beta/app/build.gradle
          grep -q "versionCode 50" personal-trainer/android-beta/app/build.gradle
          grep -q "versionName '3.0.10'" personal-trainer/android-beta/app/build.gradle
          grep -q 'android:icon="@mipmap/kinetiq_launcher_v308"' personal-trainer/android-beta/app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/kinetiq_launcher_v308_round"' personal-trainer/android-beta/app/src/main/AndroidManifest.xml
          test -s personal-trainer/android-beta/app/src/main/res/drawable-nodpi/kinetiq_launcher_foreground_final.webp
          test -s personal-trainer/android-beta/app/src/main/res/mipmap-xxxhdpi/kinetiq_launcher_final.webp
          test -s personal-trainer/android-beta/app/src/main/res/mipmap-anydpi-v26/kinetiq_launcher_v308.xml
          test -s personal-trainer/android-beta/app/src/main/res/mipmap-anydpi-v26/kinetiq_launcher_v308_round.xml
          grep -q '@drawable/kinetiq_launcher_foreground_v308' personal-trainer/android-beta/app/src/main/res/mipmap-anydpi-v26/kinetiq_launcher_v308.xml
          grep -q '@color/ic_launcher_background' personal-trainer/android-beta/app/src/main/res/mipmap-anydpi-v26/kinetiq_launcher_v308.xml
          test -s "$A/kinetiq-cover-locked.webp"
          python3 - <<'PY'
          from PIL import Image
          cover=Image.open('personal-trainer/android-beta/app/src/main/assets/kinetiq-cover-locked.webp')
          fg=Image.open('personal-trainer/android-beta/app/src/main/res/drawable-nodpi/kinetiq_launcher_foreground_final.webp').convert('RGBA')
          icon=Image.open('personal-trainer/android-beta/app/src/main/res/mipmap-xxxhdpi/kinetiq_launcher_final.webp')
          assert cover.size == (941,1672)
          assert fg.size == (432,432) and fg.getchannel('A').getextrema()[0] == 0
          assert icon.size == (512,512)
          PY
          grep -q 'style2-v305-master-fix.js' "$A/index29.html"
          grep -q 'kinetiq-v308-hotfix.js' "$A/index29.html"
          grep -q 'kinetiq-v308-hotfix.css' "$A/index29.html"
          test -s personal-trainer/android-beta/app/src/main/res/drawable-nodpi/kinetiq_launcher_foreground_v308.png
          grep -q 'COMPLETED WORKOUT' "$A/style2-v305-master-fix.js"
          grep -q 'private void enterCoverFromNative' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q 'MotionEvent.ACTION_UP' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q 'setCoverVisible(boolean visible)' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q 'private void positionCoverTap' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q 'BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q 'kinetiq-v310-cover-fix.css' "$A/index29.html"

      - name: Build unsigned release APK
        run: gradle --no-daemon -p personal-trainer/android-beta :app:assembleRelease

      - name: Sign with preserved owner update key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          UNSIGNED=personal-trainer/android-beta/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=release/KINETIQ-3.0.10-UPDATE-aligned.apk
          SIGNED=release/KINETIQ-3.0.10-UPDATE.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"

          test -s "$UNSIGNED"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"

          python3 - <<'PY'
          import os, re, subprocess, zipfile
          archive='ILIA-SAFE-SOURCE.bin'
          gradle_path='Ilias-Coach/app/build.gradle'
          key_path='Ilias-Coach/owner-debug.jks'
          with zipfile.ZipFile(archive) as z:
              gradle=z.read(gradle_path).decode('utf-8')
              key=z.read(key_path)

          def grab(name):
              m=re.search(r"\b"+re.escape(name)+r"\s+['\"]([^'\"]+)['\"]", gradle)
              if not m:
                  raise SystemExit('Missing signing value: '+name)
              return m.group(1)

          store_password=grab('storePassword')
          key_alias=grab('keyAlias')
          key_password=grab('keyPassword')
          ks='/tmp/kinetiq-owner-update.jks'
          with open(ks,'wb') as f:
              f.write(key)

          bt=os.path.join(os.environ['ANDROID_HOME'],'build-tools','35.0.0')
          cmd=[
              os.path.join(bt,'apksigner'),'sign',
              '--ks',ks,
              '--ks-key-alias',key_alias,
              '--ks-pass','pass:'+store_password,
              '--key-pass','pass:'+key_password,
              '--out','release/KINETIQ-3.0.10-UPDATE.apk',
              'release/KINETIQ-3.0.10-UPDATE-aligned.apk'
          ]
          subprocess.run(cmd,check=True,stdout=subprocess.DEVNULL)
          PY

          rm -f "$ALIGNED" /tmp/kinetiq-owner-update.jks

      - name: Verify in-place update APK
        shell: bash
        run: |
          set -euo pipefail
          APK=release/KINETIQ-3.0.10-UPDATE.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          AAPT="$BT/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.ilia.personaltrainer' versionCode='50' versionName='3.0.10'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'KINETIQ'"
          "$BT/apksigner" verify --verbose "$APK"
          CERT="$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')"
          test "$CERT" = "4d7cd06f969d9c4b1e3e361440544a27dc187a125851655aa45796453d50c3a8"
          sha256sum "$APK" | tee release/SHA256SUMS.txt
          printf '%s\n'             'KINETIQ 3.0.10 IN-PLACE UPDATE'             'Package: com.ilia.personaltrainer'             'Version code: 50'             'Signing certificate: preserved owner update certificate'             'Install over the existing app. Do not uninstall first.'             > release/UPDATE-INSTRUCTIONS.txt

      - name: Upload signed update
        uses: actions/upload-artifact@v4
        with:
          name: KINETIQ-3.0.10-IN-PLACE-UPDATE
          path: |
            release/KINETIQ-3.0.10-UPDATE.apk
            release/SHA256SUMS.txt
            release/UPDATE-INSTRUCTIONS.txt
          if-no-files-found: error
          retention-days: 30
