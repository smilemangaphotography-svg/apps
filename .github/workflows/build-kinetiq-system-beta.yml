name: Build KINETIQ 3.0.3 System Beta

on:
  workflow_dispatch:
  push:
    branches: [ kinetiq-v303-system-beta ]
    paths:
      - 'personal-trainer/android-beta/**'
      - '.github/workflows/build-kinetiq-system-beta.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate-browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_BETA_CERT_SHA256: 7f557546ddba96bdf8ec36b447d4acd7c62861cc074bc10a1b46ea9c96634487
    steps:
      - name: Checkout System beta branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install Android SDK packages and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Reconstruct persistent KINETIQ beta signing keystore
        shell: bash
        env:
          KINETIQ_BETA_KEYSTORE_B64: ${{ secrets.KINETIQ_BETA_KEYSTORE_B64 }}
          KINETIQ_BETA_STORE_PASSWORD: ${{ secrets.KINETIQ_BETA_STORE_PASSWORD }}
          KINETIQ_BETA_KEY_ALIAS: ${{ secrets.KINETIQ_BETA_KEY_ALIAS }}
          KINETIQ_BETA_KEY_PASSWORD: ${{ secrets.KINETIQ_BETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KINETIQ_BETA_KEYSTORE_B64:?Missing KINETIQ_BETA_KEYSTORE_B64}"
          : "${KINETIQ_BETA_STORE_PASSWORD:?Missing KINETIQ_BETA_STORE_PASSWORD}"
          : "${KINETIQ_BETA_KEY_ALIAS:?Missing KINETIQ_BETA_KEY_ALIAS}"
          : "${KINETIQ_BETA_KEY_PASSWORD:?Missing KINETIQ_BETA_KEY_PASSWORD}"
          KEYSTORE_B64="${KINETIQ_BETA_KEYSTORE_B64#KINETIQ_BETA_KEYSTORE_B64=}"
          STORE_PASSWORD="${KINETIQ_BETA_STORE_PASSWORD#KINETIQ_BETA_STORE_PASSWORD=}"
          KEY_ALIAS="${KINETIQ_BETA_KEY_ALIAS#KINETIQ_BETA_KEY_ALIAS=}"
          KEY_PASSWORD="${KINETIQ_BETA_KEY_PASSWORD#KINETIQ_BETA_KEY_PASSWORD=}"
          KEYSTORE_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          printf '::add-mask::%s\n' "$STORE_PASSWORD"
          printf '::add-mask::%s\n' "$KEY_ALIAS"
          printf '::add-mask::%s\n' "$KEY_PASSWORD"
          SIGNING_DIR="$RUNNER_TEMP/kinetiq-system-beta-signing"
          KEYSTORE="$SIGNING_DIR/kinetiq-system-beta.jks"
          install -d -m 700 "$SIGNING_DIR"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED_BETA_CERT_SHA256"
          {
            echo "KINETIQ_BETA_KEYSTORE_PATH=$KEYSTORE"
            echo "KINETIQ_BETA_STORE_PASSWORD=$STORE_PASSWORD"
            echo "KINETIQ_BETA_KEY_ALIAS=$KEY_ALIAS"
            echo "KINETIQ_BETA_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Import proven anatomy motion library
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          mkdir -p "$A/media/adaptive" /tmp/kinetiq-anatomy
          git fetch --depth=1 origin rebuild/ilias-coach-v2
          git show FETCH_HEAD:ILIA-SAFE-SOURCE.bin > /tmp/kinetiq-anatomy/source.zip
          unzip -q /tmp/kinetiq-anatomy/source.zip -d /tmp/kinetiq-anatomy/source
          SRC=/tmp/kinetiq-anatomy/source/Ilias-Coach/app/src/main/assets/media/anatomy
          test -d "$SRC"
          cp -a "$SRC"/. "$A/media/adaptive/"
          test -s "$A/media/adaptive/leg-press.mp4"
          test -s "$A/media/adaptive/push-up.mp4"

      - name: Validate System beta source and isolation
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          for f in style2-v29-runtime-preflight.js app-v2.js pt-v25-core.js style2-v29.js style2-v29-admin.js style2-v29-focus.js style2-v29-priority-engine.js style2-v7.js style2-v73-library-tools.js kinetiq-beta-v303.js kinetiq-system-ui.js system-build.js; do node --check "$A/$f"; done
          node --check personal-trainer/android-beta/system-browser-test.cjs
          test -s "$A/system.html"
          test -s "$A/kinetiq-system-ui.css"
          grep -q 'kinetiq-system-ui.css' "$A/system.html"
          grep -q 'kinetiq-system-ui.js' "$A/system.html"
          grep -q 'system-build.js' "$A/system.html"
          ! grep -q 'kinetiq-ux-beta.js' "$A/system.html"
          ! grep -q 'style2-v29-master-mockup.js' "$A/system.html"
          ! grep -q 'style2-v29-master-fix.js' "$A/system.html"
          ! grep -q 'style2-v7-final-fix.js' "$A/system.html"
          grep -q "KINETIQ-SYSTEM-UI-2" "$A/kinetiq-system-ui.js"
          grep -q "KINETIQ-3.0.3-system-beta-2" "$A/kinetiq-system-ui.js"
          grep -q 'data-nav="run"' "$A/system.html"
          grep -q 'id="pageRun"' "$A/system.html"
          grep -q 'file:///android_asset/system.html' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q "applicationId 'com.ilia.personaltrainer.systembeta'" personal-trainer/android-beta/app/build.gradle
          grep -q 'versionCode 48' personal-trainer/android-beta/app/build.gradle
          grep -q "versionName '3.0.3-system-beta.4'" personal-trainer/android-beta/app/build.gradle
          grep -q '<string name="app_name">KINETIQ</string>' personal-trainer/android-beta/app/src/main/res/values/strings.xml
          if grep -q "applicationId 'com.ilia.personaltrainer.beta'" personal-trainer/android-beta/app/build.gradle; then echo 'ERROR: collides with frozen verified beta'; exit 1; fi
          if grep -q "applicationId 'com.ilia.personaltrainer'" personal-trainer/android-beta/app/build.gradle; then echo 'ERROR: collides with production'; exit 1; fi
          grep -q 'renderMotionKeyframes' "$A/style2-v29.js"
          grep -q 'renderSystemHome' "$A/kinetiq-system-ui.js"
          grep -q 'renderSystemPlan' "$A/kinetiq-system-ui.js"
          grep -q 'renderSystemTrain' "$A/kinetiq-system-ui.js"
          grep -q 'renderSystemRun' "$A/kinetiq-system-ui.js"
          grep -q 'renderSystemMore' "$A/kinetiq-system-ui.js"
          grep -q 'coach-response' "$A/kinetiq-system-ui.js"
          grep -q 'trainedBody' "$A/kinetiq-system-ui.js"
          grep -q 'requestedBody' "$A/kinetiq-system-ui.js"
          grep -q 'plan-week-card' "$A/kinetiq-system-ui.js"
          grep -q 'system-motion-shell' "$A/style2-v29.js"
          grep -q 'window.KINETIQDeviceBridge' "$A/kinetiq-system-ui.js"
          grep -q 'getDeviceCapabilities' personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java
          grep -q 'runProtocol' "$A/style2-v7.js"
          grep -q 'KINETIQ_DRIVE_FINAL_IMPLEMENTATION_PASS' personal-trainer/android-beta/system-browser-test.cjs
          grep -q 'APPLY TO PLAN' "$A/kinetiq-system-ui.js"
          grep -q 'KEEP CURRENT' "$A/kinetiq-system-ui.js"
          grep -q 'paceSamples' "$A/style2-v7.js"
      - name: Browser acceptance gate before APK build
        shell: bash
        run: |
          set -euo pipefail
          A="$GITHUB_WORKSPACE/personal-trainer/android-beta/app/src/main/assets"
          T="$RUNNER_TEMP/kinetiq-system-browser"
          R="$RUNNER_TEMP/kinetiq-system-screens"
          mkdir -p "$T" "$R"
          cd "$T"
          npm init -y >/dev/null
          npm install --no-save playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/personal-trainer/android-beta/system-browser-test.cjs" "$T/system-browser-test.cjs"
          printf "window.__KINETIQ_BUILD_ID__='%s';\n" "${GITHUB_SHA:0:7}" > "$A/system-build.js"
          python3 -m http.server 8765 --directory "$A" > "$RUNNER_TEMP/kinetiq-system-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/system.html >/dev/null && break; sleep 1; done
          KINETIQ_TEST_OUT="$R" timeout 60s node "$T/system-browser-test.cjs"

      - name: Build installable isolated UX beta APK
        run: gradle --no-daemon -p personal-trainer/android-beta :app:assembleDebug

      - name: Validate UX beta APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.ilia.personaltrainer.systembeta' versionCode='48' versionName='3.0.3-system-beta.4'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'KINETIQ'"
          unzip -l "$APK" | grep -q 'assets/system.html'
          unzip -l "$APK" | grep -q 'assets/kinetiq-system-ui.css'
          unzip -l "$APK" | grep -q 'assets/kinetiq-system-ui.js'
          unzip -p "$APK" assets/system-build.js | grep -q "${GITHUB_SHA:0:7}"
          unzip -l "$APK" | grep -q 'assets/media/adaptive/leg-press.mp4'
          VERIFY_OUT="$RUNNER_TEMP/apksigner-ux.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$VERIFY_OUT"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$VERIFY_OUT"
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$VERIFY_OUT" | head -n1 | tr '[:upper:]' '[:lower:]')"
          test "$CERT_SHA256" = "$EXPECTED_BETA_CERT_SHA256"
          printf '%s\n' "$CERT_SHA256" > "$RUNNER_TEMP/kinetiq-ux-beta-cert-sha256.txt"

      - name: Package UX beta deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release web-preview
          cp personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk release/KINETIQ-SYSTEM-BETA-3.0.3.apk
          cp "$RUNNER_TEMP/kinetiq-ux-beta-cert-sha256.txt" release/SIGNING-CERT-SHA256.txt
          cp -a personal-trainer/android-beta/app/src/main/assets/. web-preview/
          cp web-preview/system.html web-preview/index.html
          cat > release/BETA-README.txt <<'REPORT'
          KINETIQ 3.0.3 — SYSTEM BETA
          Package: com.ilia.personaltrainer.systembeta
          Label: KINETIQ
          Version: 3.0.3-system-beta.4 / versionCode 48
          Built from the separate kinetiq-v303-system-beta branch.
          Frozen verified baseline bff960ac6ee406345f344554e5e8874d285bbf42 remains unchanged.
          Production package com.ilia.personaltrainer remains unchanged.
          Verified beta package com.ilia.personaltrainer.beta remains unchanged.
          Authoritative system.html acceptance at Galaxy A54 viewport runs before the APK build step.
          REPORT
          sha256sum release/KINETIQ-SYSTEM-BETA-3.0.3.apk > release/SHA256SUMS.txt

      - name: Remove temporary UX beta signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/kinetiq-system-beta-signing"

      - name: Upload UX beta APK
        uses: actions/upload-artifact@v4
        with:
          name: KINETIQ-SYSTEM-BETA-3.0.3
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload UX beta web preview
        uses: actions/upload-artifact@v4
        with:
          name: KINETIQ-SYSTEM-BETA-WEB-PREVIEW
          path: web-preview/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload UX browser validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KINETIQ-SYSTEM-BETA-UI-CHECKS
          path: ${{ runner.temp }}/kinetiq-system-screens/*
          if-no-files-found: warn
          retention-days: 30
# KINETIQ System Beta manual build trigger
