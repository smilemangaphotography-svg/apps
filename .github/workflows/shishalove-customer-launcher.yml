name: ShishaLove Customer 1.1.21 Exact Launcher Fix

on:
  push:
    branches:
      - shishalove-main
    paths:
      - '.github/workflows/shishalove-customer-launcher.yml'
      - 'shishalove-branding/customer-icon.b64.part00'
      - 'shishalove-branding/customer-icon.b64.part01'
      - 'shishalove-branding/customer-icon.b64.part02'
      - 'shishalove-branding/customer-icon.b64.part03'
      - 'shishalove-mobile/customer/build.gradle'
      - 'shishalove-mobile/customer/src/main/res/drawable/ic_shishalove_customer_foreground.xml'
      - 'shishalove-mobile/customer/src/main/res/mipmap-anydpi/ic_launcher.xml'
      - 'shishalove-mobile/customer/src/main/res/mipmap-anydpi/ic_launcher_round.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-customer:
    name: Build and verify Customer 1.1.21 launcher-only update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact Customer launcher source and launcher-only lock
        run: |
          set -euo pipefail
          cat \
            shishalove-branding/customer-icon.b64.part00 \
            shishalove-branding/customer-icon.b64.part01 \
            shishalove-branding/customer-icon.b64.part02 \
            shishalove-branding/customer-icon.b64.part03 \
            | tr -d '[:space:]' | base64 -d > /tmp/customer-launcher-source.png
          echo '74d5803c3da43f55fb5c3947b37d15b868eee2c5f6a014a83d5a7b774f780f50  /tmp/customer-launcher-source.png' | sha256sum -c -
          grep -q "applicationId 'eu.shishalove.customer'" shishalove-mobile/customer/build.gradle
          grep -q "versionCode 123" shishalove-mobile/customer/build.gradle
          grep -q "versionName '1.1.21'" shishalove-mobile/customer/build.gradle
          grep -q "digest != '74d5803c3da43f55fb5c3947b37d15b868eee2c5f6a014a83d5a7b774f780f50'" shishalove-mobile/customer/build.gradle
          grep -q 'customer-icon.b64.part%02d' shishalove-mobile/customer/build.gradle
          grep -q 'r < 70 && g < 70 && b < 70' shishalove-mobile/customer/build.gradle
          grep -q 'targetW = 408' shishalove-mobile/customer/build.gradle
          grep -q 'redPixels < 500' shishalove-mobile/customer/build.gradle
          grep -q 'Customer launcher safe-area geometry violated' shishalove-mobile/customer/build.gradle
          grep -q 'android:width="108dp"' shishalove-mobile/customer/src/main/res/drawable/ic_shishalove_customer_foreground.xml
          grep -q 'android:height="108dp"' shishalove-mobile/customer/src/main/res/drawable/ic_shishalove_customer_foreground.xml
          grep -q '@drawable/ic_shishalove_customer_art' shishalove-mobile/customer/src/main/res/drawable/ic_shishalove_customer_foreground.xml
          grep -q '@drawable/ic_shishalove_customer_art' shishalove-mobile/customer/src/main/res/mipmap-anydpi/ic_launcher.xml
          grep -q '@drawable/ic_shishalove_customer_art' shishalove-mobile/customer/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          grep -q '@color/sl_icon_black' shishalove-mobile/customer/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/ic_shishalove_customer_foreground' shishalove-mobile/customer/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          BASE='b7fbe0b86426f82a275cf0cee574a8149e8f87f0'
          changed="$(git diff --name-only "$BASE" HEAD | sort)"
          printf '%s\n' "$changed"
          allowed='^.github/workflows/shishalove-customer-launcher.yml$|^shishalove-branding/customer-icon.b64.part0[0-3]$|^shishalove-mobile/customer/build.gradle$|^shishalove-mobile/customer/src/main/res/drawable/ic_shishalove_customer_foreground.xml$|^shishalove-mobile/customer/src/main/res/mipmap-anydpi/ic_launcher.xml$|^shishalove-mobile/customer/src/main/res/mipmap-anydpi/ic_launcher_round.xml$'
          forbidden="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$forbidden"
          git diff --exit-code shishalove-merchant-1.1.26 -- shishalove-mobile/merchant shishalove-branding/merchant-icon.b64.part00 shishalove-branding/merchant-icon.b64.part01 shishalove-branding/merchant-icon.b64.part02 shishalove-branding/merchant-icon.b64.part03
          git diff --exit-code shishalove-bridge-1.1.23 -- shishalove-app-bridge

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build canonical and legacy-beta Customer APKs
        working-directory: shishalove-mobile
        run: gradle :customer:assembleRelease :customer:assembleDebug --stacktrace

      - name: Verify APK identity and exact launcher output
        run: |
          set -euo pipefail
          RELEASE='shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk'
          DEBUG='shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --print-certs "$RELEASE"
          "$APKSIGNER" verify --print-certs "$DEBUG"
          "$AAPT" dump badging "$RELEASE" | grep -q "package: name='eu.shishalove.customer' versionCode='123' versionName='1.1.21'"
          "$AAPT" dump badging "$DEBUG" | grep -q "package: name='eu.shishalove.customer.dev' versionCode='123' versionName='1.1.21-dev'"
          test -f shishalove-mobile/customer/src/main/res/drawable-nodpi/ic_shishalove_customer_art.png
          test ! -f shishalove-mobile/customer/src/main/res/drawable-nodpi/ic_shishalove_customer_legacy.png
          grep -q 'build=129' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java

      - name: Prove canonical signing continuity from Customer 1.1.20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/previous
          gh release download shishalove-mobile-1.1.20 --pattern 'ShishaLove-Customer-Android-1.1.20.apk' --dir dist/previous
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/previous/ShishaLove-Customer-Android-1.1.20.apk)" = "$(digest shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk)"

      - name: Prove stable legacy-beta signing continuity from Customer 1.1.20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/legacy
          gh release download shishalove-mobile-1.1.20-stable-beta-update --pattern 'ShishaLove-Customer-Android-1.1.20-UPDATE.apk' --dir dist/legacy
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/legacy/ShishaLove-Customer-Android-1.1.20-UPDATE.apk)" = "$(digest shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk)"

      - name: Prepare Customer installers
        run: |
          set -euo pipefail
          mkdir -p dist/public
          cp shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk dist/public/ShishaLove-Customer-Android-1.1.21.apk
          cp shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk dist/public/ShishaLove-Customer-Android-1.1.21-LEGACY-BETA.apk
          sha256sum dist/public/*.apk > dist/public/SHA256SUMS.txt
          cat > dist/public/RELEASE_NOTES.md <<'TXT'
          # ShishaLove Customer 1.1.21 — Exact Launcher Logo Fix

          Customer launcher-only update. Merchant app, Customer UI/WebView, Bridge and business logic are unchanged.

          - Uses the exact user-approved ShishaLove artwork: white ShishaLove/hookah + red heart, with no MERCHANT band.
          - Crops only the dark canvas and faint baked outline so the ShishaLove script appears larger and clearer.
          - Fits the complete logo into the same protected adaptive safe-area geometry as the approved Merchant 1.1.26 launcher.
          - Android/Samsung owns the final rounded-square launcher mask.
          - No white frame or baked rounded-square icon shape is used.
          - Customer package IDs and signing identities are unchanged for normal in-place updates.
          TXT

      - name: Publish Customer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-customer-1.1.21'
          ASSETS=(dist/public/ShishaLove-Customer-Android-1.1.21.apk dist/public/ShishaLove-Customer-Android-1.1.21-LEGACY-BETA.apk dist/public/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Customer 1.1.21 — Exact Launcher Logo Fix' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Customer 1.1.21 — Exact Launcher Logo Fix' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          fi

      - name: Confirm public Customer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-customer-1.1.21 --json url,assets
