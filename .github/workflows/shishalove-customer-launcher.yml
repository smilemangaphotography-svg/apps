name: ShishaLove Customer 1.1.22 Final Logo Frame Fix

on:
  push:
    branches:
      - shishalove-main
    paths:
      - '.github/workflows/shishalove-customer-launcher.yml'
      - 'shishalove-branding/customer-icon.b64.part00'
      - 'shishalove-branding/customer-icon.b64.part01'
      - 'shishalove-branding/customer-icon.b64.part02'
      - 'shishalove-branding/customer-icon.b64.part03'
      - 'shishalove-mobile/customer/build.gradle'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-customer:
    name: Build and verify Customer 1.1.22 logo-only APK update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact final Customer scope
        run: |
          set -euo pipefail
          cat \
            shishalove-branding/customer-icon.b64.part00 \
            shishalove-branding/customer-icon.b64.part01 \
            shishalove-branding/customer-icon.b64.part02 \
            shishalove-branding/customer-icon.b64.part03 \
            | tr -d '[:space:]' | base64 -d > /tmp/customer-launcher-source.png
          echo '74d5803c3da43f55fb5c3947b37d15b868eee2c5f6a014a83d5a7b774f780f50  /tmp/customer-launcher-source.png' | sha256sum -c -

          BUILD='shishalove-mobile/customer/build.gradle'
          grep -q "applicationId 'eu.shishalove.customer'" "$BUILD"
          grep -q "versionCode 124" "$BUILD"
          grep -q "versionName '1.1.22'" "$BUILD"
          grep -q "digest != '74d5803c3da43f55fb5c3947b37d15b868eee2c5f6a014a83d5a7b774f780f50'" "$BUILD"
          grep -q 'targetW = 368' "$BUILD"
          grep -q 'maxTargetH = 320' "$BUILD"
          grep -q "ic_shishalove_customer_art);'" "$BUILD"
          grep -q 'offsetX < 64' "$BUILD"
          grep -q 'offsetY < 80' "$BUILD"

          # No Merchant APK/artwork change is permitted by this Customer release.
          git diff --exit-code shishalove-merchant-1.1.26 -- shishalove-mobile/merchant \
            shishalove-branding/merchant-icon.b64.part00 \
            shishalove-branding/merchant-icon.b64.part01 \
            shishalove-branding/merchant-icon.b64.part02 \
            shishalove-branding/merchant-icon.b64.part03

          # Within Customer native code, only build.gradle may differ from 1.1.21.
          changed_customer="$(git diff --name-only shishalove-customer-1.1.21..HEAD -- shishalove-mobile/customer | sort)"
          printf '%s\n' "$changed_customer"
          test "$changed_customer" = 'shishalove-mobile/customer/build.gradle'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build canonical and legacy-beta Customer APKs
        working-directory: shishalove-mobile
        run: gradle :customer:assembleRelease :customer:assembleDebug --stacktrace

      - name: Verify package, splash and launcher output
        run: |
          set -euo pipefail
          RELEASE='shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk'
          DEBUG='shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --print-certs "$RELEASE"
          "$APKSIGNER" verify --print-certs "$DEBUG"
          "$AAPT" dump badging "$RELEASE" | grep -q "package: name='eu.shishalove.customer' versionCode='124' versionName='1.1.22'"
          "$AAPT" dump badging "$DEBUG" | grep -q "package: name='eu.shishalove.customer.dev' versionCode='124' versionName='1.1.22-dev'"
          test -f shishalove-mobile/customer/src/main/res/drawable-nodpi/ic_shishalove_customer_art.png
          grep -q 'logo.setImageResource(eu.shishalove.customer.R.drawable.ic_shishalove_customer_art);' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          ! grep -q 'logo.setImageResource(eu.shishalove.customer.R.drawable.ic_shishalove_customer);' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'build=129' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java

      - name: Prove signing continuity from Customer 1.1.21
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/previous
          gh release download shishalove-customer-1.1.21 --pattern 'ShishaLove-Customer-Android-1.1.21.apk' --dir dist/previous
          gh release download shishalove-customer-1.1.21 --pattern 'ShishaLove-Customer-Android-1.1.21-LEGACY-BETA.apk' --dir dist/previous
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/previous/ShishaLove-Customer-Android-1.1.21.apk)" = "$(digest shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk)"
          test "$(digest dist/previous/ShishaLove-Customer-Android-1.1.21-LEGACY-BETA.apk)" = "$(digest shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk)"

      - name: Prepare Customer installers
        run: |
          set -euo pipefail
          mkdir -p dist/public
          cp shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk dist/public/ShishaLove-Customer-Android-1.1.22.apk
          cp shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk dist/public/ShishaLove-Customer-Android-1.1.22-LEGACY-BETA.apk
          sha256sum dist/public/*.apk > dist/public/SHA256SUMS.txt
          cat > dist/public/RELEASE_NOTES.md <<'TXT'
          # ShishaLove Customer 1.1.22 — Final Logo Frame Fix

          Android Customer logo-only update. Customer WebView/business logic and the Merchant APK are unchanged.

          - Exact approved ShishaLove artwork is retained.
          - Visible launcher artwork is reduced to a protected 368px width on the 512px adaptive canvas, so it no longer touches Samsung launcher edges.
          - Android/Samsung still owns the final rounded-square mask.
          - Splash now uses the processed transparent artwork, not the raw square source, eliminating the faint white/gray rounded border around the opening logo.
          - Package IDs and both signing identities are unchanged for in-place updates.
          TXT

      - name: Publish Customer 1.1.22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-customer-1.1.22'
          ASSETS=(dist/public/ShishaLove-Customer-Android-1.1.22.apk dist/public/ShishaLove-Customer-Android-1.1.22-LEGACY-BETA.apk dist/public/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Customer 1.1.22 — Final Logo Frame Fix' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Customer 1.1.22 — Final Logo Frame Fix' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          fi

      - name: Confirm public Customer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-customer-1.1.22 --json url,assets
