name: ShishaLove Merchant 1.1.42 Scroll Fix

on:
  push:
    branches: [shishalove-main]
    paths:
      - '.github/workflows/shishalove-merchant-1.1.42.yml'
      - 'shishalove-mobile/tools/patch-merchant-scroll-1.1.42.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Merchant Android 1.1.42 scroll patch
        run: |
          set -euo pipefail
          python3 shishalove-mobile/tools/patch-merchant-scroll-1.1.42.py
          A='shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MerchantActivityV121.java'
          G='shishalove-mobile/merchant/build.gradle'
          M='shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java'
          grep -Fq 'slm-native-layout-142' "$A"
          grep -Fq "overflow-y','auto','important'" "$A"
          grep -Fq 'body.slb-merchant .slm-page{position:relative!important' "$A"
          grep -Fq 'overflow:visible!important' "$A"
          grep -Fq 'body.slb-merchant .slm-bottom{position:fixed!important' "$A"
          grep -Fq 'bottom:0!important' "$A"
          grep -Fq 'int safeBottom = Math.min(Math.max(0, systemBottom), dp(64)) + dp(6);' "$A"
          grep -Fq 'versionCode 142' "$G"
          grep -Fq "versionName '1.1.42'" "$G"
          grep -Fq 'build=142' "$M"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Merchant update
        working-directory: shishalove-mobile
        run: gradle :merchant:assembleRelease :merchant:assembleDebug --stacktrace

      - name: Verify update identity and signature continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          RELEASE='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          DEBUG='shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk'
          "$AAPT" dump badging "$RELEASE" | grep -q "package: name='eu.shishalove.merchant' versionCode='142' versionName='1.1.42'"
          "$AAPT" dump badging "$DEBUG" | grep -q "package: name='eu.shishalove.merchant.dev' versionCode='142' versionName='1.1.42-dev'"

          mkdir -p dist/previous
          gh release download shishalove-merchant-1.1.41 --pattern 'ShishaLove-Merchant-1.1.41-CURRENT-PHONE-UPDATE.apk' --dir dist/previous
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/previous/ShishaLove-Merchant-1.1.41-CURRENT-PHONE-UPDATE.apk)" = "$(digest "$RELEASE")"

          mkdir -p dist
          cp "$RELEASE" dist/ShishaLove-Merchant-1.1.42-CURRENT-PHONE-UPDATE.apk
          cp "$DEBUG" dist/ShishaLove-Merchant-1.1.42-LEGACY-DEV-ONLY.apk
          sha256sum dist/ShishaLove-Merchant-1.1.42-CURRENT-PHONE-UPDATE.apk dist/ShishaLove-Merchant-1.1.42-LEGACY-DEV-ONLY.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: shishalove-merchant-1.1.42
          path: dist/*
          if-no-files-found: error

      - name: Publish Merchant 1.1.42
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-merchant-1.1.42'
          NOTES='Merchant 1.1.42 fixes the device-confirmed no-scroll regression introduced by 1.1.41. The nested page scroller is removed; the WebView document is again the single vertical scroll owner while the Merchant bottom navigation remains fixed at the bottom of the native safe viewport. Header, logo, products, filters, data logic, Customer and WordPress Bridge are unchanged.'
          ASSETS=(dist/ShishaLove-Merchant-1.1.42-CURRENT-PHONE-UPDATE.apk dist/ShishaLove-Merchant-1.1.42-LEGACY-DEV-ONLY.apk dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Merchant 1.1.42 — Scrolling Fix' --notes "$NOTES" --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Merchant 1.1.42 — Scrolling Fix' --notes "$NOTES" --target shishalove-main
          fi
