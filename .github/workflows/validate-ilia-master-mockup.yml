name: Validate KINETIQ Master Mockups

on:
  workflow_dispatch:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - 'personal-trainer/android-beta/app/src/main/assets/kinetiq-master-310.js'
      - 'personal-trainer/android-beta/app/src/main/assets/kinetiq-master-310.css'
      - 'personal-trainer/android-beta/app/src/main/assets/index29.html'
      - 'personal-trainer/KINETIQ-3.1.0-PERMANENT-MASTER-MOCKUPS-LOCK.md'
      - '.github/workflows/validate-ilia-master-mockup.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-trainer-main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Master Mockups lock
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          node --check "$A/kinetiq-master-310.js"
          test -s "$A/kinetiq-master-310.css"
          test -s personal-trainer/KINETIQ-3.1.0-PERMANENT-MASTER-MOCKUPS-LOCK.md
          grep -q 'HOME' "$A/index29.html"
          grep -q 'PLAN' "$A/index29.html"
          grep -q 'TRAIN' "$A/index29.html"
          grep -q 'RUN' "$A/index29.html"
          grep -q 'MORE' "$A/index29.html"
          grep -q 'km-sticky-head' "$A/kinetiq-master-310.css"
          grep -q 'overflow-y:auto!important' "$A/kinetiq-master-310.css"
          grep -q 'showTodayWorkout' "$A/kinetiq-master-310.js"
          grep -q 'showRecovery' "$A/kinetiq-master-310.js"
          grep -q 'showFuel' "$A/kinetiq-master-310.js"
          grep -q 'showProgress' "$A/kinetiq-master-310.js"
          grep -q 'showMusic' "$A/kinetiq-master-310.js"
          grep -q 'showAI' "$A/kinetiq-master-310.js"
          grep -q 'showOwner' "$A/kinetiq-master-310.js"
          echo 'KINETIQ 3.1.0 Master Mockups validation PASS'
