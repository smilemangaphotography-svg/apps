name: Validate ILIA Coach Master Mockup

on:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - 'personal-trainer/android-beta/app/src/main/assets/style2-v29-master-mockup.js'
      - 'personal-trainer/android-beta/app/src/main/assets/style2-v29-master-mockup.css'
      - 'personal-trainer/android-beta/app/src/main/assets/style2-v29-priority-engine.js'
      - 'personal-trainer/android-beta/app/src/main/assets/index29.html'
      - 'personal-trainer/ILIA-COACH-MASTER-MOCKUP-LOCK.md'
      - '.github/workflows/validate-ilia-master-mockup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-trainer-main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and master-lock validation
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          node --check "$A/style2-v29-master-mockup.js"
          node --check "$A/style2-v29-priority-engine.js"
          test -s "$A/style2-v29-master-mockup.css"
          test -s personal-trainer/ILIA-COACH-MASTER-MOCKUP-LOCK.md
          grep -q 'style2-v29-master-mockup.css' "$A/index29.html"
          grep -q 'style2-v29-master-mockup.js' "$A/index29.html"
          grep -q "__ILIA_MASTER_MOCKUP__='approved-functional'" "$A/style2-v29-master-mockup.js"
          grep -q 'Upper + Strong Legs' "$A/style2-v29-master-mockup.js"
          grep -q 'Knee Support + Strength' "$A/style2-v29-master-mockup.js"
          grep -q 'Runner + Leg Strength' "$A/style2-v29-master-mockup.js"
          grep -q 'CREATE MY PLAN' "$A/style2-v29-master-mockup.js"
          grep -q "'Knee','Hip','Ankle','Lower Back','Shoulder','Elbow','Wrist'" "$A/style2-v29-priority-engine.js"
          echo 'ILIA Coach master mockup static validation PASS'
