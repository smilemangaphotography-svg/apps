name: ShishaLove Customer 1.1.38 Resume Safe Area Fix

on:
  push:
    branches: [shishalove-main]
    paths:
      - '.github/workflows/shishalove-customer-1.1.38.yml'
      - 'shishalove-mobile/tools/patch-customer-resume-1.1.38.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Customer-only 1.1.38 runtime patch
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          python3 shishalove-mobile/tools/patch-customer-resume-1.1.38.py

          A='shishalove-mobile/customer/src/main/java/eu/shishalove/customer/CustomerActivityV134.java'
          G='shishalove-mobile/customer/build.gradle'
          grep -Fq 'getWindow().setDecorFitsSystemWindows(false);' "$A"
          grep -Fq 'refreshInsetsAndViewport();' "$A"
          grep -Fq 'appRoot.postDelayed(appRoot::requestApplyInsets, 280);' "$A"
          grep -Fq '.setInsets(WindowInsets.Type.systemBars(), android.graphics.Insets.NONE)' "$A"
          grep -Fq 'v.setPadding(bars.left, bars.top, bars.right, bars.bottom);' "$A"
          grep -Fq 'bottomInsetCssPx = 0;' "$A"
          grep -Fq 'versionCode 138' "$G"
          grep -Fq "versionName '1.1.38'" "$G"

          # Scope lock: this release does not modify Bridge UI or Merchant behavior.
          git diff -- shishalove-wordpress-bridge | grep -q . && { echo 'Bridge changed unexpectedly'; exit 1; } || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Customer update identities
        working-directory: shishalove-mobile
        run: gradle :customer:assembleRelease :customer:assembleDebug --stacktrace

      - name: Verify version, package and signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          RELEASE='shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk'
          DEBUG='shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk'

          "$AAPT" dump badging "$RELEASE" | grep -q "package: name='eu.shishalove.customer' versionCode='138' versionName='1.1.38'"
          "$AAPT" dump badging "$DEBUG" | grep -q "package: name='eu.shishalove.customer.dev' versionCode='138' versionName='1.1.38-dev'"

          mkdir -p dist/previous
          gh release download shishalove-runtime-1.1.37 --pattern 'ShishaLove-Customer-1.1.37-CURRENT-PHONE-UPDATE.apk' --dir dist/previous
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/previous/ShishaLove-Customer-1.1.37-CURRENT-PHONE-UPDATE.apk)" = "$(digest "$RELEASE")"

          cp "$RELEASE" dist/ShishaLove-Customer-1.1.38-CURRENT-PHONE-UPDATE.apk
          cp "$DEBUG" dist/ShishaLove-Customer-1.1.38-LEGACY-DEV-ONLY.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: shishalove-customer-1.1.38
          path: dist/*
          if-no-files-found: error

      - name: Publish Customer-only update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-customer-1.1.38'
          NOTES='Customer-only in-place update. Fixes the stale/double bottom system-bar inset that appeared when returning to ShishaLove from Recents without fully closing it. Android root now owns and consumes system-bar insets once, then recalculates them on resume and focus regain. Bridge and Merchant are unchanged.'
          ASSETS=(dist/ShishaLove-Customer-1.1.38-CURRENT-PHONE-UPDATE.apk dist/ShishaLove-Customer-1.1.38-LEGACY-DEV-ONLY.apk dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Customer 1.1.38 — Resume Safe Area Fix' --notes "$NOTES" --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Customer 1.1.38 — Resume Safe Area Fix' --notes "$NOTES" --target shishalove-main
          fi
