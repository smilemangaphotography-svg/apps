name: Build Work Schedule Final

on:
  push:
    branches: [ "work-schedule-main" ]
    paths:
      - "work-schedule/**"
      - ".github/workflows/build-work-schedule.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Apply Beta 0.7 base polish
        working-directory: work-schedule
        run: python3 beta7_patch.py
      - name: Apply Beta 0.8 mockup lock
        working-directory: work-schedule
        run: python3 beta8_patch.py
      - name: Validate Beta 0.8 mockup lock
        working-directory: work-schedule
        run: python3 beta8_validate.py
      - name: Apply Beta 0.9 settings cleanup
        working-directory: work-schedule
        run: python3 beta9_patch.py
      - name: Validate Beta 0.9 settings
        working-directory: work-schedule
        run: python3 beta9_validate.py
      - name: Apply Beta 0.10 interaction fix
        working-directory: work-schedule
        run: python3 beta10_patch.py
      - name: Validate Beta 0.10
        working-directory: work-schedule
        run: python3 beta10_validate.py
      - name: Apply Final 1.0 production patch
        working-directory: work-schedule
        run: python3 final1_patch.py
      - name: Validate Final 1.0
        working-directory: work-schedule
        run: python3 final1_validate.py
      - name: Apply 1.0.1 launcher icon fix
        working-directory: work-schedule
        run: python3 icon101_patch.py
      - name: Validate 1.0.1 launcher icon
        working-directory: work-schedule
        run: python3 icon101_validate.py
      - name: Build final APKs
        working-directory: work-schedule
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Prepare final artifacts
        working-directory: work-schedule
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Work-Schedule-1.0.1-install.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk Work-Schedule-1.0.1-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Work-Schedule-Final-1.0.1-Icon-Fix
          path: |
            work-schedule/Work-Schedule-1.0.1-install.apk
            work-schedule/Work-Schedule-1.0.1-release-unsigned.apk
          if-no-files-found: error
