name: Build Work Schedule Beta

on:
  push:
    branches: [ "work-schedule-main" ]
    paths:
      - "work-schedule/**"
      - ".github/workflows/build-work-schedule.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Apply Beta 0.7 base polish
        working-directory: work-schedule
        run: python3 beta7_patch.py
      - name: Apply Beta 0.8 mockup lock
        working-directory: work-schedule
        run: python3 beta8_patch.py
      - name: Validate Beta 0.8 mockup lock
        working-directory: work-schedule
        run: python3 beta8_validate.py
      - name: Apply Beta 0.9 settings cleanup
        working-directory: work-schedule
        run: python3 beta9_patch.py
      - name: Validate Beta 0.9 settings
        working-directory: work-schedule
        run: python3 beta9_validate.py
      - name: Build debug APK
        working-directory: work-schedule
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Work-Schedule-Beta-0.9-Settings-Fix-APK
          path: work-schedule/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
