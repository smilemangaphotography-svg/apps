name: Build ILIAS COACH V6 — Native Compose

on:
  workflow_dispatch:
  push:
    branches: [ rebuild/ilias-coach-compose-v6 ]
    paths:
      - 'ilias-compose-v4/**'
      - 'ilias-compose-v5/**'
      - 'ilias-compose-v6/**'
      - '.github/workflows/build-ilias-compose-v6.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract existing ILIAS assets
        run: |
          rm -rf buildsrc source.zip; mkdir -p buildsrc
          cp ILIA-SAFE-SOURCE.bin source.zip; unzip -q source.zip -d buildsrc
          test -d buildsrc/Ilias-Coach/app/src/main/assets/media/anatomy
      - name: Replace shell with Compose
        run: |
          cp ilias-compose-v4/root-build.gradle buildsrc/Ilias-Coach/build.gradle
          cp ilias-compose-v4/app-build.gradle buildsrc/Ilias-Coach/app/build.gradle
          cat > buildsrc/Ilias-Coach/gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF
          cp ilias-compose-v4/AndroidManifest.xml buildsrc/Ilias-Coach/app/src/main/AndroidManifest.xml
          cp ilias-compose-v4/themes.xml buildsrc/Ilias-Coach/app/src/main/res/values/themes.xml
          pkg=buildsrc/Ilias-Coach/app/src/main/java/com/iliaperformance/iliacoach2026
          mkdir -p "$pkg"; rm -f "$pkg/MainActivity.java"
          cp ilias-compose-v4/*.kt "$pkg/"
      - name: Apply V4 compile fixes
        run: python3 ilias-compose-v4/apply_compile_fixes.py
      - name: Apply V5
        run: |
          python3 ilias-compose-v5/normalize_spotify_for_v5.py
          python3 ilias-compose-v5/apply_v5_changes.py
          python3 ilias-compose-v5/fix_v5_compile.py
      - name: Add V6 source
        run: |
          pkg=buildsrc/Ilias-Coach/app/src/main/java/com/iliaperformance/iliacoach2026
          cp ilias-compose-v6/V6Features.kt "$pkg/V6Features.kt"
          python3 ilias-compose-v6/apply_v6_changes.py
          python3 ilias-compose-v6/fix_v6_compile.py
      - name: Verify V6 architecture
        run: |
          pkg=buildsrc/Ilias-Coach/app/src/main/java/com/iliaperformance/iliacoach2026
          grep -q 'class MainActivity : ComponentActivity' "$pkg/MainActivity.kt"
          grep -q 'V6LayoutMigration.merge' "$pkg/Persistence.kt"
          grep -q 'NutritionPreferencesBlock' "$pkg/V6Features.kt"
          grep -q 'WeekPlanBlock' "$pkg/V6Features.kt"
          grep -q 'V6PrimaryButton' "$pkg/V6Features.kt"
          grep -q 'CoverHeroV6' "$pkg/Screens.kt"
          grep -q 'val sets: Int = 3' "$pkg/ModelsAndCatalog.kt"
          ! grep -R 'WebView' "$pkg"
      - name: Build V6 APK
        run: gradle --no-daemon -p buildsrc/Ilias-Coach :app:assembleDebug --stacktrace
      - name: Collect
        run: |
          mkdir -p output
          cp buildsrc/Ilias-Coach/app/build/outputs/apk/debug/app-debug.apk output/ILIAS-COACH-V6-COMPOSE.apk
          sha256sum output/ILIAS-COACH-V6-COMPOSE.apk > output/SHA256SUMS.txt
          ls -lh output
      - uses: actions/upload-artifact@v4
        with:
          name: ILIAS-COACH-V6-COMPOSE-APK
          path: output/*
          retention-days: 30
          if-no-files-found: error
