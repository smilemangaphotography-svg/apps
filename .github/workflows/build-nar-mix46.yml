name: Build NAR — Canonical App

on:
  workflow_dispatch:
  push:
    branches: [ nar-main ]
    paths:
      - 'ILIA-SAFE-SOURCE.bin'
      - 'nar-mix45/**'
      - 'nar-mix46/**'
      - 'nar-canonical/**'
      - 'nar-mix47/**'
      - 'nar-mix49/**'
      - 'nar-beta/**'
      - 'nar-beta50/**'
      - '.github/workflows/build-nar-mix46.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - uses: android-actions/setup-android@v3
      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract canonical NAR source
        run: |
          rm -rf buildsrc source.zip; mkdir -p buildsrc
          cp ILIA-SAFE-SOURCE.bin source.zip
          unzip -q source.zip -d buildsrc
          test -f buildsrc/NAR-Mix/app/src/main/assets/knowledge.js
          test -f buildsrc/NAR-Mix/app/src/main/assets/app.js
          test -f buildsrc/NAR-Mix/app/src/main/java/com/iliaperformance/narowner2026/MainActivity.java
      - name: Apply NAR 4.5 base lock
        run: python3 nar-mix45/patch_nar_mix45.py
      - name: Apply NAR 4.6 owner flavor controls
        run: python3 nar-mix46/patch_nar_mix46.py
      - name: Apply NAR 4.6 launch cover
        run: python3 nar-mix46/patch_cover_v46.py
      - name: Apply canonical navigation fix
        run: python3 nar-canonical/patch_navigation.py
      - name: Apply approved 10-screen mockup lock
        run: python3 nar-mix47/patch_mockup_v47.py
      - name: Apply NAR 4.8 audit fixes
        run: python3 nar-canonical/patch_audit_v48.py
      - name: Apply NAR 4.9 functional core
        run: python3 nar-mix49/patch_functional_v49.py
      - name: Apply NAR Beta 4.9.1 store AI gallery
        run: python3 nar-beta/patch_beta_v491.py
      - name: Apply NAR Beta 5.0 approved screen lock
        run: python3 nar-beta50/patch_beta_v50.py
      - name: Apply NAR Beta 5.0.1 safe navigation fix
        run: python3 nar-beta50/patch_beta_v501_safe_nav.py
      - name: Apply NAR Beta 5.0.2 Search detail route fix
        run: python3 nar-beta50/patch_beta_v502_detail_route.py
      - name: Apply NAR Beta 5.0.3 version metadata
        run: python3 nar-beta50/patch_beta_v503_version.py
      - name: Apply NAR Beta 5.0.4 mobile Owner/AI fix
        run: python3 nar-beta50/patch_beta_v504_mobile_ui.py
      - name: Apply NAR Beta 5.0.4 Owner AI route fix
        run: python3 nar-beta50/patch_beta_v504_ai_route.py
      - name: Apply NAR Beta 5.0.5 safe content and bulk checklist
        run: python3 nar-beta50/patch_beta_v505_safe_bulk.py
      - name: Validate canonical NAR Beta 5.0
        run: |
          JS=buildsrc/NAR-Mix/app/src/main/assets/app.js
          CSS=buildsrc/NAR-Mix/app/src/main/assets/app.css
          node --check "$JS"
          grep -q 'NAR BETA 5.0 — APPROVED 10-SCREEN LOCK' "$JS"
          grep -q 'NAR BETA 5.0 — APPROVED 10-SCREEN LOCK' "$CSS"
          grep -q 'NAR BETA 5.0.1 — SAFE NAV ANCHOR FIX' "$CSS"
          grep -q 'NAR BETA 5.0.2 — SEARCH DETAIL ROUTE FIX' "$JS"
          grep -q 'NAR BETA 5.0.4 — MOBILE OWNER/AI FIX' "$JS"
          grep -q 'NAR BETA 5.0.4 — MOBILE OWNER/AI FIX' "$CSS"
          grep -q 'NAR BETA 5.0.4 — OWNER AI ROUTE FIX' "$JS"
          grep -q 'NAR BETA 5.0.5 — SAFE CONTENT + BULK CHECKLIST' "$JS"
          grep -q 'NAR BETA 5.0.5 — SAFE CONTENT + BULK CHECKLIST' "$CSS"
          grep -q 'beta505BulkControls' "$JS"
          grep -q 'beta505BottomSpacer' "$JS"
          grep -q 'function beta50ShishaStore' "$JS"
          grep -q 'state.shishaLoveStore' "$JS"
          grep -q 'ShishaLove Store' "$JS"
          grep -q 'ShishaLove is managed separately as a store' "$JS"
          grep -q 'function beta50GenerateInspiration' "$JS"
          grep -q 'Inspiration Results' "$JS"
          grep -q 'Expected Taste Profile' "$JS"
          grep -q 'Choose brand logo from NĀR Gallery' "$JS"
          grep -q 'Choose from NĀR Gallery' "$JS"
          grep -q 'Are you sure you want to delete this image from NĀR Gallery' "$JS"
          grep -q 'HOOKAH KNOWLEDGE · MIXOLOGY' "$JS"
          grep -q "\['home','⌂','Home'\]" "$JS"
          grep -q "\['search','⌕','Search'\]" "$JS"
          grep -q "\['store','▰','Store'\]" "$JS"
          grep -q "\['mix','✦','Mix'\]" "$JS"
          grep -q "\['gallery','▣','Gallery'\]" "$JS"
          grep -q "\['mine','◎','My NĀR'\]" "$JS"
          grep -q 'function detail(id' "$JS"
          grep -q "\['details','mixes','reviews','photos','similar'\]" "$JS"
          grep -q 'function gpt(p)' "$JS"
          grep -q 'AI connection is not configured' "$JS"
          grep -q 'function adminFlavorsModal' "$JS"
          grep -q 'function bowlData(k)' "$JS"
          if grep -q "learnTopic=b.dataset.topic;learn(p)" "$JS"; then exit 1; fi
      - name: Browser regression audit for all Beta 5.0 screens
        run: |
          rm -rf /tmp/nar-ui
          npm install --prefix /tmp/nar-ui puppeteer-core@24.16.0 --silent
          python3 -m http.server 8765 --directory buildsrc/NAR-Mix/app/src/main/assets >/tmp/nar-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          node nar-beta50/debug_detail.mjs
          node nar-beta50/test_beta50.mjs
          node nar-beta50/test_beta504_mobile_ui.mjs
          node nar-beta50/test_beta505_safe_bulk.mjs
      - name: Build the same NAR Beta APK
        run: gradle --no-daemon -p buildsrc/NAR-Mix :app:assembleDebug --stacktrace
      - name: Verify package/signing identity and collect Beta APK
        run: |
          APK=buildsrc/NAR-Mix/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          mkdir -p output
          "$AAPT" dump badging "$APK" | tee output/APK_BADGING.txt
          "$APKSIGNER" verify --print-certs "$APK" | tee output/APK_CERT.txt
          grep -q "package: name='com.iliaperformance.narowner2026'" output/APK_BADGING.txt
          grep -q "versionCode='555'" output/APK_BADGING.txt
          grep -q "versionName='5.0.5-beta'" output/APK_BADGING.txt
          cp "$APK" output/NAR-BETA-5.0.5-debug.apk
          sha256sum output/NAR-BETA-5.0.5-debug.apk > output/SHA256SUMS.txt
          ls -lh output
      - uses: actions/upload-artifact@v4
        with:
          name: NAR-BETA-APK
          path: output/*
          retention-days: 90
          if-no-files-found: error
