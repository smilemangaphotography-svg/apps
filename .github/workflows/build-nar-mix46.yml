name: Build NAR — Canonical App

on:
  workflow_dispatch:
  push:
    branches: [ nar-main ]
    paths:
      - 'ILIA-SAFE-SOURCE.bin'
      - 'nar-mix45/**'
      - 'nar-mix46/**'
      - 'nar-canonical/**'
      - 'nar-mix47/**'
      - 'nar-mix49/**'
      - 'nar-beta/**'
      - '.github/workflows/build-nar-mix46.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - uses: android-actions/setup-android@v3
      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract canonical NAR source
        run: |
          rm -rf buildsrc source.zip; mkdir -p buildsrc
          cp ILIA-SAFE-SOURCE.bin source.zip
          unzip -q source.zip -d buildsrc
          test -f buildsrc/NAR-Mix/app/src/main/assets/knowledge.js
          test -f buildsrc/NAR-Mix/app/src/main/assets/app.js
          test -f buildsrc/NAR-Mix/app/src/main/java/com/iliaperformance/narowner2026/MainActivity.java
      - name: Apply NAR 4.5 base lock
        run: python3 nar-mix45/patch_nar_mix45.py
      - name: Apply NAR 4.6 owner flavor controls
        run: python3 nar-mix46/patch_nar_mix46.py
      - name: Apply NAR 4.6 launch cover
        run: python3 nar-mix46/patch_cover_v46.py
      - name: Apply canonical navigation fix
        run: python3 nar-canonical/patch_navigation.py
      - name: Apply approved 10-screen mockup lock
        run: python3 nar-mix47/patch_mockup_v47.py
      - name: Apply NAR 4.8 audit fixes
        run: python3 nar-canonical/patch_audit_v48.py
      - name: Apply NAR 4.9 functional core
        run: python3 nar-mix49/patch_functional_v49.py
      - name: Apply NAR Beta 4.9.1 store AI gallery
        run: python3 nar-beta/patch_beta_v491.py
      - name: Validate canonical NAR Beta 4.9.1
        run: |
          JS=buildsrc/NAR-Mix/app/src/main/assets/app.js
          CSS=buildsrc/NAR-Mix/app/src/main/assets/app.css
          node --check "$JS"
          grep -q 'function adminFlavorsModal' "$JS"
          grep -q 'function bowlData(k)' "$JS"
          grep -q 'NAR 4.8 AUDIT FIXES' "$CSS"
          grep -q 'NAR 4.9 FUNCTIONAL CORE' "$JS"
          grep -q 'NAR 4.9 FUNCTIONAL CORE' "$CSS"
          grep -q 'NAR BETA 4.9.1' "$JS"
          grep -q 'NAR BETA 4.9.1' "$CSS"
          grep -q 'function store(p)' "$JS"
          grep -q 'ShishaLove' "$JS"
          grep -q 'betaTopBar' "$JS"
          grep -q 'betaNav' "$JS"
          grep -q 'NĀR Gallery' "$JS"
          grep -q 'Recognize with NĀR AI' "$JS"
          grep -q 'function betaSuggestionFor' "$JS"
          grep -q 'function adminStoreBrandModal' "$JS"
          grep -q 'Choose from NĀR Gallery' "$JS"
          grep -q 'SETUP REQUIRED' "$JS"
          grep -q 'bottom:54px' "$CSS"
          grep -q 'Tobacco Store setup' "$JS"
          grep -q 'Subcategories / tobacco lines' "$JS"
          grep -q 'Expected Taste Profile' "$JS"
          grep -q 'Inspiration' "$JS"
          grep -q 'favoriteMixes' "$JS"
          grep -q 'Are you sure you want to delete this image' "$JS"
          if grep -q "learnTopic=b.dataset.topic;learn(p)" "$JS"; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          s = Path('buildsrc/NAR-Mix/app/src/main/assets/app.js').read_text()
          c = Path('buildsrc/NAR-Mix/app/src/main/assets/app.css').read_text()
          ai = '/* ===== NAR MIX 4.5 — OWNER AI / PHOTO RECOGNITION ===== */'
          v49 = '/* ===== NAR 4.9 FUNCTIONAL CORE ===== */'
          beta = '/* ===== NAR BETA 4.9.1 — STORE + AI + GALLERY ===== */'
          assert ai in s and s.index(ai) < s.rindex('})();'), 'AI scope regression'
          assert v49 in s and s.index(v49) < s.rindex('})();'), '4.9 scope regression'
          assert beta in s and s.index(beta) < s.rindex('})();'), 'Beta scope regression'
          tail = s.split(beta, 1)[1]
          assert "['home','⌂','Home'],['search','⌕','Search'],['store','▰','Store'],['mix','✦','Mix'],['gallery','▣','Gallery'],['mine','◎','My NĀR']" in tail
          assert 'function store(p)' in tail
          assert 'function betaSuggestionFor(prompt)' in tail
          assert 'function adminStoreBrandModal(bid)' in tail
          assert 'function gpt(p)' in tail
          assert 'function betaGalleryPicker' in tail
          assert 'state.narGallery' in tail
          assert 'sessionStorage' in tail
          assert 'ShishaLove' in tail
          assert 'Photo Recognition' in tail
          assert 'secure endpoint' in tail.lower()
          assert '.betaNav{bottom:54px' in c
          assert '.betaTopBar{' in c
          assert 'NAR BETA 4.9.1' in c
          PY
      - name: Build the same NAR Beta APK
        run: gradle --no-daemon -p buildsrc/NAR-Mix :app:assembleDebug --stacktrace
      - name: Collect Beta APK
        run: |
          mkdir -p output
          cp buildsrc/NAR-Mix/app/build/outputs/apk/debug/app-debug.apk output/NAR-BETA-4.9.1-debug.apk
          sha256sum output/NAR-BETA-4.9.1-debug.apk > output/SHA256SUMS.txt
          ls -lh output
      - uses: actions/upload-artifact@v4
        with:
          name: NAR-BETA-APK
          path: output/*
          retention-days: 90
          if-no-files-found: error
