name: Build NAR — Canonical App

on:
  workflow_dispatch:
  push:
    branches: [ nar-main ]
    paths:
      - 'ILIA-SAFE-SOURCE.bin'
      - 'nar-mix45/**'
      - 'nar-mix46/**'
      - 'nar-canonical/**'
      - 'nar-mix47/**'
      - '.github/workflows/build-nar-mix46.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - uses: android-actions/setup-android@v3
      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract canonical NAR source
        run: |
          rm -rf buildsrc source.zip; mkdir -p buildsrc
          cp ILIA-SAFE-SOURCE.bin source.zip
          unzip -q source.zip -d buildsrc
          test -f buildsrc/NAR-Mix/app/src/main/assets/knowledge.js
          test -f buildsrc/NAR-Mix/app/src/main/assets/app.js
          test -f buildsrc/NAR-Mix/app/src/main/java/com/iliaperformance/narowner2026/MainActivity.java
      - name: Apply NAR 4.5 base lock
        run: python3 nar-mix45/patch_nar_mix45.py
      - name: Apply NAR 4.6 owner flavor controls
        run: python3 nar-mix46/patch_nar_mix46.py
      - name: Apply NAR 4.6 launch cover
        run: python3 nar-mix46/patch_cover_v46.py
      - name: Apply canonical navigation fix
        run: python3 nar-canonical/patch_navigation.py
      - name: Apply approved 10-screen mockup lock
        run: python3 nar-mix47/patch_mockup_v47.py
      - name: Apply NAR 4.8 audit fixes
        run: python3 nar-canonical/patch_audit_v48.py
      - name: Validate canonical NAR mockup and audit locks
        run: |
          JS=buildsrc/NAR-Mix/app/src/main/assets/app.js
          CSS=buildsrc/NAR-Mix/app/src/main/assets/app.css
          node --check "$JS"
          grep -q 'function adminFlavorsModal' "$JS"
          grep -q 'Brand<select id="afBrand"' "$JS"
          grep -q 'Tobacco Line<select id="afLineSelect"' "$JS"
          grep -q 'Change Image' "$JS"
          grep -q 'SET COVER' "$JS"
          grep -q 'afCamera' "$JS"
          grep -q 'Manage flavors' "$JS"
          grep -q 'narLaunchV47' "$JS"
          grep -q 'narLaunchV47' "$CSS"
          grep -q 'EXPLORE · LEARN · MIX · ENJOY' "$JS"
          grep -q 'ENTER NĀR' "$JS"
          grep -q 'homeQuick' "$JS"
          grep -q 'Flavor Search' "$JS"
          grep -q 'Build Your Mix' "$JS"
          grep -q 'aiModeTabs' "$JS"
          grep -q 'learnMockList' "$JS"
          grep -q 'My NĀR' "$JS"
          grep -q 'ownerRows' "$JS"
          grep -q 'Export / Import' "$JS"
          grep -q 'Personal Notes' "$JS"
          grep -q 'Recently Viewed' "$JS"
          grep -q 'function goTab(next)' "$JS"
          grep -q "function goLearn(topic='home')" "$JS"
          grep -q 'function bowlData(k)' "$JS"
          grep -q "ownerMini').onclick=adminHomeModal" "$JS"
          grep -q 'Home · Quick access' "$JS"
          grep -q 'navHome:true' "$JS"
          grep -q 'NAR 4.8 AUDIT FIXES' "$CSS"
          grep -q 'grid-template-columns:48px minmax(0,1fr) 42px 14px 40px' "$CSS"
          grep -q 'left:50%!important;right:auto!important;transform:translateX(-50%)!important' "$CSS"
          if grep -q "learnTopic=b.dataset.topic;learn(p)" "$JS"; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          s = Path('buildsrc/NAR-Mix/app/src/main/assets/app.js').read_text()
          c = Path('buildsrc/NAR-Mix/app/src/main/assets/app.css').read_text()
          marker = '/* ===== NAR MIX 4.5 — OWNER AI / PHOTO RECOGNITION ===== */'
          assert marker in s, 'AI marker missing'
          assert 'function gpt(p)' in s, 'GPT page missing'
          assert s.index(marker) < s.rindex('})();'), 'AI code escaped canonical NAR scope'
          assert 'NĀR CANONICAL MOCKUP LOCK 2026-09-09' in c
          assert 'NAR 4.8 AUDIT FIXES' in c
          assert 'function bowlData(k)' in s
          assert "$('.ownerMini').onclick=adminHomeModal" in s
          assert all(x in s for x in ['navHome:true','navSearch:true','navMix:true','navGpt:true','navLearn:true','navMine:true'])
          PY
      - name: Build the same NAR APK
        run: gradle --no-daemon -p buildsrc/NAR-Mix :app:assembleDebug --stacktrace
      - name: Collect canonical APK
        run: |
          mkdir -p output
          cp buildsrc/NAR-Mix/app/build/outputs/apk/debug/app-debug.apk output/NAR-CANONICAL-debug.apk
          sha256sum output/NAR-CANONICAL-debug.apk > output/SHA256SUMS.txt
          ls -lh output
      - uses: actions/upload-artifact@v4
        with:
          name: NAR-CANONICAL-APK
          path: output/*
          retention-days: 90
          if-no-files-found: error
