name: Build NAR — Canonical App

on:
  workflow_dispatch:
  push:
    branches: [ nar-main ]
    paths:
      - 'ILIA-SAFE-SOURCE.bin'
      - 'nar-mix45/**'
      - 'nar-mix46/**'
      - 'nar-canonical/**'
      - 'nar-mix47/**'
      - 'nar-mix49/**'
      - '.github/workflows/build-nar-mix46.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - uses: android-actions/setup-android@v3
      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract canonical NAR source
        run: |
          rm -rf buildsrc source.zip; mkdir -p buildsrc
          cp ILIA-SAFE-SOURCE.bin source.zip
          unzip -q source.zip -d buildsrc
          test -f buildsrc/NAR-Mix/app/src/main/assets/knowledge.js
          test -f buildsrc/NAR-Mix/app/src/main/assets/app.js
          test -f buildsrc/NAR-Mix/app/src/main/java/com/iliaperformance/narowner2026/MainActivity.java
      - name: Apply NAR 4.5 base lock
        run: python3 nar-mix45/patch_nar_mix45.py
      - name: Apply NAR 4.6 owner flavor controls
        run: python3 nar-mix46/patch_nar_mix46.py
      - name: Apply NAR 4.6 launch cover
        run: python3 nar-mix46/patch_cover_v46.py
      - name: Apply canonical navigation fix
        run: python3 nar-canonical/patch_navigation.py
      - name: Apply approved 10-screen mockup lock
        run: python3 nar-mix47/patch_mockup_v47.py
      - name: Apply NAR 4.8 audit fixes
        run: python3 nar-canonical/patch_audit_v48.py
      - name: Apply NAR 4.9 functional core
        run: python3 nar-mix49/patch_functional_v49.py
      - name: Validate canonical NAR functional core
        run: |
          JS=buildsrc/NAR-Mix/app/src/main/assets/app.js
          CSS=buildsrc/NAR-Mix/app/src/main/assets/app.css
          node --check "$JS"
          grep -q 'function adminFlavorsModal' "$JS"
          grep -q 'Brand<select id="afBrand"' "$JS"
          grep -q 'Tobacco Line<select id="afLineSelect"' "$JS"
          grep -q 'Change Image' "$JS"
          grep -q 'SET COVER' "$JS"
          grep -q 'afCamera' "$JS"
          grep -q 'Manage flavors' "$JS"
          grep -q 'narLaunchV47' "$JS"
          grep -q 'narLaunchV47' "$CSS"
          grep -q 'EXPLORE · LEARN · MIX · ENJOY' "$JS"
          grep -q 'ENTER NĀR' "$JS"
          grep -q 'Build Your Mix' "$JS"
          grep -q 'aiModeTabs' "$JS"
          grep -q 'learnMockList' "$JS"
          grep -q 'My NĀR' "$JS"
          grep -q 'ownerRows' "$JS"
          grep -q 'Export / Import' "$JS"
          grep -q 'function bowlData(k)' "$JS"
          grep -q 'NAR 4.8 AUDIT FIXES' "$CSS"
          grep -q 'NAR 4.9 FUNCTIONAL CORE' "$JS"
          grep -q 'NAR 4.9 FUNCTIONAL CORE' "$CSS"
          grep -q 'function v49RenderSearchResults' "$JS"
          grep -q 'function resolveFlavorRef' "$JS"
          grep -q 'function openProfileSearch' "$JS"
          grep -q 'function v49Similar' "$JS"
          grep -q 'id="afSweet"' "$JS"
          grep -q 'id="afSour"' "$JS"
          grep -q 'id="afCooling"' "$JS"
          grep -q 'id="afMix"' "$JS"
          grep -q 'The six main navigation tabs are permanent' "$JS"
          if grep -q "learnTopic=b.dataset.topic;learn(p)" "$JS"; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          s = Path('buildsrc/NAR-Mix/app/src/main/assets/app.js').read_text()
          c = Path('buildsrc/NAR-Mix/app/src/main/assets/app.css').read_text()
          ai = '/* ===== NAR MIX 4.5 — OWNER AI / PHOTO RECOGNITION ===== */'
          v49 = '/* ===== NAR 4.9 FUNCTIONAL CORE ===== */'
          assert ai in s and s.index(ai) < s.rindex('})();'), 'AI scope regression'
          assert v49 in s and s.index(v49) < s.rindex('})();'), '4.9 scope regression'
          tail = s.split(v49, 1)[1]
          assert "function nav(){const items=[['home','⌂','Home'],['search','⌕','Search'],['mix','✦','Mix'],['gpt','✧','GPT'],['learn','◉','Learn'],['mine','◎','My NĀR']]" in tail
          assert "input.oninput=e=>{query=e.target.value;v49RenderSearchResults(p)}" in tail, 'Search focus-safe renderer missing'
          assert "DB.brands.map(b=>`<button data-home-brand" in tail, 'All-brand Home shortcuts missing'
          assert "allBrands.map(b=>`<button data-b" in tail, 'All-brand Search filters missing'
          assert "function detail(id,active='details')" in tail
          for tab in ['details','mixes','reviews','photos','similar']:
              assert f"['{tab}'" in tail or f"'{tab}'" in tail
          for fn in ['v49PairingButtons','bindV49Pairings','openProfileSearch','openIngredientSearch','v49Similar','v49FeelRows']:
              assert f'function {fn}' in tail
          assert all(x in s for x in ['id="afSweet"','id="afSour"','id="afCooling"','id="afIntensity"','id="afMix"'])
          assert 'NAR 4.9 FUNCTIONAL CORE' in c
          assert 'NAR 4.8 AUDIT FIXES' in c
          PY
      - name: Build the same NAR APK
        run: gradle --no-daemon -p buildsrc/NAR-Mix :app:assembleDebug --stacktrace
      - name: Collect canonical APK
        run: |
          mkdir -p output
          cp buildsrc/NAR-Mix/app/build/outputs/apk/debug/app-debug.apk output/NAR-CANONICAL-debug.apk
          sha256sum output/NAR-CANONICAL-debug.apk > output/SHA256SUMS.txt
          ls -lh output
      - uses: actions/upload-artifact@v4
        with:
          name: NAR-CANONICAL-APK
          path: output/*
          retention-days: 90
          if-no-files-found: error
