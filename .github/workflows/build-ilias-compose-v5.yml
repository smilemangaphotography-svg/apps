name: Build ILIAS COACH V5 — Native Compose

on:
  workflow_dispatch:
  push:
    branches: [ rebuild/ilias-coach-compose-v5 ]
    paths:
      - 'ilias-compose-v4/**'
      - 'ilias-compose-v5/**'
      - '.github/workflows/build-ilias-compose-v5.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract existing ILIAS assets
        shell: bash
        run: |
          rm -rf buildsrc source.zip
          mkdir -p buildsrc
          cp ILIA-SAFE-SOURCE.bin source.zip
          unzip -q source.zip -d buildsrc
          test -d buildsrc/Ilias-Coach/app/src/main/assets/media/anatomy
          test "$(find buildsrc/Ilias-Coach/app/src/main/assets/media/anatomy -name '*.mp4' | wc -l)" -ge 20

      - name: Replace WebView shell with Kotlin Compose
        shell: bash
        run: |
          cp ilias-compose-v4/root-build.gradle buildsrc/Ilias-Coach/build.gradle
          cp ilias-compose-v4/app-build.gradle buildsrc/Ilias-Coach/app/build.gradle
          cat > buildsrc/Ilias-Coach/gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF
          cp ilias-compose-v4/AndroidManifest.xml buildsrc/Ilias-Coach/app/src/main/AndroidManifest.xml
          cp ilias-compose-v4/themes.xml buildsrc/Ilias-Coach/app/src/main/res/values/themes.xml
          pkg=buildsrc/Ilias-Coach/app/src/main/java/com/iliaperformance/iliacoach2026
          mkdir -p "$pkg"
          rm -f "$pkg/MainActivity.java"
          cp ilias-compose-v4/*.kt "$pkg/"

      - name: Apply native compile fixes
        shell: bash
        run: python3 ilias-compose-v4/apply_compile_fixes.py

      - name: Normalize Spotify block for V5
        shell: bash
        run: python3 ilias-compose-v5/normalize_spotify_for_v5.py

      - name: Apply V5 product changes
        shell: bash
        run: python3 ilias-compose-v5/apply_v5_changes.py

      - name: Verify V5 architecture locks
        shell: bash
        run: |
          pkg=buildsrc/Ilias-Coach/app/src/main/java/com/iliaperformance/iliacoach2026
          grep -q "class MainActivity : ComponentActivity" "$pkg/MainActivity.kt"
          grep -q "fun SafeAreaContainer" "$pkg/Components.kt"
          grep -q "fun IliaTopBar" "$pkg/Components.kt"
          grep -q "fun IliaBottomBar" "$pkg/Components.kt"
          grep -q "fun SwipePager" "$pkg/Components.kt"
          grep -q "class CoachDatabase" "$pkg/Persistence.kt"
          grep -q "class Media3MusicEngine" "$pkg/Engines.kt"
          grep -q "No exact exercise mapping" "$pkg/CoachApp.kt"
          grep -q "animationAsset = \"media/anatomy/\$id.mp4\"" "$pkg/ModelsAndCatalog.kt"
          grep -q "WORKOUT BALANCE" "$pkg/Screens.kt"
          grep -q "SETS PER EXERCISE" "$pkg/Screens.kt"
          grep -q "SpotifyModeCard(\"DRIVE\"" "$pkg/Screens.kt"
          grep -q 'val sets: Int = 3' "$pkg/ModelsAndCatalog.kt"
          ! grep -R "WebView" "$pkg"
          ! grep -R "Add your Spotify Client ID in Owner Layout first" "$pkg"

      - name: Build native Compose V5 APK
        run: gradle --no-daemon -p buildsrc/Ilias-Coach :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output
          cp buildsrc/Ilias-Coach/app/build/outputs/apk/debug/app-debug.apk output/ILIAS-COACH-V5-COMPOSE.apk
          sha256sum output/ILIAS-COACH-V5-COMPOSE.apk > output/SHA256SUMS.txt
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ILIAS-COACH-V5-COMPOSE-APK
          path: output/*
          retention-days: 30
          if-no-files-found: error
