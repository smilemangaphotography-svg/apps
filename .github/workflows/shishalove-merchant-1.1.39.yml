name: ShishaLove Merchant 1.1.39 Bottom Safe Zone Fix

on:
  push:
    branches: [shishalove-main]
    paths:
      - '.github/workflows/shishalove-merchant-1.1.39.yml'
      - 'shishalove-mobile/tools/patch-merchant-safezone-1.1.39.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Merchant-only 1.1.39 safe-zone patch
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          python3 shishalove-mobile/tools/patch-merchant-safezone-1.1.39.py

          A='shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MerchantActivityV121.java'
          G='shishalove-mobile/merchant/build.gradle'
          M='shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java'

          grep -Fq 'getWindow().setDecorFitsSystemWindows(false);' "$A"
          grep -Fq 'refreshInsetsAndViewport();' "$A"
          grep -Fq 'WindowInsets.Type.navigationBars()' "$A"
          grep -Fq 'WindowInsets.Type.tappableElement()' "$A"
          grep -Fq 'WindowInsets.Type.systemGestures()' "$A"
          grep -Fq 'int safeBottom = Math.max(0, systemBottom) + dp(10);' "$A"
          grep -Fq 'v.setPadding(bars.left, bars.top, bars.right, safeBottom);' "$A"
          grep -Fq '.setInsets(WindowInsets.Type.systemBars(), android.graphics.Insets.NONE)' "$A"
          grep -Fq "--safe-bottom','0px','important'" "$A"
          grep -Fq 'versionCode 139' "$G"
          grep -Fq "versionName '1.1.39'" "$G"
          grep -Fq 'build=139' "$M"

          # Scope lock: this fix must not alter Customer or WordPress Bridge files.
          git diff -- shishalove-mobile/customer shishalove-wordpress-bridge | grep -q . && {
            echo 'Unexpected Customer/Bridge change'; exit 1;
          } || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Merchant update identities
        working-directory: shishalove-mobile
        run: gradle :merchant:assembleRelease :merchant:assembleDebug --stacktrace

      - name: Verify package version and signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          RELEASE='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          DEBUG='shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk'

          "$AAPT" dump badging "$RELEASE" | grep -q "package: name='eu.shishalove.merchant' versionCode='139' versionName='1.1.39'"
          "$AAPT" dump badging "$DEBUG" | grep -q "package: name='eu.shishalove.merchant.dev' versionCode='139' versionName='1.1.39-dev'"

          mkdir -p dist/previous
          gh release download shishalove-runtime-1.1.37 --pattern 'ShishaLove-Merchant-1.1.37-CURRENT-PHONE-UPDATE.apk' --dir dist/previous
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/previous/ShishaLove-Merchant-1.1.37-CURRENT-PHONE-UPDATE.apk)" = "$(digest "$RELEASE")"

          cp "$RELEASE" dist/ShishaLove-Merchant-1.1.39-CURRENT-PHONE-UPDATE.apk
          cp "$DEBUG" dist/ShishaLove-Merchant-1.1.39-LEGACY-DEV-ONLY.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: shishalove-merchant-1.1.39
          path: dist/*
          if-no-files-found: error

      - name: Publish Merchant-only update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-merchant-1.1.39'
          NOTES='Merchant-only in-place update. Fixes the bottom navigation safe zone on Samsung/Android by making the native root the single owner of system-bar insets, using the largest navigation/tappable/gesture inset, adding a 10dp physical clearance above system buttons, and recalculating the viewport on resume/focus regain. Customer, WordPress Bridge, products, orders, sorting, branding and Merchant business UI are unchanged.'
          ASSETS=(dist/ShishaLove-Merchant-1.1.39-CURRENT-PHONE-UPDATE.apk dist/ShishaLove-Merchant-1.1.39-LEGACY-DEV-ONLY.apk dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Merchant 1.1.39 — Bottom Safe Zone Fix' --notes "$NOTES" --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Merchant 1.1.39 — Bottom Safe Zone Fix' --notes "$NOTES" --target shishalove-main
          fi
