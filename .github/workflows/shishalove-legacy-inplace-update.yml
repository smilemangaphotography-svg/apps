name: ShishaLove Stable Beta In-place Update 1.1.20

on:
  push:
    branches:
      - shishalove-main
    paths:
      - '.github/workflows/shishalove-legacy-inplace-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-legacy-update:
    name: Build 1.1.20 updates for stable beta package line
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate wrapper state
        run: |
          set -euo pipefail
          grep -q "applicationIdSuffix '.dev'" shishalove-mobile/customer/build.gradle
          grep -q "applicationIdSuffix '.dev'" shishalove-mobile/merchant/build.gradle
          grep -q "versionCode 122" shishalove-mobile/customer/build.gradle
          grep -q "versionCode 122" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.20'" shishalove-mobile/customer/build.gradle
          grep -q "versionName '1.1.20'" shishalove-mobile/merchant/build.gradle
          grep -q "build=129" shishalove-mobile/customer/build.gradle
          grep -q "build=129" shishalove-mobile/merchant/build.gradle
          grep -q "bars.top + dp(6)" shishalove-mobile/customer/build.gradle
          grep -q "bars.bottom - dp(28)" shishalove-mobile/customer/build.gradle
          git diff --exit-code bd70d49208100a82700ce7fc104ab514f5b6ce63 -- shishalove-branding/merchant-icon.b64.part00 shishalove-branding/merchant-icon.b64.part01 shishalove-branding/merchant-icon.b64.part02 shishalove-branding/merchant-icon.b64.part03

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build stable-beta update APKs
        working-directory: shishalove-mobile
        run: gradle :customer:assembleDebug :merchant:assembleDebug --stacktrace

      - name: Download prior stable-beta references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/old
          gh release download shishalove-mobile-1.1.19-legacy-beta-update \
            --pattern 'ShishaLove-Customer-Android-1.1.19-UPDATE-1.1.8-BETA.apk' \
            --dir dist/old
          gh release download shishalove-mobile-1.1.8-beta \
            --pattern 'ShishaLove-Merchant-Android-1.1.8.apk' \
            --dir dist/old

      - name: Prove Customer in-place update compatibility
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OLD='dist/old/ShishaLove-Customer-Android-1.1.19-UPDATE-1.1.8-BETA.apk'
          NEW='shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk'
          "$AAPT" dump badging "$OLD" | grep -q "package: name='eu.shishalove.customer.dev' versionCode='121'"
          "$AAPT" dump badging "$NEW" | grep -q "package: name='eu.shishalove.customer.dev' versionCode='122'"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest "$OLD")" = "$(digest "$NEW")"
          echo 'Customer .dev 1.1.19 -> 1.1.20 update compatibility verified.'

      - name: Prove Merchant stable-beta line compatibility
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          OLD='dist/old/ShishaLove-Merchant-Android-1.1.8.apk'
          NEW='shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk'
          "$AAPT" dump badging "$OLD" | grep -q "package: name='eu.shishalove.merchant.dev' versionCode='118'"
          "$AAPT" dump badging "$NEW" | grep -q "package: name='eu.shishalove.merchant.dev' versionCode='122'"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest "$OLD")" = "$(digest "$NEW")"
          echo 'Merchant stable-beta 1.1.8 -> 1.1.20 certificate continuity verified.'

      - name: Verify wrapper corrections
        run: |
          set -euo pipefail
          grep -q 'build=129' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'build=129' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'ShishaLoveCustomer/1.1.20' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'ShishaLoveMerchant/1.1.20' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'bars.top + dp(6)' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'bars.bottom - dp(28)' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q '@drawable/ic_shishalove_merchant' shishalove-mobile/merchant/src/main/res/mipmap-anydpi/ic_launcher.xml

      - name: Prepare stable-beta update installers
        run: |
          set -euo pipefail
          mkdir -p dist/public
          cp shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk dist/public/ShishaLove-Customer-Android-1.1.20-UPDATE.apk
          cp shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk dist/public/ShishaLove-Merchant-Android-1.1.20-STABLE-BETA-UPDATE.apk
          sha256sum dist/public/*.apk > dist/public/SHA256SUMS.txt
          cat > dist/public/RELEASE_NOTES.md <<'TXT'
          # ShishaLove Mobile 1.1.20 — Stable Beta Update Line

          Customer update:
          - package `eu.shishalove.customer.dev`
          - versionCode 122
          - same stable beta signing certificate as the previously published Customer 1.1.19 update
          - Android wrapper-only safe-area fix; approved Bridge/WebView remains build 129

          Merchant stable-beta update:
          - package `eu.shishalove.merchant.dev`
          - versionCode 122
          - same stable beta certificate as public Merchant 1.1.8 Beta
          - exact approved red-band Merchant launcher artwork

          Important: Merchant APKs installed before the stable beta signing line used an ephemeral GitHub runner debug key. Those older installs cannot be cryptographically updated because that private key no longer exists. This release must not be described as an in-place update for such pre-stable installs.
          TXT

      - name: Publish stable-beta update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-mobile-1.1.20-stable-beta-update'
          ASSETS=(dist/public/ShishaLove-Customer-Android-1.1.20-UPDATE.apk dist/public/ShishaLove-Merchant-Android-1.1.20-STABLE-BETA-UPDATE.apk dist/public/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Mobile 1.1.20 — Stable Beta Update' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Mobile 1.1.20 — Stable Beta Update' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          fi

      - name: Confirm release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-mobile-1.1.20-stable-beta-update --json url,assets
