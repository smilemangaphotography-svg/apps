name: ShishaLove Bridge 1.1.13 WebView Validation

on:
  push:
    branches:
      - shishalove-main
    paths:
      - 'shishalove-wordpress-bridge/tools/patch-shishalove-1.1.13.py'
      - '.github/workflows/shishalove-bridge-1.1.13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bridge:
    name: Validate and package 1.1.13 web bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Build canonical 1.1.13 bridge
        run: |
          set -euo pipefail
          rm -rf package dist
          mkdir -p package dist
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge package/shishalove-app-bridge
          python3 shishalove-wordpress-bridge/tools/patch-shishalove-1.1.13.py package/shishalove-app-bridge

          MAIN='package/shishalove-app-bridge/shishalove-app-bridge.php'
          CUSTOMER='package/shishalove-app-bridge/assets/customer.js'
          MERCHANT='package/shishalove-app-bridge/assets/merchant.js'
          CSS='package/shishalove-app-bridge/assets/bridge.css'

          sed -i 's/Version: 1.1.6-rc.2/Version: 1.1.13/' "$MAIN"
          sed -i "s/define('SLB_VERSION', '1.1.6-rc.2');/define('SLB_VERSION', '1.1.13');/" "$MAIN"

          php -l "$MAIN"
          node --check "$CUSTOMER"
          node --check "$MERCHANT"

          python3 - "$MAIN" "$CUSTOMER" "$MERCHANT" "$CSS" <<'PY'
          import sys
          from pathlib import Path
          main=Path(sys.argv[1]).read_text(encoding='utf-8')
          customer=Path(sys.argv[2]).read_text(encoding='utf-8')
          merchant=Path(sys.argv[3]).read_text(encoding='utf-8')
          css=Path(sys.argv[4]).read_text(encoding='utf-8')

          official='https://shishalove.eu/wp-content/uploads/2023/08/Shishalove-Transparent-Logo-01-min-1024x456.png'
          assert 'Version: 1.1.13' in main
          assert "define('SLB_VERSION', '1.1.13')" in main
          assert "BUILD='1.1.13'" in customer
          assert official in customer, 'Customer drawer must use the official ShishaLove master artwork'
          assert 'slb-drawer-logo-white' in customer and 'slb-drawer-logo-red' in customer
          assert 'brightness(0) invert(1)' in css
          assert 'clip-path:polygon(25% 0,61% 0,61% 60%,22% 60%)' in css
          assert 'ShishaLove 1.1.13 exact owner drawer logo lock' in css

          lock=main[main.index('function slb_collection_all'):main.index('function slb_customer_bootstrap_data')]
          preferred=lock[lock.index('$preferred = array('):lock.index(');',lock.index('$preferred = array('))]
          for forbidden in ['KRAKEN','FRNKN STEIN','Shishalove','Wind Cover']:
              assert forbidden not in preferred, f'non-brand remained preferred: {forbidden}'
              assert forbidden in lock, f'missing Hookah exclusion lock: {forbidden}'
          for brand in ['Wookah','Alpha','Steamulation','Union','MIG','El-Badia','Moze','Meduse','Anima','Gold Miner','YKAP','Maklaud','Mexanika','DIAVLA','Karma','Darkside','Matt Pear','Shadow Hookah','KAYA','KORESS','El Bomber','OVO','Orden','Hooligan','SHI CARVER','Voodoo','Pandora','Mamay','Shisha Original','IZZY','Prisma','VZ Hookah','Nube','Mashisha','BATR','Pushka','DSH','Tempus','Retrofit','First','Octopuz']:
              assert brand in lock, f'missing retained Hookah brand: {brand}'

          assert 'brandPagerMarkup' in customer and 'Next brands' in customer
          assert 'Price: Low to High' in customer and 'Price: High to Low' in customer
          assert "return ['purchases','DESC']" in customer
          assert 'merchantMenu' in merchant and 'orderPanel' in merchant
          print('ShishaLove Bridge 1.1.13 owner locks passed')
          PY

          cat > package/shishalove-app-bridge/INSTALL-1.1.13.txt <<'TXT'
          ShishaLove App Bridge 1.1.13

          WebView-only validation release. Do not install/update Android APKs until this web view is approved.

          Locked corrections:
          - Customer drawer uses the official ShishaLove master artwork on black: white mark/text with the original red heart
          - KRAKEN, FRNKN STEIN, Shishalove and Wind Cover are excluded from Hookah brands only
          - those WooCommerce categories/products are not deleted or moved; they remain in their existing storefront catalogues
          - all previously approved Hookah brands remain preserved
          - Hookah Previous/Next brand paging remains functional
          - Search price sorting, purchase-ranked Recommended, Merchant menu and Merchant order details remain locked
          TXT

          (cd package && zip -qr ../dist/shishalove-app-bridge-1.1.13.zip shishalove-app-bridge)
          (cd dist && sha256sum shishalove-app-bridge-1.1.13.zip > shishalove-app-bridge-1.1.13.zip.sha256)

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-app-bridge-1.1.13
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent WordPress installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-bridge-1.1.13'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'ShishaLove App Bridge 1.1.13' --notes 'WebView validation: corrected Customer drawer branding and Hookah catalogue exclusions. No APK update yet.' --target shishalove-main
          fi
          gh release upload "$TAG" dist/shishalove-app-bridge-1.1.13.zip dist/shishalove-app-bridge-1.1.13.zip.sha256 --clobber
