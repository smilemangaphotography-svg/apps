name: ShishaLove 1.1.9 Canonical Android Regression

on:
  push:
    branches:
      - shishalove-main
    paths:
      - 'shishalove-mobile/**'
      - 'shishalove-wordpress-bridge/**'
      - 'shishalove-branding/**'
      - '.github/workflows/shishalove-release.yml'
  workflow_dispatch:

jobs:
  android:
    name: Customer + Merchant 1.1.9
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate permanent regression locks
        run: |
          set -euo pipefail
          grep -q "versionCode 119" shishalove-mobile/customer/build.gradle
          grep -q "versionName '1.1.9'" shishalove-mobile/customer/build.gradle
          grep -q "signingConfig signingConfigs.beta" shishalove-mobile/customer/build.gradle
          grep -q "lockCanonicalCustomerRuntime" shishalove-mobile/customer/build.gradle
          grep -q "isCanonicalBridge" shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q "Repeated document-wide injection" shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q "shishalove-beta-keystore.b64" shishalove-mobile/customer/build.gradle

          grep -q "versionCode 119" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.9'" shishalove-mobile/merchant/build.gradle
          grep -q "signingConfig signingConfigs.beta" shishalove-mobile/merchant/build.gradle
          grep -q "merchant_launcher_approved.b64" shishalove-mobile/merchant/build.gradle
          grep -q "red MERCHANT band" shishalove-mobile/merchant/build.gradle
          grep -q 'POST_NOTIFICATIONS' shishalove-mobile/merchant/src/main/AndroidManifest.xml
          grep -q 'notifyOrder' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java

          grep -q "legacy website DOM patches" shishalove-wordpress-bridge/design-lock/SHISHALOVE_CUSTOMER_1_1_LOCK.md
          grep -q "Price Low→High" shishalove-wordpress-bridge/design-lock/SHISHALOVE_CUSTOMER_1_1_LOCK.md

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build canonical signed release APKs
        working-directory: shishalove-mobile
        run: gradle :customer:assembleRelease :merchant:assembleRelease --stacktrace

      - name: Verify generated runtime, package identity and icon locks
        run: |
          set -euo pipefail
          grep -q "build=119" shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q "ShishaLoveCustomer/1.1.9" shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q "SHISHALOVE_BRIDGE" shishalove-mobile/customer/src/main/assets/customer_phone_polish.js
          grep -q "SHISHALOVE_BRIDGE" shishalove-mobile/customer/src/main/assets/customer_phone_fix_115.js
          grep -q "build=119" shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q "ShishaLoveMerchant/1.1.9" shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java

          test -s shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant.png
          file shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant.png | grep -qi PNG
          python3 - <<'PY'
          import base64, pathlib, struct
          source = base64.b64decode(pathlib.Path('shishalove-mobile/merchant/src/main/assets/merchant_launcher_approved.b64').read_text().strip())
          generated = pathlib.Path('shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant.png').read_bytes()
          def dims(data):
              assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not PNG'
              assert data[12:16] == b'IHDR', 'missing IHDR'
              return struct.unpack('>II', data[16:24])
          assert dims(source) == (192, 192), 'approved Merchant source dimensions changed'
          assert dims(generated) == (192, 192), 'generated Merchant icon dimensions changed'
          print('Approved Merchant red-band artwork source normalized to valid 192x192 Android PNG')
          PY

          CUSTOMER='shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk'
          MERCHANT='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --print-certs "$CUSTOMER"
          "$APKSIGNER" verify --print-certs "$MERCHANT"
          "$AAPT" dump badging "$CUSTOMER" | grep -q "package: name='eu.shishalove.customer' versionCode='119' versionName='1.1.9'"
          "$AAPT" dump badging "$MERCHANT" | grep -q "package: name='eu.shishalove.merchant' versionCode='119' versionName='1.1.9'"
          ! "$AAPT" dump badging "$CUSTOMER" | grep -q 'eu.shishalove.customer.dev'
          ! "$AAPT" dump badging "$MERCHANT" | grep -q 'eu.shishalove.merchant.dev'

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk dist/android/ShishaLove-Customer-1.1.9.apk
          cp shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk dist/android/ShishaLove-Merchant-1.1.9.apk
          sha256sum dist/android/*.apk > dist/android/SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-android-1.1.9
          path: dist/android/
          if-no-files-found: error
          retention-days: 30
