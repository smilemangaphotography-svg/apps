name: ShishaLove 1.1.8 Canonical Android Regression

on:
  push:
    branches:
      - shishalove-main
    paths:
      - 'shishalove-mobile/**'
      - 'shishalove-wordpress-bridge/**'
      - 'shishalove-branding/**'
      - '.github/workflows/shishalove-release.yml'
  workflow_dispatch:

jobs:
  android:
    name: Customer + Merchant 1.1.8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate permanent regression locks
        run: |
          set -euo pipefail
          grep -q "versionCode 118" shishalove-mobile/customer/build.gradle
          grep -q "versionName '1.1.8'" shishalove-mobile/customer/build.gradle
          grep -q "lockCanonicalCustomerRuntime" shishalove-mobile/customer/build.gradle
          grep -q "SHISHALOVE_BRIDGE" shishalove-mobile/customer/build.gradle
          grep -q "shishalove-beta-keystore.b64" shishalove-mobile/customer/build.gradle

          grep -q "versionCode 118" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.8'" shishalove-mobile/merchant/build.gradle
          grep -q "merchant_launcher_approved.b64" shishalove-mobile/merchant/build.gradle
          grep -q "shishalove-beta-keystore.b64" shishalove-mobile/merchant/build.gradle
          grep -q 'POST_NOTIFICATIONS' shishalove-mobile/merchant/src/main/AndroidManifest.xml
          grep -q 'notifyOrder' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'setInterval' shishalove-mobile/merchant/src/main/assets/merchant_order_watch.js

          grep -q "legacy website DOM patches" shishalove-wordpress-bridge/design-lock/SHISHALOVE_CUSTOMER_1_1_LOCK.md
          grep -q "Price Low→High" shishalove-wordpress-bridge/design-lock/SHISHALOVE_CUSTOMER_1_1_LOCK.md

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed beta APKs
        working-directory: shishalove-mobile
        run: gradle :customer:assembleDebug :merchant:assembleDebug --stacktrace

      - name: Verify generated runtime and icon locks
        run: |
          set -euo pipefail
          grep -q "build=118" shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q "ShishaLoveCustomer/1.1.8" shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q "SHISHALOVE_BRIDGE" shishalove-mobile/customer/src/main/assets/customer_phone_polish.js
          grep -q "SHISHALOVE_BRIDGE" shishalove-mobile/customer/src/main/assets/customer_phone_fix_115.js
          grep -q "build=118" shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q "ShishaLoveMerchant/1.1.8" shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          test -s shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant.png
          file shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant.png | grep -qi PNG

          CUSTOMER='shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk'
          MERCHANT='shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$CUSTOMER"
          "$APKSIGNER" verify --print-certs "$MERCHANT"

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk dist/android/ShishaLove-Customer-1.1.8-Beta.apk
          cp shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk dist/android/ShishaLove-Merchant-1.1.8-Beta.apk
          sha256sum dist/android/*.apk > dist/android/SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-android-1.1.8-beta
          path: dist/android/
          if-no-files-found: error
          retention-days: 30
