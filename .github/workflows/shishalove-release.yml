name: ShishaLove Bridge RC2 + 1.1.5 Native Validation

on:
  push:
    branches:
      - shishalove-main
    paths:
      - 'shishalove-mobile/**'
      - 'shishalove-ios/**'
      - 'shishalove-branding/**'
      - 'shishalove-wordpress-bridge/**'
      - '.github/workflows/shishalove-release.yml'
  workflow_dispatch:

jobs:
  bridge:
    name: Bridge 1.1.6 RC2 validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Validate canonical bridge source
        run: |
          set -euo pipefail
          PLUGIN='shishalove-wordpress-bridge/plugin/shishalove-app-bridge'
          php -l "$PLUGIN/shishalove-app-bridge.php"
          node --check "$PLUGIN/assets/customer.js"
          node --check "$PLUGIN/assets/merchant.js"
          grep -q "Version: 1.1.6-rc.2" "$PLUGIN/shishalove-app-bridge.php"
          grep -q "shishalove-app" "$PLUGIN/shishalove-app-bridge.php"
          grep -q "shishalove-merchant" "$PLUGIN/shishalove-app-bridge.php"
          grep -q "slb_find_global_exact" "$PLUGIN/shishalove-app-bridge.php"
          grep -q "html_entity_decode" "$PLUGIN/shishalove-app-bridge.php"
          grep -q "slb_merchant_categories" "$PLUGIN/shishalove-app-bridge.php"
          grep -q "orderby.*count" "$PLUGIN/shishalove-app-bridge.php"
          grep -q "Quick Picks (Most Used)" "$PLUGIN/assets/merchant.js"
          grep -q "slice(0,10)" "$PLUGIN/assets/merchant.js"
          grep -q "Search categories" "$PLUGIN/assets/merchant.js"
          grep -q "productsByView" "$PLUGIN/assets/merchant.js"
          grep -q "vkey('slb-bootstrap')" "$PLUGIN/assets/customer.js"
          grep -q "slb-brand-lockup" "$PLUGIN/assets/bridge.css"
          ! grep -q "MutationObserver" "$PLUGIN/assets/customer.js"
          ! grep -q "MutationObserver" "$PLUGIN/assets/merchant.js"
          ! grep -q "Loading\.\.\." "$PLUGIN/assets/customer.js"
          ! grep -q "Loading\.\.\." "$PLUGIN/assets/merchant.js"

      - name: Verify category picker order
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='shishalove-wordpress-bridge/plugin/shishalove-app-bridge/assets/merchant.js';
          const s=fs.readFileSync(p,'utf8');
          const search=s.indexOf('Search categories');
          const quick=s.indexOf('Quick Picks (Most Used)');
          const all=s.indexOf('All Categories');
          if(!(search>=0 && quick>search && all>quick)) throw new Error('Merchant category order must be Search -> Quick Picks -> All Categories');
          const wanted=['Hookah','Bowls','Accessories'];
          wanted.forEach(x=>{ if(!s.includes("'"+x+"'")) throw new Error('Missing locked Merchant filter '+x); });
          NODE

      - name: Package WordPress bridge release candidate
        run: |
          set -euo pipefail
          mkdir -p dist/bridge package
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge package/shishalove-app-bridge
          (cd package && zip -qr ../dist/bridge/shishalove-app-bridge-1.1.6-rc.2.zip shishalove-app-bridge)
          zip -qr dist/bridge/shishalove-bridge-source-1.1.6-rc.2.zip shishalove-wordpress-bridge -x '*/.DS_Store'
          sha256sum dist/bridge/*.zip > dist/bridge/SHA256SUMS.txt

      - name: Upload bridge candidate
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-bridge-1.1.6-rc.2
          path: dist/bridge/
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android Customer + Merchant existing 1.1.5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Android 1.1.5 metadata
        run: |
          grep -q "versionCode 115" shishalove-mobile/customer/build.gradle
          grep -q "versionName '1.1.5'" shishalove-mobile/customer/build.gradle
          grep -q "versionCode 115" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.5'" shishalove-mobile/merchant/build.gradle
          grep -q 'build=115' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'ShishaLoveCustomer/1.1.5' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'build=115' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'ShishaLoveMerchant/1.1.5' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build existing Android baseline
        working-directory: shishalove-mobile
        run: gradle :customer:assembleDebug :merchant:assembleDebug :customer:bundleRelease :merchant:bundleRelease --stacktrace

      - name: Collect Android baseline artifacts
        run: |
          mkdir -p dist/android
          cp shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk dist/android/ShishaLove-Customer-1.1.5-Install.apk
          cp shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk dist/android/ShishaLove-Merchant-1.1.5-Install.apk
          cp shishalove-mobile/customer/build/outputs/bundle/release/customer-release.aab dist/android/ShishaLove-Customer-1.1.5-Unsigned.aab
          cp shishalove-mobile/merchant/build/outputs/bundle/release/merchant-release.aab dist/android/ShishaLove-Merchant-1.1.5-Unsigned.aab
          sha256sum dist/android/* > dist/android/SHA256SUMS.txt

      - name: Upload Android baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-1.1.5-android
          path: dist/android/
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS Customer + Merchant existing compile check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate existing iOS release metadata
        run: |
          grep -A20 'ShishaLoveCustomer:' shishalove-ios/project.yml | grep -q 'MARKETING_VERSION: 1.1.2'
          grep -A20 'ShishaLoveCustomer:' shishalove-ios/project.yml | grep -q 'CURRENT_PROJECT_VERSION: 112'
          grep -A20 'ShishaLoveMerchant:' shishalove-ios/project.yml | grep -q 'MARKETING_VERSION: 1.1.2'
          grep -A20 'ShishaLoveMerchant:' shishalove-ios/project.yml | grep -q 'CURRENT_PROJECT_VERSION: 112'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Materialize approved app icons
        working-directory: shishalove-ios
        run: bash scripts/materialize-assets.sh

      - name: Generate Xcode project
        working-directory: shishalove-ios
        run: xcodegen generate

      - name: Build Customer for iOS Simulator
        working-directory: shishalove-ios
        run: xcodebuild -project ShishaLoveMobile.xcodeproj -scheme ShishaLoveCustomer -sdk iphonesimulator -configuration Release -derivedDataPath build/customer CODE_SIGNING_ALLOWED=NO build

      - name: Build Merchant for iOS Simulator
        working-directory: shishalove-ios
        run: xcodebuild -project ShishaLoveMobile.xcodeproj -scheme ShishaLoveMerchant -sdk iphonesimulator -configuration Release -derivedDataPath build/merchant CODE_SIGNING_ALLOWED=NO build
