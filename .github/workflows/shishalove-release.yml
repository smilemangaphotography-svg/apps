name: ShishaLove 1.1.4 Functional Mockup Validation

on:
  push:
    branches:
      - shishalove-main
    paths:
      - 'shishalove-mobile/**'
      - 'shishalove-ios/**'
      - 'shishalove-branding/**'
      - 'shishalove-wordpress-bridge/**'
      - '.github/workflows/shishalove-release.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android Customer + Merchant 1.1.4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate Android functional mockup metadata
        run: |
          grep -q "versionCode 114" shishalove-mobile/customer/build.gradle
          grep -q "versionName '1.1.4'" shishalove-mobile/customer/build.gradle
          grep -q "versionCode 114" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.4'" shishalove-mobile/merchant/build.gradle
          grep -q 'build=114' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'ShishaLoveCustomer/1.1.4' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'build=114' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'ShishaLoveMerchant/1.1.4' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'sl114-hookah-grid' shishalove-mobile/customer/src/main/assets/customer_phone_polish.js
          grep -q 'sl114-drawer' shishalove-mobile/customer/src/main/assets/customer_phone_polish.js
          grep -q 'Quick Select (Most Used)' shishalove-mobile/merchant/src/main/assets/merchant_phone_polish.js
          grep -q 'slm114-hidden-loading' shishalove-mobile/merchant/src/main/assets/merchant_phone_polish.js
          test -f shishalove-mobile/customer/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f shishalove-mobile/merchant/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f shishalove-branding/customer-icon.b64.part00
          test -f shishalove-branding/merchant-icon.b64.part00

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable development APKs and production bundles
        working-directory: shishalove-mobile
        run: gradle :customer:assembleDebug :merchant:assembleDebug :customer:bundleRelease :merchant:bundleRelease --stacktrace

      - name: Verify launcher assets were materialized
        run: |
          test -s shishalove-mobile/customer/src/main/res/drawable-nodpi/ic_shishalove_customer.png
          test -s shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant.png

      - name: Collect Android artifacts
        run: |
          mkdir -p dist/android
          cp shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk dist/android/ShishaLove-Customer-1.1.4-Install.apk
          cp shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk dist/android/ShishaLove-Merchant-1.1.4-Install.apk
          cp shishalove-mobile/customer/build/outputs/bundle/release/customer-release.aab dist/android/ShishaLove-Customer-1.1.4-Unsigned.aab
          cp shishalove-mobile/merchant/build/outputs/bundle/release/merchant-release.aab dist/android/ShishaLove-Merchant-1.1.4-Unsigned.aab
          sha256sum dist/android/* > dist/android/SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-1.1.4-android
          path: dist/android/
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS Customer + Merchant existing compile check
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate existing iOS release metadata
        run: |
          grep -A20 'ShishaLoveCustomer:' shishalove-ios/project.yml | grep -q 'MARKETING_VERSION: 1.1.2'
          grep -A20 'ShishaLoveCustomer:' shishalove-ios/project.yml | grep -q 'CURRENT_PROJECT_VERSION: 112'
          grep -A20 'ShishaLoveMerchant:' shishalove-ios/project.yml | grep -q 'MARKETING_VERSION: 1.1.2'
          grep -A20 'ShishaLoveMerchant:' shishalove-ios/project.yml | grep -q 'CURRENT_PROJECT_VERSION: 112'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Materialize approved app icons
        working-directory: shishalove-ios
        run: bash scripts/materialize-assets.sh

      - name: Generate Xcode project
        working-directory: shishalove-ios
        run: xcodegen generate

      - name: Build Customer for iOS Simulator
        working-directory: shishalove-ios
        run: xcodebuild -project ShishaLoveMobile.xcodeproj -scheme ShishaLoveCustomer -sdk iphonesimulator -configuration Release -derivedDataPath build/customer CODE_SIGNING_ALLOWED=NO build

      - name: Build Merchant for iOS Simulator
        working-directory: shishalove-ios
        run: xcodebuild -project ShishaLoveMobile.xcodeproj -scheme ShishaLoveMerchant -sdk iphonesimulator -configuration Release -derivedDataPath build/merchant CODE_SIGNING_ALLOWED=NO build
