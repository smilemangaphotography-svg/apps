name: Build FRAME Redesign Beta

on:
  workflow_dispatch:
  push:
    branches: [ frame-redesign-main ]
    paths:
      - 'FRAME-Redesign/beta/**'
      - '.github/workflows/build-frame-redesign-beta.yml'

permissions:
  contents: read

jobs:
  build-frame-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4

      - name: Validate mockup-locked Beta 0.8 runtime
        shell: bash
        run: |
          test -f FRAME-Redesign/beta/app/src/main/assets/index08.html
          test -f FRAME-Redesign/beta/app/src/main/assets/style08.css
          test -f FRAME-Redesign/beta/app/src/main/assets/app08.js
          test -f FRAME-Redesign/beta/app/src/main/java/com/ilia/frame/redesignbeta/SmartMlBridge.java
          node --check FRAME-Redesign/beta/app/src/main/assets/app08.js
          grep -q 'style08.css' FRAME-Redesign/beta/app/src/main/assets/index08.html
          grep -q 'app08.js' FRAME-Redesign/beta/app/src/main/assets/index08.html
          grep -q 'index08.html' FRAME-Redesign/beta/app/src/main/java/com/ilia/frame/redesignbeta/MainActivity.java
          grep -q 'saveXmp' FRAME-Redesign/beta/app/src/main/java/com/ilia/frame/redesignbeta/MainActivity.java
          grep -q 'PoseDetection' FRAME-Redesign/beta/app/src/main/java/com/ilia/frame/redesignbeta/SmartMlBridge.java
          grep -q 'SubjectSegmentation' FRAME-Redesign/beta/app/src/main/java/com/ilia/frame/redesignbeta/SmartMlBridge.java
          grep -q 'subject-segmentation' FRAME-Redesign/beta/app/build.gradle
          grep -q "versionName '0.8.0-beta8'" FRAME-Redesign/beta/app/build.gradle
          grep -q '9:16' FRAME-Redesign/beta/app/src/main/assets/app08.js
          grep -q 'Add Photos' FRAME-Redesign/beta/app/src/main/assets/index08.html
          grep -q 'Crop Lock' FRAME-Redesign/beta/app/src/main/assets/app08.js
          grep -q 'AI Master Recipe' FRAME-Redesign/beta/app/src/main/assets/app08.js
          grep -q 'Color Range' FRAME-Redesign/beta/app/src/main/assets/app08.js
          grep -q 'Luminance' FRAME-Redesign/beta/app/src/main/assets/app08.js
          grep -q 'Export Lightroom XMP' FRAME-Redesign/beta/app/src/main/assets/app08.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build FRAME Beta
        run: gradle --no-daemon -p FRAME-Redesign/beta :app:assembleDebug

      - name: Verify APK identity
        shell: bash
        run: |
          APK="FRAME-Redesign/beta/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee FRAME-Redesign/beta/apk-badging.txt
          grep -q "package: name='com.ilia.frame.redesignbeta.debug'" FRAME-Redesign/beta/apk-badging.txt
          grep -q "versionName='0.8.0-beta8-debug'" FRAME-Redesign/beta/apk-badging.txt

      - name: Collect beta artifact
        shell: bash
        run: |
          mkdir -p frame-beta-apk
          cp FRAME-Redesign/beta/app/build/outputs/apk/debug/app-debug.apk frame-beta-apk/FRAME-Redesign-Beta-0.8.0.apk
          cp FRAME-Redesign/beta/apk-badging.txt frame-beta-apk/APK-IDENTITY.txt
          sha256sum frame-beta-apk/FRAME-Redesign-Beta-0.8.0.apk | tee frame-beta-apk/SHA256SUMS.txt
          ls -lh frame-beta-apk

      - name: Upload FRAME beta APK
        uses: actions/upload-artifact@v4
        with:
          name: FRAME-REDESIGN-BETA-0.8.0
          path: frame-beta-apk/*
          if-no-files-found: error
          retention-days: 30
