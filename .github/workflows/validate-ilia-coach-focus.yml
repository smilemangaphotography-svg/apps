name: Validate KINETIQ 3.1.2 Permanent Runtime

on:
  workflow_dispatch:
  push:
    branches: [ personal-trainer-main ]
    paths:
      - 'personal-trainer/android-beta/app/src/main/assets/kinetiq-master-310.js'
      - 'personal-trainer/android-beta/app/src/main/assets/kinetiq-master-310.css'
      - 'personal-trainer/android-beta/app/src/main/assets/index29.html'
      - 'personal-trainer/android-beta/app/src/main/java/com/ilia/personaltrainer/MainActivity.java'
      - 'personal-trainer/KINETIQ-3.1.0-PERMANENT-MASTER-MOCKUPS-LOCK.md'
      - '.github/workflows/validate-ilia-coach-focus.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-trainer-main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate permanent Master runtime
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          node --check "$A/kinetiq-master-310.js"
          test -s "$A/kinetiq-master-310.css"
          grep -q 'kinetiq-master-310.css' "$A/index29.html"
          grep -q 'kinetiq-master-310.js' "$A/index29.html"
          grep -q "__KINETIQ_MASTER_MOCKUPS__='3.1.2-permanent'" "$A/kinetiq-master-310.js"
                    grep -q 'EXERCISE COMPLETED' "$A/kinetiq-master-310.js"
          grep -q 'Workout Complete!' "$A/kinetiq-master-310.js"
          grep -q 'Run Activity' "$A/kinetiq-master-310.js"
          grep -q 'INFINITE DRIVE' "$A/kinetiq-master-310.js"
          grep -q 'data-nav="run"' "$A/index29.html"
          grep -q "__KINETIQ_BASE_READY__=true" "$A/index29.html"
          grep -q "__KINETIQ_ENTRY_READY__=true" "$A/kinetiq-v315-root-lock.js"
          grep -q "3.1.2-master-fidelity" "$A/kinetiq-v315-root-lock.js"
          echo 'KINETIQ 3.1.2 permanent runtime validation PASS'
