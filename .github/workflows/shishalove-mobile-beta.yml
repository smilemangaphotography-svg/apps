name: Build ShishaLove Mobile Beta

on:
  push:
    branches:
      - shishalove-mobile-beta
    paths:
      - 'shishalove-mobile/**'
      - '.github/workflows/shishalove-mobile-beta.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify dev lineage and regression locks
        run: |
          set -euo pipefail
          test -s shishalove-mobile/signing/shishalove-beta-keystore.b64
          grep -Fq "applicationIdSuffix '.dev'" shishalove-mobile/customer/build.gradle
          grep -Fq "versionCode 116" shishalove-mobile/customer/build.gradle
          grep -Fq "versionName '1.1.6'" shishalove-mobile/customer/build.gradle
          grep -Fq 'signingConfig signingConfigs.beta' shishalove-mobile/customer/build.gradle
          grep -Fq "applicationIdSuffix '.dev'" shishalove-mobile/merchant/build.gradle
          grep -Fq "versionCode 117" shishalove-mobile/merchant/build.gradle
          grep -Fq "versionName '1.1.7'" shishalove-mobile/merchant/build.gradle
          grep -Fq 'signingConfig signingConfigs.beta' shishalove-mobile/merchant/build.gradle
          grep -Fq 'customer_phone_fix_116.js' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -Fq 'build=116' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -Fq '@drawable/ic_shishalove_merchant' shishalove-mobile/merchant/src/main/AndroidManifest.xml
          node --check shishalove-mobile/customer/src/main/assets/customer_phone_fix_116.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build both beta APKs
        working-directory: shishalove-mobile
        run: gradle :customer:assembleDebug :merchant:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk dist/ShishaLove-Customer-Beta.apk
          cp shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk dist/ShishaLove-Merchant-Beta.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-mobile-beta-apks
          path: dist/
          if-no-files-found: error
          retention-days: 30
