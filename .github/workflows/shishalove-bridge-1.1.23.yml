name: ShishaLove Bridge 1.1.23 Permanent Merchant Compact Logo Fix

on:
  push:
    branches:
      - shishalove-main
    paths:
      - 'shishalove-wordpress-bridge/tools/patch-shishalove-1.1.23.py'
      - '.github/workflows/shishalove-bridge-1.1.23.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bridge:
    name: Freeze 1.1.22; permanently fix Merchant header logo size only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Build locked 1.1.22 baseline and 1.1.23 candidate
        run: |
          set -euo pipefail
          rm -rf baseline package dist
          mkdir -p baseline package dist
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge baseline/shishalove-app-bridge
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge package/shishalove-app-bridge

          python3 shishalove-wordpress-bridge/tools/patch-shishalove-1.1.22.py baseline/shishalove-app-bridge
          python3 shishalove-wordpress-bridge/tools/patch-shishalove-1.1.23.py package/shishalove-app-bridge

          BASE_CUSTOMER='baseline/shishalove-app-bridge/assets/customer.js'
          BASE_MERCHANT='baseline/shishalove-app-bridge/assets/merchant.js'
          CUSTOMER='package/shishalove-app-bridge/assets/customer.js'
          MERCHANT='package/shishalove-app-bridge/assets/merchant.js'
          MAIN='package/shishalove-app-bridge/shishalove-app-bridge.php'
          CSS='package/shishalove-app-bridge/assets/bridge.css'

          # Absolute functional freeze: this release is CSS-only.
          cmp --silent "$BASE_CUSTOMER" "$CUSTOMER" || { echo 'ERROR: Customer JS changed'; exit 1; }
          cmp --silent "$BASE_MERCHANT" "$MERCHANT" || { echo 'ERROR: Merchant JS changed'; exit 1; }

          sed -i 's/Version: 1.1.6-rc.2/Version: 1.1.23/' "$MAIN"
          sed -i "s/define('SLB_VERSION', '1.1.6-rc.2');/define('SLB_VERSION', '1.1.23');/" "$MAIN"

          php -l "$MAIN"
          node --check "$CUSTOMER"
          node --check "$MERCHANT"

          python3 - "$MAIN" "$CSS" <<'PY'
          import sys
          from pathlib import Path
          main=Path(sys.argv[1]).read_text(encoding='utf-8')
          css=Path(sys.argv[2]).read_text(encoding='utf-8')
          assert 'Version: 1.1.23' in main
          assert "define('SLB_VERSION', '1.1.23')" in main
          assert 'ShishaLove 1.1.23 PERMANENT Merchant header-logo size/alignment lock' in css
          assert 'height:66px!important' in css
          assert 'transform:none!important' in css
          assert 'width:156px!important' in css
          assert 'height:46px!important' in css
          assert 'width:142px!important' in css
          assert 'height:19px!important' in css
          assert 'overflow-y:scroll!important' in css
          assert 'padding-bottom:150px!important' in css
          print('PASS: Merchant logo is smaller, fully visible and centered with controls; scrolling preserved; JS frozen')
          PY

          cat > package/shishalove-app-bridge/INSTALL-1.1.23.txt <<'TXT'
          ShishaLove App Bridge 1.1.23

          WORDPRESS BRIDGE UPDATE ONLY. DO NOT REINSTALL OR REPLACE ANDROID APPS.

          PERMANENT MERCHANT HEADER FIX:
          - Removes the 1.1.22 -20px upward transform that clipped the top of the Merchant artwork.
          - Keeps the 88px Merchant header row.
          - Reduces the approved Merchant header lockup from 176px to 156px wide.
          - Centers the full Merchant lockup on the same visual axis as hamburger and refresh.
          - Preserves vertical scrolling and all approved Merchant functionality.

          LOCKED / UNCHANGED:
          - Customer UI and behaviour.
          - Merchant menu, Orders, order details, Products, Stock, editor, search and navigation logic.
          - Merchant artwork itself; only displayed size/alignment changes.
          - Android APK/package/signing files.
          TXT

          (cd package && zip -qr ../dist/shishalove-app-bridge-1.1.23.zip shishalove-app-bridge)
          (cd dist && sha256sum shishalove-app-bridge-1.1.23.zip > shishalove-app-bridge-1.1.23.zip.sha256)

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-app-bridge-1.1.23
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent WordPress installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-bridge-1.1.23'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'ShishaLove App Bridge 1.1.23' --notes 'Permanent Merchant header-logo size/alignment correction. Customer/Merchant JS remains frozen. No APK update.' --target shishalove-main
          fi
          gh release upload "$TAG" dist/shishalove-app-bridge-1.1.23.zip dist/shishalove-app-bridge-1.1.23.zip.sha256 --clobber

      - name: Confirm release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-bridge-1.1.23 --json url,assets
