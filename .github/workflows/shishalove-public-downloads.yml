name: ShishaLove Public Downloads 1.1.11

on:
  push:
    branches:
      - shishalove-main
    paths:
      - '.github/workflows/shishalove-public-downloads.yml'
      - 'shishalove-mobile/**'
      - 'shishalove-branding/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android:
    name: Build and publish canonical Android update installers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate locked mobile versions
        run: |
          set -euo pipefail
          grep -q "applicationId 'eu.shishalove.customer'" shishalove-mobile/customer/build.gradle
          grep -q "applicationId 'eu.shishalove.merchant'" shishalove-mobile/merchant/build.gradle
          grep -q "versionCode 120" shishalove-mobile/customer/build.gradle
          grep -q "versionName '1.1.11'" shishalove-mobile/customer/build.gradle
          grep -q "versionCode 120" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.11'" shishalove-mobile/merchant/build.gradle
          grep -q "signingConfig signingConfigs.beta" shishalove-mobile/customer/build.gradle
          grep -q "signingConfig signingConfigs.beta" shishalove-mobile/merchant/build.gradle
          grep -q "shishalove-beta-keystore.b64" shishalove-mobile/customer/build.gradle
          grep -q "shishalove-beta-keystore.b64" shishalove-mobile/merchant/build.gradle
          grep -q "merchant-icon.b64.part" shishalove-mobile/merchant/build.gradle
          grep -q "red MERCHANT band" shishalove-mobile/merchant/build.gradle
          grep -q 'POST_NOTIFICATIONS' shishalove-mobile/merchant/src/main/AndroidManifest.xml
          grep -q 'notifyOrder' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'isCanonicalBridge' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'Never create a replacement package' shishalove-wordpress-bridge/design-lock/SHISHALOVE_CUSTOMER_1_1_LOCK.md

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build stable-signed canonical Android apps
        working-directory: shishalove-mobile
        run: gradle :customer:assembleRelease :merchant:assembleRelease --stacktrace

      - name: Verify canonical APK identities and artwork
        run: |
          set -euo pipefail
          CUSTOMER='shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk'
          MERCHANT='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --print-certs "$CUSTOMER"
          "$APKSIGNER" verify --print-certs "$MERCHANT"
          "$AAPT" dump badging "$CUSTOMER" | grep -q "package: name='eu.shishalove.customer' versionCode='120' versionName='1.1.11'"
          "$AAPT" dump badging "$MERCHANT" | grep -q "package: name='eu.shishalove.merchant' versionCode='120' versionName='1.1.11'"
          ! "$AAPT" dump badging "$CUSTOMER" | grep -q 'eu.shishalove.customer.dev'
          ! "$AAPT" dump badging "$MERCHANT" | grep -q 'eu.shishalove.merchant.dev'
          python3 - <<'PY'
          import base64, pathlib, struct
          parts = sorted(pathlib.Path('shishalove-branding').glob('merchant-icon.b64.part*'))
          assert parts, 'missing Merchant branding parts'
          source = base64.b64decode(''.join(p.read_text().strip() for p in parts))
          generated = pathlib.Path('shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant.png').read_bytes()
          def dims(data):
              assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not PNG'
              assert data[12:16] == b'IHDR', 'missing IHDR'
              return struct.unpack('>II', data[16:24])
          assert dims(source) == (512, 512)
          assert generated == source
          print('Merchant locked red-band launcher verified at 512x512')
          PY

      - name: Prove normal update compatibility with 1.1.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/previous
          gh release download shishalove-mobile-1.1.9 \
            --pattern 'ShishaLove-Customer-Android-1.1.9.apk' \
            --pattern 'ShishaLove-Merchant-Android-1.1.9.apk' \
            --dir dist/previous
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          OLD_CUSTOMER="$(digest dist/previous/ShishaLove-Customer-Android-1.1.9.apk)"
          NEW_CUSTOMER="$(digest shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk)"
          OLD_MERCHANT="$(digest dist/previous/ShishaLove-Merchant-Android-1.1.9.apk)"
          NEW_MERCHANT="$(digest shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk)"
          test -n "$OLD_CUSTOMER" && test "$OLD_CUSTOMER" = "$NEW_CUSTOMER"
          test -n "$OLD_MERCHANT" && test "$OLD_MERCHANT" = "$NEW_MERCHANT"
          echo "Customer 1.1.9 -> 1.1.11 signing continuity verified: $NEW_CUSTOMER"
          echo "Merchant 1.1.9 -> 1.1.11 signing continuity verified: $NEW_MERCHANT"

      - name: Prepare public update installers
        run: |
          set -euo pipefail
          mkdir -p dist/public
          cp shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk dist/public/ShishaLove-Customer-Android-1.1.11.apk
          cp shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk dist/public/ShishaLove-Merchant-Android-1.1.11.apk
          sha256sum dist/public/*.apk > dist/public/SHA256SUMS.txt
          cat > dist/public/RELEASE_NOTES.md <<'TXT'
          # ShishaLove Mobile 1.1.11

          This is the canonical **in-place update line** from 1.1.9.

          **Customer 1.1.11**
          - package remains `eu.shishalove.customer`
          - versionCode increased from 119 to 120
          - same permanent signing certificate as canonical 1.1.9
          - Customer launcher artwork remains unchanged
          - wrapper remains a thin container for the canonical `/shishalove-app/` WordPress Bridge

          **Merchant 1.1.11**
          - package remains `eu.shishalove.merchant`
          - versionCode increased from 119 to 120
          - same permanent signing certificate as canonical 1.1.9
          - locked Merchant launcher artwork retained: black background, white ShishaLove mark, red heart, red MERCHANT band
          - Merchant wrapper continues to load the canonical WordPress Bridge

          **Update rule**
          Android should present these APKs as **Update**, not require removing the installed canonical 1.1.9 app. Do not uninstall the existing canonical app as a normal update step. If a device does not offer an update, stop and verify which historical package/signing identity is installed rather than deleting app data.

          Install/activate ShishaLove App Bridge 1.1.11 in WordPress first so the updated Customer and Merchant runtime fixes are live.
          TXT

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-mobile-1.1.11'
          TITLE='ShishaLove Mobile 1.1.11 — In-place Update'
          ASSETS=(dist/public/ShishaLove-Customer-Android-1.1.11.apk dist/public/ShishaLove-Merchant-Android-1.1.11.apk dist/public/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TITLE" --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          fi

      - name: Confirm public asset URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-mobile-1.1.11 --json url,assets
