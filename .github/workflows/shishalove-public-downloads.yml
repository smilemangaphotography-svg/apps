name: ShishaLove Merchant 1.1.26 Adaptive Safe Area Fix

on:
  push:
    branches:
      - shishalove-main
    paths:
      - '.github/workflows/shishalove-public-downloads.yml'
      - 'shishalove-mobile/merchant/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-merchant:
    name: Build and verify Merchant 1.1.26 launcher-only update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate launcher-only source locks
        run: |
          set -euo pipefail
          grep -q "applicationId 'eu.shishalove.merchant'" shishalove-mobile/merchant/build.gradle
          grep -q "versionCode 128" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.26'" shishalove-mobile/merchant/build.gradle
          grep -q 'targetW = 408' shishalove-mobile/merchant/build.gradle
          grep -q 'redPixels < 500' shishalove-mobile/merchant/build.gradle
          grep -q 'Merchant launcher safe-area geometry violated' shishalove-mobile/merchant/build.gradle
          grep -q 'android:width="108dp"' shishalove-mobile/merchant/src/main/res/drawable/ic_shishalove_merchant_foreground.xml
          grep -q 'android:height="108dp"' shishalove-mobile/merchant/src/main/res/drawable/ic_shishalove_merchant_foreground.xml
          grep -q '@drawable/ic_shishalove_merchant_art' shishalove-mobile/merchant/src/main/res/drawable/ic_shishalove_merchant_foreground.xml
          grep -q '@color/sl_icon_black' shishalove-mobile/merchant/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@drawable/ic_shishalove_merchant_foreground' shishalove-mobile/merchant/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'android:width="108dp"' shishalove-mobile/merchant/src/main/res/mipmap-anydpi/ic_launcher.xml
          grep -q 'android:width="108dp"' shishalove-mobile/merchant/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          grep -q 'v.setPadding(bars.left, bars.top, bars.right, 0)' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MerchantActivityV121.java
          grep -q "overflow-y','auto','important" shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MerchantActivityV121.java
          git diff --exit-code shishalove-merchant-1.1.25 -- shishalove-mobile/customer
          git diff --exit-code shishalove-merchant-1.1.25 -- shishalove-app-bridge
          changed="$(git diff --name-only shishalove-merchant-1.1.25 -- shishalove-mobile/merchant | sort)"
          printf '%s\n' "$changed"
          forbidden="$(printf '%s\n' "$changed" | grep -Ev '^(shishalove-mobile/merchant/build.gradle|shishalove-mobile/merchant/src/main/res/drawable/ic_shishalove_merchant_foreground.xml|shishalove-mobile/merchant/src/main/res/mipmap-anydpi/ic_launcher.xml|shishalove-mobile/merchant/src/main/res/mipmap-anydpi/ic_launcher_round.xml)$' || true)"
          test -z "$forbidden"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build canonical and legacy-beta Merchant APKs
        working-directory: shishalove-mobile
        run: gradle :merchant:assembleRelease :merchant:assembleDebug --stacktrace

      - name: Verify APK identity signing and launcher geometry
        run: |
          set -euo pipefail
          RELEASE='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          DEBUG='shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --print-certs "$RELEASE"
          "$APKSIGNER" verify --print-certs "$DEBUG"
          "$AAPT" dump badging "$RELEASE" | grep -q "package: name='eu.shishalove.merchant' versionCode='128' versionName='1.1.26'"
          "$AAPT" dump badging "$DEBUG" | grep -q "package: name='eu.shishalove.merchant.dev' versionCode='128' versionName='1.1.26-dev'"
          test -f shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant_art.png
          test ! -f shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant_legacy.png
          grep -q 'build=129' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'ShishaLoveMerchant/1.1.22' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java

      - name: Prove canonical signing continuity from 1.1.25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/previous
          gh release download shishalove-merchant-1.1.25 --pattern 'ShishaLove-Merchant-Android-1.1.25.apk' --dir dist/previous
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/previous/ShishaLove-Merchant-Android-1.1.25.apk)" = "$(digest shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk)"

      - name: Prove stable legacy-beta signing continuity from 1.1.25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/legacy
          gh release download shishalove-merchant-1.1.25 --pattern 'ShishaLove-Merchant-Android-1.1.25-LEGACY-BETA.apk' --dir dist/legacy
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/legacy/ShishaLove-Merchant-Android-1.1.25-LEGACY-BETA.apk)" = "$(digest shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk)"

      - name: Prepare installers
        run: |
          set -euo pipefail
          mkdir -p dist/public
          cp shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk dist/public/ShishaLove-Merchant-Android-1.1.26.apk
          cp shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk dist/public/ShishaLove-Merchant-Android-1.1.26-LEGACY-BETA.apk
          sha256sum dist/public/*.apk > dist/public/SHA256SUMS.txt
          cat > dist/public/RELEASE_NOTES.md <<'TXT'
          # ShishaLove Merchant 1.1.26 — Adaptive Safe Area Launcher Fix

          Merchant launcher-only update. Customer app, Merchant UI/WebView, Bridge and business logic are unchanged.

          - Keeps Android/Samsung responsible for the final rounded launcher mask.
          - Extracts the complete ShishaLove + red MERCHANT artwork from the locked source.
          - Crops only empty black canvas, then recomposes the complete artwork into a protected adaptive safe area.
          - The red MERCHANT band is explicitly validated before build and kept away from launcher clipping zones.
          - Removes the previous 96/112dp double-scaling approach.
          - No white frame or baked rounded-square image is used.
          - Package IDs, signing identities and WebView build 129 are unchanged.
          TXT

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-merchant-1.1.26'
          ASSETS=(dist/public/ShishaLove-Merchant-Android-1.1.26.apk dist/public/ShishaLove-Merchant-Android-1.1.26-LEGACY-BETA.apk dist/public/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Merchant 1.1.26 — Adaptive Safe Area Launcher Fix' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Merchant 1.1.26 — Adaptive Safe Area Launcher Fix' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          fi

      - name: Confirm public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-merchant-1.1.26 --json url,assets
