name: ShishaLove Public Downloads 1.1.20

on:
  push:
    branches:
      - shishalove-main
    paths:
      - '.github/workflows/shishalove-public-downloads.yml'
      - 'shishalove-mobile/**'
      - 'shishalove-branding/**'
      - 'shishalove-wordpress-bridge/design-lock/SHISHALOVE_FINAL_APPROVED_1_1_19.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android:
    name: Build ShishaLove Android wrapper 1.1.20
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate locked WebView and Android identities
        run: |
          set -euo pipefail
          grep -q "applicationId 'eu.shishalove.customer'" shishalove-mobile/customer/build.gradle
          grep -q "applicationId 'eu.shishalove.merchant'" shishalove-mobile/merchant/build.gradle
          grep -q "versionCode 122" shishalove-mobile/customer/build.gradle
          grep -q "versionName '1.1.20'" shishalove-mobile/customer/build.gradle
          grep -q "versionCode 122" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.20'" shishalove-mobile/merchant/build.gradle
          grep -q "build=129" shishalove-mobile/customer/build.gradle
          grep -q "build=129" shishalove-mobile/merchant/build.gradle
          grep -q "ShishaLoveCustomer/1.1.20" shishalove-mobile/customer/build.gradle
          grep -q "ShishaLoveMerchant/1.1.20" shishalove-mobile/merchant/build.gradle
          grep -q "bars.top + dp(6)" shishalove-mobile/customer/build.gradle
          grep -q "bars.bottom - dp(28)" shishalove-mobile/customer/build.gradle
          grep -q "merchant-icon.b64.part" shishalove-mobile/merchant/build.gradle
          grep -q 'Status: APPROVED / FROZEN' shishalove-wordpress-bridge/design-lock/SHISHALOVE_FINAL_APPROVED_1_1_19.md
          # The Merchant launcher artwork must remain the exact approved red-band source.
          git diff --exit-code bd70d49208100a82700ce7fc104ab514f5b6ce63 -- shishalove-branding/merchant-icon.b64.part00 shishalove-branding/merchant-icon.b64.part01 shishalove-branding/merchant-icon.b64.part02 shishalove-branding/merchant-icon.b64.part03

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build canonical Android apps
        working-directory: shishalove-mobile
        run: gradle :customer:assembleRelease :merchant:assembleRelease --stacktrace

      - name: Verify APK identities, runtime, safe areas and Merchant icon
        run: |
          set -euo pipefail
          CUSTOMER='shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk'
          MERCHANT='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --print-certs "$CUSTOMER"
          "$APKSIGNER" verify --print-certs "$MERCHANT"
          "$AAPT" dump badging "$CUSTOMER" | grep -q "package: name='eu.shishalove.customer' versionCode='122' versionName='1.1.20'"
          "$AAPT" dump badging "$MERCHANT" | grep -q "package: name='eu.shishalove.merchant' versionCode='122' versionName='1.1.20'"
          grep -q 'build=129' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'build=129' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'ShishaLoveCustomer/1.1.20' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'ShishaLoveMerchant/1.1.20' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'bars.top + dp(6)' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q 'bars.bottom - dp(28)' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java
          grep -q '@drawable/ic_shishalove_merchant' shishalove-mobile/merchant/src/main/res/mipmap-anydpi/ic_launcher.xml
          python3 - <<'PY'
          import base64, pathlib, struct
          parts = sorted(pathlib.Path('shishalove-branding').glob('merchant-icon.b64.part*'))
          source = base64.b64decode(''.join(p.read_text().strip() for p in parts))
          generated = pathlib.Path('shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant.png').read_bytes()
          assert source[:8] == b'\x89PNG\r\n\x1a\n'
          assert source[12:16] == b'IHDR'
          assert struct.unpack('>II', source[16:24]) == (512, 512)
          assert generated == source
          print('Approved 512x512 Merchant red-band launcher source materialized exactly')
          PY

      - name: Prove canonical update compatibility from 1.1.19
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/previous
          gh release download shishalove-mobile-1.1.19 \
            --pattern 'ShishaLove-Customer-Android-1.1.19.apk' \
            --pattern 'ShishaLove-Merchant-Android-1.1.19.apk' \
            --dir dist/previous
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/previous/ShishaLove-Customer-Android-1.1.19.apk)" = "$(digest shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk)"
          test "$(digest dist/previous/ShishaLove-Merchant-Android-1.1.19.apk)" = "$(digest shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk)"

      - name: Prepare canonical installers
        run: |
          set -euo pipefail
          mkdir -p dist/public
          cp shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk dist/public/ShishaLove-Customer-Android-1.1.20.apk
          cp shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk dist/public/ShishaLove-Merchant-Android-1.1.20.apk
          sha256sum dist/public/*.apk > dist/public/SHA256SUMS.txt
          cat > dist/public/RELEASE_NOTES.md <<'TXT'
          # ShishaLove Mobile 1.1.20 — Android Wrapper Correction

          The approved WordPress Bridge/WebView remains frozen at 1.1.19 / build 129.

          Customer Android wrapper only:
          - moves the WebView slightly below the Android top safe area
          - reduces the oversized bottom inset/empty band
          - no approved Customer WebView functionality or layout is changed

          Merchant Android wrapper only:
          - keeps the approved WebView build 129 unchanged
          - launcher artwork is the exact approved black/white/red Merchant source with the red MERCHANT band

          Canonical packages remain `eu.shishalove.customer` and `eu.shishalove.merchant`, versionCode 122, versionName 1.1.20.
          TXT

      - name: Publish canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-mobile-1.1.20'
          ASSETS=(dist/public/ShishaLove-Customer-Android-1.1.20.apk dist/public/ShishaLove-Merchant-Android-1.1.20.apk dist/public/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Mobile 1.1.20 — Android Wrapper Correction' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Mobile 1.1.20 — Android Wrapper Correction' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          fi

      - name: Confirm public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-mobile-1.1.20 --json url,assets
