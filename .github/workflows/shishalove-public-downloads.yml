name: ShishaLove Merchant 1.1.21 Permanent Android Fix

on:
  push:
    branches:
      - shishalove-main
    paths:
      - '.github/workflows/shishalove-public-downloads.yml'
      - 'shishalove-mobile/merchant/**'
      - 'shishalove-branding/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-merchant:
    name: Build and verify Merchant 1.1.21 permanent wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate permanent source locks
        run: |
          set -euo pipefail
          grep -q "applicationId 'eu.shishalove.merchant'" shishalove-mobile/merchant/build.gradle
          grep -q "versionCode 123" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.21'" shishalove-mobile/merchant/build.gradle
          grep -q 'android:name=".MerchantActivityV121"' shishalove-mobile/merchant/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/ic_shishalove_merchant"' shishalove-mobile/merchant/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@drawable/ic_shishalove_merchant"' shishalove-mobile/merchant/src/main/AndroidManifest.xml
          grep -q 'v.setPadding(bars.left, bars.top, bars.right, 0)' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MerchantActivityV121.java
          grep -q "nav.style.setProperty('bottom',inset,'important')" shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MerchantActivityV121.java
          grep -q "overflow-y','auto','important" shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MerchantActivityV121.java
          grep -q "merchant-icon.b64.part" shishalove-mobile/merchant/build.gradle
          git diff --exit-code bd70d49208100a82700ce7fc104ab514f5b6ce63 -- \
            shishalove-branding/merchant-icon.b64.part00 \
            shishalove-branding/merchant-icon.b64.part01 \
            shishalove-branding/merchant-icon.b64.part02 \
            shishalove-branding/merchant-icon.b64.part03

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build canonical and legacy-beta Merchant APKs
        working-directory: shishalove-mobile
        run: gradle :merchant:assembleRelease :merchant:assembleDebug --stacktrace

      - name: Verify APK package, version, signing, icon and permanent fixes
        run: |
          set -euo pipefail
          RELEASE='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          DEBUG='shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --print-certs "$RELEASE"
          "$APKSIGNER" verify --print-certs "$DEBUG"
          "$AAPT" dump badging "$RELEASE" | grep -q "package: name='eu.shishalove.merchant' versionCode='123' versionName='1.1.21'"
          "$AAPT" dump badging "$DEBUG" | grep -q "package: name='eu.shishalove.merchant.dev' versionCode='123' versionName='1.1.21-dev'"
          "$AAPT" dump xmltree "$RELEASE" AndroidManifest.xml | grep -q 'MerchantActivityV121'
          grep -q 'ShishaLoveMerchant/1.1.21' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'build=129' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          python3 - <<'PY'
          import base64, pathlib, struct
          parts = sorted(pathlib.Path('shishalove-branding').glob('merchant-icon.b64.part*'))
          source = base64.b64decode(''.join(p.read_text().strip() for p in parts))
          generated = pathlib.Path('shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant.png').read_bytes()
          assert source[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', source[16:24]) == (512, 512)
          assert generated == source
          print('PASS: exact approved red-band Merchant icon is packaged directly')
          PY

      - name: Prove canonical signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/previous
          gh release download shishalove-mobile-1.1.20 \
            --pattern 'ShishaLove-Merchant-Android-1.1.20.apk' \
            --dir dist/previous
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/previous/ShishaLove-Merchant-Android-1.1.20.apk)" = "$(digest shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk)"

      - name: Prove stable legacy-beta signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/legacy
          gh release download shishalove-mobile-1.1.19-legacy-beta-update \
            --pattern 'ShishaLove-Merchant-Android-1.1.19-UPDATE-1.1.8-BETA.apk' \
            --dir dist/legacy
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/legacy/ShishaLove-Merchant-Android-1.1.19-UPDATE-1.1.8-BETA.apk)" = "$(digest shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk)"

      - name: Prepare installers
        run: |
          set -euo pipefail
          mkdir -p dist/public
          cp shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk \
             dist/public/ShishaLove-Merchant-Android-1.1.21.apk
          cp shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk \
             dist/public/ShishaLove-Merchant-Android-1.1.21-LEGACY-BETA.apk
          sha256sum dist/public/*.apk > dist/public/SHA256SUMS.txt
          cat > dist/public/RELEASE_NOTES.md <<'TXT'
          # ShishaLove Merchant 1.1.21 — Permanent Android Fix

          The WordPress Merchant UI/business logic remains unchanged.

          Permanent native fixes:
          - removes bottom system-bar padding from the whole WebView
          - positions the Merchant bottom navigation using the real Android bottom inset
          - forces reliable vertical touch scrolling for Orders / Products / Stock
          - keeps the top Android status-bar safe area
          - uses the exact approved red-band Merchant PNG directly as both launcher icons
          - keeps WebView build 129

          Two signed update lines are published:
          - canonical: eu.shishalove.merchant
          - stable legacy beta: eu.shishalove.merchant.dev
          TXT

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-merchant-1.1.21'
          ASSETS=(dist/public/ShishaLove-Merchant-Android-1.1.21.apk dist/public/ShishaLove-Merchant-Android-1.1.21-LEGACY-BETA.apk dist/public/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Merchant 1.1.21 — Permanent Android Fix' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Merchant 1.1.21 — Permanent Android Fix' --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          fi

      - name: Confirm public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-merchant-1.1.21 --json url,assets
