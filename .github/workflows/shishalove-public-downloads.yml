name: ShishaLove Public Downloads 1.1.9

on:
  push:
    branches:
      - shishalove-main
    paths:
      - '.github/workflows/shishalove-public-downloads.yml'
      - 'shishalove-mobile/**'
      - 'shishalove-branding/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android:
    name: Build and publish canonical Android installers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate locked mobile versions
        run: |
          set -euo pipefail
          grep -q "applicationId 'eu.shishalove.customer'" shishalove-mobile/customer/build.gradle
          grep -q "applicationId 'eu.shishalove.merchant'" shishalove-mobile/merchant/build.gradle
          grep -q "versionCode 119" shishalove-mobile/customer/build.gradle
          grep -q "versionName '1.1.9'" shishalove-mobile/customer/build.gradle
          grep -q "versionCode 119" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.9'" shishalove-mobile/merchant/build.gradle
          grep -q "signingConfig signingConfigs.beta" shishalove-mobile/customer/build.gradle
          grep -q "signingConfig signingConfigs.beta" shishalove-mobile/merchant/build.gradle
          grep -q "merchant-icon.b64.part" shishalove-mobile/merchant/build.gradle
          grep -q "red MERCHANT band" shishalove-mobile/merchant/build.gradle
          grep -q 'POST_NOTIFICATIONS' shishalove-mobile/merchant/src/main/AndroidManifest.xml
          grep -q 'notifyOrder' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java
          grep -q 'isCanonicalBridge' shishalove-mobile/customer/src/main/java/eu/shishalove/customer/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build stable-signed canonical Android apps
        working-directory: shishalove-mobile
        run: gradle :customer:assembleRelease :merchant:assembleRelease --stacktrace

      - name: Verify canonical APK identities
        run: |
          set -euo pipefail
          CUSTOMER='shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk'
          MERCHANT='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --print-certs "$CUSTOMER"
          "$APKSIGNER" verify --print-certs "$MERCHANT"
          "$AAPT" dump badging "$CUSTOMER" | grep -q "package: name='eu.shishalove.customer' versionCode='119' versionName='1.1.9'"
          "$AAPT" dump badging "$MERCHANT" | grep -q "package: name='eu.shishalove.merchant' versionCode='119' versionName='1.1.9'"
          python3 - <<'PY'
          import base64, pathlib, struct
          parts = sorted(pathlib.Path('shishalove-branding').glob('merchant-icon.b64.part*'))
          assert parts, 'missing Merchant branding parts'
          source = base64.b64decode(''.join(p.read_text().strip() for p in parts))
          generated = pathlib.Path('shishalove-mobile/merchant/src/main/res/drawable-nodpi/ic_shishalove_merchant.png').read_bytes()
          def dims(data):
              assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not PNG'
              assert data[12:16] == b'IHDR', 'missing IHDR'
              return struct.unpack('>II', data[16:24])
          assert dims(source) == (512, 512)
          assert generated == source
          print('Merchant locked red-band launcher verified at 512x512')
          PY

      - name: Prepare public installers
        run: |
          set -euo pipefail
          mkdir -p dist/public
          cp shishalove-mobile/customer/build/outputs/apk/release/customer-release.apk dist/public/ShishaLove-Customer-Android-1.1.9.apk
          cp shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk dist/public/ShishaLove-Merchant-Android-1.1.9.apk
          sha256sum dist/public/*.apk > dist/public/SHA256SUMS.txt
          cat > dist/public/RELEASE_NOTES.md <<'TXT'
          # ShishaLove Mobile 1.1.9

          **Customer 1.1.9**
          - canonical `/shishalove-app/` bridge is protected inside MainActivity itself
          - legacy website DOM scripts are never injected into the canonical customer page
          - repeated progress-event JavaScript injection removed
          - scrolling, age-gate duplication and slow refresh regression hardened
          - canonical bridge keeps official WordPress logo and numeric price sorting

          **Merchant 1.1.9**
          - exact locked Merchant launcher artwork from `shishalove-branding/merchant-icon.b64.part*`: black background, white ShishaLove mark, red heart and red MERCHANT band
          - canonical package is `eu.shishalove.merchant` (no `.dev` suffix)
          - release APK is signed with the stable ShishaLove signing identity
          - versionCode 119 establishes the permanent forward update line

          The Customer launcher icon is intentionally unchanged.

          If an old Merchant beta was installed from an earlier ephemeral/debug-signed build, Android cannot cryptographically update that old package. If Android reports a signature conflict, uninstall the old Merchant app once and install 1.1.9. From this canonical line onward, future builds retain the same package/signing identity.
          TXT

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-mobile-1.1.9'
          TITLE='ShishaLove Mobile 1.1.9'
          ASSETS=(dist/public/ShishaLove-Customer-Android-1.1.9.apk dist/public/ShishaLove-Merchant-Android-1.1.9.apk dist/public/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/public/RELEASE_NOTES.md
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TITLE" --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          fi

      - name: Confirm public asset URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-mobile-1.1.9 --json url,assets
