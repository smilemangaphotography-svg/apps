name: ShishaLove Public Downloads 1.1.8

on:
  push:
    branches:
      - shishalove-main
    paths:
      - '.github/workflows/shishalove-public-downloads.yml'
      - 'shishalove-mobile/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-android:
    name: Build and publish public Android beta installers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate locked mobile versions
        run: |
          set -euo pipefail
          grep -q "versionCode 118" shishalove-mobile/customer/build.gradle
          grep -q "versionName '1.1.8'" shishalove-mobile/customer/build.gradle
          grep -q "versionCode 118" shishalove-mobile/merchant/build.gradle
          grep -q "versionName '1.1.8'" shishalove-mobile/merchant/build.gradle
          grep -q "merchant_launcher_approved.b64" shishalove-mobile/merchant/build.gradle
          grep -q "shishalove-beta-keystore.b64" shishalove-mobile/customer/build.gradle
          grep -q "shishalove-beta-keystore.b64" shishalove-mobile/merchant/build.gradle
          grep -q 'POST_NOTIFICATIONS' shishalove-mobile/merchant/src/main/AndroidManifest.xml
          grep -q 'notifyOrder' shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build stable-signed beta Android apps
        working-directory: shishalove-mobile
        run: gradle :customer:assembleDebug :merchant:assembleDebug --stacktrace

      - name: Prepare public installers
        run: |
          set -euo pipefail
          mkdir -p dist/public
          cp shishalove-mobile/customer/build/outputs/apk/debug/customer-debug.apk dist/public/ShishaLove-Customer-Android-1.1.8.apk
          cp shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk dist/public/ShishaLove-Merchant-Android-1.1.8.apk
          sha256sum dist/public/*.apk > dist/public/SHA256SUMS.txt
          cat > dist/public/RELEASE_NOTES.md <<'TXT'
          # ShishaLove Mobile 1.1.8 Beta

          **Customer 1.1.8**
          - canonical bridge-native navigation; legacy website patching is disabled on the app route
          - scrolling/age-gate/refresh regression fixes
          - official WordPress logo lock
          - real numeric low/high price ordering
          - 1:1 product details, category shortcuts and pagination retained

          **Merchant 1.1.8**
          - exact approved black/red Merchant launcher artwork
          - order notification runtime retained
          - stable beta signing identity for future in-place beta updates

          Important one-time Android note: APKs from older GitHub Actions builds used ephemeral debug signing. If Android says “App not installed” while updating an older beta, uninstall that older beta once, then install 1.1.8. Builds after 1.1.8 use the stable beta signing identity and can update in place.
          TXT

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-mobile-1.1.8-beta'
          TITLE='ShishaLove Mobile 1.1.8 Beta'
          ASSETS=(dist/public/ShishaLove-Customer-Android-1.1.8.apk dist/public/ShishaLove-Merchant-Android-1.1.8.apk dist/public/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/public/RELEASE_NOTES.md
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TITLE" --notes-file dist/public/RELEASE_NOTES.md --target shishalove-main
          fi

      - name: Confirm public asset URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-mobile-1.1.8-beta --json url,assets
