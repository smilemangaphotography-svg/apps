name: ShishaLove Staging Validation

on:
  push:
    branches: [shishalove-staging]
    paths:
      - 'shishalove-staging/**'
      - 'shishalove-staging-loader/**'
      - '.github/workflows/shishalove-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Validate staging Customer fix
        run: |
          set -euo pipefail
          php -l shishalove-staging-loader/shishalove-staging-loader.php
          node --check shishalove-staging/customer-staging.js
          grep -Fq '/shishalove-app-beta/' shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq 'raw.githubusercontent.com/smilemangaphotography-svg/apps/shishalove-staging' shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq 'slb-staging-front' shishalove-staging/customer-staging.js
          grep -Fq 'slb-staging-front-visual' shishalove-staging/customer-staging.css

      - name: Validate staging Merchant master fix
        run: |
          set -euo pipefail
          rm -rf merchant-stage-package
          mkdir -p merchant-stage-package
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge merchant-stage-package/shishalove-app-bridge
          python3 shishalove-staging/patch-shishalove-merchant-masterfix-staging.py merchant-stage-package/shishalove-app-bridge

          M='merchant-stage-package/shishalove-app-bridge/assets/merchant.js'
          P='merchant-stage-package/shishalove-app-bridge/shishalove-app-bridge.php'
          node --check "$M"
          php -l "$P"

          grep -Fq "CFG.version='staging-merchant-sync-search-1'" "$M"
          grep -Fq 's.oninput=function()' "$M"
          grep -Fq '},220);' "$M"
          grep -Fq "merchant/orders?page=1&per_page=20&_slm_fresh=" "$M"
          grep -Fq 'window.SLM_CHECK_ORDERS=function(){loadOrders(true,true);};' "$M"
          grep -Fq 'window.__SLM_ORDER_WATCH_INSTALLED=true;' "$M"
          grep -Fq 'ShishaLoveNative.notifyOrder' "$M"
          grep -Fq 'p.post_title LIKE %s OR pm.meta_value LIKE %s' "$P"
          grep -Fq 't.name LIKE %s' "$P"
          grep -Fq 'Cloudflare-CDN-Cache-Control' "$P"
          grep -Fq 'merchantReturnScroll' "$M"
          grep -Fq 'Filter · All' "$M"

      - name: Materialize exact Merchant beta script
        run: |
          set -euo pipefail
          M='merchant-stage-package/shishalove-app-bridge/assets/merchant.js'
          cp "$M" shishalove-staging/merchant-generated.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('shishalove-staging/merchant-generated.js')
          t=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global t
              n=t.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {n}')
              t=t.replace(old,new,1)

          once(
              "var CFG=window.SHISHALOVE_BRIDGE||{};\nCFG.version='staging-merchant-sync-search-1';",
              "var CFG=window.SHISHALOVE_BRIDGE||{};\nCFG.version='staging-merchant-sync-search-3';\nvar MERCHANT_CANONICAL_REST=location.origin+'/wp-json/shishalove/v1/';\nvar MERCHANT_STAGING_REST=location.origin+'/wp-json/shishalove-staging/v1/';",
              'beta rest roots'
          )
          once("var DATA_CACHE='stable-v1';","var DATA_CACHE='staging-beta-v3';",'beta cache')

          old_api="function api(path,opts){opts=opts||{};var h=opts.headers||{};if(CFG.restNonce)h['X-WP-Nonce']=CFG.restNonce;if(opts.body&&!h['Content-Type'])h['Content-Type']='application/json';opts.headers=h;opts.credentials='same-origin';if(!opts.method||String(opts.method).toUpperCase()==='GET')opts.cache='no-store';return fetch(CFG.rest+path,opts).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}"
          new_api="function api(path,opts){opts=opts||{};var h=opts.headers||{};if(CFG.restNonce)h['X-WP-Nonce']=CFG.restNonce;if(opts.body&&!h['Content-Type'])h['Content-Type']='application/json';opts.headers=h;opts.credentials='same-origin';if(!opts.method||String(opts.method).toUpperCase()==='GET')opts.cache='no-store';var base=/^merchant\\/(?:products|orders)(?:\\?|$)/.test(path)?MERCHANT_STAGING_REST:MERCHANT_CANONICAL_REST;return fetch(base+path,opts).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}"
          once(old_api,new_api,'split staging/canonical api')

          # Dashboard failed because the stats variables were referenced without
          # ever being declared in the generated 1.1.43 Merchant runtime.
          once(
              "function loadDashboardStats(force){",
              "var dashboardStats=null,dashboardStatsLoading=false;\nfunction loadDashboardStats(force){",
              'dashboard state'
          )

          # Stock management is an owner rule: it is always on and cannot be
          # accidentally disabled from the phone editor.
          once(
              "var p=state.editor,creating=!p.id,busy=!!p._mediaBusy,manage=!!p.manage_stock;",
              "var p=state.editor,creating=!p.id,busy=!!p._mediaBusy,manage=true;",
              'stock management render'
          )
          t=t.replace("manage_stock:false,stock_quantity:''","manage_stock:true,stock_quantity:''")
          once(
              "var ms=document.getElementById('slm-manage-stock'),manage=!!(ms&&ms.checked);",
              "var ms=document.getElementById('slm-manage-stock'),manage=true;if(ms)ms.checked=true;",
              'stock management save'
          )
          once(
              "var ms=document.getElementById('slm-manage-stock');if(ms)ms.onchange=function(){var q=document.getElementById('slm-stock-qty-wrap');if(q)q.style.display=this.checked?'block':'none';};",
              "var ms=document.getElementById('slm-manage-stock');if(ms){ms.checked=true;ms.onchange=function(){this.checked=true;var q=document.getElementById('slm-stock-qty-wrap');if(q)q.style.display='block';};}",
              'stock management lock'
          )

          # Beta-only notification diagnostic. This does not create an order or
          # touch production data; it only proves the Android native bridge can
          # post a notification before we test a real WooCommerce order.
          once(
              "function moreBody(){var u=state.bootstrap&&state.bootstrap.user||{};return '<main class=\"slm-page\"><div class=\"slm-head\"><div><h1>More</h1><div class=\"slm-muted\">Signed in as '+esc(u.name||'WordPress user')+'</div></div></div><div class=\"slb-account-card\">Bridge 1.1.43</div><button class=\"slb-account-card slm-account-button\" data-view=\"media-library\">Media Library</button><a class=\"slb-account-card\" href=\"'+esc(CFG.site)+'wp-admin/\">Open WordPress Admin</a><a class=\"slb-account-card\" href=\"'+esc(CFG.site)+'wp-admin/admin.php?page=wc-admin\">WooCommerce Admin</a></main>';}",
              "function moreBody(){var u=state.bootstrap&&state.bootstrap.user||{},nativeOk=!!(window.ShishaLoveNative&&typeof window.ShishaLoveNative.notifyOrder==='function');return '<main class=\"slm-page\"><div class=\"slm-head\"><div><h1>More</h1><div class=\"slm-muted\">Signed in as '+esc(u.name||'WordPress user')+'</div></div></div><div class=\"slb-account-card\">Bridge 1.1.43</div><div class=\"slb-account-card\"><strong>Order notifications</strong><div class=\"slm-muted\" style=\"margin-top:6px\">'+(nativeOk?'Android notification bridge detected':'Browser preview only — open Merchant Beta app for phone notifications')+'</div></div><button class=\"slb-account-card slm-account-button\" data-act=\"test-native-notification\">TEST PHONE NOTIFICATION</button><button class=\"slb-account-card slm-account-button\" data-view=\"media-library\">Media Library</button><a class=\"slb-account-card\" href=\"'+esc(CFG.site)+'wp-admin/\">Open WordPress Admin</a><a class=\"slb-account-card\" href=\"'+esc(CFG.site)+'wp-admin/admin.php?page=wc-admin\">WooCommerce Admin</a></main>';}",
              'notification diagnostic card'
          )
          once(
              "root.querySelectorAll('[data-act=\"refresh\"]').forEach(function(e){e.onclick=refresh;});",
              "root.querySelectorAll('[data-act=\"refresh\"]').forEach(function(e){e.onclick=refresh;});root.querySelectorAll('[data-act=\"test-native-notification\"]').forEach(function(e){e.onclick=function(){if(window.ShishaLoveNative&&typeof window.ShishaLoveNative.notifyOrder==='function'){window.ShishaLoveNative.notifyOrder('TEST','Merchant notification test','€0.00');}else{alert('Open this preview inside the ShishaLove Merchant Beta app to test Android notifications.');}};});",
              'notification diagnostic binding'
          )

          # Product list thumbnails: request the small WP thumbnail first, with
          # the original image as an automatic fallback. This reduces list paint
          # time without altering stored product artwork.
          image_helper="function fastProductImage(src){src=String(src||'');return src.replace(/-\\d+x\\d+(\\.[a-z0-9]+)(\\?.*)?$/i,'-150x150$1$2');}\n"
          once("function productRows(items){",image_helper+"function productRows(items){",'image helper')
          once(
              """<img src="'+esc(p.image)+'" alt="">""",
              """<img src="'+esc(fastProductImage(p.image))+'" data-fallback="'+esc(p.image)+'" loading="eager" decoding="async" fetchpriority="high" onerror="this.onerror=null;this.src=this.dataset.fallback" alt="">""",
              'fast product thumbnail'
          )

          p.write_text(t,encoding='utf-8')
          PY
          node --check shishalove-staging/merchant-generated.js
          grep -Fq "CFG.version='staging-merchant-sync-search-3'" shishalove-staging/merchant-generated.js
          grep -Fq "MERCHANT_CANONICAL_REST" shishalove-staging/merchant-generated.js
          grep -Fq "MERCHANT_STAGING_REST" shishalove-staging/merchant-generated.js
          grep -Fq "var DATA_CACHE='staging-beta-v3';" shishalove-staging/merchant-generated.js
          grep -Fq "var dashboardStats=null,dashboardStatsLoading=false;" shishalove-staging/merchant-generated.js
          grep -Fq "Version: 1.3.0" shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq "/merchant/device-register" shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq "/merchant/order-pulse" shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq "x-shishalove-device" shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq "slsl_merchant_order_devices_v1" shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq "var p=state.editor,creating=!p.id,busy=!!p._mediaBusy,manage=true;" shishalove-staging/merchant-generated.js
          grep -Fq "manage=true;if(ms)ms.checked=true" shishalove-staging/merchant-generated.js
          grep -Fq "fastProductImage" shishalove-staging/merchant-generated.js
          grep -Fq "TEST PHONE NOTIFICATION" shishalove-staging/merchant-generated.js
          grep -Fq "test-native-notification" shishalove-staging/merchant-generated.js
          grep -Fq 's.oninput=function()' shishalove-staging/merchant-generated.js
          grep -Fq 'window.SLM_CHECK_ORDERS=function(){loadOrders(true,true);};' shishalove-staging/merchant-generated.js

      - name: Validate exact Merchant WebView beta
        run: |
          set -euo pipefail
          php -l shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq '/shishalove-merchant-beta/' shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq "rest_url('shishalove/v1/')" shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq "merchant-generated.js" shishalove-staging-loader/shishalove-staging-loader.php
          ! grep -Fq "slsl_remote_asset_url('merchant-css')" shishalove-staging-loader/shishalove-staging-loader.php
          grep -Fq "MERCHANT_CANONICAL_REST" shishalove-staging/merchant-generated.js
          grep -Fq "MERCHANT_STAGING_REST" shishalove-staging/merchant-generated.js
          grep -Fq "var DATA_CACHE='staging-beta-v3';" shishalove-staging/merchant-generated.js
          grep -Fq "var dashboardStats=null,dashboardStatsLoading=false;" shishalove-staging/merchant-generated.js

      - name: Save exact Merchant beta script to staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shishalove-staging/merchant-generated.js
          if git diff --cached --quiet; then
            echo 'Merchant beta script already current.'
          else
            git commit -m 'Refresh exact Merchant functional beta script'
            git push origin HEAD:shishalove-staging
          fi

      - name: Package staging loader 1.3.0
        run: |
          rm -rf dist && mkdir -p dist/shishalove-staging-loader
          cp shishalove-staging-loader/shishalove-staging-loader.php dist/shishalove-staging-loader/
          cd dist && zip -qr shishalove-staging-loader-1.3.0.zip shishalove-staging-loader

      - uses: actions/upload-artifact@v4
        with:
          name: shishalove-staging-loader-1.3.0
          path: dist/shishalove-staging-loader-1.3.0.zip
          if-no-files-found: error

      - name: Publish staging loader 1.3.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-staging-loader-1.3.0'
          ASSET='dist/shishalove-staging-loader-1.3.0.zip'
          NOTES='Staging only. Adds authenticated Merchant device registration and a token-protected order-pulse endpoint for native background order notifications, while preserving the exact Merchant beta UI and existing staging behavior. Production Customer, Merchant and live Bridge remain unchanged.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title 'ShishaLove Staging Loader 1.3.0 — Background Order Notifications' --notes "$NOTES" --target shishalove-staging
          else
            gh release create "$TAG" "$ASSET" --title 'ShishaLove Staging Loader 1.3.0 — Background Order Notifications' --notes "$NOTES" --target shishalove-staging
          fi
