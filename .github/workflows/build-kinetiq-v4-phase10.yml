name: Build KINETIQ V4 Phase 10 A54 Candidate

on:
  workflow_dispatch:
  push:
    branches: [ kinetiq-v4-goal-engine-beta ]
    paths:
      - 'personal-trainer/android-beta/**'
      - 'personal-trainer/validation/**'
      - '.github/workflows/build-kinetiq-v4-phase10.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_BETA_CERT_SHA256: 7f557546ddba96bdf8ec36b447d4acd7c62861cc074bc10a1b46ea9c96634487
    steps:
      - name: Checkout V4 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm authoritative branch and Phase 9.2 ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "kinetiq-v4-goal-engine-beta"
          git merge-base --is-ancestor 643740c5c3177111bef9b1dc66ae458ff882fcde HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install Android SDK packages and ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Reconstruct persistent KINETIQ beta signing keystore
        shell: bash
        env:
          KINETIQ_BETA_KEYSTORE_B64: ${{ secrets.KINETIQ_BETA_KEYSTORE_B64 }}
          KINETIQ_BETA_STORE_PASSWORD: ${{ secrets.KINETIQ_BETA_STORE_PASSWORD }}
          KINETIQ_BETA_KEY_ALIAS: ${{ secrets.KINETIQ_BETA_KEY_ALIAS }}
          KINETIQ_BETA_KEY_PASSWORD: ${{ secrets.KINETIQ_BETA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KINETIQ_BETA_KEYSTORE_B64:?Missing KINETIQ_BETA_KEYSTORE_B64}"
          : "${KINETIQ_BETA_STORE_PASSWORD:?Missing KINETIQ_BETA_STORE_PASSWORD}"
          : "${KINETIQ_BETA_KEY_ALIAS:?Missing KINETIQ_BETA_KEY_ALIAS}"
          : "${KINETIQ_BETA_KEY_PASSWORD:?Missing KINETIQ_BETA_KEY_PASSWORD}"
          KEYSTORE_B64="${KINETIQ_BETA_KEYSTORE_B64#KINETIQ_BETA_KEYSTORE_B64=}"
          STORE_PASSWORD="${KINETIQ_BETA_STORE_PASSWORD#KINETIQ_BETA_STORE_PASSWORD=}"
          KEY_ALIAS="${KINETIQ_BETA_KEY_ALIAS#KINETIQ_BETA_KEY_ALIAS=}"
          KEY_PASSWORD="${KINETIQ_BETA_KEY_PASSWORD#KINETIQ_BETA_KEY_PASSWORD=}"
          KEYSTORE_B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          printf '::add-mask::%s\n' "$STORE_PASSWORD"
          printf '::add-mask::%s\n' "$KEY_ALIAS"
          printf '::add-mask::%s\n' "$KEY_PASSWORD"
          SIGNING_DIR="$RUNNER_TEMP/kinetiq-v4-signing"
          KEYSTORE="$SIGNING_DIR/kinetiq-v4-system-beta.jks"
          install -d -m 700 "$SIGNING_DIR"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED_BETA_CERT_SHA256"
          {
            echo "KINETIQ_BETA_KEYSTORE_PATH=$KEYSTORE"
            echo "KINETIQ_BETA_STORE_PASSWORD=$STORE_PASSWORD"
            echo "KINETIQ_BETA_KEY_ALIAS=$KEY_ALIAS"
            echo "KINETIQ_BETA_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Import proven anatomy motion library
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          mkdir -p "$A/media/adaptive" /tmp/kinetiq-v4-anatomy
          git fetch --depth=1 origin rebuild/ilias-coach-v2
          git show FETCH_HEAD:ILIA-SAFE-SOURCE.bin > /tmp/kinetiq-v4-anatomy/source.zip
          unzip -q /tmp/kinetiq-v4-anatomy/source.zip -d /tmp/kinetiq-v4-anatomy/source
          SRC=/tmp/kinetiq-v4-anatomy/source/Ilias-Coach/app/src/main/assets/media/anatomy
          test -d "$SRC"
          cp -a "$SRC"/. "$A/media/adaptive/"
          test -s "$A/media/adaptive/leg-press.mp4"
          test -s "$A/media/adaptive/push-up.mp4"

      - name: Syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          find "$A/v4" -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check personal-trainer/validation/phase9-recovery-progress-validation.js
          node --check "$A/style2-v7.js"
          node --check "$A/kinetiq-system-ui.js"

      - name: Deterministic Phase 0-9 regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='personal-trainer/android-beta/app/src/main/assets/';
          const validation=require('./personal-trainer/validation/phase9-recovery-progress-validation.js');
          const files={
            core:fs.readFileSync(p+'v4/phase9-recovery-progress.js','utf8'),
            ui:fs.readFileSync(p+'v4/ui/v4-recovery-progress.js','utf8'),
            shell:fs.readFileSync(p+'v4/ui/v4-shell.js','utf8'),
            css:fs.readFileSync(p+'v4/ui/v4-shell.css','utf8'),
            system:fs.readFileSync(p+'system.html','utf8'),
            phase0:fs.readFileSync(p+'v4/phase0-foundation.js','utf8'),
            phase5:fs.readFileSync(p+'v4/phase5-safety.js','utf8'),
            phase8:fs.readFileSync(p+'v4/phase8-devices.js','utf8'),
            changedPaths:[]
          };
          const result=validation.validatePhase9(files);
          if(!result?.ok) throw new Error('Phase 9 validation did not pass');
          const system=files.system;
          if(system.includes('\\n<script src="v4/')) throw new Error('Literal loader newline defect present');
          const scripts=[...system.matchAll(/<script\s+src=["']([^"']+)["'][^>]*><\/script>/gi)].map(m=>m[1]);
          const v4=scripts.filter(x=>x.startsWith('v4/'));
          if(v4.at(-1)!=='v4/ui/v4-shell.js') throw new Error('V4 shell is not last');
          const required=[
            'v4/phase0-foundation.js','v4/phase1-profile-foundation.js','v4/phase2a-goal-plan-today.js',
            'v4/ui/v4-today.js','v4/ui/v4-journey.js','v4/phase4a-coach-intent.js',
            'v4/phase4b-coach-apply.js','v4/phase5-safety.js','v4/phase6-exercise-library.js',
            'v4/phase6-smart-import.js','v4/phase7-run.js','v4/phase8-devices.js',
            'v4/phase9-recovery-progress.js','v4/ui/v4-recovery-progress.js','v4/ui/v4-shell.js'
          ];
          for(const x of required) if(!scripts.includes(x)) throw new Error('Missing loader '+x);
          const nav=files.shell.includes("const NAV=Object.freeze(['TODAY','JOURNEY','COACH','RUN','MORE']);");
          if(!nav) throw new Error('Primary nav contract changed');
          console.log('KINETIQ V4 Phase 0-9 deterministic regression PASS');
          NODE

      - name: Migration and startup static acceptance
        shell: bash
        run: |
          set -euo pipefail
          A=personal-trainer/android-beta/app/src/main/assets
          grep -q "LEGACY_KEY" "$A/v4/phase0-foundation.js"
          grep -q "class V3MigrationAdapter" "$A/v4/phase0-foundation.js"
          grep -q "LAST_ACTIVE_KEY" "$A/v4/phase1-profile-foundation.js"
          grep -q "READY_FOR_TODAY" "$A/v4/phase1-profile-foundation.js"
          grep -q "NEEDS_PROFILE" "$A/v4/phase1-profile-foundation.js"
          grep -q "NEEDS_GOAL_SETUP" "$A/v4/phase1-profile-foundation.js"
          grep -q "deviceHistory" "$A/v4/phase0-foundation.js"
          grep -q "recoveryStates" "$A/v4/phase0-foundation.js"
          grep -q "runHistory" "$A/v4/phase0-foundation.js"
          grep -q "workoutHistory" "$A/v4/phase0-foundation.js"
          grep -q "customExercises" "$A/v4/phase0-foundation.js"

      - name: Validate Android V4 candidate metadata
        shell: bash
        run: |
          set -euo pipefail
          G=personal-trainer/android-beta/app/build.gradle
          grep -q "applicationId 'com.ilia.personaltrainer.systembeta'" "$G"
          grep -q 'versionCode 49' "$G"
          grep -q "versionName '4.0.0-beta.1'" "$G"
          grep -q 'minSdk 26' "$G"
          grep -q 'targetSdk 35' "$G"
          grep -q 'signingConfig signingConfigs.beta' "$G"
          grep -q 'android:icon="@mipmap/ic_launcher"' personal-trainer/android-beta/app/src/main/AndroidManifest.xml
          grep -q '<string name="app_name">KINETIQ</string>' personal-trainer/android-beta/app/src/main/res/values/strings.xml

      - name: Build signed A54 candidate APK
        run: gradle --no-daemon -p personal-trainer/android-beta :app:assembleDebug

      - name: Verify APK identity and persistent signature
        shell: bash
        run: |
          set -euo pipefail
          APK=personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.ilia.personaltrainer.systembeta' versionCode='49' versionName='4.0.0-beta.1'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'KINETIQ'"
          unzip -l "$APK" | grep -q 'assets/system.html'
          unzip -l "$APK" | grep -q 'assets/v4/phase9-recovery-progress.js'
          unzip -l "$APK" | grep -q 'assets/v4/ui/v4-recovery-progress.js'
          unzip -l "$APK" | grep -q 'assets/media/adaptive/leg-press.mp4'
          VERIFY_OUT="$RUNNER_TEMP/apksigner-v4.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$VERIFY_OUT"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$VERIFY_OUT"
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$VERIFY_OUT" | head -n1 | tr '[:upper:]' '[:lower:]')"
          test "$CERT_SHA256" = "$EXPECTED_BETA_CERT_SHA256"
          printf '%s\n' "$CERT_SHA256" > "$RUNNER_TEMP/kinetiq-v4-cert-sha256.txt"

      - name: Package Phase 10 A54 candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp personal-trainer/android-beta/app/build/outputs/apk/debug/app-debug.apk release/KINETIQ-V4-A54-CANDIDATE.apk
          cp "$RUNNER_TEMP/kinetiq-v4-cert-sha256.txt" release/SIGNING-CERT-SHA256.txt
          sha256sum release/KINETIQ-V4-A54-CANDIDATE.apk > release/SHA256SUMS.txt
          cat > release/PHASE10-README.txt <<'REPORT'
          KINETIQ V4 — PHASE 10 A54 ACCEPTANCE CANDIDATE
          Package: com.ilia.personaltrainer.systembeta
          Version: 4.0.0-beta.1
          Version code: 49
          Target device: Samsung Galaxy A54
          Target SDK: 35
          This is a real-device acceptance candidate, not the final permanent freeze.
          Install as an update over the existing KINETIQ System Beta; do not uninstall first.
          REPORT

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/kinetiq-v4-signing"

      - name: Upload A54 candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: KINETIQ-V4-A54-CANDIDATE
          path: release/*
          if-no-files-found: error
          retention-days: 30
