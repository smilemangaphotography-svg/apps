name: ShishaLove Bridge 1.1.8 Canonical

on:
  push:
    branches:
      - shishalove-main
    paths:
      - 'shishalove-wordpress-bridge/plugin/shishalove-app-bridge/**'
      - 'shishalove-wordpress-bridge/tools/patch-customer-1.1.7-rc2.py'
      - 'shishalove-wordpress-bridge/tools/run-customer-1.1.7-rc2.py'
      - 'shishalove-wordpress-bridge/tools/patch-shishalove-1.1.8.py'
      - '.github/workflows/shishalove-bridge-1.1.7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bridge:
    name: Validate and package 1.1.8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Build canonical bridge
        run: |
          set -euo pipefail
          rm -rf package dist
          mkdir -p package dist
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge package/shishalove-app-bridge
          python3 shishalove-wordpress-bridge/tools/patch-shishalove-1.1.8.py package/shishalove-app-bridge

          MAIN='package/shishalove-app-bridge/shishalove-app-bridge.php'
          CUSTOMER='package/shishalove-app-bridge/assets/customer.js'
          MERCHANT='package/shishalove-app-bridge/assets/merchant.js'
          CSS='package/shishalove-app-bridge/assets/bridge.css'

          sed -i 's/Version: 1.1.6-rc.2/Version: 1.1.8/' "$MAIN"
          sed -i "s/define('SLB_VERSION', '1.1.6-rc.2');/define('SLB_VERSION', '1.1.8');/" "$MAIN"

          php -l "$MAIN"
          node --check "$CUSTOMER"
          node --check "$MERCHANT"

          grep -q "Version: 1.1.8" "$MAIN"
          grep -q "define('SLB_VERSION', '1.1.8')" "$MAIN"
          grep -q "BUILD='1.1.8'" "$CUSTOMER"
          grep -q "slb-age-ok-stable" "$CUSTOMER"
          grep -q "document.body.style.overflow=''" "$CUSTOMER"
          grep -q "Price: Low to High" "$CUSTOMER"
          grep -q "Price: High to Low" "$CUSTOMER"
          grep -q "Recommended order" "$CUSTOMER"
          grep -q "Recent Arrivals" "$CUSTOMER"
          grep -q "productCategoryShortcuts" "$CUSTOMER"
          grep -q "meta_type.*NUMERIC" "$MAIN"
          grep -q "price_value" "$MAIN"
          grep -q "slb-product-detail-image" "$CSS"
          ! grep -q "Last 7 days" "$CUSTOMER"
          ! grep -q "Last 30 days" "$CUSTOMER"
          ! grep -q "Before 30 days" "$CUSTOMER"

          grep -q "Search product name or SKU" "$MERCHANT"
          grep -q "Quick Picks (Most Used)" "$MERCHANT"
          ! grep -q "Laser Engravable Products" "$MERCHANT"

          cat > package/shishalove-app-bridge/INSTALL-1.1.8.txt <<'TXT'
          ShishaLove App Bridge 1.1.8

          In WordPress, open Plugins > Add New Plugin > Upload Plugin.
          Select shishalove-app-bridge-1.1.8.zip without extracting it.
          Install, then choose Replace current with uploaded if prompted.
          Activate if needed. Keep the existing WooCommerce data.

          Confirm /wp-json/shishalove/v1/status reports version 1.1.8.
          Live Customer/Merchant and Samsung A54 testing is still required.

          Customer regression lock:
          - bridge-native navigation only; no website-category fallback in the Android app
          - official WordPress custom logo is authoritative
          - stable one-time age confirmation migrated from previous builds
          - body scrolling is explicitly restored after drawer/navigation changes
          - cached bootstrap renders immediately without a second full-page redraw
          - Recommended + Recent Arrivals home feed only
          - numeric Price Low-to-High / High-to-Low sorting
          - 1:1 product detail imagery and category shortcuts
          - working pagination and in-stock filtering

          Merchant behavior remains WooCommerce-authoritative.
          TXT

          # WordPress only descends into the plugin folder when it is the sole
          # top-level entry. A sibling INSTALL file makes plugin detection fail.
          (cd package && zip -qr ../dist/shishalove-app-bridge-1.1.8.zip shishalove-app-bridge)
          python3 - dist/shishalove-app-bridge-1.1.8.zip <<'PY'
          import re
          import sys
          import zipfile
          from pathlib import PurePosixPath

          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert archive.testzip() is None, 'Corrupt plugin ZIP'
              names = archive.namelist()
              assert len(names) == len(set(names)), 'Duplicate ZIP entries'
              paths = [PurePosixPath(name) for name in names]
              assert all(not path.is_absolute() and '..' not in path.parts for path in paths)
              assert {path.parts[0] for path in paths} == {'shishalove-app-bridge'}, 'ZIP must contain exactly one plugin folder'
              main = archive.read('shishalove-app-bridge/shishalove-app-bridge.php').decode('utf-8')
              assert re.search(r'^\s*\* Plugin Name: ShishaLove App Bridge\s*$', main, re.M)
              assert re.search(r'^\s*\* Version: 1\.1\.8\s*$', main, re.M)
              assert "define('SLB_VERSION', '1.1.8');" in main
              for asset in ('bridge.css', 'customer.js', 'merchant.js'):
                  assert archive.read('shishalove-app-bridge/assets/' + asset), 'Empty runtime asset'
          print('WordPress plugin ZIP structure and version verified')
          PY
          (cd dist && sha256sum shishalove-app-bridge-1.1.8.zip > SHA256SUMS.txt)
          cp dist/SHA256SUMS.txt dist/shishalove-app-bridge-1.1.8.zip.sha256

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-app-bridge-1.1.8
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent WordPress installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload shishalove-mobile-1.1.8-beta \
            dist/shishalove-app-bridge-1.1.8.zip \
            dist/shishalove-app-bridge-1.1.8.zip.sha256 \
            --clobber
