name: ShishaLove Bridge 1.1.9 Canonical

on:
  push:
    branches:
      - shishalove-main
    paths:
      - 'shishalove-wordpress-bridge/plugin/shishalove-app-bridge/**'
      - 'shishalove-wordpress-bridge/tools/patch-customer-1.1.7-rc2.py'
      - 'shishalove-wordpress-bridge/tools/run-customer-1.1.7-rc2.py'
      - 'shishalove-wordpress-bridge/tools/patch-shishalove-1.1.8.py'
      - 'shishalove-wordpress-bridge/tools/patch-shishalove-1.1.9.py'
      - 'shishalove-wordpress-bridge/design-lock/SHISHALOVE_CUSTOMER_1_1_LOCK.md'
      - '.github/workflows/shishalove-bridge-1.1.7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bridge:
    name: Validate and package 1.1.9
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Build canonical bridge
        run: |
          set -euo pipefail
          rm -rf package dist
          mkdir -p package dist
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge package/shishalove-app-bridge
          python3 shishalove-wordpress-bridge/tools/patch-shishalove-1.1.9.py package/shishalove-app-bridge

          MAIN='package/shishalove-app-bridge/shishalove-app-bridge.php'
          CUSTOMER='package/shishalove-app-bridge/assets/customer.js'
          MERCHANT='package/shishalove-app-bridge/assets/merchant.js'
          CSS='package/shishalove-app-bridge/assets/bridge.css'

          sed -i 's/Version: 1.1.6-rc.2/Version: 1.1.9/' "$MAIN"
          sed -i "s/define('SLB_VERSION', '1.1.6-rc.2');/define('SLB_VERSION', '1.1.9');/" "$MAIN"

          php -l "$MAIN"
          node --check "$CUSTOMER"
          node --check "$MERCHANT"

          python3 - "$MAIN" "$CUSTOMER" "$MERCHANT" "$CSS" <<'PY'
          import re
          import sys
          from pathlib import Path

          main = Path(sys.argv[1]).read_text(encoding='utf-8')
          customer = Path(sys.argv[2]).read_text(encoding='utf-8')
          merchant = Path(sys.argv[3]).read_text(encoding='utf-8')
          css = Path(sys.argv[4]).read_text(encoding='utf-8')

          required_main = [
              'Version: 1.1.9',
              "define('SLB_VERSION', '1.1.9')",
              'price_value',
              'meta_type',
              'NUMERIC',
          ]
          required_customer = [
              "BUILD='1.1.9'",
              'neutralizeLegacyWrapper',
              'legacySafeLabel',
              'numericProductPrice',
              '__sl114obs',
              '__sl115Obs',
              '__sl115RouteCapture',
              'aria-label=\\"Navigation\\"',
              'slb-age-ok-stable',
              'Age confirmation is required to enter this shop',
              "document.body.style.overflow=''",
              'Price: Low to High',
              'Price: High to Low',
              'Recommended order',
              'Recent Arrivals',
              'productCategoryShortcuts',
          ]
          required_css = [
              'slb-menu-lines',
              'safe-area-inset-bottom',
              '#sl114-drawer',
          ]
          required_merchant = ['Search product name or SKU', 'Quick Picks (Most Used)']

          for value in required_main:
              assert value in main, f'missing PHP lock: {value}'
          for value in required_customer:
              assert value in customer, f'missing Customer lock: {value}'
          for value in required_css:
              assert value in css, f'missing CSS lock: {value}'
          for value in required_merchant:
              assert value in merchant, f'missing Merchant behavior: {value}'

          assert 'aria-label=\\"Menu\\">☰' not in customer, 'legacy-capturable hamburger still present'
          assert 'Last 7 days' not in customer
          assert 'Last 30 days' not in customer
          assert 'Before 30 days' not in customer
          assert 'Laser Engravable Products' not in merchant
          print('Bridge 1.1.9 runtime regression checks passed')
          PY

          cat > package/shishalove-app-bridge/INSTALL-1.1.9.txt <<'TXT'
          ShishaLove App Bridge 1.1.9

          This is the customer-runtime update. No Customer APK reinstall is required
          for these UI/runtime corrections.

          In WordPress, open Plugins > Add New Plugin > Upload Plugin.
          Select shishalove-app-bridge-1.1.9.zip without extracting it.
          Install, then choose Replace current with uploaded if prompted.
          Activate if needed. Keep the existing WooCommerce data.

          Confirm /wp-json/shishalove/v1/status reports version 1.1.9.
          Force-close and reopen the Customer app once after installation.

          1.1.9 regression lock:
          - bridge remains the Customer UI/runtime authority
          - old APK phone-polish observers/drawers/age overlays are neutralized
          - category taps remain bridge-native and cannot be hijacked to website category pages
          - Wookah/category Low→High and High→Low use numeric WooCommerce price sorting
          - Recommended/Home price sorting is defensively ordered on the visible page
          - one persistent bridge age gate only
          - official WordPress custom logo remains authoritative
          - drawer has Android/iOS bottom safe-area padding
          - customer body scrolling is restored after drawer/navigation changes
          - versioned caches are invalidated for this runtime

          Merchant launcher icon is an Android package resource and cannot be changed
          by a WordPress Bridge update. Customer runtime/UI changes belong here.
          TXT

          (cd package && zip -qr ../dist/shishalove-app-bridge-1.1.9.zip shishalove-app-bridge)
          python3 - dist/shishalove-app-bridge-1.1.9.zip <<'PY'
          import re
          import sys
          import zipfile
          from pathlib import PurePosixPath

          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert archive.testzip() is None, 'Corrupt plugin ZIP'
              names = archive.namelist()
              assert len(names) == len(set(names)), 'Duplicate ZIP entries'
              paths = [PurePosixPath(name) for name in names]
              assert all(not path.is_absolute() and '..' not in path.parts for path in paths)
              assert {path.parts[0] for path in paths} == {'shishalove-app-bridge'}, 'ZIP must contain exactly one plugin folder'
              main = archive.read('shishalove-app-bridge/shishalove-app-bridge.php').decode('utf-8')
              customer = archive.read('shishalove-app-bridge/assets/customer.js').decode('utf-8')
              assert re.search(r'^\s*\* Plugin Name: ShishaLove App Bridge\s*$', main, re.M)
              assert re.search(r'^\s*\* Version: 1\.1\.9\s*$', main, re.M)
              assert "define('SLB_VERSION', '1.1.9');" in main
              assert "BUILD='1.1.9'" in customer
              assert 'neutralizeLegacyWrapper' in customer
              assert 'legacySafeLabel' in customer
              for asset in ('bridge.css', 'customer.js', 'merchant.js'):
                  assert archive.read('shishalove-app-bridge/assets/' + asset), 'Empty runtime asset'
          print('WordPress plugin ZIP structure, runtime guard and version verified')
          PY
          (cd dist && sha256sum shishalove-app-bridge-1.1.9.zip > SHA256SUMS.txt)
          cp dist/SHA256SUMS.txt dist/shishalove-app-bridge-1.1.9.zip.sha256

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-app-bridge-1.1.9
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent WordPress installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view shishalove-bridge-1.1.9 >/dev/null 2>&1; then
            gh release create shishalove-bridge-1.1.9 --title 'ShishaLove App Bridge 1.1.9' --notes 'Bridge-owned Customer runtime compatibility and regression fixes.'
          fi
          gh release upload shishalove-bridge-1.1.9 \
            dist/shishalove-app-bridge-1.1.9.zip \
            dist/shishalove-app-bridge-1.1.9.zip.sha256 \
            --clobber
