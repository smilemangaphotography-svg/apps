name: ShishaLove Customer Bridge 1.1.7 RC2

on:
  push:
    branches:
      - shishalove-main
    paths:
      - 'shishalove-wordpress-bridge/plugin/shishalove-app-bridge/**'
      - 'shishalove-wordpress-bridge/tools/patch-customer-1.1.7-rc2.py'
      - 'shishalove-wordpress-bridge/tools/run-customer-1.1.7-rc2.py'
      - '.github/workflows/shishalove-bridge-1.1.7.yml'
  workflow_dispatch:

jobs:
  build-bridge:
    name: Validate and package 1.1.7 RC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Validate canonical source
        run: |
          set -euo pipefail
          PLUGIN='shishalove-wordpress-bridge/plugin/shishalove-app-bridge'
          php -l "$PLUGIN/shishalove-app-bridge.php"
          node --check "$PLUGIN/assets/customer.js"
          node --check "$PLUGIN/assets/merchant.js"

      - name: Build patched bridge 1.1.7 RC2
        run: |
          set -euo pipefail
          rm -rf package dist
          mkdir -p package dist
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge package/shishalove-app-bridge
          python3 shishalove-wordpress-bridge/tools/run-customer-1.1.7-rc2.py package/shishalove-app-bridge

          MAIN='package/shishalove-app-bridge/shishalove-app-bridge.php'
          CUSTOMER='package/shishalove-app-bridge/assets/customer.js'

          sed -i 's/Version: 1.1.6-rc.2/Version: 1.1.7-rc.2/' "$MAIN"
          sed -i "s/define('SLB_VERSION', '1.1.6-rc.2');/define('SLB_VERSION', '1.1.7-rc.2');/" "$MAIN"

          php -l "$MAIN"
          node --check "$CUSTOMER"
          node --check package/shishalove-app-bridge/assets/merchant.js

          grep -q "Version: 1.1.7-rc.2" "$MAIN"
          grep -q "define('SLB_VERSION', '1.1.7-rc.2')" "$MAIN"
          grep -q "BUILD='1.1.7-rc.2'" "$CUSTOMER"
          grep -q "Price: Low to High" "$CUSTOMER"
          grep -q "Price: High to Low" "$CUSTOMER"
          grep -q "Recommended order" "$CUSTOMER"
          grep -q "Recent Arrivals" "$CUSTOMER"
          grep -q "productCategoryShortcuts" "$CUSTOMER"
          grep -q "orderby='price'" "$CUSTOMER"
          grep -q "pagerMarkup" "$CUSTOMER"
          grep -q "data-add" "$CUSTOMER"
          ! grep -q "Last 7 days" "$CUSTOMER"
          ! grep -q "Last 30 days" "$CUSTOMER"
          ! grep -q "Before 30 days" "$CUSTOMER"

          cat > package/INSTALL-1.1.7-RC2.txt <<'TXT'
          ShishaLove App Bridge 1.1.7 RC2

          Customer precision fixes:
          - Recommended and Recent Arrivals only; removed day-window tabs
          - Recommended/Recent feeds now have sorting
          - true numeric Price Low-to-High and High-to-Low sorting
          - price sorting uses the canonical WooCommerce category ID query
          - category sorting remains available in every catalogue
          - product detail uses uncropped large imagery in a true 1:1 contain frame
          - product detail shows clickable category shortcuts above the image
          - category/feed sort state survives refresh/navigation
          - in-stock-only display and working pagination preserved
          TXT

          (cd package && zip -qr ../dist/shishalove-app-bridge-1.1.7-rc.2.zip shishalove-app-bridge INSTALL-1.1.7-RC2.txt)
          sha256sum dist/shishalove-app-bridge-1.1.7-rc.2.zip > dist/SHA256SUMS.txt

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-app-bridge-1.1.7-rc.2
          path: dist/
          if-no-files-found: error
          retention-days: 30
