name: Inspect ILIAS source

on:
  workflow_dispatch:
  push:
    branches: [ rebuild/ilias-coach-v2 ]
    paths:
      - '.github/workflows/inspect-ilias-v2.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        shell: bash
        run: |
          mkdir -p buildsrc
          cp ILIA-SAFE-SOURCE.bin source.zip
          unzip -q source.zip -d buildsrc
          echo '=== Ilias-Coach files ==='
          find buildsrc/Ilias-Coach -maxdepth 6 -type f | sort | sed -n '1,240p'
          echo '=== Asset-like files ==='
          find buildsrc/Ilias-Coach -type f \( -iname '*.html' -o -iname '*.js' -o -iname '*.css' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | sort | sed -n '1,320p'
