name: Build ILIAS COACH V2 — Premium Android

on:
  workflow_dispatch:
  push:
    branches: [ rebuild/ilias-coach-v2 ]
    paths:
      - 'ilias-v2-overlay/**'
      - '.github/workflows/build-ilias-coach-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract existing ILIA source
        shell: bash
        run: |
          rm -rf buildsrc source.zip
          mkdir -p buildsrc
          cp ILIA-SAFE-SOURCE.bin source.zip
          unzip -q source.zip -d buildsrc
          test -f buildsrc/Ilias-Coach/app/build.gradle
          test -d buildsrc/Ilias-Coach/app/src/main/assets/media/anatomy

      - name: Apply premium ILIAS COACH V2 overlay
        shell: bash
        run: |
          base64 -d ilias-v2-overlay/index.html.gz.b64 | gzip -d > buildsrc/Ilias-Coach/app/src/main/assets/index.html
          base64 -d ilias-v2-overlay/styles.css.gz.b64 | gzip -d > buildsrc/Ilias-Coach/app/src/main/assets/styles.css
          base64 -d ilias-v2-overlay/app.js.gz.b64 | gzip -d > buildsrc/Ilias-Coach/app/src/main/assets/app.js
          cp ilias-v2-overlay/AndroidManifest.xml buildsrc/Ilias-Coach/app/src/main/AndroidManifest.xml
          cp ilias-v2-overlay/MainActivity.java buildsrc/Ilias-Coach/app/src/main/java/com/iliaperformance/iliacoach2026/MainActivity.java
          sed -i "s/versionCode 610; versionName '6.1.0'/versionCode 700; versionName '7.0.0-v2'/" buildsrc/Ilias-Coach/app/build.gradle
          grep -q "ANATOMY MOTION" buildsrc/Ilias-Coach/app/src/main/assets/app.js
          grep -q "Owner Controls" buildsrc/Ilias-Coach/app/src/main/assets/app.js
          grep -q "spotify-callback" buildsrc/Ilias-Coach/app/src/main/AndroidManifest.xml
          test -f buildsrc/Ilias-Coach/app/src/main/assets/media/anatomy/lat-pulldown.webp

      - name: Build ILIAS COACH V2
        run: gradle --no-daemon -p buildsrc/Ilias-Coach :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output
          cp buildsrc/Ilias-Coach/app/build/outputs/apk/debug/app-debug.apk output/ILIAS-COACH-V2.apk
          sha256sum output/ILIAS-COACH-V2.apk | tee output/SHA256SUMS.txt
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ILIAS-COACH-V2-APK
          path: output/*
          if-no-files-found: error
          retention-days: 30
