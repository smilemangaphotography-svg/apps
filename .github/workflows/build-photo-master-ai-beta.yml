name: Build PHOTO MASTER AI Beta — A54

on:
  workflow_dispatch:
  push:
    branches: [ photo-master-ai-beta ]
    paths:
      - 'PHOTO-MASTER-AI/**'
      - '.github/workflows/build-photo-master-ai-beta.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build PHOTO MASTER AI beta
        env:
          PHOTO_MASTER_AI_ENDPOINT: ${{ secrets.PHOTO_MASTER_AI_ENDPOINT }}
        shell: bash
        run: |
          gradle --no-daemon -p PHOTO-MASTER-AI \
            -PPHOTO_MASTER_AI_ENDPOINT="$PHOTO_MASTER_AI_ENDPOINT" \
            :app:assembleDebug

      - name: Verify package/version
        shell: bash
        run: |
          APK="PHOTO-MASTER-AI/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.ilia.photomasterai'" badging.txt
          grep -q "versionName='0.9.0-beta'" badging.txt

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p beta-artifact
          cp PHOTO-MASTER-AI/app/build/outputs/apk/debug/app-debug.apk beta-artifact/PHOTO-MASTER-AI-BETA.apk
          sha256sum beta-artifact/PHOTO-MASTER-AI-BETA.apk > beta-artifact/SHA256SUMS.txt

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO-MASTER-AI-BETA-A54
          path: beta-artifact/*
          if-no-files-found: error
          retention-days: 30
