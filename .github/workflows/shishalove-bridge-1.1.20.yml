name: ShishaLove Bridge 1.1.20 Android Safe Area

on:
  push:
    branches:
      - shishalove-main
    paths:
      - 'shishalove-wordpress-bridge/tools/patch-shishalove-1.1.20.py'
      - '.github/workflows/shishalove-bridge-1.1.20.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bridge:
    name: Freeze 1.1.19; fix Android safe areas only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Build locked 1.1.19 baseline and 1.1.20 candidate
        run: |
          set -euo pipefail
          rm -rf baseline package dist
          mkdir -p baseline package dist
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge baseline/shishalove-app-bridge
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge package/shishalove-app-bridge

          python3 shishalove-wordpress-bridge/tools/patch-shishalove-1.1.19.py baseline/shishalove-app-bridge
          python3 shishalove-wordpress-bridge/tools/patch-shishalove-1.1.20.py package/shishalove-app-bridge

          BASE_CUSTOMER='baseline/shishalove-app-bridge/assets/customer.js'
          BASE_MERCHANT='baseline/shishalove-app-bridge/assets/merchant.js'
          CUSTOMER='package/shishalove-app-bridge/assets/customer.js'
          MERCHANT='package/shishalove-app-bridge/assets/merchant.js'
          MAIN='package/shishalove-app-bridge/shishalove-app-bridge.php'
          CSS='package/shishalove-app-bridge/assets/bridge.css'

          # Absolute functional lock: JS/customer/merchant behaviour cannot change.
          cmp --silent "$BASE_CUSTOMER" "$CUSTOMER" || { echo 'ERROR: Customer JS changed'; exit 1; }
          cmp --silent "$BASE_MERCHANT" "$MERCHANT" || { echo 'ERROR: Merchant JS changed'; exit 1; }

          sed -i 's/Version: 1.1.6-rc.2/Version: 1.1.20/' "$MAIN"
          sed -i "s/define('SLB_VERSION', '1.1.6-rc.2');/define('SLB_VERSION', '1.1.20');/" "$MAIN"

          php -l "$MAIN"
          node --check "$CUSTOMER"
          node --check "$MERCHANT"

          python3 - "$MAIN" "$CSS" <<'PY'
          import sys
          from pathlib import Path
          main=Path(sys.argv[1]).read_text(encoding='utf-8')
          css=Path(sys.argv[2]).read_text(encoding='utf-8')
          assert 'Version: 1.1.20' in main
          assert "define('SLB_VERSION', '1.1.20')" in main
          assert "$platform = isset($_GET['app'])" in main
          assert 'slb-platform-<?php echo esc_attr($platform); ?>' in main
          assert 'body.slb-platform-android' in css
          assert '--safe-top:0px!important' in css
          assert '--safe-bottom:0px!important' in css
          assert 'ShishaLove 1.1.19 Merchant Products/Stock search-row edge spacing only' in css
          print('PASS: Android duplicate safe-area insets removed; 1.1.19 functional UI remains locked')
          PY

          cat > package/shishalove-app-bridge/INSTALL-1.1.20.txt <<'TXT'
          ShishaLove App Bridge 1.1.20

          WORDPRESS BRIDGE UPDATE ONLY — DO NOT REINSTALL OR REPLACE ANDROID APPS.

          FIXED:
          - Android Customer/Merchant top header/logo safe-area duplication.
          - Android Customer/Merchant bottom navigation extra blank space caused by duplicate bottom inset.

          LOCKED / UNCHANGED:
          - Customer catalogue/categories/brands/recommended/sorting/cart/account/drawer.
          - Merchant dashboard/orders/order detail/products/stock/editor/search/menu/logo layout.
          - Existing 1.1.19 functionality and data behaviour.
          - Android package IDs, signing identities and installed app data are not touched by this WordPress update.
          TXT

          (cd package && zip -qr ../dist/shishalove-app-bridge-1.1.20.zip shishalove-app-bridge)
          (cd dist && sha256sum shishalove-app-bridge-1.1.20.zip > shishalove-app-bridge-1.1.20.zip.sha256)

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: shishalove-app-bridge-1.1.20
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent WordPress installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-bridge-1.1.20'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'ShishaLove App Bridge 1.1.20' --notes 'WordPress Bridge only: remove duplicate Android safe-area insets. Customer/Merchant 1.1.19 functionality remains frozen. No APK update.' --target shishalove-main
          fi
          gh release upload "$TAG" dist/shishalove-app-bridge-1.1.20.zip dist/shishalove-app-bridge-1.1.20.zip.sha256 --clobber

      - name: Confirm release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view shishalove-bridge-1.1.20 --json url,assets
