name: ShishaLove Bridge 1.1.31 Reload + Favorites + Black Nav Labels

on:
  push:
    branches: [shishalove-main]
    paths:
      - 'shishalove-wordpress-bridge/tools/patch-shishalove-1.1.31.py'
      - '.github/workflows/shishalove-bridge-1.1.31.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Build and verify Bridge 1.1.31
        run: |
          set -euo pipefail
          rm -rf package dist
          mkdir -p package dist
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge package/shishalove-app-bridge

          python3 shishalove-wordpress-bridge/tools/patch-shishalove-1.1.31.py package/shishalove-app-bridge

          CUSTOMER='package/shishalove-app-bridge/assets/customer.js'
          MERCHANT='package/shishalove-app-bridge/assets/merchant.js'
          MAIN='package/shishalove-app-bridge/shishalove-app-bridge.php'
          CSS='package/shishalove-app-bridge/assets/bridge.css'

          sed -i 's/Version: 1.1.6-rc.2/Version: 1.1.31/' "$MAIN"
          sed -i "s/define('SLB_VERSION', '1.1.6-rc.2');/define('SLB_VERSION', '1.1.31');/" "$MAIN"

          node --check "$CUSTOMER"
          node --check "$MERCHANT"
          php -l "$MAIN"

          grep -Fq "var BUILD='1.1.31'" "$CUSTOMER"
          grep -Fq "CFG.version='1.1.31'" "$CUSTOMER"
          grep -Fq "CFG.version='1.1.31'" "$MERCHANT"
          grep -Fq "slbfix','1.1.31'" "$CUSTOMER"
          grep -Fq "slbfix','1.1.31'" "$MERCHANT"
          grep -Fq 'Bridge 1.1.31' "$MERCHANT"

          # Reload-performance lock: stable cache survives Bridge version bumps and media is prefetched.
          grep -Fq "var DATA_CACHE='stable-v1'" "$CUSTOMER"
          grep -Fq "var DATA_CACHE='stable-v1'" "$MERCHANT"
          grep -Fq 'function prefetchMediaManager()' "$MERCHANT"
          grep -Fq 'function hydrateMediaManagerCache()' "$MERCHANT"
          grep -Fq 'function mediaCacheKey(' "$MERCHANT"
          grep -Fq 'cset(key,d);renderEditorOnly();' "$MERCHANT"

          # Customer visual lock: heart stays above the positioned image; labels are solid black.
          grep -Fq 'body.slb-customer .slb-heart{' "$CSS"
          grep -Fq 'z-index:4!important;' "$CSS"
          grep -Fq 'body.slb-customer .slb-bottom .slb-bottom-label' "$CSS"
          grep -Fq 'color:#000!important;' "$CSS"

          # Preserve the immediately previous approved 1.1.30 scope.
          grep -Fq 'TRASH PRODUCT' "$MERCHANT"
          grep -Fq 'function slb_trash_product' "$MAIN"
          grep -Fq 'watermark_failed' "$MAIN"
          grep -Fq 'Product brands' "$MERCHANT"
          ! grep -Fq 'Points Earned' "$MERCHANT"
          ! grep -Fq 'Maximum Discount' "$MERCHANT"
          ! grep -Fq 'Age Gate' "$MERCHANT"
          ! grep -Fq 'Product Options' "$MERCHANT"
          ! grep -Fq 'YouTube Video' "$MERCHANT"
          ! grep -Fq 'Product tags' "$MERCHANT"

          cat > package/shishalove-app-bridge/INSTALL-1.1.31.txt <<'TXT'
          ShishaLove App Bridge 1.1.31 — RELOAD + FAVORITES + BLACK NAV LABELS

          Update the existing WordPress Bridge only. No Android APK reinstall required.

          CHANGED ONLY:
          - Customer and Merchant reuse valid local data immediately on reload, then refresh it in the background instead of blanking the screen while network requests finish.
          - Merchant Media Library page 1 is prefetched and cached; already-loaded media stays visible while refresh runs.
          - Customer favorite-heart control is stacked above the product image so the complete heart is visible.
          - Customer bottom navigation text labels are solid black. Icon colors and active-state logic are unchanged.
          - All Bridge 1.1.30 Trash, permanent watermark, editor cleanup, products, orders, stock, sorting and other approved behavior remain unchanged.
          TXT

          (cd package && zip -qr ../dist/shishalove-app-bridge-1.1.31.zip shishalove-app-bridge)
          (cd dist && sha256sum shishalove-app-bridge-1.1.31.zip > shishalove-app-bridge-1.1.31.zip.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: shishalove-app-bridge-1.1.31
          path: dist/
          if-no-files-found: error

      - name: Publish Bridge 1.1.31
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-bridge-1.1.31'
          NOTES='Scoped update only: faster Customer/Merchant reload through persistent stale-while-revalidate data caching and Merchant Media Library prefetch; full Customer favorite hearts; solid black Customer bottom-nav labels. Bridge 1.1.30 Trash/watermark/editor behavior remains locked.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/shishalove-app-bridge-1.1.31.zip dist/shishalove-app-bridge-1.1.31.zip.sha256 --clobber
            gh release edit "$TAG" --title 'ShishaLove App Bridge 1.1.31 — Reload + Favorites + Black Nav Labels' --notes "$NOTES" --target shishalove-main
          else
            gh release create "$TAG" dist/shishalove-app-bridge-1.1.31.zip dist/shishalove-app-bridge-1.1.31.zip.sha256 --title 'ShishaLove App Bridge 1.1.31 — Reload + Favorites + Black Nav Labels' --notes "$NOTES" --target shishalove-main
          fi
          gh release view "$TAG" --json url,assets
