name: ShishaLove Merchant 1.1.50 Exact Beta Promotion

on:
  push:
    branches: [shishalove-main]
    paths:
      - '.github/workflows/shishalove-merchant-1.1.50.yml'
      - 'shishalove-wordpress-bridge/runtime/merchant-approved-beta-1.1.50.js'
      - 'shishalove-wordpress-bridge/runtime/merchant-approved-beta-routes-1.1.50.php.inc'
      - 'shishalove-wordpress-bridge/tools/patch-shishalove-1.1.50.py'
      - 'shishalove-mobile/tools/patch-merchant-final-1.1.50.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Build Bridge 1.1.50 from approved Beta runtime
        run: |
          set -euo pipefail
          rm -rf package dist && mkdir -p package dist
          cp -R shishalove-wordpress-bridge/plugin/shishalove-app-bridge package/shishalove-app-bridge
          python3 shishalove-wordpress-bridge/tools/patch-shishalove-1.1.50.py package/shishalove-app-bridge

          MAIN='package/shishalove-app-bridge/shishalove-app-bridge.php'
          C='package/shishalove-app-bridge/assets/customer.js'
          M='package/shishalove-app-bridge/assets/merchant.js'
          APPROVED='shishalove-wordpress-bridge/runtime/merchant-approved-beta-1.1.50.js'

          sed -i 's/Version: 1.1.6-rc.2/Version: 1.1.50/' "$MAIN"
          sed -i "s/define('SLB_VERSION', '1.1.6-rc.2');/define('SLB_VERSION', '1.1.50');/" "$MAIN"

          node --check "$C"
          node --check "$M"
          php -l "$MAIN"

          # The final production merchant runtime must be byte-for-byte the approved Beta snapshot.
          cmp "$M" "$APPROVED"

          # Exact Beta runtime locks.
          grep -Fq "CFG.version='1.1.50';" "$M"
          grep -Fq "var MERCHANT_STAGING_REST=location.origin+'/wp-json/shishalove-production/v1/';" "$M"
          grep -Fq "var DATA_CACHE='production-beta-lock-v1';" "$M"
          grep -Fq "root.querySelectorAll('[data-view]')" "$M"
          grep -Fq "function dashboardBody()" "$M"
          grep -Fq "function loadOrders(force,allowNotify)" "$M"
          grep -Fq "api('merchant/orders?page=1&per_page=20&_slm_fresh='+Date.now()" "$M"
          grep -Fq "Bridge 1.1.50" "$M"

          # Exact staging-proven WooCommerce list/order mirror routes.
          grep -Fq 'function slb_prod_beta_merchant_products($request)' "$MAIN"
          grep -Fq 'function slb_prod_beta_merchant_orders($request)' "$MAIN"
          grep -Fq 'shishalove-production/v1' "$MAIN"
          grep -Fq 'Version: 1.1.50' "$MAIN"

          # Customer frozen.
          grep -Fq "var BUILD='1.1.45';" "$C"
          grep -Fq "CFG.version='1.1.45';" "$C"
          grep -Fq 'function frontPageMarkup()' "$C"

      - name: Apply Merchant Android 1.1.50
        run: |
          set -euo pipefail
          python3 shishalove-mobile/tools/patch-merchant-final-1.1.50.py package/shishalove-app-bridge

          G='shishalove-mobile/merchant/build.gradle'
          M='shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MainActivity.java'
          X='shishalove-mobile/merchant/src/main/AndroidManifest.xml'
          A='shishalove-mobile/merchant/src/main/java/eu/shishalove/merchant/MerchantActivityV121.java'

          grep -Fq 'versionCode 150' "$G"
          grep -Fq "versionName '1.1.50'" "$G"
          grep -Fq 'build=150' "$M"
          grep -Fq 'ShishaLoveMerchant/1.1.50' "$M"
          grep -Fq 'WebSettings.LOAD_DEFAULT' "$M"
          ! grep -Fq 'WebSettings.LOAD_CACHE_ELSE_NETWORK' "$M"
          grep -Fq 'refreshOfficialRuntimeCache()' "$M"
          grep -Fq 'webView.clearCache(true)' "$M"
          grep -Fq 'merchant_web_runtime_build' "$M"
          grep -Fq 'loadFreshStartUrl()' "$M"
          grep -Fq 'Cache-Control", "no-cache, no-store, max-age=0' "$M"
          grep -Fq 'OrderPollReceiver' "$X"
          grep -Fq 'android:launchMode="singleTop"' "$X"
          grep -Fq 'slm-native-layout-147' "$A"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build production Merchant 1.1.50
        working-directory: shishalove-mobile
        run: gradle :merchant:assembleRelease :merchant:assembleDebug --stacktrace

      - name: Verify package and signing continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          RELEASE='shishalove-mobile/merchant/build/outputs/apk/release/merchant-release.apk'
          DEBUG='shishalove-mobile/merchant/build/outputs/apk/debug/merchant-debug.apk'

          "$AAPT" dump badging "$RELEASE" | grep -q "package: name='eu.shishalove.merchant' versionCode='150' versionName='1.1.50'"
          "$AAPT" dump badging "$DEBUG" | grep -q "package: name='eu.shishalove.merchant.dev' versionCode='150' versionName='1.1.50-dev'"

          mkdir -p dist/previous
          gh release download shishalove-merchant-1.1.49 --pattern 'ShishaLove-Merchant-1.1.49-CURRENT-PHONE-UPDATE.apk' --dir dist/previous
          digest() { "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1; }
          test "$(digest dist/previous/ShishaLove-Merchant-1.1.49-CURRENT-PHONE-UPDATE.apk)" = "$(digest "$RELEASE")"

          cp "$RELEASE" dist/ShishaLove-Merchant-1.1.50-CURRENT-PHONE-UPDATE.apk
          (cd package && zip -qr ../dist/shishalove-app-bridge-1.1.50.zip shishalove-app-bridge)
          sha256sum dist/ShishaLove-Merchant-1.1.50-CURRENT-PHONE-UPDATE.apk dist/shishalove-app-bridge-1.1.50.zip > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: shishalove-merchant-1.1.50-exact-beta-promotion
          path: dist/*
          if-no-files-found: error

      - name: Publish 1.1.50 exact Beta promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='shishalove-merchant-1.1.50'
          NOTES='MASTER FIX — root-cause correction. 1.1.50 promotes the exact approved working Beta runtime byte-for-byte into production and mirrors the staging-proven Products/Orders REST code. It also fixes the stale official WebView runtime problem: production now clears the old WebView resource cache once on build 150, uses HTTP-aware LOAD_DEFAULT instead of LOAD_CACHE_ELSE_NETWORK, and loads the production shell with explicit no-cache headers. This prevents an old Merchant shell/JS from surviving Bridge updates and making Dashboard or Orders appear unfixed. Android notifications, exact-order deep links, splash, scrolling, editor, search and stock behavior remain frozen. Customer 1.1.45 remains unchanged. Install Bridge 1.1.50 first, then update Merchant 1.1.50 over the existing app. Do not uninstall.'
          ASSETS=(dist/ShishaLove-Merchant-1.1.50-CURRENT-PHONE-UPDATE.apk dist/shishalove-app-bridge-1.1.50.zip dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title 'ShishaLove Merchant 1.1.50 — Exact Approved Beta Promotion' --notes "$NOTES" --target shishalove-main
          else
            gh release create "$TAG" "${ASSETS[@]}" --title 'ShishaLove Merchant 1.1.50 — Exact Approved Beta Promotion' --notes "$NOTES" --target shishalove-main
          fi
