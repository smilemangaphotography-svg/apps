name: INFINITE DRIVE Android

on:
  push:
    branches:
      - infinite-drive-build
      - infinite-drive-device-fix
      - infinite-drive-signing-setup
      - infinite-drive-main
    paths:
      - 'INFINITE-DRIVE/**'
      - '.github/workflows/infinite-drive-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.IDRIVE_KEYSTORE_B64 != '' && secrets.IDRIVE_STORE_PASSWORD != '' && secrets.IDRIVE_KEY_ALIAS != '' && secrets.IDRIVE_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: INFINITE-DRIVE
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release code path
        working-directory: INFINITE-DRIVE
        run: gradle :app:assembleRelease --stacktrace

      - name: Run lint
        working-directory: INFINITE-DRIVE
        run: gradle :app:lintDebug

      - name: Prepare permanent release keystore
        if: env.HAS_RELEASE_SIGNING == 'true'
        shell: bash
        env:
          IDRIVE_KEYSTORE_B64: ${{ secrets.IDRIVE_KEYSTORE_B64 }}
        run: |
          echo "$IDRIVE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/infinite-drive-release.jks"
          chmod 600 "$RUNNER_TEMP/infinite-drive-release.jks"

      - name: Build permanently signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        working-directory: INFINITE-DRIVE
        env:
          IDRIVE_KEYSTORE_PATH: ${{ runner.temp }}/infinite-drive-release.jks
          IDRIVE_STORE_PASSWORD: ${{ secrets.IDRIVE_STORE_PASSWORD }}
          IDRIVE_KEY_ALIAS: ${{ secrets.IDRIVE_KEY_ALIAS }}
          IDRIVE_KEY_PASSWORD: ${{ secrets.IDRIVE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --rerun-tasks

      - name: Verify permanent signer
        if: env.HAS_RELEASE_SIGNING == 'true'
        shell: bash
        run: |
          APK="INFINITE-DRIVE/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signer-report.txt
          ACTUAL="$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' signer-report.txt | tr -d ':')"
          EXPECTED="d317bbe5e7e9779bc89c2dd587fbd0d017dfaeedbbc28f9b130380ec77274750"
          test "$ACTUAL" = "$EXPECTED"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: infinite-drive-debug-apk
          path: INFINITE-DRIVE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload permanently signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: infinite-drive-release-apk
          path: INFINITE-DRIVE/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
