name: INFINITE DRIVE Android

on:
  push:
    branches:
      - infinite-drive-build
      - infinite-drive-main
    paths:
      - 'INFINITE-DRIVE/**'
      - '.github/workflows/infinite-drive-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: INFINITE-DRIVE
        run: gradle :app:assembleDebug --stacktrace

      - name: Run lint
        working-directory: INFINITE-DRIVE
        run: gradle :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: infinite-drive-debug-apk
          path: INFINITE-DRIVE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
