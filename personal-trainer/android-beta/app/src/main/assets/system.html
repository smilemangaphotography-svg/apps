<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06100b">
<title>KINETIQ SYSTEM</title>
<link rel="stylesheet" href="app-v2.css">
<link rel="stylesheet" href="style2-v29.css">
<link rel="stylesheet" href="style2-v29-focus.css">
<link rel="stylesheet" href="style2-v7.css">
<link rel="stylesheet" href="style2-v73-library-tools.css">
<link rel="stylesheet" href="kinetiq-beta-v303.css">
<link rel="stylesheet" href="kinetiq-system-ui.css">
</head>
<body class="system-runtime">
<section id="style2Cover" class="cover-screen kinetiq-cover">
  <div class="kinetiq-atmosphere" aria-hidden="true"><span class="kinetiq-arc arc-a"></span><span class="kinetiq-arc arc-b"></span><span class="kinetiq-arc arc-c"></span></div>
  <div class="kinetiq-brand">
    <svg class="kinetiq-mark" viewBox="0 0 240 260" role="img" aria-label="KINETIQ motion mark">
      <defs><linearGradient id="kqSilver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f1e8"/><stop offset=".46" stop-color="#8d978f"/><stop offset="1" stop-color="#253129"/></linearGradient><linearGradient id="kqLime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0ffd0"/><stop offset=".48" stop-color="#cfff62"/><stop offset="1" stop-color="#799b36"/></linearGradient></defs>
      <path fill="url(#kqSilver)" d="M127 32c-34 9-59 31-66 59-6 25 6 44 21 61 12 14 12 29 2 47-9 16-25 31-45 47 39-13 70-33 84-57 13-22 11-43-4-61-12-15-22-27-16-45 5-17 14-34 24-51z"/>
      <path fill="url(#kqLime)" d="M128 69c29 5 52 24 55 46 3 20-11 35-28 45-15 9-17 20-8 31 8 10 22 18 39 25-29-1-55-10-67-26-13-18-9-37 8-52 13-12 26-21 23-34-2-12-12-24-22-35z"/>
      <circle cx="169" cy="42" r="17" fill="url(#kqLime)"/>
    </svg>
    <div class="kinetiq-wordmark">KINETI<span>Q</span></div><div class="kinetiq-statement">A HIGHER YOU</div>
  </div>
  <button id="coverEnter" class="kinetiq-enter" aria-label="Enter KINETIQ"><span>Q</span></button>
</section>
<div id="app">
  <section id="builder" class="builder hidden"><div id="builderBody"></div></section>
  <main id="mainApp" class="main-app hidden system-shell">
    <header class="system-topbar">
      <div><div class="system-eyebrow">KINETIQ</div><div id="topTitle" class="system-title">Today</div></div>
      <button id="systemProfile" class="system-icon-btn" aria-label="More">◎</button>
    </header>
    <section id="pageHome" class="page active" data-page="home"></section>
    <section id="pagePlan" class="page" data-page="plan"></section>
    <section id="pageTrain" class="page" data-page="train"></section>
    <section id="pageRun" class="page" data-page="run"></section>
    <section id="pageMore" class="page" data-page="more"></section>
    <nav class="bottom-nav system-nav">
      <button class="nav-btn active" data-nav="home"><span class="nav-icon">⌂</span><small>HOME</small></button>
      <button class="nav-btn" data-nav="plan"><span class="nav-icon">▦</span><small>PLAN</small></button>
      <button class="nav-btn" data-nav="train"><span class="nav-icon">▣</span><small>TRAIN</small></button>
      <button class="nav-btn" data-nav="run"><span class="nav-icon">↗</span><small>RUN</small></button>
      <button class="nav-btn" data-nav="more"><span class="nav-icon">•••</span><small>MORE</small></button>
    </nav>
    <button id="systemAiFab" class="system-ai-fab" aria-label="KINETIQ Coach"><span>✦</span><b>AI</b></button>
  </main>
  <section id="exerciseDetail" class="overlay hidden"></section>
  <section id="workoutOverlay" class="overlay workout hidden"></section>
  <section id="restOverlay" class="overlay rest hidden"></section>
  <section id="runOverlay" class="overlay hidden"></section>
  <section id="sheet" class="sheet hidden"><div id="sheetCard" class="sheet-card"></div></section>
  <div id="toast" class="toast"></div>
  <button id="driveButton" class="hidden" type="button" aria-hidden="true" tabindex="-1"></button>
  <input id="audioPicker" class="hidden" type="file" accept="audio/*" multiple><audio id="audioPlayer"></audio>
  <input id="activityPicker" class="hidden" type="file" accept=".gpx,.tcx,.csv,text/*">
  <input id="exerciseFilePicker" class="hidden" type="file" accept="video/mp4,video/*,image/*">
  <input id="galleryFilePicker" class="hidden" type="file" accept="image/*">
</div>
<script src="style2-v29-runtime-preflight.js"></script>
<script src="app-v2.js"></script>
<script src="pt-v25-core.js"></script>
<script src="style2-v29.js"></script>
<script src="style2-v29-admin.js"></script>
<script src="style2-v29-focus.js"></script>
<script src="style2-v29-priority-engine.js"></script>
<script src="style2-v7.js"></script>
<script>try{window.S=S}catch(e){}</script>
<script src="style2-v73-library-tools.js"></script>
<script src="kinetiq-beta-v303.js"></script>
<script src="system-build.js"></script>
<script src="kinetiq-system-ui.js"></script>
</body>
</html>
