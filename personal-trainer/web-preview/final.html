function prioritiesHtml(){return `<div class="builder-head"><div class="step">02 · BODY MAP</div><h1>Choose your <em>priorities.</em></h1><p>Tap each area to cycle: skip, train, focus, priority.</p></div><div class="priority-presets">${['Balanced','Upper','Lower','Arms','Runner','Push'].map(x=>`<button class="pill" data-preset="${x}">${x}</button>`).join('')}</div><div class="priority-grid">${priorityAreas.map(a=>priorityCard(a)).join('')}</div>`}
function priorityCard(a){const v=S.priorities[a]||'train',n=priorityLevels.indexOf(v);return `<button class="priority-card ${v}" data-priority="${a}"><strong>${a}</strong><small>${v.toUpperCase()}</small><div class="priority-meter">${[0,1,2].map(i=>`<i class="${i<Math.max(1,n)?'on':''}"></i>`).join('')}</div></button>`}
function logisticsHtml(){return `<div class="builder-head"><div class="step">03 · LOGISTICS</div><h1>Make it fit <em>real life.</em></h1><p>The best program is hard enough to work and realistic enough to repeat.</p></div><label class="section-label">TRAINING DAYS</label><div class="choice-row days">${[2,3,4,5,6].map(x=>`<button class="choice-btn ${S.days===x?'selected':''}" data-days="${x}">${x} DAYS</button>`).join('')}</div><label class="section-label">SESSION LENGTH</label><div class="choice-row minutes">${[30,45,60,75].map(x=>`<button class="choice-btn ${S.minutes===x?'selected':''}" data-min="${x}">${x} MIN</button>`).join('')}</div><label class="section-label">EQUIPMENT</label><div class="option-stack">${[['Full Gym','Machines, cables and free weights.'],['Dumbbells + Bench','Home or compact gym setup.'],['Bodyweight','No loaded equipment required.']].map(([x,d])=>`<button class="option-card ${S.equipment===x?'selected':''}" data-equip="${x}"><b>${x}</b><span>${d}</span></button>`).join('')}</div>`}
function injuriesHtml(){const selected=S.injuries[0];return `<div class="builder-head"><div class="step">04 · GUARDRAILS</div><h1>Train hard. <em>Stay useful.</em></h1><p>These filters avoid automatically programming movements that commonly aggravate selected areas. You stay in control.</p></div><div class="injury-grid">${injuryAreas.map(x=>`<button class="injury-btn ${S.injuries.includes(x)?'selected':''}" data-injury="${x}">${x}</button>`).join('')}</div>${selected?injuryDetailHtml(selected):'<div class="medical-note"><b>NO INJURY SELECTED</b>You can continue without guardrails and change this later in Profile.</div>'}`}
function injuryDetailHtml(x){const d=S.injuryDetails[x]||{side:'Both',pain:0,notes:''};return `<div class="injury-detail"><div class="accent-label">SELECTED INJURY</div><h2>${x}</h2><div class="row">${['Left','Right','Both'].map(s=>`<button class="pill ${d.side===s?'selected':''}" data-side="${s}">${s}</button>`).join('')}</div><label class="section-label">PAIN LEVEL <b id="painOut">${d.pain}/10</b></label><input id="painRange" type="range" min="0" max="10" value="${d.pain}"><label class="section-label">NOTES (OPTIONAL)</label><textarea id="injuryNotes" class="field" style="min-height:110px;padding-top:16px" placeholder="e.g. pain with deep flexion">${esc(d.notes)}</textarea></div>`}
function summaryHtml(){const focus=priorityAreas.filter(a=>['focus','priority'].includes(S.priorities[a])).join(' · ')||'Balanced';const injury=S.injuries.length?S.injuries.join(', '):'None';return `<div class="builder-head"><div class="step">05 · YOUR PROGRAM</div><h1>Your program <em>is ready.</em></h1><p>Review the system before building your monthly plan.</p></div><div class="summary-hero"><div class="accent-label">YOUR PROGRAM</div><h2>${S.days} DAYS · ${S.minutes} MIN</h2><div class="block-note">${S.goal} · ${focus}</div></div><div class="summary-list"><div class="summary-row"><span>Experience</span><b>${S.experience}</b></div><div class="summary-row"><span>Equipment</span><b>${S.equipment}</b></div><div class="summary-row"><span>Focus</span><b>${focus}</b></div><div class="summary-row"><span>Injuries</span><b>${injury}</b></div><div class="summary-row"><span>Progression</span><b>Changes every 2 weeks</b></div></div><div class="medical-note"><b>TRAINER BOUNDARY</b>This app programs training; it does not diagnose injuries. Stop for sharp pain, swelling, locking, giving way or altered movement.</div>`}
function bindBuilder(){
 $$('[data-goal]').forEach(b=>b.onclick=()=>{S.goal=b.dataset.goal;renderBuilder()});
 $$('[data-exp]').forEach(b=>b.onclick=()=>{S.experience=b.dataset.exp;renderBuilder()});
 $$('[data-priority]').forEach(b=>b.onclick=()=>{const a=b.dataset.priority,i=priorityLevels.indexOf(S.priorities[a]||'train');S.priorities[a]=priorityLevels[(i+1)%priorityLevels.length];save();renderBuilder()});
 $$('[data-preset]').forEach(b=>b.onclick=()=>applyPreset(b.dataset.preset));
 $$('[data-days]').forEach(b=>b.onclick=()=>{S.days=+b.dataset.days;renderBuilder()});
 $$('[data-min]').forEach(b=>b.onclick=()=>{S.minutes=+b.dataset.min;renderBuilder()});
 $$('[data-equip]').forEach(b=>b.onclick=()=>{S.equipment=b.dataset.equip;renderBuilder()});
 $$('[data-injury]').forEach(b=>b.onclick=()=>{const x=b.dataset.injury;if(S.injuries.includes(x))S.injuries=S.injuries.filter(i=>i!==x);else S.injuries=[x,...S.injuries.filter(i=>i!==x)];if(!S.injuryDetails[x])S.injuryDetails[x]={side:'Both',pain:0,notes:''};save();renderBuilder()});
 $$('[data-side]').forEach(b=>b.onclick=()=>{const x=S.injuries[0];S.injuryDetails[x].side=b.dataset.side;save();renderBuilder()});
 const pr=$('#painRange');if(pr)pr.oninput=e=>{const x=S.injuries[0];S.injuryDetails[x].pain=+e.target.value;$('#painOut').textContent=e.target.value+'/10';save()};
}
function captureBuilder(){if(S.builderStep===0){S.name=($('#nameInput')?.value||'Athlete').trim()||'Athlete'}if(S.builderStep===3&&S.injuries[0]){S.injuryDetails[S.injuries[0]].notes=$('#injuryNotes')?.value.trim()||''}save();return true}
function applyPreset(p){const base=Object.fromEntries(priorityAreas.map(a=>[a,'train']));if(p==='Upper'){['Chest','Back','Shoulders','Arms'].forEach(a=>base[a]='focus')}if(p==='Lower'){['Quads','Glutes','Hamstrings','Calves'].forEach(a=>base[a]='focus')}if(p==='Arms'){base.Arms='priority';base.Shoulders='focus'}if(p==='Runner'){['Quads','Glutes','Hamstrings','Calves','Core'].forEach(a=>base[a]='focus')}if(p==='Push'){['Chest','Shoulders','Arms'].forEach(a=>base[a]='focus')}S.priorities=base;save();renderBuilder()}
function buildProgram(){const templates=[
 {name:'Push',muscles:'Chest · Shoulders · Triceps',ids:['pushup','incline','lat','rdl','row']},
 {name:'Lower',muscles:'Quads · Glutes · Hamstrings',ids:['goblet','legpress','split','hamcurl','calf']},
 {name:'Pull',muscles:'Back · Biceps · Posterior Chain',ids:['lat','row','rdl','pushup']},
 {name:'Full Body',muscles:'Push · Pull · Legs',ids:['goblet','pushup','lat','rdl','row']},
 {name:'Upper',muscles:'Chest · Back · Shoulders',ids:['incline','lat','row','pushup']},
 {name:'Lower Capacity',muscles:'Quads · Glutes · Calves',ids:['legpress','goblet','calf','hamcurl']}
 ];
 const picks=[];for(let i=0;i<S.days;i++)picks.push(clone(templates[i%templates.length]));
 const knee=S.injuries.includes('Knee');if(knee){picks.forEach(d=>{d.ids=d.ids.filter(id=>!['split'].includes(id));if(!d.ids.length)d.ids=['pushup','lat','row']})}
 S.program=picks;S.currentDay=0;S.currentWeek=1;S.completed={};save();
}
function showMain(page){$('#builder').classList.add('hidden');$('#mainApp').classList.remove('hidden');$$('.page').forEach(p=>p.classList.toggle('active',p.dataset.page===page));$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));$('#topTitle').textContent=page==='home'?(S.name||'Athlete'):page[0].toUpperCase()+page.slice(1);renderPage(page);window.scrollTo(0,0)}
function renderPage(p){if(p==='home')renderHome();if(p==='plan')renderPlan();if(p==='library')renderLibrary();if(p==='profile')renderProfile()}
function currentProgramDay(){return S.program[S.currentDay]||S.program[0]||{name:'Push',muscles:'Chest · Shoulders',ids:['pushup','incline']}}
function rx(ex,week=S.currentWeek){const block=Math.floor((Math.max(1,week)-1)/2)%3;if(block===0)return{sets:ex.sets,reps:ex.reps,rest:ex.rest,label:'Base'};if(block===1)return{sets:Math.min(ex.sets+1,5),reps:ex.reps==='5–7'?'6–8':'8–10',rest:Math.max(60,ex.rest-15),label:'Build'};return{sets:ex.sets,reps:ex.reps==='5–7'?'4–6':'6–8',rest:ex.rest+15,label:'Load'}}
function renderHome(){const d=currentProgramDay(),done=completedCount(S.currentDay);$('#pageHome').innerHTML=`<div class="day-strip">${S.program.map((x,i)=>`<button class="day-btn ${i===S.currentDay?'active':''}" data-day="${i}">D${i+1}<b>${completedCount(i)}</b></button>`).join('')}</div><article class="session-card"><div class="row"><div class="kicker">DAY ${S.currentDay+1}</div><div class="kicker">${d.name.toUpperCase()}</div></div><h1>${d.name}</h1><div class="muscles">${d.muscles}</div><div class="session-meta"><div class="meta-block"><b>${S.minutes} MIN</b><small>SESSION</small></div><div class="meta-block"><b>${formatName()}</b><small>FORMAT</small></div><div class="meta-block"><b>${done}/${d.ids.length}</b><small>DONE</small></div></div><button id="startSession" class="primary-cta">START SESSION →</button></article><div class="section-head"><h2>TODAY</h2><small>TAP TO START THERE</small></div><div class="today-list">${d.ids.map((id,i)=>exerciseRow(findEx(id),i)).join('')}</div>`;
 $$('[data-day]').forEach(b=>b.onclick=()=>{S.currentDay=+b.dataset.day;save();renderHome()});
 $$('[data-today-ex]').forEach(b=>b.onclick=()=>openDetail(findEx(b.dataset.todayEx),{startIndex:+b.dataset.index,day:S.currentDay}));
 $('#startSession').onclick=()=>startWorkout(0,S.currentDay);
}
function formatName(){return S.minutes<=45?'SUPERSETS':'STRAIGHT SETS'}
function exerciseRow(ex,i){const r=rx(ex);return `<button class="exercise-row" data-today-ex="${ex.id}" data-index="${i}"><span class="exercise-code">${ex.code||String(i+1)}</span><span><b>${ex.name}</b><small>${ex.muscles.toUpperCase()}</small></span><span class="rx">${r.sets} × ${r.reps} ›</span></button>`}
function completedCount(day){const d=S.program[day];if(!d)return 0;return d.ids.filter((id,i)=>S.completed[`${day}:${i}`]).length}
function renderPlan(){const weeks=[1,2,3,4];$('#pagePlan').innerHTML=`<div class="library-head"><h1>Plan</h1><div class="accent-label">MONTH 1</div></div><div class="plan-tabs"><button class="active">MONTHLY</button><button>2-WEEK BLOCKS</button></div><div class="month-card"><div class="accent-label">CURRENT MONTH</div><h3>${S.goal}</h3><p class="block-note">Your load or rep target changes every two weeks while the weekly structure remains recognizable.</p>${weeks.map(w=>weekHtml(w)).join('')}</div>`;$$('[data-plan-day]').forEach(b=>b.onclick=()=>{S.currentDay=+b.dataset.planDay;S.currentWeek=+b.dataset.week;save();showMain('home')})}
function weekHtml(w){const block=Math.floor((w-1)/2),label=block===0?'Base & technique':'Progress load or reps';return `<div class="week-card"><div class="week-title"><div><span class="week-chip">WEEK ${w}</span><b style="margin-left:8px">${w<=2?'Foundation':'Progression'}</b></div><span class="muted">${label}</span></div><div class="week-days">${S.program.map((d,i)=>`<button class="plan-day" data-plan-day="${i}" data-week="${w}"><strong>D${i+1} · ${d.name}</strong><span>${S.minutes} min ›</span></button>`).join('')}</div></div>`}
function renderLibrary(){const cats=['All','Chest','Back','Shoulders','Arms','Quads','Glutes','Hamstrings','Calves'];const list=EX.filter(e=>S.libraryFilter==='All'||e.cat===S.libraryFilter);$('#pageLibrary').innerHTML=`<div class="library-head"><h1>Library</h1><div class="accent-label">${EX.length} MOVES</div></div><div class="filters">${cats.map(c=>`<button class="pill ${S.libraryFilter===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div><div class="library-grid">${list.map(e=>libraryCard(e)).join('')}</div>`;$$('[data-filter]').forEach(b=>b.onclick=()=>{S.libraryFilter=b.dataset.filter;save();renderLibrary()});$$('[data-lib-ex]').forEach(b=>b.onclick=()=>openDetail(findEx(b.dataset.libEx),{}))}
function libraryCard(e){return `<button class="library-card" data-lib-ex="${e.id}"><div class="library-img">${e.media?`<img src="${e.media}" alt="${esc(e.name)}">`:`<div class="library-placeholder">${e.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</div>`}</div><div class="library-copy"><b>${e.name}</b><small>${e.muscles.toUpperCase()}</small></div></button>`}
function renderProfile(){const focus=priorityAreas.filter(a=>['focus','priority'].includes(S.priorities[a])).slice(0,3).join(' · ')||'Balanced';$('#pageProfile').innerHTML=`<div class="profile-system"><div class="accent-label">CURRENT SYSTEM</div><h1>${S.goal}</h1><p>${focus}</p></div><div class="profile-metrics"><div class="profile-metric"><b>${S.days}</b><small>DAYS</small></div><div class="profile-metric"><b>${S.minutes}</b><small>MINUTES</small></div><div class="profile-metric"><b style="font-size:20px">${S.experience.toUpperCase()}</b><small>LEVEL</small></div></div><div class="profile-actions"><button class="profile-action" data-profile="rebuild"><b>Rebuild my program</b><small>Change goals, focus, schedule or equipment.</small></button><button class="profile-action" data-profile="edit"><b>Edit individual days</b><small>Add, remove, reorder or change prescriptions.</small></button><button class="profile-action" data-profile="reset"><b>Reset workout progress</b><small>Keep the program and clear completed sets.</small></button><button class="profile-action" data-profile="connected"><b>Connected Data</b><small>Garmin / Strava activity import and connection status.</small></button><button class="profile-action" data-profile="nutrition"><b>Nutrition & Food Profile</b><small>Targets, allergies and foods to avoid.</small></button><button class="profile-action" data-profile="music"><b>Music / DRIVE</b><small>Local, Spotify and YouTube Music preferences.</small></button><button class="profile-action danger" data-profile="startover"><b>Start completely over</b><small>Delete this profile and generated schedule.</small></button></div><div class="medical-note"><b>NOT MEDICAL CARE</b>Programming is educational. A swollen, locking, unstable or acutely painful joint needs qualified assessment.</div>`;$$('[data-profile]').forEach(b=>b.onclick=()=>profileAction(b.dataset.profile))}
function profileAction(k){if(k==='rebuild'){showBuilder(0);return}if(k==='edit'){showDayEditor();return}if(k==='reset'){S.completed={};S.history=[];save();toast('Workout progress reset');renderProfile();return}if(k==='connected'){showConnected();return}if(k==='nutrition'){showNutrition();return}if(k==='music'){showDrive();return}if(k==='startover'){showConfirmStartOver()}}
function findEx(id){return EX.find(e=>e.id===id)||EX[0]}
function openDetail(ex,opt={}){const r=rx(ex);const ov=$('#exerciseDetail');ov.classList.remove('hidden');ov.innerHTML=`<div class="overlay-head"><button id="detailBack">‹</button><div class="tiny-label">EXERCISE DETAIL</div><span></span></div><div class="detail-page"><div class="demo-stage">${ex.media?`<img src="${ex.media}" alt="${esc(ex.name)}">`:`<div class="demo-placeholder">${ex.name}<br><small>Demonstration coming soon</small></div>`}</div><span class="detail-code">${ex.code} · ${ex.muscles.toUpperCase()}</span><h1>${ex.name}</h1><p class="cue">${ex.cue}</p><div class="workout-stats"><div class="workout-stat"><b>${r.sets}</b><small>SETS</small></div><div class="workout-stat"><b>${r.reps}</b><small>REPS</small></div><div class="workout-stat"><b>${r.rest}s</b><small>REST</small></div></div><div class="detail-list"><div class="detail-item"><b>PURPOSE</b><p>${ex.muscles}. ${S.goal} programming.</p></div><div class="detail-item"><b>COMMON MISTAKES</b><p>${ex.errors}</p></div><div class="detail-item"><b>ALTERNATIVES</b><p>${ex.alts}</p></div></div><button id="detailStart" class="primary-cta">${opt.startIndex!==undefined?'START FROM HERE':'USE IN TODAY\'S WORKOUT'} →</button></div>`;$('#detailBack').onclick=()=>ov.classList.add('hidden');$('#detailStart').onclick=()=>{ov.classList.add('hidden');if(opt.startIndex!==undefined)startWorkout(opt.startIndex,opt.day);else{const d=currentProgramDay();if(!d.ids.includes(ex.id))d.ids.push(ex.id);save();showMain('home');toast('Added to today')}}}
function startWorkout(index=0,day=S.currentDay){workout.open=true;workout.day=day;workout.index=index;workout.set=0;workout.rep=0;workout.elapsed=0;workout.paused=false;clearInterval(workout.timer);workout.timer=setInterval(()=>{if(!workout.paused)workout.elapsed++},1000);$('#workoutOverlay').classList.remove('hidden');renderWorkout();if(S.music.autoStart)playAudio()}
function workoutEx(){const d=S.program[workout.day]||currentProgramDay();return findEx(d.ids[workout.index])}
function renderWorkout(){const d=S.program[workout.day]||currentProgramDay(),ex=workoutEx(),r=rx(ex);const next=workout.index<d.ids.length-1?findEx(d.ids[workout.index+1]):null;const ov=$('#workoutOverlay');ov.innerHTML=`<div class="overlay-head"><button id="workoutBack">‹</button><div><div class="tiny-label">WORKOUT ACTIVE</div><b>${workout.index+1}/${d.ids.length}</b></div><button id="workoutFinish" class="icon-btn" style="font-size:12px">END</button></div><div class="demo-stage">${ex.media?`<img src="${ex.media}" alt="${esc(ex.name)}">`:`<div class="demo-placeholder">${ex.name}<br><small>Demonstration coming soon</small></div>`}</div><span class="detail-code">${ex.code} · ${ex.muscles.toUpperCase()}</span><h1>${ex.name}</h1><p class="cue">${ex.cue}</p><div class="workout-stats"><div class="workout-stat"><b>${r.sets}</b><small>SETS</small></div><div class="workout-stat"><b>${r.reps}</b><small>REPS</small></div><div class="workout-stat"><b>${r.rest}s</b><small>REST</small></div></div><div class="set-progress">${Array.from({length:r.sets},(_,i)=>`<span class="set-dot ${i<workout.set?'done':i===workout.set?'active':''}">${i+1}</span>`).join('')}</div><div class="rep-counter"><div><span class="accent-label">CURRENT SET</span><strong>${workout.set+1}/${r.sets}</strong></div><button id="completeSet">COMPLETE SET</button></div>${next?`<div class="next-card"><div class="next-row"><div><div class="next-label">UP NEXT</div><b>${next.name}</b><div class="block-note">${rx(next).sets} × ${rx(next).reps}</div></div><span style="font-size:28px">→</span></div></div>`:''}`;$('#workoutBack').onclick=()=>{workout.paused=true;toast('Workout paused')};$('#workoutFinish').onclick=finishWorkout;$('#completeSet').onclick=()=>completeSet(r)}
function completeSet(r){workout.set++;workout.rep=0;if(workout.set>=r.sets){const key=`${workout.day}:${workout.index}`;S.completed[key]=true;save();const d=S.program[workout.day];if(workout.index<d.ids.length-1){startRest(r.rest,true)}else{startRest(r.rest,false)}}else startRest(r.rest,false)}
function startRest(seconds,advanceExercise){workout.restLeft=seconds;workout.paused=true;const ov=$('#restOverlay');ov.classList.remove('hidden');ov.innerHTML=`<div class="overlay-head"><button id="restBack">‹</button><div><div class="tiny-label">REST</div><b id="restSetLabel">Recover for the next effort</b></div><span></span></div><div class="rest-ring"><div><strong id="restSeconds">${seconds}</strong><span>seconds</span></div></div><div class="next-card"><div class="next-label">${advanceExercise?'NEXT EXERCISE':'NEXT SET'}</div><b>${advanceExercise?((S.program[workout.day].ids[workout.index+1]&&findEx(S.program[workout.day].ids[workout.index+1]).name)||'Finish'):workoutEx().name}</b></div><div class="rest-actions"><button id="pauseRest" class="btn ghost">PAUSE</button><button id="skipRest" class="btn lime">SKIP REST</button></div>`;let paused=false;clearInterval(workout.restTimer);workout.restTimer=setInterval(()=>{if(paused)return;workout.restLeft--;$('#restSeconds').textContent=Math.max(0,workout.restLeft);if(workout.restLeft<=0){clearInterval(workout.restTimer);finishRest(advanceExercise)}},1000);$('#restBack').onclick=()=>{paused=true;$('#pauseRest').textContent='RESUME'};$('#pauseRest').onclick=()=>{paused=!paused;$('#pauseRest').textContent=paused?'RESUME':'PAUSE'};$('#skipRest').onclick=()=>{clearInterval(workout.restTimer);finishRest(advanceExercise)}}
function finishRest(advanceExercise){$('#restOverlay').classList.add('hidden');if(advanceExercise){workout.index++;workout.set=0}workout.paused=false;renderWorkout()}
function finishWorkout(){clearInterval(workout.timer);clearInterval(workout.restTimer);$('#restOverlay').classList.add('hidden');$('#workoutOverlay').classList.add('hidden');workout.open=false;S.history.push({date:Date.now(),day:workout.day,duration:workout.elapsed});save();if(S.music.autoStop)pauseAudio();showMain('home');toast('Workout saved')}
function showSheet(title,html){$('#sheet').classList.remove('hidden');$('#sheetCard').innerHTML=`<div class="sheet-handle"></div><div class="section-head" style="margin-top:0"><h2>${title}</h2><button id="sheetClose" class="icon-btn">×</button></div>${html}`;$('#sheetClose').onclick=closeSheet}
function closeSheet(){$('#sheet').classList.add('hidden')}
function showDrive(){showSheet('DRIVE',`<div class="music-player"><div class="music-row"><div class="music-cover">♫</div><div style="flex:1"><div class="accent-label">WORKOUT MUSIC</div><b id="trackName">${esc(S.music.trackName||'No local track selected')}</b></div></div><div class="music-controls"><button id="musicPrev">‹</button><button id="musicPlay" class="play">▶</button><button id="musicNext">›</button></div></div><div class="sheet-list" style="margin-top:12px"><button id="pickLocal" class="sheet-option"><b>Local Storage</b><small>Choose a full audio file from this phone.</small></button><button id="openSpotify" class="sheet-option"><b>Spotify</b><small>Open Spotify externally.</small></button><button id="openYoutube" class="sheet-option"><b>YouTube Music</b><small>Open YouTube Music externally.</small></button><label class="toggle-row"><span>Start music with workout</span><input id="autoStart" type="checkbox" ${S.music.autoStart?'checked':''}></label><label class="toggle-row"><span>Stop music when workout ends</span><input id="autoStop" type="checkbox" ${S.music.autoStop?'checked':''}></label></div>`);$('#pickLocal').onclick=()=>$('#audioPicker').click();$('#musicPlay').onclick=toggleAudio;$('#openSpotify').onclick=()=>location.href='https://open.spotify.com/';$('#openYoutube').onclick=()=>location.href='https://music.youtube.com/';$('#autoStart').onchange=e=>{S.music.autoStart=e.target.checked;save()};$('#autoStop').onchange=e=>{S.music.autoStop=e.target.checked;save()}}
function selectAudio(file){if(!file)return;if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(file);$('#audioPlayer').src=audioUrl;S.music.trackName=file.name;save();const t=$('#trackName');if(t)t.textContent=file.name;toast('Music selected')}
function playAudio(){const a=$('#audioPlayer');if(a.src)a.play().catch(()=>{})}

function systemStep(){return `<div class="builder-head"><div class="step">02 · TRAINING TYPE</div><h1>Choose your <em>system.</em></h1><p>Training type is separate from your goals. Select one or several approaches.</p></div><div class="goal-grid-v29">${SYSTEMS.map(x=>`<button class="train-type-card ${S.trainingSystems.includes(x)?'selected':''}" data-system29="${x}"><b>${x}</b><span>${x.includes('Hybrid')?'Strength + running in one coordinated week.':x.includes('Rehab')?'Recovery-focused structure with compatible training.':'Use this structure inside the generated week.'}</span></button>`).join('')}</div><label class="section-label">RUNNING SESSION TYPES</label><div class="type-chip-row">${RUN_TYPES.map(x=>`<button class="type-chip ${S.runTypes.includes(x)?'selected':''}" data-runtype29="${x}">${x}</button>`).join('')}</div>`}
function scheduleStep(){return `<div class="builder-head"><div class="step">04 · SCHEDULE + EXERCISES</div><h1>Build your <em>week.</em></h1><p>Set your total training time and control the exact exercise pool.</p></div><label class="section-label">TRAINING DAYS</label><div class="choice-row">${[2,3,4,5,6,7].map(x=>`<button class="choice-btn ${S.days===x?'selected':''}" data-days="${x}">${x} DAYS</button>`).join('')}</div><label class="section-label">SESSION LENGTH</label><div class="choice-row">${[30,45,60,75].map(x=>`<button class="choice-btn ${S.minutes===x?'selected':''}" data-min="${x}">${x} MIN</button>`).join('')}</div><label class="section-label">EQUIPMENT</label><div class="option-stack">${[['Full Gym','Machines, cables and free weights.'],['Dumbbells + Bench','Compact free-weight setup.'],['Bodyweight','No loaded equipment required.'],['Machines / Cables','Selectorized machines and cables.'],['Custom','Use your available setup.']].map(([x,d])=>`<button class="option-card ${S.equipment===x?'selected':''}" data-equip="${x}"><b>${x}</b><span>${d}</span></button>`).join('')}</div><label class="section-label">EXERCISE POOL</label><button class="option-card" id="manageBuilder29"><b>${countEnabled()} / ${catalog().length} enabled</b><span>Select or unselect any exercise. The program only uses enabled exercises.</span></button>`}
function summary29(){const r=race(),p=r&&S.race.targetTime&&C?C.paceTargets(r,S.race.targetTime):null;return `<div class="builder-head"><div class="step">06 · REVIEW</div><h1>Your system is <em>ready.</em></h1><p>One coordinated plan will combine your selected goals and training types.</p></div><div class="summary-hero"><div class="accent-label">ACTIVE GOALS</div><h2>${esc2(goalsText())}</h2><div class="block-note">${S.trainingSystems.join(' + ')}</div></div><div class="summary-list"><div class="summary-row"><span>Schedule</span><b>${S.days} days · ${S.minutes} min</b></div><div class="summary-row"><span>Experience</span><b>${S.experience}</b></div><div class="summary-row"><span>Equipment</span><b>${S.equipment}</b></div><div class="summary-row"><span>Exercises</span><b>${countEnabled()} / ${catalog().length}</b></div><div class="summary-row"><span>Injuries</span><b>${S.injuries.length?S.injuries.join(', '):'None'}</b></div>${r?`<div class="summary-row"><span>${r} target</span><b>${esc2(S.race.targetTime)}${p?' · '+C.formatClock(p.race)+'/km':''}</b></div>`:''}</div>`}
function bindBuilder29(){$$('[data-goal29]').forEach(b=>b.onclick=()=>{const g=b.dataset.goal29;S.goals.includes(g)?S.goals=S.goals.filter(x=>x!==g):S.goals.push(g);if(!S.goals.length)S.goals=['Get Stronger'];save();renderBuilder()});$$('[data-race29]').forEach(b=>b.onclick=()=>{const r=b.dataset.race29,was=race()===r;S.goals=S.goals.filter(x=>!RACES.includes(x));if(!was){S.goals.push(r);S.race.goal=r;S.race.targetTime=C.defaultTarget(r)}else{S.race.goal='';S.race.targetTime=''}save();renderBuilder()});$$('[data-system29]').forEach(b=>b.onclick=()=>{const x=b.dataset.system29;S.trainingSystems.includes(x)?S.trainingSystems=S.trainingSystems.filter(v=>v!==x):S.trainingSystems.push(x);if(!S.trainingSystems.length)S.trainingSystems=['Strength'];save();renderBuilder()});$$('[data-runtype29]').forEach(b=>b.onclick=()=>{const x=b.dataset.runtype29;S.runTypes.includes(x)?S.runTypes=S.runTypes.filter(v=>v!==x):S.runTypes.push(x);save();renderBuilder()});$$('[data-exp]').forEach(b=>b.onclick=()=>{S.experience=b.dataset.exp;save();renderBuilder()});$$('[data-days]').forEach(b=>b.onclick=()=>{S.days=+b.dataset.days;save();renderBuilder()});$$('[data-min]').forEach(b=>b.onclick=()=>{S.minutes=+b.dataset.min;save();renderBuilder()});$$('[data-equip]').forEach(b=>b.onclick=()=>{S.equipment=b.dataset.equip;save();renderBuilder()});const m=$('#manageBuilder29');if(m)m.onclick=()=>showExerciseManager(true)}
function capture29(){if(S.builderStep===0){S.name=($('#name29')?.value||S.name||'Athlete').trim()||'Athlete';const r=race();if(r){S.race.targetTime=($('#target29')?.value||S.race.targetTime||C.defaultTarget(r)).trim();S.race.raceDate=$('#raceDate29')?.value||'';S.race.currentTime=($('#current29')?.value||'').trim();S.race.weeklyKm=Math.max(5,+$('#km29')?.value||15)}}if(S.builderStep===4&&S.injuries?.[0]){const x=S.injuries[0];S.injuryDetails[x]=S.injuryDetails[x]||{};S.injuryDetails[x].notes=$('#injuryNotes')?.value?.trim()||S.injuryDetails[x].notes||''}save()}

function showExerciseManager(fromBuilder=false){const cats=['All','Chest','Back','Shoulders','Arms','Quads','Glutes','Hamstrings','Calves','Core','Rehab'];let filter='All';const draw=()=>{const list=catalog().filter(e=>filter==='All'||e.cat===filter);sheet('Exercise Selection',`<div class="medical-note"><b>YOUR EXERCISE POOL</b>Only enabled exercises can be selected by the program. You can change this any time.</div><div class="library-filters-v29">${cats.map(c=>`<button class="${filter===c?'active':''}" data-ef29="${c}">${c}</button>`).join('')}</div><div class="library-grid">${list.map(e=>exerciseCard(e,true)).join('')}</div><button id="savePool29" class="manage-btn-v29">SAVE + REBUILD PROGRAM</button>`);$$('[data-ef29]',$('#sheetCard')).forEach(b=>b.onclick=()=>{filter=b.dataset.ef29;draw()});$$('[data-toggle29]',$('#sheetCard')).forEach(b=>b.onclick=()=>{const id=b.dataset.toggle29;if(enabled(id)&&countEnabled()===1){toast('Keep at least one exercise');return}S.exerciseEnabled[id]=!enabled(id);save();draw()});$('#savePool29').onclick=()=>{if(S.built)buildProgram();closeSheet();fromBuilder?renderBuilder():showMain('train');toast('Exercise pool updated')}};draw()}
function exerciseCard(e,onlyToggle=false){const p=mediaPoster(e);return `<article class="library-card-v29 ${enabled(e.id)?'':'disabled'}"><button class="toggle ${enabled(e.id)?'on':''}" data-toggle29="${e.id}">${enabled(e.id)?'✓':'+'}</button><div class="media" ${onlyToggle?'':`data-open29="${e.id}"`}>${p?`<img src="${p}" alt="${esc2(e.name)}">`:`<div style="height:100%;display:grid;place-items:center;color:#111;font-weight:950">${esc2(e.name)}</div>`}</div><div class="copy" ${onlyToggle?'':`data-open29="${e.id}"`}><b>${esc2(e.name)}</b><small>${esc2(e.muscles).toUpperCase()}</small></div></article>`}
// ----- program generation -----
function strengthIds(kind){const all=catalog().filter(e=>enabled(e.id)&&e.cat!=='Running');const cats=kind==='upper'?['Chest','Back','Shoulders','Arms','Core']:kind==='lower'?['Quads','Glutes','Hamstrings','Calves','Core','Rehab']:null;let a=all.filter(e=>!cats||cats.includes(e.cat));const knee=S.injuries.includes('Knee');const back=S.injuries.includes('Back');if(knee)a=a.filter(e=>!['split'].includes(e.id));if(back)a=a.filter(e=>e.id!=='rdl');return a.slice(0,Math.max(4,Math.min(7,Math.round(S.minutes/10)+1))).map(e=>e.id)}
function rehabIds(){const pref=S.injuries.includes('Knee')?['sled','stepup','seatedcalf','hamcurl','pallof','sideplank','hipthrust']:S.injuries.includes('Achilles')?['seatedcalf','calf','stepup','pallof','sideplank']:S.injuries.includes('Back')?['pallof','sideplank','frontplank','hipthrust','onearmrow']:S.injuries.includes('Hamstring')?['hipthrust','hamcurl','pallof','stepup']:['pallof','sideplank','stepup','seatedcalf'];return pref.filter(id=>enabled(id)).slice(0,5)}
function hasStrength(){return S.trainingSystems.some(x=>['Strength','Hypertrophy','Full Body','Upper / Lower','Push / Pull / Legs','Hybrid Strength + Running','Rehab + Strength','Custom'].includes(x))||S.goals.some(x=>['Build Muscle','Get Stronger','Lose Fat','Get Fit','Athletic Performance'].includes(x))}
function hasRun(){return !!race()||S.goals.includes('Running / Endurance')||S.trainingSystems.some(x=>x.includes('Running'))}
function hasRehab(){return S.goals.includes('Injury Recovery / Rehab')||S.injuries.length>0||S.trainingSystems.some(x=>x.includes('Rehab'))}
function makeRun(kind,dist){const r=race()||'5K';return{type:'run',name:kind,time:'07:00',duration:S.minutes,distanceKm:dist||Math.max(3,Math.round((S.race.weeklyKm||15)/3)),kind,ids:[],muscles:`${r} · Running`}}
function addSession(week,day,session){week[day].sessions.push(session)}
buildProgram=function(){ensure();const week=Array.from({length:7},(_,i)=>({day:i,sessions:[]}));let strengthN=hasStrength()?Math.min(4,Math.max(2,Math.round(S.days*0.5))):0;let runN=hasRun()?Math.min(4,Math.max(2,Math.round(S.days*0.5))):0;let rehabN=hasRehab()?2:0;if(strengthN+runN+rehabN>S.days+3){rehabN=Math.min(2,rehabN)}const upper={type:'strength',name:'Upper Strength',time:'12:00',duration:S.minutes,ids:strengthIds('upper'),muscles:'Chest · Back · Shoulders'};const lower={type:'strength',name:'Lower Strength',time:'12:00',duration:S.minutes,ids:strengthIds('lower'),muscles:'Quads · Glutes · Hamstrings'};const full={type:'strength',name:'Full Body Strength',time:'12:00',duration:S.minutes,ids:strengthIds('full'),muscles:'Full Body'};if(strengthN){addSession(week,1,upper);if(strengthN>1)addSession(week,3,lower);if(strengthN>2)addSession(week,5,full);if(strengthN>3)addSession(week,0,{...upper,name:'Upper Strength B'})}if(runN){const types=S.runTypes.length?S.runTypes:['Easy Run','Tempo','Long Run'];addSession(week,2,makeRun(types.includes('Easy Run')?'Easy Run':types[0],Math.max(3,Math.round((S.race.weeklyKm||15)*.25))));if(runN>1)addSession(week,4,makeRun(types.includes('Intervals')?'Intervals':types.includes('Tempo')?'Tempo':types[1]||'Tempo',Math.max(3,Math.round((S.race.weeklyKm||15)*.3))));if(runN>2)addSession(week,0,makeRun(types.includes('Long Run')?'Long Run':types[2]||'Long Run',Math.max(5,Math.round((S.race.weeklyKm||15)*.45))));if(runN>3)addSession(week,6,makeRun(types.includes('Recovery Run')?'Recovery Run':'Easy Run',3))}if(rehabN){const re={type:'rehab',name:(S.injuries[0]||'Recovery')+' Rehab',time:'18:00',duration:Math.min(30,S.minutes),ids:rehabIds(),muscles:'Mobility · Stability · Control'};addSession(week,2,re);if(rehabN>1)addSession(week,6,{...re,time:'18:00'})}week.forEach(d=>{if(!d.sessions.length)addSession(week,d.day,{type:'recovery',name:'Recovery / Mobility',time:'18:00',duration:20,ids:rehabIds().slice(0,3),muscles:'Recovery'})});const flat=[];week.forEach(d=>d.sessions.forEach(s=>{s.programIndex=flat.length;flat.push({...s})}));S.weekPlan=week;S.program=flat;S.currentDay=0;S.currentWeek=1;S.completed={};S.programVersion=29;save()};
function todayDay(){ensure();if(!S.weekPlan||!S.weekPlan.length)buildProgram();return S.weekPlan[new Date().getDay()]}
function primarySession(day){return day.sessions.find(s=>s.type!=='recovery')||day.sessions[0]}
// ----- Home -----
renderHome=function(){ensure();if(!S.weekPlan?.length)buildProgram();const d=todayDay(),p=primarySession(d),r=race(),pace=r&&S.race.targetTime&&C?C.paceTargets(r,S.race.targetTime):null;const blocks=p.type==='run'?[['Warm Up','5 min','Easy jog + mobility'],[p.name,`${Math.max(20,p.duration-15)} min`,pace?`${C.formatClock((pace.easy?.[0]||pace.race))}–${C.formatClock((pace.easy?.[1]||pace.race))}/km`:'Controlled effort'],hasRehab()?['Rehab','8–10 min','Targeted exercises']:['Strides','5 min','Relaxed technique'],['Cool Down','5 min','Easy jog + mobility']]:p.ids.slice(0,4).map((id,i)=>[byId(id).name,`${rx(byId(id)).sets} × ${rx(byId(id)).reps}`,i===0?'Start here':'Next exercise']);$('#pageHome').innerHTML=`<section class="hero-v29"><div class="kicker">YOUR GOALS</div><h1>${esc2(goalsText())}</h1><div class="goal-icons-v29">${S.goals.slice(0,3).map((g,i)=>`<div class="goal-chip-v29"><i>${i===0?'⌁':i===1?'♡':'▥'}</i><div><b>${esc2(g)}</b></div></div>`).join('')}</div></section><section class="today-card-v29"><div class="kicker">CURRENT WORKOUT · ${fmtDate(new Date()).toUpperCase()}</div><h2>${esc2(p.name)}${p.type==='run'&&hasRehab()?' + '+(S.injuries[0]||'Recovery')+' Rehab':''}</h2><div class="today-meta-v29"><div><b>${p.duration} min</b><small>DURATION</small></div><div><b>${p.type==='run'?(pace?C.formatClock(pace.race)+'/km':'Easy pace'):p.ids.length+' exercises'}</b><small>${p.type==='run'?'PACE TARGET':'WORK'}</small></div><div><b>${p.type==='run'?'Build endurance':p.muscles}</b><small>PURPOSE</small></div></div><div class="today-blocks-v29">${blocks.map((b,i)=>`<div class="today-block-v29"><b>${i+1}. ${esc2(b[0])}</b><small>${esc2(b[1])}<br>${esc2(b[2])}</small></div>`).join('')}</div><div class="today-actions-v29">${p.type==='run'?`<button class="run" id="homeRun29">▶ START RUN</button>`:''}<button class="session" id="homeSession29">▦ ${p.type==='run'&&hasRehab()?'START REHAB':'START SESSION'}</button></div></section><div class="split-v29"><section class="mini-card-v29"><div class="kicker">NEXT UP</div><h3>${nextSessionName()}</h3><div class="block-note">Tomorrow / next scheduled session</div></section><section class="mini-card-v29"><div class="kicker">THIS WEEK</div><div class="week-dots-v29">${['S','M','T','W','T','F','S'].map((x,i)=>`<i class="${i===new Date().getDay()?'today':''}">${x}</i>`).join('')}</div><div class="block-note">${S.weekPlan.reduce((a,x)=>a+x.sessions.filter(s=>s.type!=='recovery').length,0)} planned sessions</div></section></div><section class="mini-card-v29" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center"><div><div class="kicker" style="color:var(--lime)">VOICE COACH</div><h3>Ready to coach your run</h3><div class="block-note">Real-time pace cues and session guidance.</div></div><button class="choice-btn ${S.voiceCoach.enabled?'selected':''}" id="voiceToggle29">${S.voiceCoach.enabled?'ON':'OFF'}</button></section>`;if($('#homeRun29'))$('#homeRun29').onclick=()=>startRun(p);$('#homeSession29').onclick=()=>{const target=p.type==='run'?d.sessions.find(s=>s.type==='rehab'):p;if(target&&target.ids?.length){S.currentDay=target.programIndex;save();startWorkout(0,target.programIndex)}else toast('No strength/rehab block today')};$('#voiceToggle29').onclick=()=>{S.voiceCoach.enabled=!S.voiceCoach.enabled;save();renderHome()}}
function nextSessionName(){const w=S.weekPlan;const t=new Date().getDay();for(let n=1;n<8;n++){const d=w[(t+n)%7],s=d.sessions.find(x=>x.type!=='recovery');if(s)return s.name}return'Recovery'}
// ----- Plan -----
renderPlan=function(){ensure();if(!S.weekPlan?.length)buildProgram();const mode=S.planMode||'monthly';$('#pagePlan').innerHTML=`<div class="page-title-v29"><div><h1>Plan</h1><div class="block-note">Weekly, calendar and progression blocks.</div></div></div><div class="seg-v29"><button data-planmode="weekly" class="${mode==='weekly'?'active':''}">WEEKLY</button><button data-planmode="monthly" class="${mode==='monthly'?'active':''}">MONTHLY</button><button data-planmode="blocks" class="${mode==='blocks'?'active':''}">2-WEEK BLOCKS</button></div>${mode==='monthly'?monthlyHtml():mode==='weekly'?weeklyHtml():blocksHtml()}`;$$('[data-planmode]').forEach(b=>b.onclick=()=>{S.planMode=b.dataset.planmode;save();renderPlan()});$$('[data-date29]').forEach(b=>b.onclick=()=>{S.selectedDate=b.dataset.date29;save();renderPlan()});$$('[data-session29]').forEach(b=>b.onclick=()=>openPlanSession(+b.dataset.session29));$$('[data-weekstart29]').forEach(b=>b.onclick=()=>openPlanSession(+b.dataset.weekstart29))}
function sessionsForDate(date){return S.weekPlan[date.getDay()].sessions}
function monthlyHtml(){const sel=new Date(S.selectedDate+'T12:00:00'),base=isNaN(sel)?new Date():sel,y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),days=Array.from({length:42},(_,i)=>new Date(start.getFullYear(),start.getMonth(),start.getDate()+i));const selected=new Date(S.selectedDate+'T12:00:00');const sessions=sessionsForDate(selected);return `<div class="calendar-v29"><div class="cal-head-v29"><button class="cal-arrow" data-month29="-1">‹</button><h2>${new Intl.DateTimeFormat('en',{month:'long',year:'numeric'}).format(first)}</h2><button class="cal-arrow" data-month29="1">›</button></div><div class="cal-weekdays">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-grid">${days.map(d=>`<button class="cal-day ${d.getMonth()!==m?'other':''} ${ymd(d)===S.selectedDate?'selected':''}" data-date29="${ymd(d)}"><span>${d.getDate()}</span><span class="cal-markers">${sessionsForDate(d).slice(0,4).map(s=>`<i class="m-${s.type}"></i>`).join('')}</span></button>`).join('')}</div></div>${daySessionsHtml(selected,sessions)}`}
function weeklyHtml(){return `<div class="day-sessions-v29"><header><h2>This Week</h2><b>${S.weekPlan.reduce((a,d)=>a+d.sessions.length,0)} sessions</b></header>${S.weekPlan.map((d,i)=>`<section style="border-top:1px solid var(--line);padding:15px 0"><div class="kicker">${['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'][i]}</div>${d.sessions.map(s=>sessionRow(s)).join('')}</section>`).join('')}</div>`}
function blocksHtml(){return `<div class="day-sessions-v29">${[['WEEKS 1–2','Foundation','Establish tolerable volume, technique and easy aerobic work.'],['WEEKS 3–4','Build','Increase selected reps, load or running volume.'],['WEEKS 5–6','Specific','Shift more quality toward your strongest goal.'],['WEEKS 7–8','Consolidate','Keep quality while controlling fatigue.']].map(x=>`<section class="mini-card-v29" style="margin-bottom:10px"><div class="kicker">${x[0]}</div><h2>${x[1]}</h2><div class="block-note">${x[2]}</div></section>`).join('')}</div>`}

function sessionRow(s){const color=s.type==='run'?'var(--blue)':s.type==='strength'?'var(--orange)':s.type==='rehab'?'var(--purple)':s.type==='recovery'?'#73f34a':'var(--rest)';return `<button class="session-row-v29" data-session29="${s.programIndex}" style="width:100%;border-left:0;border-right:0;border-bottom:0;color:inherit;background:transparent;text-align:left"><b>${s.time||'--:--'}</b><i class="session-icon-v29" style="background:${color}">${s.type==='run'?'↗':s.type==='strength'?'▥':s.type==='rehab'?'+':'♡'}</i><span><b>${esc2(s.name)}</b><small>${s.type==='run'?`${s.distanceKm||''} km · ${s.duration} min`:`${s.duration} min · ${s.ids?.length||0} exercises`}</small></span><b>›</b></button>`}

const REC={Knee:['sled','stepup','hipthrust','sideplank','seatedcalf','hamcurl'],Hip:['hipthrust','sideplank','pallof','stepup'],Back:['pallof','sideplank','frontplank','hipthrust'],Achilles:['seatedcalf','calf','stepup','sled'],Ankle:['seatedcalf','calf','stepup','sideplank'],Hamstring:['hamcurl','hipthrust','pallof','stepup']};
function showRecover(){ensure();const area=(S.injuries.find(x=>REC[x])||Object.keys(REC)[0]);drawRecover(area)}
function drawRecover(area){S.recoveryProfiles[area]=S.recoveryProfiles[area]||{pain:2,side:'Both'};const p=S.recoveryProfiles[area],ids=(REC[area]||REC.Knee).filter(id=>byId(id));sheet('Recover',`<div class="recover-tabs-v29">${Object.keys(REC).map(x=>`<button class="${x===area?'active':''}" data-recarea29="${x}">${x}</button>`).join('')}</div><section class="recover-card-v29"><div class="kicker" style="color:var(--lime)">${area.toUpperCase()} RECOVERY</div><div class="pain-head-v29"><h2>Pain Level</h2><strong id="painOut29">${p.pain}/10</strong></div><input id="pain29" type="range" min="0" max="10" value="${p.pain}"><div class="side-row-v29">${['Left','Right','Both'].map(x=>`<button class="${p.side===x?'active':''}" data-recside29="${x}">${x}</button>`).join('')}</div></section><section class="mini-card-v29" style="margin-top:12px"><div class="kicker">PRECISE RECOVERY BUILDER</div><h3>${p.pain>=6?'Reduce load and prioritize symptom-limited recovery':p.pain>=3?'Controlled loading with reduced volume':'Progressive controlled strength'}</h3><div class="block-note">Recommendations adapt to the selected area, side and current pain score. This does not diagnose an injury.</div></section><div class="recovery-list-v29">${ids.slice(0,p.pain>=6?3:5).map(id=>{const e=byId(id);return`<button class="recovery-ex-v29" data-recex29="${id}" style="color:inherit;text-align:left"><img src="${mediaPoster(e)}"><span><b>${e.name}</b><small>${p.pain>=6?'Use a comfortable range and low effort.':e.cue}</small><i class="tag-v29">${e.muscles}</i></span><b>›</b></button>`}).join('')}</div><div class="medical-note"><b>TRAINING GUARDRAIL</b>Stop or regress an exercise if symptoms clearly worsen during or after the session. Seek qualified assessment for significant swelling, locking, giving way or acute loss of function.</div>`);$$('[data-recarea29]',$('#sheetCard')).forEach(b=>b.onclick=()=>drawRecover(b.dataset.recarea29));$$('[data-recside29]',$('#sheetCard')).forEach(b=>b.onclick=()=>{p.side=b.dataset.recside29;save();drawRecover(area)});$('#pain29').oninput=e=>{p.pain=+e.target.value;$('#painOut29').textContent=p.pain+'/10';save()};$('#pain29').onchange=()=>drawRecover(area);$$('[data-recex29]',$('#sheetCard')).forEach(b=>b.onclick=()=>{closeSheet();openDetail(byId(b.dataset.recex29),{})})}

function attachMotion(stage,e){if(!stage)return;const poster=mediaPoster(e);stage.innerHTML=poster?`<img src="${poster}" alt="${esc2(e.name)}">`:`<div style="height:100%;display:grid;place-items:center;color:#111">${esc2(e.name)}</div>`;const ui=document.createElement('div');ui.className='motion-ui-v29';ui.innerHTML=`<div class="motion-state-v29"><b id="motionPhase29">START</b><span>${esc2(e.muscles)}</span></div><button class="motion-play-v29">Ⅱ</button>`;stage.appendChild(ui);if(S.animationEnabled[e.id]===false){$('.motion-play-v29',ui).textContent='OFF';return}const builtin=motionSrc(e);const load=async()=>{let src=builtin;if(window.PT29Admin?.urlForExercise){const custom=await window.PT29Admin.urlForExercise(e.id);if(custom)src=custom}if(!src)return;const img=$('img',stage);const v=document.createElement('video');v.className='motion-video-v29';v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';v.src=src;if(img)img.replaceWith(v);const play=()=>v.play().catch(()=>{if(poster){const im=document.createElement('img');im.src=poster;v.replaceWith(im)}$('.motion-play-v29',ui).textContent='▶'});v.addEventListener('timeupdate',()=>{const t=v.currentTime%6,lab=t<1.1?'START':t<4.7?'ACTIVE MUSCLES':'END';const el=$('#motionPhase29',ui);if(el)el.textContent=lab});$('.motion-play-v29',ui).onclick=()=>{if(v.paused){play();$('.motion-play-v29',ui).textContent='Ⅱ'}else{v.pause();$('.motion-play-v29',ui).textContent='▶'}};play()};requestAnimationFrame(()=>requestAnimationFrame(load))}
openDetail=function(e,opt={}){const r=rx(e),ov=$('#exerciseDetail');ov.classList.remove('hidden');ov.innerHTML=`<div class="overlay-head"><button id="detailBack">‹</button><div class="tiny-label">EXERCISE DETAIL</div><span></span></div><div class="detail-page"><div class="demo-stage" id="motionStage29"></div><div class="phase-row-v29"><button data-phase29="0.1" class="active">START</button><button data-phase29="2.8">ACTIVE MUSCLES</button><button data-phase29="5.3">END</button></div><span class="detail-code">${esc2(e.cat)} · ${esc2(e.muscles)}</span><h1>${esc2(e.name)}</h1><p class="cue">${esc2(e.cue)}</p><div class="workout-stats"><div class="workout-stat"><b>${r.sets}</b><small>SETS</small></div><div class="workout-stat"><b>${r.reps}</b><small>REPS</small></div><div class="workout-stat"><b>${r.rest}s</b><small>REST</small></div></div><div class="detail-item"><b>PURPOSE</b><p>${esc2(e.muscles)}. Supports the current ${esc2(goalsText())} plan.</p></div><div class="detail-item"><b>COMMON MISTAKES</b><p>${esc2(e.errors||'Rushing the movement or losing control.')}</p></div><div class="detail-item"><b>ALTERNATIVES</b><p>${esc2(e.alts||'Use a comfortable regression or nearby machine variation.')}</p></div><button id="detailUse29" class="manage-btn-v29">${enabled(e.id)?'✓ INCLUDED IN PROGRAM':'+ ADD TO PROGRAM'}</button></div>`;$('#detailBack').onclick=()=>{ov.classList.add('hidden');$('video',ov)?.pause()};$('#detailUse29').onclick=()=>{if(enabled(e.id)&&countEnabled()===1){toast('Keep at least one exercise');return}S.exerciseEnabled[e.id]=!enabled(e.id);if(S.built)buildProgram();save();$('#detailUse29').textContent=enabled(e.id)?'✓ INCLUDED IN PROGRAM':'+ ADD TO PROGRAM'};attachMotion($('#motionStage29'),e);$$('[data-phase29]',ov).forEach(b=>b.onclick=()=>{const v=$('video',ov);$$('[data-phase29]',ov).forEach(x=>x.classList.remove('active'));b.classList.add('active');if(v){v.pause();v.currentTime=+b.dataset.phase29;$('.motion-play-v29',ov).textContent='▶'}});if(opt.startIndex!==undefined){const use=$('#detailUse29');use.textContent='START WORKOUT FROM HERE';use.onclick=()=>{ov.classList.add('hidden');startWorkout(opt.startIndex,opt.day)}}}
renderWorkout=function(){const d=S.program[workout.day]||S.program[0],e=d&&d.ids?.length?byId(d.ids[workout.index]):EX[0],r=rx(e),next=d&&workout.index<d.ids.length-1?byId(d.ids[workout.index+1]):null,ov=$('#workoutOverlay');ov.innerHTML=`<div class="overlay-head"><button id="workoutBack">‹</button><div><div class="tiny-label">WORKOUT ACTIVE</div><b>${workout.index+1}/${d.ids.length}</b></div><button id="workoutFinish" style="font-size:11px">END</button></div><div class="detail-page"><div class="demo-stage" id="workoutMotion29"></div><span class="detail-code">${e.muscles}</span><h1>${e.name}</h1><p class="cue">${e.cue}</p><div class="workout-stats"><div class="workout-stat"><b>${r.sets}</b><small>SETS</small></div><div class="workout-stat"><b>${r.reps}</b><small>REPS</small></div><div class="workout-stat"><b>${r.rest}s</b><small>REST</small></div></div><div class="set-progress">${Array.from({length:r.sets},(_,i)=>`<span class="set-dot ${i<workout.set?'done':i===workout.set?'active':''}">${i+1}</span>`).join('')}</div><div class="rep-counter"><div><span class="accent-label">CURRENT SET</span><strong>${workout.set+1}/${r.sets}</strong></div><button id="completeSet">COMPLETE SET</button></div>${next?`<div class="next-card"><div class="kicker">UP NEXT</div><h3>${next.name}</h3><div class="block-note">${rx(next).sets} × ${rx(next).reps}</div></div>`:''}</div>`;$('#workoutBack').onclick=()=>{workout.paused=true;$('video',ov)?.pause();ov.classList.add('hidden');toast('Workout paused')};$('#workoutFinish').onclick=()=>{ $('video',ov)?.pause();finishWorkout()};$('#completeSet').onclick=()=>completeSet(r);attachMotion($('#workoutMotion29'),e)}
// ----- Running -----
let runState=null,runTimer=null,lastLoc=null;
function targetPaceFor(s){const r=race(),p=r&&S.race.targetTime&&C?C.paceTargets(r,S.race.targetTime):null;if(!p)return 360;if(/easy|recovery|long/i.test(s.name))return Math.round((p.easy[0]+p.easy[1])/2);if(/tempo|threshold/i.test(s.name))return Math.round((p.tempo[0]+p.tempo[1])/2);if(/interval/i.test(s.name))return p.interval||Math.max(180,p.race-20);return p.race}
function startRun(s){const ov=$('#runOverlay');runState={session:s,start:Date.now(),elapsed:0,distance:0,currentPace:0,target:targetPaceFor(s),lastVoice:0};lastLoc=null;ov.classList.remove('hidden');drawRun();clearInterval(runTimer);runTimer=setInterval(()=>{if(!runState)return;runState.elapsed=Math.floor((Date.now()-runState.start)/1000);drawRunMetrics()},1000);try{window.PTNative?.startLocation();if(S.voiceCoach.enabled)window.PTNative?.speak('Run started. Start controlled and settle into your pace.')}catch(e){}}
function drawRun(){const s=runState.session,ov=$('#runOverlay');ov.innerHTML=`<div class="overlay-head"><button id="runBack29">‹</button><div><div class="tiny-label">RUNNING COACH</div><b>${esc2(s.name)}</b></div><button id="runEnd29" style="font-size:11px">END</button></div><div class="run-shell-v29"><section class="run-hero-v29"><div class="kicker" id="runCue29" style="color:var(--lime)">CONTROLLED OPENING</div><strong id="runPace29">--:--</strong><small>/ km · current pace</small></section><div class="run-metrics-v29"><div class="run-metric-v29"><b id="runDist29">0.00</b><small>KM</small></div><div class="run-metric-v29"><b id="runTime29">0:00</b><small>TIME</small></div><div class="run-metric-v29"><b id="runAvg29">--:--</b><small>AVG / KM</small></div><div class="run-metric-v29"><b>${C?C.formatClock(runState.target):'--:--'}</b><small>TARGET / KM</small></div></div><div class="voice-card-v29"><span><b>VOICE COACH</b><small style="display:block;color:var(--muted)">${S.voiceCoach.enabled?'ON · '+S.voiceCoach.frequency:'OFF'}</small></span><button id="runVoice29" class="choice-btn ${S.voiceCoach.enabled?'selected':''}">${S.voiceCoach.enabled?'ON':'OFF'}</button></div></div>`;$('#runBack29').onclick=()=>{toast('Run continues. Tap END to finish.')};$('#runEnd29').onclick=endRun;$('#runVoice29').onclick=()=>{S.voiceCoach.enabled=!S.voiceCoach.enabled;save();drawRun()}}
function drawRunMetrics(){if(!runState)return;const e=runState.elapsed,d=runState.distance,avg=d>0.05?e/d:0;const f=s=>C?C.formatClock(Math.round(s)):'--:--';if($('#runTime29'))$('#runTime29').textContent=`${Math.floor(e/60)}:${String(e%60).padStart(2,'0')}`;if($('#runDist29'))$('#runDist29').textContent=d.toFixed(2);if($('#runPace29'))$('#runPace29').textContent=runState.currentPace?f(runState.currentPace):'--:--';if($('#runAvg29'))$('#runAvg29').textContent=avg?f(avg):'--:--';if(runState.currentPace&&$('#runCue29')){const cue=C?.paceCue?C.paceCue(runState.currentPace,runState.target):'hold';$('#runCue29').textContent=cue==='speed-up'?'SPEED UP SLIGHTLY':cue==='slow-down'?'EASE BACK':'KEEP THIS PACE';const interval=S.voiceCoach.frequency==='Frequent'?45:S.voiceCoach.frequency==='Minimal'?150:90;if(S.voiceCoach.enabled&&e-runState.lastVoice>=interval){runState.lastVoice=e;try{window.PTNative?.speak(cue==='speed-up'?'Speed up slightly.':cue==='slow-down'?'Ease back slightly.':'You are on target. Hold this pace.')}catch(err){}}}}
function hav(a,b,c,d){const R=6371,p=Math.PI/180,dx=(c-a)*p,dy=(d-b)*p,z=Math.sin(dx/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dy/2)**2;return 2*R*Math.asin(Math.sqrt(z))}
function onLocation(lat,lon,speed,accuracy){if(!runState||accuracy>40)return;const now={lat,lon,t:Date.now()};if(lastLoc){const km=hav(lastLoc.lat,lastLoc.lon,lat,lon);if(km<.2)runState.distance+=km}lastLoc=now;if(speed>.5)runState.currentPace=1000/speed;drawRunMetrics()}
function endRun(){if(!runState)return;clearInterval(runTimer);try{window.PTNative?.stopLocation();if(S.voiceCoach.enabled)window.PTNative?.speak('Run complete. Nice work.')}catch(e){}S.runHistory.push({date:new Date().toISOString(),name:runState.session.name,distance:+runState.distance.toFixed(2),seconds:runState.elapsed});save();runState=null;$('#runOverlay').classList.add('hidden');showMain('home')}
function showRunPlanner(){const runs=S.program.filter(s=>s.type==='run');sheet('Running Coach',`<div class="medical-note"><b>LIVE GPS + VOICE</b>Choose a generated run. Pace guidance uses your race target when available.</div><div class="playlist-list-v29">${runs.map((s,i)=>`<button class="playlist-v29" data-startrun29="${s.programIndex}" style="color:inherit;text-align:left"><span class="thumb">↗</span><span><b>${s.name}</b><small>${s.distanceKm} km · ${s.duration} min</small></span><b>START</b></button>`).join('')||'<div class="block-note">Add a running goal or running training type first.</div>'}</div>`);$$('[data-startrun29]',$('#sheetCard')).forEach(b=>b.onclick=()=>{const s=S.program[+b.dataset.startrun29];closeSheet();startRun(s)})}

function ensureFocusState(){
  S.priorities=S.priorities||Object.fromEntries(priorityAreas.map(a=>[a,'train']));
  priorityAreas.forEach(a=>{if(!S.priorities[a])S.priorities[a]='train'});
  S.jointPriorities=S.jointPriorities||{};
  JOINTS.forEach(j=>{if(!JOINT_LEVELS.includes(S.jointPriorities[j]))S.jointPriorities[j]='off'});
  if(S.kneeCapacityFocus&&S.jointPriorities.Knee==='off')S.jointPriorities.Knee='priority';
  if(!S.focusProfile)S.focusProfile='Balanced';
}
function bodyState(area){return S.priorities?.[area]||'train'}
function jointState(joint){return S.jointPriorities?.[joint]||'off'}
function setBodyLevels(levels){
  const base=Object.fromEntries(priorityAreas.map(a=>[a,'train']));
  Object.entries(levels).forEach(([level,areas])=>areas.forEach(a=>{if(a in base)base[a]=level}));
  S.priorities=base;
}
function bodySummary(){
  const p=priorityAreas.filter(a=>bodyState(a)==='priority');
  const f=priorityAreas.filter(a=>bodyState(a)==='focus');
  if(p.length)return `Priority: ${p.join(' · ')}${f.length?`  |  Focus: ${f.join(' · ')}`:''}`;
  if(f.length)return `Focus: ${f.join(' · ')}`;
  return 'Balanced body emphasis';
}
function jointSummary(){
  const p=JOINTS.filter(j=>jointState(j)==='priority');
  const s=JOINTS.filter(j=>jointState(j)==='support');
  if(p.length)return `Priority: ${p.join(' · ')}${s.length?`  |  Support: ${s.join(' · ')}`:''}`;
  if(s.length)return `Support: ${s.join(' · ')}`;
  return 'No extra joint-support emphasis';
}
function applyPreset(name){
  if(name==='Balanced')setBodyLevels({train:priorityAreas});
  if(name==='UpperLegs')setBodyLevels({focus:['Chest','Back','Shoulders','Arms','Quads','Glutes','Hamstrings'],train:['Calves','Core']});
  if(name==='Upper')setBodyLevels({priority:['Chest','Back','Shoulders'],focus:['Arms'],train:['Quads','Glutes','Hamstrings','Calves','Core']});
  if(name==='Legs')setBodyLevels({priority:['Quads','Glutes','Hamstrings'],focus:['Calves'],train:['Chest','Back','Shoulders','Arms','Core']});
  if(name==='Runner')setBodyLevels({focus:['Quads','Glutes','Hamstrings','Calves','Core'],train:['Chest','Back','Shoulders','Arms']});
  if(name==='KneeStrength'){
    setBodyLevels({focus:['Quads','Glutes','Hamstrings','Calves'],train:['Chest','Back','Shoulders','Arms','Core']});
    S.jointPriorities.Knee='priority';
  }
  S.focusProfile=name;
  save();window.renderBuilder();
}
function cycleBody(area){
  const now=bodyState(area),i=priorityLevels.indexOf(now);
  S.priorities[area]=priorityLevels[(i+1)%priorityLevels.length];
  S.focusProfile='Custom';
  save();window.renderBuilder();
}
function cycleJoint(joint){
  const now=jointState(joint),i=JOINT_LEVELS.indexOf(now);
  S.jointPriorities[joint]=JOINT_LEVELS[(i+1)%JOINT_LEVELS.length];
  if(joint==='Knee')S.kneeCapacityFocus=S.jointPriorities.Knee!=='off';
  S.focusProfile='Custom';
  save();window.renderBuilder();
}
function presetButtons(){return PRESETS.map(([k,label])=>`<button type="button" class="${S.focusProfile===k?'selected':''}" data-master-preset="${k}">${label}</button>`).join('')}

function mountDetailed(){
  const body=document.querySelector('#builderBody');if(!body)return;
  const head=body.querySelector('.builder-head');
  if(head){
    const step=head.querySelector('.step');if(step)step.textContent='03 · BODY + JOINT PRIORITIES';
    const h=head.querySelector('h1');if(h)h.innerHTML='Choose where to <em>invest.</em>';
    const p=head.querySelector('p');if(p)p.textContent='Muscle emphasis and joint-support work are separate. You can prioritize upper body while also giving legs and knees more attention.';
  }

  const grid=body.querySelector('.priority-grid');
  if(grid){
    grid.className='focus-master-grid detail';
    grid.innerHTML=priorityAreas.map(a=>{const s=bodyState(a);return `<button type="button" class="focus-master-area ${s}" data-focus-area="${a}"><strong>${a}</strong><small>${BODY_LEVEL_LABEL[s]||s.toUpperCase()}</small></button>`}).join('');

      const joint=document.createElement('section');joint.className='joint-priority-v2';
      joint.innerHTML=`<div class="section-label" style="margin:0 0 10px">JOINT SUPPORT PRIORITY</div><p>Separate from injuries. SUPPORT adds compatible capacity work; PRIORITY gives the joint a dedicated capacity block when scheduling allows. Injury guardrails later always take precedence.</p><div class="joint-grid-v2">${JOINTS.map(j=>{const s=jointState(j);return `<button type="button" class="joint-card-v2 ${s}" data-joint-focus="${j}"><strong>${j}</strong><small>${JOINT_LABEL[s]}</small></button>`}).join('')}</div><div class="focus-master-note"><b>${bodySummary()}</b><br>${jointSummary()}<br><br>MINIMAL removes that muscle group from automatic selection. MAINTAIN keeps normal work. FOCUS changes exercise order and weekly emphasis. PRIORITY can also add volume/frequency, subject to guardrails.</div>`;

  wrap.innerHTML=`<div class="summary-row"><span>Body emphasis</span><b>${bodySummary()}</b></div><div class="summary-row"><span>Joint support</span><b>${jointSummary()}</b></div>`;
  list.appendChild(wrap);
}
function relabelLegacyCards(){
  document.querySelectorAll('[data-priority] small').forEach(el=>{const raw=(el.textContent||'').trim().toLowerCase();if(BODY_LEVEL_LABEL[raw])el.textContent=BODY_LEVEL_LABEL[raw]});
}
function mount(){
  ensureFocusState();
  if(S.builderStep===0)mountGoalQuick();
  if(S.builderStep===2)mountDetailed();

/* style2-v29-priority-engine.js */
(()=>{'use strict';
const baseBuild=window.buildProgram;
const baseRx=window.rx;
if(typeof baseBuild!=='function')return;
const LEVEL={skip:0,train:1,focus:2,priority:3};
const UPPER=['Chest','Back','Shoulders','Arms'];
const LOWER=['Quads','Glutes','Hamstrings','Calves'];
const JOINTS=['Knee','Hip','Ankle','Lower Back','Shoulder','Elbow','Wrist'];
const JOINT_PREF={
  Knee:['sled','stepup','singlelegpress','legpress','hamcurl','hipthrust','seatedcalf','pallof'],
  Hip:['hipthrust','stepup','sideplank','pallof','hamcurl','singlelegpress','onearmrow'],
  Ankle:['seatedcalf','calf','stepup','sled','singlelegpress','pallof'],
  'Lower Back':['pallof','sideplank','frontplank','hipthrust','onearmrow','hamcurl'],
  Shoulder:['facepull','onearmrow','machinepress','lateral','shoulderpress','pallof'],
  Elbow:['facepull','onearmrow','triceps','biceps','machinepress','pallof'],
  Wrist:['onearmrow','biceps','triceps','facepull','machinepress','pallof']
};
const allExercises=()=>EX.concat((S.customExercises||[]).filter(x=>!EX.some(e=>e.id===x.id)));
const levelFor=cat=>LEVEL[(S.priorities&&S.priorities[cat])||'train']??1;
const jointLevel=j=>S.jointPriorities?.[j]||'off';
const enabledLocal=id=>!S.exerciseEnabled||S.exerciseEnabled[id]!==false;
const allowed=e=>{
  if(!e||!enabledLocal(e.id)||e.cat==='Running')return false;
  if(levelFor(e.cat)===0)return false;
  if(S.injuries?.includes('Knee')&&e.id==='split')return false;
  if(S.injuries?.includes('Back')&&e.id==='rdl')return false;
  return true;
};
function targetCount(){return Math.max(4,Math.min(7,Math.round((S.minutes||45)/10)+1))}
function sortedPool(cats){return allExercises().filter(e=>allowed(e)&&cats.includes(e.cat)).sort((a,b)=>levelFor(b.cat)-levelFor(a.cat))}
function uniqueIds(exercises,n){const seen=new Set(),out=[];exercises.forEach(e=>{if(e&&allowed(e)&&!seen.has(e.id)&&out.length<n){seen.add(e.id);out.push(e.id)}});return out}
function idsFor(kind){
  const n=targetCount();
  if(kind==='upper')return uniqueIds([...sortedPool(UPPER),...sortedPool(['Core'])],n);
  if(kind==='lower')return uniqueIds([...sortedPool(LOWER),...sortedPool(['Rehab','Core'])],n);
  if(kind==='mixed'){
    const lo=sortedPool(LOWER),up=sortedPool(UPPER),core=sortedPool(['Core','Rehab']);
    const lowBias=LOWER.reduce((s,c)=>s+levelFor(c),0)>=UPPER.reduce((s,c)=>s+levelFor(c),0);
    const first=lowBias?lo:up,second=lowBias?up:lo;
    return uniqueIds([...first.slice(0,Math.ceil(n/2)),...second.slice(0,Math.floor(n/2)),...core,...first,...second],n)
  }
  return uniqueIds(allExercises().filter(allowed).sort((a,b)=>levelFor(b.cat)-levelFor(a.cat)),n)
}
function strengthSessions(){const out=[];(S.weekPlan||[]).forEach(d=>(d.sessions||[]).forEach(s=>{if(s.type==='strength')out.push(s)}));return out}
function focusShape(){
  const upperScore=UPPER.reduce((n,c)=>n+levelFor(c),0),lowerScore=LOWER.reduce((n,c)=>n+levelFor(c),0);
  const upperFocus=UPPER.filter(c=>levelFor(c)>=2).length>=3;
  const lowerPriority=LOWER.filter(c=>levelFor(c)>=3).length>=3;
  const lowerFocus=LOWER.filter(c=>levelFor(c)>=2).length>=3;
  if(upperFocus&&lowerPriority)return'upperlegs';
  if(S.focusProfile==='KneeStrength')return'legs';
  if(lowerPriority||lowerScore>=upperScore+3)return'legs';
  if(upperFocus&&upperScore>=lowerScore+2)return'upper';
  if(S.focusProfile==='Runner'&&lowerFocus)return'runner';
  return'balanced'
}
function applyStrengthFocus(){
  const sessions=strengthSessions();if(!sessions.length)return;
  const shape=focusShape();
  const map={upperlegs:['upper','lower','mixed','lower'],upper:['upper','lower','upper','mixed'],legs:['lower','upper','lower','mixed'],runner:['lower','mixed','upper','lower'],balanced:['upper','lower','mixed','upper']};
  const kinds=map[shape];
  sessions.forEach((s,i)=>{
    const kind=kinds[i%kinds.length],ids=idsFor(kind);if(ids.length)s.ids=ids;
    if(kind==='upper'){s.name=i>2?'Upper Strength B':'Upper Strength';s.muscles='Chest · Back · Shoulders · Arms'}
    if(kind==='lower'){s.name='Lower Strength';s.muscles='Quads · Glutes · Hamstrings · Calves'}
    if(kind==='mixed'){s.name=shape==='upperlegs'?'Upper + Strong Legs':'Full Body Strength';s.muscles='Upper Body · Legs'}
  })
}
function supportIds(joint,max=5){
  const map=new Map(allExercises().filter(allowed).map(e=>[e.id,e]));
  const out=[];(JOINT_PREF[joint]||[]).forEach(id=>{if(map.has(id)&&out.length<max)out.push(id)});
  return out
}
function relevantStrengthSessions(joint){
  const lowerJoint=['Knee','Hip','Ankle','Lower Back'].includes(joint);
  return strengthSessions().filter(s=>lowerJoint?/Lower|Full Body|Strong Legs/i.test(s.name):/Upper|Full Body|Strong Legs/i.test(s.name));
}
function weaveJointSupport(){
  JOINTS.forEach(j=>{
    const lvl=jointLevel(j);if(lvl==='off')return;
    const ids=supportIds(j,lvl==='priority'?2:1);if(!ids.length)return;
    const targets=relevantStrengthSessions(j);if(!targets.length)return;
    targets.forEach((s,idx)=>{
      const add=ids.slice(0,lvl==='priority'&&idx===0?2:1);
      add.reverse().forEach(id=>{if(!s.ids.includes(id))s.ids.unshift(id)});
      s.ids=[...new Set(s.ids)].slice(0,targetCount()+1);
    })
  })
}
function existingRehabSessions(){const out=[];(S.weekPlan||[]).forEach(d=>(d.sessions||[]).forEach(s=>{if(s.type==='rehab')out.push(s)}));return out}
function leastLoadedDay(){return [...(S.weekPlan||[])].sort((a,b)=>(a.sessions?.length||0)-(b.sessions?.length||0))[0]||S.weekPlan?.[6]}
function injuryKey(joint){return joint==='Lower Back'?'Back':joint}
function applyPriorityCapacity(){
  const priorities=JOINTS.filter(j=>jointLevel(j)==='priority');if(!priorities.length||!S.weekPlan?.length)return;
  const injuryMatch=priorities.find(j=>S.injuries?.includes(injuryKey(j)));
  const rehab=existingRehabSessions();
  const ids=[];priorities.forEach(j=>supportIds(j,3).forEach(id=>{if(!ids.includes(id)&&ids.length<6)ids.push(id)}));
  if(!ids.length)return;
  if(injuryMatch&&rehab.length){
    rehab[0].name=`${priorities.join(' + ')} Capacity / Rehab`;
    rehab[0].ids=ids.slice();
    rehab[0].muscles='Controlled joint capacity · Stability · Strength';
    return
  }
  const day=leastLoadedDay();if(!day)return;
  const existing=day.sessions.find(s=>s.type==='rehab'&&/Capacity/.test(s.name));
  if(existing){existing.ids=ids.slice();existing.name=`${priorities.join(' + ')} Capacity`;return}
  day.sessions.push({type:'rehab',name:`${priorities.join(' + ')} Capacity`,time:'18:00',duration:Math.min(30,S.minutes||30),ids:ids.slice(),muscles:'Controlled joint capacity · Stability · Strength'})
}
function rebuildFlat(){
  const flat=[];(S.weekPlan||[]).forEach(d=>(d.sessions||[]).forEach(s=>{s.programIndex=flat.length;flat.push({...s})}));
  S.program=flat;S.programVersion='29-master-mockup';save()
}
window.buildProgram=function(){
  S.jointPriorities=S.jointPriorities||{};
  baseBuild();
  applyStrengthFocus();
  weaveJointSupport();
  applyPriorityCapacity();
  rebuildFlat();
};
if(typeof baseRx==='function'){
  window.rx=function(ex,week){
    const r=baseRx(ex,week),lvl=levelFor(ex?.cat);
    if(!ex||ex.cat==='Rehab'||lvl<3)return r;
    const lower=LOWER.includes(ex.cat),guarded=lower&&S.injuries?.some(x=>['Knee','Hip','Ankle','Achilles','Hamstring'].includes(x));
    if(guarded)return r;
    return {...r,sets:Math.min(5,(Number(r.sets)||Number(ex.sets)||3)+1),label:`${r.label||'Base'} · Priority`}
  }
}
})();

const SHORT_GOAL={'Running Support':'Running','Running / Endurance':'Running','Injury Recovery / Rehab':'Recovery / Rehab','Get Stronger':'Strength','Build Muscle':'Build Muscle','Get Fit':'Fitness','Lose Fat':'Fat Loss','Athletic Performance':'Athletic Performance'};
const BODY_ORDER={Quads:1,Glutes:2,Hamstrings:3,Rehab:4,Calves:5,Core:6,Chest:7,Back:8,Shoulders:9,Arms:10};
const LOWER_ID=['legpress','singlelegpress','goblet','stepup','hipthrust','rdl','hamcurl','split','sled','seatedcalf','calf','pallof','sideplank','frontplank'];
const UPPER_ID=['machinepress','incline','pushup','lat','row','onearmrow','shoulderpress','facepull','lateral','biceps','triceps','pallof','sideplank','frontplank'];
function uniq(a){return [...new Set((a||[]).filter(Boolean))]}
function normalizeGoals(){
  S.goals=uniq((S.goals||[]).map(g=>g==='Running Support'?'Running / Endurance':g));
  const races=S.goals.filter(g=>RACES.includes(g));
  if(races.length>1){const keep=S.race?.goal&&RACES.includes(S.race.goal)?S.race.goal:races[0];S.goals=S.goals.filter(g=>!RACES.includes(g)||g===keep)}
  const active=S.goals.find(g=>RACES.includes(g));

}
function catalog(){return uniqById([...(Array.isArray(EX)?EX:[]),...((S.customExercises||[]))])}
function uniqById(list){const seen=new Set();return list.filter(e=>e&&e.id&&!seen.has(e.id)&&seen.add(e.id))}
function exById(id){return catalog().find(e=>e.id===id)}
function targetCount(){return Math.max(4,Math.min(7,Math.round((Number(S.minutes)||45)/10)+1))}

function removeEntry(entry){if(!entry||!entry.d||!Array.isArray(entry.d.sessions))return;const i=entry.d.sessions.indexOf(entry.s);if(i>=0)entry.d.sessions.splice(i,1)}
function bestStrengthForRehab(){const all=activeSessions().filter(x=>x.s.type==='strength');return all.find(x=>/Lower|Strong Legs|Full Body/i.test(x.s.name||''))||all[0]}
function mergeRehab(entry){const target=bestStrengthForRehab();if(!target)return;const add=entry.s.ids||[];target.s.ids=uniq([...(target.s.ids||[]),...add]).slice(0,targetCount())}
function compactSchedule(){
  const max=Math.max(2,Math.min(7,Number(S.days)||4));
  const wantsRehab=(S.goals||[]).includes('Injury Recovery / Rehab')||((S.injuries||[]).length>0);
  let act=activeSessions();
  let rehab=act.filter(x=>x.s.type==='rehab');
  const keepRehab=wantsRehab&&max>=5?1:0;
  while(rehab.length>keepRehab||act.length>max&&rehab.length){const e=rehab.pop();mergeRehab(e);removeEntry(e);act=activeSessions();rehab=act.filter(x=>x.s.type==='rehab')}
  while(act.length>max){
    const runs=act.filter(x=>x.s.type==='run'),strength=act.filter(x=>x.s.type==='strength');
    let victim=null;
    if(runs.length>strength.length&&runs.length>1)victim=runs.find(x=>/Recovery Run|Easy Run/i.test(x.s.name||''))||runs[runs.length-1];
    else if(strength.length>1)victim=strength.find(x=>/Upper Strength B|Full Body/i.test(x.s.name||''))||strength[strength.length-1];
    else if(runs.length>1)victim=runs[runs.length-1];
    else victim=act[act.length-1];
    removeEntry(victim);act=activeSessions();
  }
}
function rankIds(ids,kind){
  const pref=kind==='upper'?UPPER_ID:kind==='lower'?LOWER_ID:[];
  return uniq(ids).sort((a,b)=>{
    const ai=pref.indexOf(a),bi=pref.indexOf(b);if(ai>=0||bi>=0){if(ai<0)return 1;if(bi<0)return-1;if(ai!==bi)return ai-bi}
    const ea=exById(a),eb=exById(b),ca=BODY_ORDER[ea?.cat]||50,cb=BODY_ORDER[eb?.cat]||50;return ca-cb
  })
}
function orderStrength(){
  (S.weekPlan||[]).forEach(d=>(d.sessions||[]).forEach(s=>{if(s.type!=='strength')return;const kind=/Upper/i.test(s.name||'')&&!/Strong Legs|Full Body/i.test(s.name||'')?'upper':/Lower|Strong Legs/i.test(s.name||'')?'lower':'mixed';s.ids=rankIds(s.ids||[],kind).slice(0,targetCount())}))
}
function rebuildFlat(){const flat=[];(S.weekPlan||[]).forEach(d=>(d.sessions||[]).forEach(s=>{s.programIndex=flat.length;flat.push({...s})}));S.program=flat;S.programVersion='29.1-master-fix';if(typeof save==='function')save()}

  }
};
const baseShowMain=window.showMain;
if(typeof baseShowMain==='function')window.showMain=function(page){baseShowMain(page);const t=document.querySelector('#topLabel');if(t)t.textContent='ILIA COACH · ALL-IN-ONE · V7 · 3.0.2'};

if(typeof baseShowBuilder==='function')window.showBuilder=function(step){document.querySelector('#style2Cover')?.classList.add('hidden');baseShowBuilder(step);window.scrollTo(0,0)};

normalizeGoals();stamp();

function inferRequirement(e){
 const assigned=S.v73ExerciseEquipment?.[e.id];
 if(assigned&&assigned.length)return assigned.map(x=>[x]);
 if(RULES[e.id])return RULES[e.id];
 const n=(e.name||'').toLowerCase();
 if(/dumbbell/.test(n))return [['Dumbbells']];
 if(/barbell/.test(n))return [['Barbell']];
 if(/cable|pulldown|face pull|pressdown|pallof/.test(n))return [['Cable Station']];
 if(/leg press/.test(n))return [['Leg Press Machine']];
 if(/hamstring curl|leg curl/.test(n))return [['Leg Curl Machine']];
 if(/calf/.test(n))return [['Calf Machine'],['Bodyweight']];
 if(/sled/.test(n))return [['Sled']];

function syncPlanAvailability(){
 if(!S.v7)return;
 const maps=planMaps();
 for(const [kind,map] of Object.entries(maps)){
  S.v73PlanRemoved[kind]=S.v73PlanRemoved[kind]||{};
  for(const [date,p] of Object.entries(map)){
   if(!Array.isArray(p?.ids))continue;
   const key=S.v73PlanRemoved[kind][date]||(S.v73PlanRemoved[kind][date]=[]);
   // Restore previously equipment-filtered exercises when they become available again.
   for(const rec of [...key].sort((a,b)=>a.index-b.index)){
    const e=byId(rec.id);
    if(e&&isAvailable(e)&&!p.ids.includes(rec.id))p.ids.splice(Math.min(rec.index,p.ids.length),0,rec.id);
   }
   S.v73PlanRemoved[kind][date]=key.filter(rec=>{const e=byId(rec.id);return !e||!isAvailable(e)});
   // Remove unavailable exercises while remembering their original slot.
   for(let i=p.ids.length-1;i>=0;i--){
    const id=p.ids[i],e=byId(id);
    if(e&&!isAvailable(e)){
     if(!S.v73PlanRemoved[kind][date].some(r=>r.id===id))S.v73PlanRemoved[kind][date].push({id,index:i});

function bindSwipeGestures(root=document){
 root.querySelectorAll('[data-swipe-exercise]').forEach(row=>{
  if(row.dataset.v73SwipeBound==='1')return;

  const start=(x,y,id=null)=>{sx=x;sy=y;dx=0;dy=0;tracking=true;pointerId=id};
  const move=(x,y,ev)=>{
   if(!tracking)return;
   dx=x-sx;dy=y-sy;
   if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.08){
    if(ev?.cancelable)ev.preventDefault();
    const shift=Math.max(-86,Math.min(86,dx*.62));

    row.classList.toggle('v73-swipe-left',dx<0);
    row.classList.toggle('v73-swipe-right',dx>0);
   }
  };
  const finish=()=>{
   if(!tracking)return;
   tracking=false;
   const horizontal=Math.abs(dx)>=52&&Math.abs(dx)>Math.abs(dy)*1.08;
   row.style.transform='';
   row.classList.remove('v73-swipe-left','v73-swipe-right');
   if(!horizontal)return;

   row.dataset.v73SwipeUntil=String(swipeClickLockUntil);

   else window.ILIA_V7?.showAlternatives?.(id,mode);

   row.addEventListener('pointerdown',ev=>{
    if(ev.pointerType==='mouse'&&ev.button!==0)return;
    start(ev.clientX,ev.clientY,ev.pointerId);
    try{row.setPointerCapture(ev.pointerId)}catch(_){}
   });
   row.addEventListener('pointermove',ev=>{if(pointerId===null||ev.pointerId===pointerId)move(ev.clientX,ev.clientY,ev)});
   row.addEventListener('pointerup',ev=>{if(pointerId===null||ev.pointerId===pointerId){finish();pointerId=null}});
   row.addEventListener('pointercancel',()=>{tracking=false;pointerId=null;row.style.transform='';row.classList.remove('v73-swipe-left','v73-swipe-right')});

 return catalog().filter(e=>e.cat!=='Running').map(e=>{
