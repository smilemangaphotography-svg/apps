<script>
(function(){
 if(window.PTNative)return;
 let watchId=null;
 function status(msg){try{window.PT25&&window.PT25.onGpsStatus&&window.PT25.onGpsStatus(msg)}catch(e){}}
 window.PTNative={
  startLocation:function(){
   if(!navigator.geolocation){status('GPS unavailable in this browser');return}
   if(watchId!==null)return;
   status('Starting GPS...');
   watchId=navigator.geolocation.watchPosition(function(p){
    const c=p.coords||{},speed=Number.isFinite(c.speed)?c.speed:0,accuracy=Number.isFinite(c.accuracy)?c.accuracy:0;
    try{window.PT25&&window.PT25.onLocation&&window.PT25.onLocation(c.latitude,c.longitude,speed,accuracy,Date.now());status('GPS tracking started')}catch(e){}
   },function(err){status(err&&err.message?err.message:'Location permission denied')},{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
  },
  stopLocation:function(){if(watchId!==null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);watchId=null;status('GPS stopped')},
  speak:function(text){try{if(!text||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text));u.rate=1;u.pitch=1;speechSynthesis.speak(u)}catch(e){}},
  hasLocationPermission:function(){return true}
 };
})();
</script>

<script>
(function(){
 const s=document.getElementById('previewStatus'),q=document.getElementById('coverEnter');
 function msg(t){s.textContent=t;s.classList.add('show');setTimeout(()=>s.classList.remove('show'),2200)}
 q.addEventListener('click',function(){
  setTimeout(function(){
   if(!document.getElementById('style2Cover').classList.contains('hidden') && !window.PT29) msg('App scripts are still loading — tap Q again in a moment');
  },500)
 },{passive:true});
 window.addEventListener('error',function(e){if(String(e.message||'').includes('Script'))msg('A preview script failed to load')});
})();
</script>
<script>
(function(){
  function diagnostic(){
    var missing=[];
    if(!window.PT29) missing.push('core');
    if(!window.ILIA_V7) missing.push('V7');
    if(!window.ILIA_V73) missing.push('library');
    if(missing.length){
      var s=document.getElementById('previewStatus');
      if(s){s.textContent='Preview load error: '+missing.join(', ')+' — refresh once';s.classList.add('show');}
    }
  }
  setTimeout(diagnostic,3500);
})();
</script>
