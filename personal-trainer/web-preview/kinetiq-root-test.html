<script>
(()=>{'use strict';
const cover=document.getElementById('cover');
const q=document.getElementById('q');
const home=document.getElementById('home');
let fired=false;
function enter(ev){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  if(fired)return;
  fired=true;
  if(navigator.vibrate)try{navigator.vibrate(25)}catch(_){}
  q.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:'translate(-50%,-50%) scale(.94)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:180});
  setTimeout(()=>{
    cover.style.display='none';
    home.classList.add('show');
  },120);
}
q.addEventListener('pointerup',enter,{passive:false});
q.addEventListener('touchend',enter,{passive:false});
q.addEventListener('click',enter);
window.KINETIQ_ROOT_TEST={version:'1.0',enter};
})();
